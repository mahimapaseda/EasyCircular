name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ai-tests:
    name: AI pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m spacy download en_core_web_sm
      - name: Run pytest
        env:
          AI_SERVICE_TOKEN: ""
        run: python -m pytest tests -q --tb=short

  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install
      - name: Run unit tests
        run: npm test

  verify-phase1:
    name: Phase 1 health (Compose)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Prepare env files
        run: |
          cp backend/.env.example backend/.env
          cp ai-service/.env.example ai-service/.env
          cp frontend/.env.example frontend/.env.local
          python3 - <<'PY'
          from pathlib import Path
          secret = "ci-jwt-secret-not-for-production-use-32"
          path = Path("backend/.env")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              "JWT_SECRET=change-this-to-a-long-random-string",
              f"JWT_SECRET={secret}",
          )
          path.write_text(text, encoding="utf-8")
          PY
      - name: Start stack
        run: docker compose up -d --build
      - name: Wait for health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:4000/health >/dev/null && curl -fsS http://localhost:5000/health >/dev/null && curl -fsS http://localhost:3002 >/dev/null; then
              echo "Services are up"
              exit 0
            fi
            sleep 5
          done
          docker compose logs
          exit 1
      - name: Phase 1 verifier
        run: node scripts/verify-phase1.mjs
      - name: Stop stack
        if: always()
        run: docker compose down -v
