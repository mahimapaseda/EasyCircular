        මගින් ත්‍රිස්ථර සේවා එකට යෙදවිය හැකි බැවින් පද්ධතිය self-hostable වේ. මෙම තීරණ
        requirement gathering අවධියේ පෙනී ගිය privacy hesitation සහ affordability අවශ්‍යතාවලට
        සෘජුව ප්‍රතිචාර දක්වයි.
      - >-
        දත්ත ආකෘතිය User, Circular, Summary සහ Entity වැනි ප්‍රධාන වස්තූන් වටා ගොඩනැගී ඇත.
        Circular එකක මුල් ගොනු මාර්ගය, නිස්සාරණය කළ පෙළ සහ content hash ගබඩා වේ. Summary එකක
        ව්‍යුහගත ක්ෂේත්‍ර සහ guardrail තත්ත්වය ඇතුළත් වේ. Entity එකක label වර්ගය සහ පෙළ පරාසය
        සුරැකේ. මෙම ව්‍යුහය නිසා එකම චක්‍රලේඛය නැවත සැකසීමේදී cache භාවිතයෙන් කාලය අඩු කළ හැකි
        අතර, පරිශීලකයාට පෙර සාරාංශ නැවත බැලීමටද හැකිය. සමස්තයක් ලෙස යෝජිත පද්ධතිය අවශ්‍යතාවල සිට
        ආරක්ෂිත, පාසල් මට්ටමේ ක්‍රියාත්මක විය හැකි end-to-end වෙබ් යෙදුමක් දක්වා සම්බන්ධ වේ.

  - heading_en: IV. RESULTS AND DISCUSSION
    paragraphs_si:
      - >-
        යෝජිත පද්ධතියේ ප්‍රායෝගික ප්‍රතිදානය Fig. 4 මගින් පෙන්වයි. සාරාංශ panel එකේ structured
        brief සහ entity highlights ඇතුළත් වේ. මෙයින් පෙනෙන්නේ පද්ධතිය චක්‍රලේඛයකින් purpose,
        actions සහ deadlines වෙන් කර, දින සහ නීතිමය යොමු මුල් පෙළ මත highlight කරන බවයි. මෙම
        ප්‍රතිදානය requirement gathering අවධියේ ඉල්ලූ සාරාංශ සහ entity highlighting අවශ්‍යතාවලට
        සෘජුව ගැලපේ [10], [11]. ශ්‍රී ලංකා සිංහල ලේඛන සාරාංශ පර්යේෂණයට [16] සාපේක්ෂව මෙහි ඉලක්කය අධ්‍යාපන චක්‍රලේඛ සහ school staff workflow එකකි.
      - >-
        තක්සේරුව තුන් මානයකින් සමන්විත වේ: මෙහෙයුම් කාර්ය සාධනය, ROUGE සාරාංශ ගුණාත්මකභාවය, සහ
        ස්වයංක්‍රීය පරීක්ෂණ. Staging stack එකේදී digital PDF extraction, optical character
        recognition [14], [20], cold large language model call [3], [19] සහ cached re-process කාලයන් මනින ලදී. TABLE
        III මෙම latency අගයන් සාරාංශ කරයි. මෙය පාසල් workflow එකට ප්‍රායෝගික බව පෙන්වයි, නමුත්
        production SLA එකක් ප්‍රකාශ නොකරයි.
      - >-
        සාරාංශ ගුණාත්මකභාවය ROUGE මගින් මනින ලදී [12]. Factual consistency සාහිත්‍යයට අනුව abstractive summarization හි faithfulness අවදානම වෙනම සලකා බැලිය යුතුය [8]. අධ්‍යාපන චක්‍රලේඛ හයක් සඳහා human
        reference summaries සමඟ fallback mode compare කරන ලදී. TABLE IV circular-පාඩි F1 අගයන්
        දක්වයි. Macro අගයන් ROUGE-1 F1 = 0.414, ROUGE-2 F1 = 0.215, ROUGE-L F1 = 0.292 විය. Fig.
        5 මෙම ROUGE F1 ප්‍රතිඵල visualize කරයි. Large language model මාදිලිය fluency වැඩි කරන
        නමුත් invented dates නිසා guardrails ආසන්න වශයෙන් 15% ප්‍රතික්ෂේප කරයි. එබැවින්
        නිර්දේශිත හැසිරීම LLM default තබා අසාර්ථක විට TextRank-style fallback වීමයි [4], [9].
      - >-
        TABLE V ස්වයංක්‍රීය පරීක්ෂණ ප්‍රතිඵල දක්වයි: backend unit, Selenium IDE UI සහ functional
        tests සම්පූර්ණයෙන් සමත් විය [18]. School staff UAT තවම සම්පූර්ණ නොවීම සීමාවකි. නියැදි
        ප්‍රමාණය සහ තනි annotator නිසා macro F1 අභ්‍යන්තර baseline එකක් ලෙස අර්ථකථනය කළ යුතුය.
        External validity සමීක්ෂණ convenience sample එකකට සීමා වේ. මෙම සීමාවන් අවංකව වාර්තා
        කිරීම ශාස්ත්‍රීය අවංකභාවයට අනුකූලය [8], [12].

  - heading_en: V. CONCLUSION
    paragraphs_si:
      - >-
        මෙම පත්‍රය ශ්‍රී ලංකා රජයේ අධ්‍යාපන චක්‍රලේඛ PDF අවබෝධයේ භාරය අඩු කිරීමට EasyCircular
        නම් බුද්ධිමත් වෙබ් යෙදුමක් ඉදිරිපත් කළේය. ත්‍රිස්ථර ගෘහනිර්මාණය මත PDF upload,
        ත්‍රිභාෂික optical character recognition, අනිවාර්ය පෙළ සමාලෝචනය, named entity
        recognition, map-reduce summarization සහ date guardrails එකම workflow එකකින් ඒකාබද්ධ වේ.
        මුල් PDF එක නීතිමය මූලාශ්‍රය ලෙස පවතින අතර සාරාංශය assistive shortcut එකක් පමණි. පද්ධතිය
        self-hostable වන අතර අවශ්‍ය විට local large language model විකල්පයකින් රහස්‍යතාව ආරක්ෂා
        කළ හැක.
      - >-
        පර්යේෂණ ප්‍රශ්නවලට ප්‍රතිචාර ලෙස, පළමුව purpose-built වෙබ් පද්ධතියක් ත්‍රිස්ථර
        architecture සහ Upload, Extract, Review, Summarize කාර්යප්‍රවාහය මගින් නිර්මාණය කළ හැකි
        බව පෙන්වන ලදී. දෙවනුව, අනිවාර්ය පෙළ සමාලෝචනය සහ date guardrails මගින් invented dates අවම
        කර, අසාර්ථක විට extractive fallback activate කිරීමෙන් hallucination අවදානම අවම කළ හැකි
        බව පෙන්වන ලදී. තෙවනුව, stakeholder සමීක්ෂණය, ROUGE තක්සේරුව සහ ස්වයංක්‍රීය පරීක්ෂණ මගින්
        අවශ්‍යතා සහ තාක්ෂණික ගුණාත්මකභාවය තක්සේරු කළ හැකි බව පෙන්වන ලදී.
      - >-
        Requirement gathering මගින් සාරාංශ විශේෂාංගයක් සහ entity highlighting අවශ්‍ය බව තහවුරු
        විය. එහෙත් artificial intelligence භාවිතයට සෘජු කැමැත්ත අඩු වූ අතර රහස්‍යතාව ප්‍රධාන
        බාධාවක් විය. එබැවින් local processing විකල්පය සහ mandatory Text is correct gate
        නිර්මාණයේ මධ්‍යස්ථානය විය. දිගු ලේඛන කියවීමේ බාධකය ලෙස හඳුනා ගැනීම extractive
        compression සහ highlighted deadlines යන තීරණවලට empirical backing ලබා දුන්නේය.
      - >-
        තක්සේරුවෙන් පෙනී ගියේ staging පරිසරයේ digital extraction, optical character recognition
        සහ large language model කාලයන් පාසල් workflow එකකට ප්‍රායෝගික බවයි. Fallback mode ROUGE
        macro අගයන් අභ්‍යන්තර baseline එකක් ලෙස ලැබුණු අතර ස්වයංක්‍රීය පරීක්ෂණ සම්පූර්ණයෙන් සමත්
        විය. Fig. 4 මගින් structured summary සහ entity highlights ප්‍රායෝගික ප්‍රතිදානය පෙන්වයි.
        මෙම ලකුණු නීතිමය correctness හෝ production SLA එකක් ලෙස ප්‍රකාශ නොකරයි; ඒවා ක්‍රමානුකූල
        තක්සේරු සාක්ෂියකි.
      - >-
        දායකත්වයන් තුන් මට්ටමකින් සාරාංශ කළ හැක. Domain මට්ටමේදී ශ්‍රී ලංකා අධ්‍යාපන චක්‍රලේඛ
        සඳහා self-hostable, staff-reviewed artificial intelligence ප්‍රවේශයක් ඉදිරිපත් වේ.
        Method මට්ටමේදී optical character recognition, named entity recognition, guarded
        summarization සහ reproducible evaluation එකම artefact එකක ඒකාබද්ධ වේ. Practice මට්ටමේදී
        privacy-aware local large language model සහ review gate මගින් generic chatbot adoption
        බාධකවලට ප්‍රායෝගික ප්‍රතිචාරයක් ලැබේ. විදුහල්පතිවරුන්ට සහ ගුරුවරුන්ට deadlines සහ
        actions ඉක්මනින් දැකීමට මෙය උපකාරී විය හැක.
      - >-
        සීමාවන් අවංකව පිළිගත යුතුය. Sinhala සහ Tamil named entity recognition පූර්ණ නොවේ;
        English SpaCy labels ප්‍රධානය. School staff UAT අසම්පූර්ණය. ROUGE නියැදිය කුඩා වන අතර
        තනි annotator භාවිතයක් ඇත; fallback mode abstractive fluency underestimate කළ හැක.
        සමීක්ෂණය convenience sample එකකි. එබැවින් field usefulness හෝ national generalisation
        claim නොකරයි.
      - >-
        අනාගත කටයුතු ලෙස පූර්ණ Sinhala/Tamil named entity recognition models සහ bilingual
        අතුරුමුහුණත, පාසල් පරිපාලකයන් සමඟ extended UAT, විශාල චක්‍රලේඛ නියැදියක් මත ROUGE සහ
        human ratings, batch upload සහ admin analytics, production deployment සහ monitoring, සහ
        guardrail රීති විස්තීරණය යෝජනා කරයි. මෙම පියවර මගින් EasyCircular පර්යේෂණාත්මක artefact
        එකක සිට පාසල් පරිපාලනයට ප්‍රයෝජනවත් මෙහෙයුම් මෙවලමක් දක්වා වර්ධනය කළ හැක.

