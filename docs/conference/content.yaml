title_en: >-
  An Intelligent Web Application for Summarizing Sri Lankan
  Government Education Circulars Using Large Language Models

authors:
  - name: G G M P Kusumsiri
    department: Department of Computer Science and Technology
    organization: The University of Bedfordshire
    city_country: Luton, United Kingdom
    email: "[email placeholder]"
  - name: Mr. Anuruddha Abeysinghe
    department: Department of Computer Science and Technology
    organization: The University of Bedfordshire
    city_country: Luton, United Kingdom
    email: "[email placeholder]"

abstract_en: >-
  The administrative work in the Sri Lankan education sector is guided by circulars of the
  Ministry of Education. These documents contain legal and administrative instructions on
  school management, examinations, teacher training and student welfare and are often
  lengthy. Principals and teachers need extra effort to identify key directives, deadlines
  and steps to be implemented. Circular PDFs are often available as Sinhala or Tamil
  scanned images and must be typed manually without optical character recognition.
  Summaries shared via WhatsApp groups and email forwards increase the risk of
  misinterpretation and missed deadlines. Institutional acceptance is low due to
  hallucination, data privacy concerns and unstructured output in typical large language
  model chatbot tools. The literature lacks a self-hostable system that combines PDF
  import, trilingual optical character recognition, staff-reviewed extraction, named
  entity recognition and guarded summarization for Sri Lankan government education
  circulars. Enterprise legal artificial intelligence tools are expensive for schools and
  lack circular-specific date checks. This paper presents EasyCircular, an intelligent web
  application. Its three-tier architecture integrates PDF upload, optical character
  recognition, mandatory text review, named entity recognition and date guardrails into
  one workflow. The main contributions are a self-hostable pipeline, a review gate for
  optical character recognition misreads, and guardrails with an extractive fallback that
  prevent invented dates. The system centres on large language model summarization and
  structured information extraction. Long text is summarised with map-reduce; named entity
  recognition separates dates and legal references; extractive fallback activates when
  date guardrails fail. Summary quality was assessed with automated metrics. Results show
  that guarded large language model summarization and entity-anchored extraction can
  surface orders and deadlines quickly. The original PDF remains the legal source; the
  summary is only an assistive shortcut. Overall, this study combines large language model
  extraction and guarded summarization to offer a reliable approach to understanding Sri
  Lankan education circulars.

keywords_en: >-
  PDF summarization, named entity recognition, optical character recognition, large
  language models, education circulars

sections:
  - heading_en: I. INTRODUCTION
    paragraphs_si:
      - >-
        ශ්‍රී ලංකා අධ්‍යාපන ක්‍ෂේත්‍රය දිනපතාම අධ්‍යාපන අමාත්‍යාංශය (Ministry of Education)
        විසින් නිකුත් කරනු ලබන චක්‍රලේඛ PDF මගින් පාලනය වේ [1], [2]. මෙම ලේඛන පාසල් කළමනාකරණය, විභාග,
        ගුරු පුහුණුව, ශිෂ්‍ය සුබසාධන සහ වසංගතයෙන් පසු ප්‍රතිසංවර්ධනය පිළිබඳ නීතිමය සහ පරිපාලන
        උපදෙස් අඩංගු වේ. චක්‍රලේඛ සිංහල, ඉංග්‍රීසි සහ දෙමළ භාෂාවලින් නිකුත් වන අතර බොහෝ විට දිගු
        පරිපාලන භාෂාවෙන් ලියනු ලබයි.
      - >-
        මෙම චක්‍රලේඛ පාසල් මට්ටමේ ක්‍රියාත්මක කිරීම විදුහල්පතිවරුන්, ගුරුවරුන් සහ අධ්‍යාපන
        නිලධාරීන් මත රඳා පවතී. බොහෝ චක්‍රලේඛ scanned images ලෙස පවතින බැවින් optical character
        recognition නොමැතිව අන්තර්ගතය සෙවිය නොහැක. ලේඛන WhatsApp groups සහ email forwards හරහා
        ඉක්මනින් බෙදා හරිනු ලබන නමුත් ආයතනික searchable archive එකක් කලාතුරකින් තිබේ. එබැවින්
        චක්‍රලේඛ අවබෝධය තවමත් අතින් කියවීමේ කාර්යයක් ලෙස පවතී.
      - >-
        මෙම පසුබිම තුළ ප්‍රධාන පර්යේෂණ ගැටලුව වන්නේ ශ්‍රී ලංකා රජයේ අධ්‍යාපන චක්‍රලේඛවලින්
        ප්‍රධාන නියෝග, අවසන් දින සහ ක්‍රියාත්මක කළ යුතු පියවර කෙටි කාලයකින්, විශ්වාසනීයව සහ
        ආයතනිකව පිළිගත හැකි ආකාරයෙන් ලබා දෙන ක්‍රමයක් නොමැති වීමයි. දිගු සහ බහුභාෂික PDF ලේඛන
        නිසා පාසල් කාර්ය මණ්ඩලයට අමතර ශ්‍රමයක් යෙදීමට සිදු වේ. අනවධාන සාරාංශ වැරදි අර්ථකථනය සහ
        කාලසීමා මග හැරීමට හේතු වේ. සාමාන්‍ය large language model chatbot මෙවලම් hallucination,
        දත්ත රහස්‍යතා සහ ව්‍යුහගත output නොමැතිකම නිසා පාසල් භාවිතයට සුදුසු නොවේ [3], [4]. ශ්‍රී
        ලංකා අධ්‍යාපන චක්‍රලේඛ සඳහා පෙළ නිස්සාරණය, named entity recognition සහ ආරක්ෂිත
        සාරාංශකරණය එකම වෙබ් ක්‍රියාවලියකින් සපයන purpose-built පද්ධතියක් ද නොමැත.
      - >-
        එබැවින් මෙම පර්යේෂණයේ අරමුණ වන්නේ පාසල් කාර්ය මණ්ඩලයට චක්‍රලේඛ අවබෝධයට ගතවන කාලය අඩු
        කිරීම, වැරදි අර්ථකථනයේ අවදානම අවම කිරීම සහ මුල් PDF එක නීතිමය මූලාශ්‍රය ලෙස තබා සහායක
        සාරාංශයක් ලබා දීමයි. Stakeholder සමීක්ෂණයෙන් පෙනී ගියේ සාරාංශ විශේෂාංගයක් අවශ්‍ය බවත්,
        රහස්‍යතාව භාවිතයට බාධාවක් බවත්ය. මෙම අවශ්‍යතාවට පිළිතුරු වශයෙන් EasyCircular නම්
        බුද්ධිමත් වෙබ් යෙදුමක් ඉදිරිපත් කරයි. මුල් PDF එක නීතිමය මූලාශ්‍රය ලෙස පවතින අතර සාරාංශය
        assistive shortcut එකක් පමණි.
      - >-
        එම අරමුණ සාක්ෂාත් කර ගැනීමට මෙම අධ්‍යයනය ප්‍රධාන ප්‍රශ්න තුනකට පිළිතුරු සොයයි. පළමුව,
        ශ්‍රී ලංකා රජයේ අධ්‍යාපන චක්‍රලේඛ සඳහා PDF නිස්සාරණය, optical character recognition,
        named entity recognition සහ සාරාංශකරණය ඒකාබද්ධ කරන purpose-built වෙබ් පද්ධතියක් කෙසේ
        නිර්මාණය කළ හැකිද යන්න විමසයි. දෙවනුව, අනිවාර්ය පෙළ සමාලෝචනය සහ date guardrails මගින්
        hallucination අවදානම කෙතරම් අවම කළ හැකිද යන්න පරීක්ෂා කරයි. තෙවනුව, පාසල් stakeholders
        ගේ අවශ්‍යතා සහ ස්වයංක්‍රීය තක්සේරු මිනුම් මගින් පද්ධතියේ ප්‍රයෝජනවත් බව සහ ගුණාත්මකභාවය
        කෙසේ තක්සේරු කළ හැකිද යන්න සොයා බලයි.
      - >-
        ඉතිරි පත්‍රය මෙම තර්කය අනුපිළිවෙලින් ගෙන යයි. Section II related work මගින් පර්යේෂණ
        පරතරය පැහැදිලි කරයි. Section III methodology මගින් සමීක්ෂණ සාරාංශය, පද්ධති සැලසුම සහ
        workflow විස්තර කරයි. Section IV results and discussion මගින් ප්‍රතිඵල ඉදිරිපත් කරයි.
        Section V conclusion මගින් සාරාංශය සහ අනාගත කටයුතු දක්වයි.

  - heading_en: II. RELATED WORK
    paragraphs_si:
      - >-
        නවීන ලේඛන විශ්ලේෂණය ප්‍රධාන වශයෙන් Transformer ගෘහනිර්මාණය මත පදනම් වූ natural language
        processing තාක්ෂණයන් මත ගොඩනැගී ඇත. Self-attention mechanism මගින් පෙළ අනුක්‍රමිකව පමණක්
        නොව, වාක්‍යයේ සම්පූර්ණ සන්දර්භය සහ වචන අතර සම්බන්ධතා එකවර අවබෝධ කර ගත හැක [5]. මෙය
        සංකීර්ණ පරිපාලන භාෂාවක් සහිත අධ්‍යාපන චක්‍රලේඛ විශ්ලේෂණයේදී විශේෂයෙන් වැදගත් වේ. BERT,
        GPT සහ Gemini වැනි large language models ද මෙම Transformer පදනම මත ගොඩනැගී ඇති අතර,
        පෙළෙහි අර්ථය අවබෝධ කර මිනිස් ලේඛනයකට සමාන ප්‍රතිදානයක් ජනනය කිරීමට හැකියාව ලබා දෙයි [3], [6].
