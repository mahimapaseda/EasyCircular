        නිලධාරීන්ගෙන්, සිංහල සහ ඉංග්‍රීසි භාෂාවලින් රැස් කෙරිණි [18]. අයිතම අතර කියවීමේ
        වාරගණනය, අවබෝධ දුෂ්කරතා, කාල බර, සාරාංශ ඉල්ලුම, AI භාවිතයට කැමැත්ත, entity
        highlighting ප්‍රයෝජනය සහ රහස්‍යතා ගැටලු ඇතුළත් විය. වලංගු ප්‍රතිචාර (N=41) ගුරුවරු
        ප්‍රධාන පරිශීලක කාණ්ඩය බවත් සාරාංශ සහ highlighting ඉල්ලුම ඉහළ බවත් තහවුරු කළේය. AI
