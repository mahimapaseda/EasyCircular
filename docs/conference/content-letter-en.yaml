abstract_en: >-
  Ministry of Education circulars guide school administration in Sri Lanka, yet
  staff often receive long, scanned, trilingual PDFs through informal channels.
  EasyCircular is a self-hostable web application that combines PDF ingest,
  trilingual optical character recognition, mandatory staff text review, named
  entity highlighting, and guarded large language model summarization with an
  extractive fallback. A stakeholder survey (N=41) showed strong demand for
  summaries (97.6%) but limited willingness to use AI (31.7%), motivating a
  local-model option and a review gate before generation. On six circulars with
  single-annotator references, TextRank-style extractive fallback summaries
  scored ROUGE-1/2/L F1 of 0.414/0.215/0.292; these scores do not evaluate the
  default LLM path. The original PDF remains the legal source; the brief is an
  assistive shortcut. Broader OCR, NER, LLM, and user-acceptance evaluation is
  left for future work.

keywords_en: >-
  PDF summarization, named entity recognition, optical character recognition,
  large language models, education circulars

sections:
  - heading_en: I. INTRODUCTION
    paragraphs_si:
      - >-
        ශ්‍රී ලංකා පාසල්වල දෛනික පරිපාලනය අධ්‍යාපන අමාත්‍යාංශය විසින් නිකුත් කරන චක්‍රලේඛ
        මගින් හැඩගැසේ [1], [2]. මෙම ලේඛන පාසල් කළමනාකරණය, විභාග, ගුරු සංවර්ධනය සහ ශිෂ්‍ය
        සුබසාධනය පිළිබඳ නීතිමය සහ මෙහෙයුම් උපදෙස් අඩංගු වේ. ඒවා සිංහල, ඉංග්‍රීසි සහ දෙමළ
        භාෂාවලින් පෙනෙන අතර බොහෝ විට දිගු පරිපාලන භාෂාවෙන් ලියැවෙන අතර සෙවිය හැකි පෙළ වෙනුවට
        scanned PDF ලෙස ලැබේ.
      - >-
        විදුහල්පතිවරුන්, ගුරුවරුන් සහ අධ්‍යාපන නිලධාරීන්ට තවමත් අවසන් දින, වගකිවයුත්තන් සහ
        ක්‍රියා අයිතම අතින් උපුටා ගැනීමට සිදු වේ. චක්‍රලේඛ WhatsApp කණ්ඩායම් සහ ඊමේල් හරහා
        ඉක්මනින් බෙදා හැරෙන නමුත් ආයතනවල searchable archive කලාතුරකින් තිබේ. විශ්වාසදායක
        optical character recognition සහ විශ්වාසනීය සාරාංශයක් නොමැතිව, අනියම් සාරාංශ නිසා දින
        මග හැරීමේ සහ උපදෙස් වැරදිව කියවීමේ අවදානම වැඩි වේ.
      - >-
        සාමාන්‍ය large language model chatbot මෙවලම් තවත් බාධක ඇති කරයි: දින සහ නියෝග
        hallucination වීම, පාසල් ලේඛන සඳහා දුර්වල රහස්‍යතා ආරක්ෂාව, සහ විගණනයට අපහසු
        අසංවිධිත පිළිතුරු [3], [4]. වාණිජ නීතිමය AI මෙවලම් පාසල් සඳහා මිල අධික වන අතර ශ්‍රී
        ලංකා අධ්‍යාපන චක්‍රලේඛ සඳහා සුසර නොවේ. මෙම ක්ෂේත්‍රය සඳහා PDF ආයාතය, ත්‍රිභාෂික OCR,
        කාර්ය මණ්ඩල සමාලෝචිත නිස්සාරණය, named entity recognition සහ ආරක්ෂිත සාරාංශකරණය එකතු
        කරන self-hostable pipeline එකක් සාහිත්‍යයේ නොමැත.
      - >-
        මෙම පත්‍රය එම පරතරය වටා නිර්මාණය කළ EasyCircular නම් ත්‍රිස්ථර වෙබ් යෙදුම ඉදිරිපත්
        කරයි. දායකත්වයන් වන්නේ (i) උඩුගත කිරීමේ සිට ව්‍යුහගත සාරාංශය දක්වා end-to-end
        self-hostable කාර්යප්‍රවාහයක්, (ii) සාරාංශකරණයට පෙර අනිවාර්ය OCR සමාලෝචන දොරටුවක්,
        සහ (iii) generative මාර්ගය නොමැති හෝ මූලික පරීක්ෂා අසමත් වූ විට extractive fallback
        සමඟ දින පදනම් කිරීමේ පරීක්ෂා ය. මුල් PDF එක බලයලත් මූලාශ්‍රය වන අතර සාරාංශය සහායක
        පමණි.
      - >-
        අධ්‍යයනය පර්යේෂණ ප්‍රශ්න තුනක් වටා සංවිධානය කෙරේ. RQ1: ශ්‍රී ලංකා අධ්‍යාපන චක්‍රලේඛ
        සඳහා PDF නිස්සාරණය, OCR, NER සහ සාරාංශකරණය purpose-built වෙබ් පද්ධතියකට කෙසේ ඒකාබද්ධ
        කළ හැකිද? RQ2: අනිවාර්ය පෙළ සමාලෝචනය සහ date guardrails මගින් හානිකර hallucination
        අවදානම කෙසේ අඩු කළ හැකිද? RQ3: stakeholder අවශ්‍යතා සහ ස්වයංක්‍රීය මිනුම් භාවිතයෙන්
        ප්‍රයෝජනවත් බව තක්සේරු කරන අතර තක්සේරු සීමා අවංකව ප්‍රකාශ කරන්නේ කෙසේද? Section II
        related work, Section III අවශ්‍යතා සහ සැලසුම, Section IV මූලික ප්‍රතිඵල, Section V
        නිගමනය දක්වයි.

  - heading_en: II. RELATED WORK
    paragraphs_si:
      - >-
        නවීන ලේඛන අවබෝධය දිගු පරාස සන්දර්භය self-attention මගින් ආකෘතිගත කරන Transformer
        ගෘහනිර්මාණය මත රඳා පවතී [5]. මෙම පදනම මත ගොඩනැගුණු large language models, GPT-ශෛලීය
        සහ සම්බන්ධ පද්ධති ඇතුළුව, පෙළ ප්‍රතිව්‍යාඛ්‍යානයට සහ සම්පීඩනයට යොදා ගත හැක [3], [6].
        EasyCircular වින්‍යාසිත සැපයුම්කරුවකු ඇති විට abstractive සාරාංශ සඳහා එවැනි ආකෘති
        භාවිත කරන අතර විශ්වාසනීයත්වය සඳහා deterministic extractive මාර්ගයක් තබා ගනී.
      - >-
        සාරාංශකරණ පර්යේෂණය මූලාශ්‍ර වාක්‍ය තෝරන extractive ක්‍රම සහ අන්තර්ගතය නැවත ලියන
        abstractive ක්‍රම වෙන් කරයි [7]. Extractive ප්‍රතිදානය නීතිමය උපදෙස්වල වැදගත් වචන
        රකින නමුත් කියවීම අසමාන විය හැක. Abstractive fluency කාර්ය මණ්ඩලයට ආකර්ෂණීය වුවත්
        faithfulness අසාර්ථකත්වයන් හොඳින් වාර්තා වී ඇත [8]. එබැවින් EasyCircular වින්‍යාස
        කළ විට LLM සාරාංශය default කරන අතර guardrails හෝ ආකෘති ලබා ගත නොහැකි විට
        TextRank-ශෛලීය extractive සාරාංශයට යයි [9].
      - >-
        Named entity recognition අසංවිධිත පෙළෙන් පුද්ගලයන්, ආයතන, දින සහ සම්බන්ධ පරාස
        උපුටා ගනී [10]. spaCy ප්‍රායෝගික ඉංග්‍රීසි pipeline එකක් සපයන අතර [11] EasyCircular
        චක්‍රලේඛ අංක, letterhead සහ ක්‍රියා ඉඟි සඳහා domain heuristics සමඟ ඒකාබද්ධ කරයි.
        බොහෝ අමාත්‍යාංශ චක්‍රලේඛ සිංහල හෝ දෙමළ වේ; එබැවින් ඉංග්‍රීසි-කේන්ද්‍රීය NER භාෂා
        අතර සමාන යැයි උපකල්පනය කළ නොහැකි බව අපි මිනුම් නොමැතිවම පැහැදිලිව ප්‍රකාශ කරමු.
      - >-
        මෙම ක්ෂේත්‍රයේ තක්සේරුවට fluency එකකට වඩා අවශ්‍ය වේ. ROUGE යොමු සාරාංශ සමඟ ශබ්දකෝෂ
        අතිච්ඡාදනය මැනීමේ සම්මත මිනුමක් ලෙස පවතී [12], නමුත් නීතිමය වශයෙන් වැදගත් උපදෙස්
        රැකී ඇති බව ඔප්පු නොකරයි. Faithfulness සාහිත්‍යය වෙනම කරුණු පරීක්ෂා ඉල්ලා සිටී [8].
        වත්මන් අධ්‍යයනය කුඩා gold set එකක් මත extractive fallback සඳහා පමණක් ROUGE වාර්තා
        කරන අතර LLM ගුණාත්මකභාවය, OCR නිරවද්‍යතාව සහ NER නිරවද්‍යතාව අනාගත මිනුම් ලෙස තබයි.
      - >-
        සිංහල සහ දෙමළ OCR පර්යේෂණය උරුම රජයේ අකුරු සහ අඩු-සම්පත් අක්ෂර සඳහා Tesseract සහ
        සම්බන්ධ එන්ජින් අනුවර්තනය කරයි [13]–[15]. පැරණි සිංහල පෙළ සංරක්ෂණය සඳහා සාරාංශකරණය
        ද ගවේෂණය වී ඇත [16]. එම කටයුතු අමාත්‍යාංශ අධ්‍යාපන චක්‍රලේඛ සඳහා කාර්ය මණ්ඩල
        සමාලෝචිත, ආරක්ෂිත සාරාංශකරණ වෙබ් යෙදුමක් ලබා නොදෙයි. නීතිමය-NLP සාහිත්‍යයේ සමාලෝචිත
        වාණිජ මෙවලම් වෙනත් අධිකරණ සහ මිල ස්ථාන ඉලක්ක කරයි [17]. EasyCircular පාසල්වල
        යෙදවිය හැකි stack එකකින් කලාපීය පරතරය ආමන්ත්‍රණය කරයි.
      - >-
        සාරාංශයක් ලෙස, පෙර කටයුතු OCR, NER සහ සාරාංශකරණ සංරචක ආවරණය කරන නමුත් ශ්‍රී ලංකා
        අධ්‍යාපන චක්‍රලේඛ සඳහා රහස්‍යතා-දැනුවත් කාර්යප්‍රවාහයකට ඒවා ඒකාබද්ධ නොකරයි [1], [2],
        [13], [16]. EasyCircular ලබා ඇති සාක්ෂිවලට සමානුපාතික තක්සේරු ප්‍රකාශ තබා ගනිමින්
        එම පද්ධති පරතරය පුරවන්නට නිර්මාණය වී ඇත.

  - heading_en: III. PROPOSED SYSTEM
    paragraphs_si:
      - >-
