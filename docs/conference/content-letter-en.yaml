        පෙර නිස්සාරිත පෙළ තහවුරු කිරීම අවශ්‍ය කරයි, නිදහස් chat වෙනුවට ව්‍යුහගත සාරාංශයක්
        ලබා දෙයි, සහ පාසල්-පාලිත දෘඪාංග මත Ollama හරහා භාෂා ආකෘතිය ධාවනය කළ හැක. සාරාංශ
