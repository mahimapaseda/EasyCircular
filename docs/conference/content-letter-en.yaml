        නිස්සාරණය, සංස්කරණය කළ හැකි සමාලෝචනය, ව්‍යුහගත සාරාංශය, entity highlighting,
        ක්‍රියා අයිතම ලැයිස්තු සහ චක්‍රලේඛ පුස්තකාලය ඇත. ක්‍රියාකාරී-නොවන අවශ්‍යතා ලෙස JWT
