        කටයුතු වේ; වත්මන් පද්ධතිය සමීක්ෂණ පසුබෑමට පළමු ප්‍රතිචාර ලෙස සමාලෝචනය කළ හැකි බව සහ
        self-hosting ප්‍රමුඛ කරයි.
