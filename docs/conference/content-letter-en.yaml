        සටහන් කරයි [18]. එම ප්‍රතිඵල ක්‍රියාත්මක pipeline එකේ මෘදුකාංග නිවැරදිභාවයට සහාය
        දක්වයි; සාරාංශ faithfulness පිළිබඳ පර්යේෂණ ප්‍රකාශ සඳහා සාක්ෂි නොවේ. පාසල් කාර්ය
        මණ්ඩල පරිශීලක පිළිගැනීමේ පරීක්ෂණ අසම්පූර්ණය. සමීක්ෂණයේ බාහිර වලංගුතාව convenience
        sample එකකට සීමා වේ. එබැවින් RQ පිළිතුරු සම්පූර්ණයෙන් වලංගු කළ පර්යේෂණාත්මක නිගමන
        ලෙස නොව සැලසුම් සහ මූලික-සාක්ෂි ප්‍රකාශ ලෙස සලකමු [8], [12].

  - heading_en: V. CONCLUSION
    paragraphs_si:
      - >-
        EasyCircular PDF උඩුගත කිරීම, ත්‍රිභාෂික OCR, අනිවාර්ය පෙළ සමාලෝචනය, NER
        highlighting, map-reduce LLM සාරාංශකරණය සහ දින පදනම් කිරීමේ පරීක්ෂා ශ්‍රී ලංකා
        අධ්‍යාපන චක්‍රලේඛ සඳහා self-hostable ත්‍රිස්ථර වෙබ් යෙදුමකට ඒකාබද්ධ කරයි. මුල් PDF
        එක නීතිමය මූලාශ්‍රය ලෙස පවතින අතර ව්‍යුහගත සාරාංශය සහායක කෙටිමඟකි. Ollama
        llama3.2:3b සමඟ විකල්ප දේශීය අනුමානය stakeholder විසින් මතු කළ රහස්‍යතා ගැටලු
        ආමන්ත්‍රණය කරයි.
      - >-
        පර්යේෂණ ප්‍රශ්නවලට සාපේක්ෂව, RQ1 ක්‍රියාත්මක ගෘහනිර්මාණය සහ
        Upload–Extract–Review–Summarize කාර්යප්‍රවාහය මගින් ආමන්ත්‍රණය වේ. RQ2 සැලසුම
        මගින් ආමන්ත්‍රණය වේ: සමාලෝචන දොරටුවක් සහ පටු date guardrails සහ extractive
        fallback, අනෙකුත් entity වර්ග සහ ඉංග්‍රීසි නොවන දින ආකෘති සඳහා පිළිගත් පරතර සමඟ.
        RQ3 අඩ වශයෙන් පමණක් ආමන්ත්‍රණය වේ: සමීක්ෂණය අවශ්‍යතා සහ පසුබෑම පැහැදිලි කරන අතර
        fallback සාරාංශ හයක් මත ROUGE සහ staging latency නිශ්චිත සාධනයකට වඩා මූලික තාක්ෂණික
        සංඥා ලබා දෙයි.
      - >-
        අනාගත කටයුතු ලෙස ඉංග්‍රීසි, සිංහල සහ දෙමළ හරහා චක්‍රලේඛ දස ගණනක් දක්වා gold set
        විශාල කර බහු annotator සහ එකඟතා සංඛ්‍යාලේඛන භාවිත කිරීම; එකම යොමු මත llama3.2:3b සහ
        වින්‍යාසිත cloud ආකෘතියක් factual-consistency හෝ මානව ශ්‍රේණිගත කිරීම් සමඟ තක්සේරු
        කිරීම; භාෂාවකට OCR character error rate සහ NER precision/recall මැනීම; චක්‍රලේඛ අංක,
        මුදල් ප්‍රමාණ සහ නිලධාරී නම් දක්වා guardrails විස්තීරණය; සාරාංශ ලක්ෂ්‍යවලින් මූලාශ්‍ර
        පරාසයට provenance සබැඳි එක් කිරීම; සහ පාසල් කාර්ය මණ්ඩල පිළිගැනීමේ පරීක්ෂණ සම්පූර්ණ
        කිරීම යෝජනා කෙරේ. විශ්වාසනීයත්වය හෝ පිළිගැනීම පිළිබඳ දැඩි ප්‍රකාශවලට පෙර එම පියවර
        අවශ්‍ය වේ.

