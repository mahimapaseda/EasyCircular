declaration:
  - "මම, G G M P Kusumsiri (ශිෂ්‍ය අංකය: 2540881), මෙයින් ප්‍රකාශ කරමි මෙම නිබන්ධන වාර්තාව සහ ඊට අදාළ EasyCircular මෘදුකාංග නිපැයුම මගේම මුල් කාර්යය බවත්, වෙනත් කිසිවෙකුගේ කාර්යයක් ලෙස ඉදිරිපත් කර නොමැති බවත්ය."
  - "මෙහි භාවිත කළ සියලු මූලාශ්‍ර නිසි ලෙස උපුටා දක්වා ඇති අතර, මෙම කාර්යයෙන් කිසිදු කොටසක් මීට පෙර වෙනත් උපාධි හෝ සහතික පත්‍රයක් සඳහා ඉදිරිපත් කර නොමැත."
  - "මෙම වාර්තාවේ අන්තර්ගතය මගේ දැනුම අනුව නිවැරදි බවත්, අධ්‍යයන ආචාර ධර්ම පිළිපදින බවත් මම තහවුරු කරමි."
  - "අත්සන: ..............................    දිනය: August 2026"
  - "ශිෂ්‍ය නම: G G M P Kusumsiri"

ai_declaration:
  - "මෙම ප්‍රකාශය මගින් EasyCircular ව්‍යාපෘතියේ සංවර්ධන කාර්යයේදී generative AI මෙවලම් භාවිත කළ ආකාරය විනිවිදභාවයෙන් ප්‍රකාශ කරමි. ව්‍යාපෘතියේ concept, requirements, architecture තීරණ, evaluation සහ නිබන්ධන තර්ක මගේම කාර්යය වන අතර, AI මෙවලම් සහායක (assistive) මට්ටමින් පමණක් භාවිත කරන ලදී."
  - "භාවිත කළ මෙවලම: OpenAI ChatGPT (code scaffolding, debugging suggestions සහ boilerplate generation සඳහා)."
  - "AI සහාය ලබා ගත් ප්‍රධාන ක්ෂේත්‍ර: boilerplate configuration (Docker Compose, environment setup), repetitive utility functions, regex patterns, test case scaffolding, සහ error message debugging. සෑම AI-generated code කොටසක්ම මා විසින් කියවා, තේරුම් ගෙන, ව්‍යාපෘති architecture එකට ගැලපෙන පරිදි වෙනස් කර, pytest සහ manual testing මගින් සත්‍යාපනය කරන ලදී."
  - "AI විසින් ලබා දුන් කිසිදු කේත කොටසක් සත්‍යාපනයකින් තොරව පද්ධතියට ඇතුළත් කර නොමැත. AI-assisted code segments පිළිබඳ සම්පූර්ණ විස්තර, ඒවායේ ක්‍රියාකාරිත්වය (function), භාවිත කිරීමට හේතුව (reason) සහ system design එකට ගැලපෙන ආකාරය (fit) පරිච්ඡේදය 4 හි කොටස 4.6 සහ Appendix E හි ලේඛනගත කර ඇත."
  - "නිබන්ධන පෙළ රචනය, සාහිත්‍ය සමාලෝචනය, දත්ත විශ්ලේෂණය සහ නිගමන මගේම අධ්‍යයන කාර්යයයි. AI මෙවලම් language polishing සහ formatting සඳහා පමණක් සීමිත ලෙස භාවිත විය."
  - "අත්සන: ..............................    දිනය: August 2026"

dedication:
  - "මෙම කෘතිය මගේ ආදරණීය මාතාපිතෘන්ට කැප කරමි."
  - "ඔවුන්ගේ අඛණ්ඩ ආදරය, පූජාව සහ දිරිගැන්වීම නොමැතිව මෙම ව්‍යාපෘතිය සාර්ථකව අවසන් කිරීමට නොහැකි වනු ඇත."

acknowledgement:
  - "මෙම ව්‍යාපෘතිය සාර්ථකව සම්පූර්ණ කිරීමට දායක වූ සියලු දෙනාට මගේ හද පිරි ස්තුතිය පළ කරමි."
  - "මගේ පර්යේෂණ මඟපෙන්වන්නා (Supervisor) වන Mr. Anuruddha Abeysinghe මහතාට විශේෂ ස්තුතිය පළ කරමි. ඔහුගේ අධ්‍යයන මඟපෙන්වීම, තාක්ෂණික උපදෙස්, විචාරාත්මක ප්‍රතිචාර සහ ව්‍යාපෘතිය පුරාම ලබා දුන් නිරන්තර සහාය නොමැතිව EasyCircular පද්ධතිය මෙම මට්ටමට ගෙන ඒමට නොහැකි වනු ඇත."
  - "මොඩියුල කථිකාචාර්ය (Module Lecturer) වන Dr. Gayana Fernando මහත්මියටත් ස්තුති වෙමි. මොඩියුලය පුරා ලබා දුන් අධ්‍යයන මඟපෙන්වීම, academic standards පැහැදිලි කිරීම සහ thesis report ගුණාත්මකභාවය ඉහළ නැංවීමට උපකාර වූ උපදෙස් වටිනා විය."
  - "මගේ ආදරණීය මාතාපිතෘන්ටත්, පවුලේ සාමාජිකයන්ටත් මගේ කෘතඥතාව පළ කරමි. අධ්‍යයන කාලය පුරා ඔවුන් ලබා දුන් ආදරය, ඉවසීම, ආර්ථික සහාය සහ නිරන්තර දිරිගැන්වීම මගේ විශාලතම ශක්තිය විය."
  - "මගේ මිතුරන්ටත් ස්තුති වෙමි. අධ්‍යයන කටයුතුවලදී ලබා දුන් සහාය, අදහස් හුවමාරුව, විවේක කාලවලදී ලබා දුන් ධෛර්ය සහ අවසාන අදියරේදී ලබා දුන් ප්‍රායෝගික උපකාර මට ඉතා වටිනා විය."
  - "EasyCircular පද්ධතියේ අවශ්‍යතා හඳුනා ගැනීමට Google Forms සමීක්ෂණයට සහභාගී වූ විදුහල්පතිවරු, ගුරුවරු සහ පරිපාලන නිලධාරීන් 41 දෙනාටත්, නියමු පරීක්ෂණ සඳහා සහය වූ අධ්‍යාපන ක්‍ෂේත්‍රයේ කටයුතු කරන අයටත් මගේ කෘතඥතාව පළ කරමි."
  - "අවසාන වශයෙන්, මෙම ව්‍යාපෘතිය සාර්ථක කිරීමට කෙසේ හෝ දායක වූ සියලු ගුරුවරුන්ට, සහශිෂ්‍යයන්ට සහ සහායකයන්ට මගේ හද පිරි ස්තුතිය පළ කරමි."

abstract:
  - "EasyCircular යනු ශ්‍රී ලංකා අධ්‍යාපන අමාත්‍යාංශයේ නිල චක්‍රලේඛ (MOE circulars) PDF ලේඛනවලින් වැදගත් තොරතුරු නිස්සාරණය කර, ව්‍යුහගත සාරාංශයක් සහ නාමිත සංචිත (දින, සංවිධාන, නීතිමය සම්බන්ධතා, ක්‍රියාකාරී අයිතම) ඉස්මතු කර පෙන්වන AI සහ NLP පාදක වෙබ් පද්ධතියකි. දිගු හා සංකීර්ණ පරිපාලන භාෂාවකින් යුත් මෙම චක්‍රලේඛ කෙටි කාලයකින් නිවැරදිව අවබෝධ කර ගැනීම විදුහල්පතිවරුන්ට, ගුරුවරුන්ට සහ අධ්‍යාපන නිලධාරීන්ට අපහසු වන අතර, සාමාන්‍ය chatbot මෙවලම් hallucination අවදානම, දත්ත රහස්‍යතා ගැටලු සහ ව්‍යුහගත output නොමැතිකම නිසා පාසල් මට්ටමේ විශ්වාසදායක නොවේ. ව්‍යාපෘතියේ අනන්‍යතාව වන්නේ local Ollama LLM, Tesseract OCR (සිංහල, ඉංග්‍රීසි, දෙමළ), human-in-the-loop පෙළ සංස්කරණය, content-hash caching සහ date guardrails ඒකාබද්ධ කරමින් purpose-built, self-hostable විසඳුමක් ලබා දීමයි. පද්ධතිය Next.js frontend, Express backend, FastAPI AI service සහ MongoDB යන ත්‍රිස්ථර ගෘහනිර්මාණයෙන් Agile ක්‍රමවේදය යටතේ ක්‍රියාත්මක කරන ලදී. අවශ්‍යතා තහවුරු කිරීමට සිදු කළ වෙළඳපොළ පර්යේෂණ සමීක්ෂණයේ (n=41) 97.6% සාරාංශයක් අවශ්‍ය බවත්, 78% entity highlighting ප්‍රයෝජනවත් බවත් පෙන්වා දුන්නේය. තක්සේරුවේදී ROUGE-1 F1 0.414, ROUGE-2 F1 0.215 සහ ROUGE-L F1 0.292 වාර්තා වූ අතර AI service pytest 91ක් සහ backend tests 13ක් සමත් විය. ප්‍රධාන දායකත්වය වන්නේ පාසල් පරිපාලනයේ චක්‍රලේඛ අවබෝධය වේගවත් කරන, privacy-conscious local deployment සඳහා සුදුසු ක්‍රියාකාරී මෘදුකාංග නිපැයුමකි; අනාගත කාර්යයන් ලෙස සම්පූර්ණ සිංහල NER සහ formal UAT සම්පූර්ණ කිරීම යෝජනා කෙරේ."

keywords:
  - "EasyCircular"
  - "MOE circulars"
  - "Natural Language Processing"
  - "Named Entity Recognition"
  - "Text Summarization"
  - "Sinhala OCR"
  - "Local LLM"
