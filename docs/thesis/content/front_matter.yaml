glossary:
  - term: "NLP (Natural Language Processing)"
    definition: "ස්වභාවික භාෂා සැකසුම: මිනිස් භාෂාව අවබෝධ කර ගැනීමට සහ සැකසීමට පරිගණක විද්‍යාව සහ AI භාවිත කරන ශාඛාව."
  - term: "NER (Named Entity Recognition)"
    definition: "නාමිත සංචිත හඳුනා ගැනීම: පෙළ තුළ දින, පුද්ගල නාම, සංවිධාන, නීතිමය සම්බන්ධතා වැනි ව්‍යුහගත දත්ත ස්වයංක්‍රීයව හඳුනා ගැනීම."
  - term: "LLM (Large Language Model)"
    definition: "විශාල භාෂා ආකෘතිය: Transformer architecture මත පදනම් වූ, විශාල පෙළ corpora මත පුහුණු කළ AI ආකෘතියක්."
  - term: "OCR (Optical Character Recognition)"
    definition: "පිළිබිඹු අක්ෂර හඳුනා ගැනීම: scan කළ හෝ ඡායාරූප PDF වලින් පෙළ නිස්සාරණය කිරීම."
  - term: "ROUGE"
    definition: "Recall-Oriented Understudy for Gisting Evaluation: සාරාංශ ගුණාත්මකභාවය මැනීමට භාවිත කරන ස්වයංක්‍රීය මිනුම්."
  - term: "MOE"
    definition: "Ministry of Education: ශ්‍රී ලංකා අධ්‍යාපන අමාත්‍යාංශය; පාසල් පරිපාලනය සඳහා නිල circulars නිකුත් කරන ආයතනය."
  - term: "Circular (චක්‍රලේඛ)"
    definition: "අධ්‍යාපන අමාත්‍යාංශය විසින් පාසල්වලට නිකුත් කරන නිල පරිපාලන/නීතිමය/ප්‍රතිපත්ති ලේඛනය."
  - term: "Extractive Summarization"
    definition: "මුල් ලේඛනයෙන් වැදගත් වාක්‍ය තෝරා ගෙන සාරාංශයක් සෑදීම: නීතිමය අර්ථය වෙනස් නොවී."
  - term: "Abstractive Summarization"
    definition: "AI මගින් මුල් අර්ථය අවබෝධ කර නව වාක්‍යවලින් සාරාංශයක් ලිවීම."
  - term: "Guardrails"
    definition: "AI output පිළිබඳ ආරක්ෂක පියවර: උදා: සාරාංශයේ දින මුල් circular එකේ නොමැති නම් LLM output ඉවතලීම."
  - term: "SpaCy"
    definition: "Python NLP library: en_core_web_sm වැනි ආකෘති සමඟ NER සහ tokenization."
  - term: "LangChain"
    definition: "LLM applications සඳහා framework: prompt chains, map-reduce summarization."
  - term: "MongoDB"
    definition: "NoSQL document database: circular records, summaries, entities storage."
  - term: "FastAPI"
    definition: "Python web framework: AI microservice REST API."
  - term: "Next.js"
    definition: "React-based web framework: EasyCircular frontend."
  - term: "Ollama"
    definition: "Local LLM runtime: llama3.2:3b වැනි ආකෘති host-side run කිරීම."
  - term: "Map-Reduce Summarization"
    definition: "දිගු circulars කොටස් වලට බෙදා partial summaries ලබා ගෙන ඒවා ඒකාබද්ධ සාරාංශයක් බවට පත් කිරීම."
  - term: "Human-in-the-Loop"
    definition: "AI process කිරීමට පෙර පරිශීලක extract කළ පෙළ සංස්කරණය කිරීම."
  - term: "UAT (User Acceptance Testing)"
    definition: "අවසාන පරිශීලක acceptance testing: පාසල් staff සමඟ practical accuracy පරීක්ෂාව."
  - term: "Agile SDLC"
    definition: "Iterative software development: sprints, continuous feedback, prototype tuning."
  - term: "JWT"
    definition: "JSON Web Token: authenticated API requests සඳහා bearer token."
  - term: "Tesseract"
    definition: "Open-source OCR engine: sin+eng+tam language packs සමඟ MOE circulars."
  - term: "PyMuPDF / pdfplumber"
    definition: "PDF text extraction libraries: native PDF parsing."
  - term: "Content Hash"
    definition: "SHA-256 hash of extracted/edited text: duplicate LLM calls cache කිරීමට."
  - term: "Phase Exit Gate"
    definition: "Implementation phase අවසානයේ pass කළ යුතු verification criteria."
  - term: "Hallucination"
    definition: "AI විසින් මුල් ලේඛනයේ නොමැති false facts generate කිරීම."
  - term: "Hybrid Summarization"
    definition: "Extractive + abstractive techniques එකට combine කිරීම."
  - term: "Transformer"
    definition: "Self-attention architecture: BERT, GPT, Gemini වැනි ආකෘතිවල foundation."
  - term: "Generative AI"
    definition: "ජනන කෘත්‍රිම බුද්ධිය: පෙළ, කේත හෝ රූප නව ලෙස ජනනය කරන AI ආකෘති; උදා: ChatGPT."
  - term: "ChatGPT"
    definition: "OpenAI විසින් සංවර්ධිත conversational LLM මෙවලමක්; මෙම ව්‍යාපෘතියේ code scaffolding සහ debugging සහාය සඳහා භාවිත විය (කොටස 4.6)."
  - term: "AI-Assisted Code"
    definition: "AI මෙවලමක් විසින් යෝජනා කර, පසුව සංවර්ධකයා විසින් සමාලෝචනය කර, වෙනස් කර, පරීක්ෂා කර පද්ධතියට ඇතුළත් කළ කේත කොටස්."
  - term: "Prompt Engineering"
    definition: "LLM එකකින් අපේක්ෂිත output ලබා ගැනීමට instruction/prompt නිර්මාණය කිරීමේ ක්‍රමවේදය."
  - term: "Academic Integrity"
    definition: "අධ්‍යයන අවංකභාවය: භාවිත කළ සියලු මූලාශ්‍ර සහ AI සහාය නිසි ලෙස ප්‍රකාශ කිරීම සහ උපුටා දැක්වීම."
