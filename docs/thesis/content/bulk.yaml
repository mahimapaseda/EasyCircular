    - චක්‍රලේඛ අවබෝධයේ ප්‍රායෝගික බලපෑම පාසල් මට්ටමේ අනුකූලතාව, විභාග කටයුතු සහ ශිෂ්‍ය සුබසාධන ක්‍රියාත්මක කිරීමට
      සෘජුව බලපායි. වැරදි අර්ථකථනයකින් කාලසීමා මගහැරීම හෝ අනුකූලතා ගැටලු ඇති විය හැක.
    - ඩිජිටල් පරිවර්තනය අධ්‍යාපන අංශයේ ඉදිරියට යන අතරත්, චක්‍රලේඛ සැකසීම සඳහා purpose-built AI මෙවලම් තවමත් දුර්ලභය.
      EasyCircular මෙම ප්‍රායෝගික හිඩැස පුරවයි.
    - WhatsApp සහ email හරහා ලේඛන බෙදා හැරීමේදී සන්දර්භය අහිමි වීම සාමාන්‍ය ගැටලුවකි. සම්මත සාරාංශයක් තිබීමෙන් මෙම
      අවදානම අඩු වේ.
  scope:
    paragraphs:
    - EasyCircular විෂය පථ නිර්වචනය සති 10ක නිබන්ධන කාලරාමුව, තනි සංවර්ධක සම්පත් සීමාව සහ ලබා ගත හැකි අමාත්‍යාංශ
      චක්‍රලේඛ නියමු නියැදි මත පදනම් වේ. විෂය පථය තුළ ඇති බෙදාහැරීම් අතර ක්‍රියාකාරී මෘදුකාංග කෘතිය, තක්සේරු සාධක
      (ROUGE ලකුණු, පරීක්ෂණ ප්‍රතිඵල) සහ ශාස්ත්‍රීය ලේඛනගත කිරීම (නිබන්ධන වාර්තාව) ඇතුළත් වේ. විෂය පථ සීමා පැහැදිලිව
      වෙන් කිරීම යථාර්ථවාදී අපේක්ෂා සකසා ශාස්ත්‍රීය අවංකභාවය පවත්වා ගනියි.
    - විෂය පථය තුළ PDF සැකසුම් හැකියාවන් pdfplumber layout-දැනුවත් නිස්සාරණය, PyMuPDF fallback, Tesseract OCR ත්‍රිභාෂික
      සහාය (sin+eng+tam) සහ human-in-the-loop පෙළ සංස්කරණය එකට සංයුක්ත කරයි. මෙම බහු-අදියර ප්‍රවේශය විවිධ අමාත්‍යාංශ
      චක්‍රලේඛ ආකෘති හැසිරවීමේ විශ්වාසය සපයයි. ඩිජිටල් උපත ලද PDF, ස්කෑන් කළ ලේඛන සහ මිශ්‍ර මාදිලි PDF (සමහර පිටු
      ඩිජිටල්, සමහරක් ස්කෑන්) pipeline එක දෘඪ ලෙස සකසයි.
    - විෂය පථය තුළ AI හැකියාවන් SpaCy NER (ඉංග්‍රීසි entities), LangChain/Ollama සාරාංශකරණය (map-reduce chain),
      guardrails (නිර්මිත දින ප්‍රතික්ෂේප කිරීම, extractive fallback) සහ ක්‍රියාකාරී අයිතම නිස්සාරණය (අනිවාර්ය වාක්‍ය
      හඳුනා ගැනීම) ඇතුළත් කරයි. AI pipeline එක ව්‍යුහගත JSON ප්‍රතිදානය (entities, සාරාංශය, ක්‍රියාකාරී අයිතම, සැකසුම්
      මාදිලිය) නිපදවා MongoDB හි ගබඩා කරයි. නැවත නැවත සැකසීම වැළැක්වීමට content hash caching ක්‍රියාත්මක කර ඇත.
    - 'විෂය පථය තුළ තක්සේරු බෙදාහැරීම් ROUGE මිනුම් (නියමු චක්‍රලේඛ 6ක්, macro-averaged ලකුණු), ස්වයංක්‍රීය පරීක්ෂණ
      කට්ටලය (91 pytest සහ backend පරීක්ෂණ 13ක්), අදියර සත්‍යාපන scripts (phase1, phase4) සහ health check අධීක්ෂණය
      ඇතුළත් කරයි. තක්සේරු සාධක නැවත නිපදවිය හැක: scripts repository එකේ අනුවාද-පාලිත වන අතර පරීක්ෂණ විධාන ලේඛනගත
      කර ඇත. ROUGE තක්සේරුවේ fallback මාදිලිය ප්‍රාථමික baseline ලෙස ඉදිරිපත් කරයි.'
    - විෂය පථයෙන් පිටත අයිතම අවංකව පිළිගෙන Phase 6 අනාගත කාර්ය ලෙස වර්ගීකරණය කර ඇත. සම්පූර්ණ සිංහල/දෙමළ NER ආකෘති
      ඉංග්‍රීසි SpaCy ආකෘතියේ Phase 5 සීමාවකි; කැප වූ සිංහල NER (multilingual BERT fine-tuning) සැලකිය යුතු පුහුණු
      දත්ත සහ ගණනය කිරීමේ සම්පත් අවශ්‍ය කරයි. නිෂ්පාදන cloud යෙදවීම AWS/GCP යටිතල පහසුකම්, SSL සහතික, වසම් වින්‍යාසය
      සහ අධීක්ෂණ පිහිටුවීම නිබන්ධන කාලරාමුව ඉක්මවයි.
    - විධිමත් UAT (User Acceptance Testing) අවම වශයෙන් පාසල් කාර්ය මණ්ඩල සහභාගිවන්නන් 5ක් සමඟ සැලසුම් කර ඇති නමුත්
      නිබන්ධන ඉදිරිපත් කිරීමේ දිනය වන විට කාලසටහන් සීමා නිසා pending ලෙස පවතී. නිබන්ධන වාර්තාව UAT තත්ත්වය අවංකව
      වාර්තා කරන අතර pending ස්වභාවය ශාස්ත්‍රීය අඛණ්ඩතා උල්ලංඝනයක් නොවන ලෙස ඉදිරිපත් කරයි. UAT සම්පූර්ණ කිරීම ඉදිරිපත්
      කිරීමෙන් පසු අනුගමනයක් ලෙස නිර්දේශ කරයි.
    - ද්විභාෂික UI (සිංහල/දෙමළ/ඉංග්‍රීසි අතුරුමුහුණු ලේබල), භූමිකා-පාදක admin dashboard, async job queue (පිටු 20කට
      වැඩි චක්‍රලේඛ), අමාත්‍යාංශ නිල API ඒකාබද්ධ කිරීම සහ AI සාරාංශවල නීතිමය වලංගුතා සහතික කිරීම විෂය පථයෙන් පිටත
      පවතී. මෙම අයිතම සැබෑ පරිශීලක වටිනාකම එකතු කරන අනාගත වැඩිදියුණු කිරීම් වන අතර නිබන්ධන විෂය පථ සීමාව යථාර්ථවාදී
      බෙදාහැරීම් කට්ටලයකට ප්‍රමුඛතාව දීමට අනිවාර්ය කරයි.
    - විෂය පථ කළමනාකරණය Agile ක්‍රමවේදය සමඟ පෙළගැසී sprint-පාදක ප්‍රමුඛතාකරණය අනුගමනය කරයි. Phase 1 (Foundation)
      මූලික යටිතල පහසුකම්, Phase 2 (Ingestion) PDF pipeline, Phase 3 (AI Core) NER/සාරාංශකරණය, Phase 4 (MVP) ඒකාබද්ධ
      වෙබ් යෙදුම සහ Phase 5 (Validate and Release) පරීක්ෂණ/තක්සේරුව බෙදා හරියි. එක් එක් අදියර නිශ්චිත විෂය පථ අයිතමවලට
      කැප වී අදියර පිටවීමේ දොරටු මගින් සත්‍යාපනය කරයි.
    - 'තනි-සංවර්ධක ව්‍යාපෘතියක විෂය පථ ප්‍රසාරණය වැළැක්වීම තීරණාත්මකය: විශේෂාංග ඉල්ලීම් (තමන්ගේ අදහස්, අධීක්ෂක යෝජනා)
      ක්‍රියාත්මක කිරීමට පෙර ප්‍රමුඛතාගත backlog එකක තක්සේරු කරයි. විනය මෙසේය: විශේෂාංගයක් Phase 5 විෂය පථයෙන් පිටත
      නම් එය Phase 6 ලෙස ලේඛනගත කර ඉදිරියට යයි. විෂය පථ විනය සති 10ක කාලරාමුව අනුගමනය කිරීම සක්‍රීය කරන අතර විෂය
      පථ ප්‍රසාරණය කාලරාමු ඉක්මවීමේ ප්‍රාථමික අවදානමයි. Backlog කළමනාකරණය ක්‍රියාත්මක කිරීමේ කැපවීමකින් තොරව විශේෂාංග
      අදහස් ග්‍රහණය කරයි.'
    - 'විෂය පථ සීමා නිර්වචනය පුනරාවර්තනීය පිරිපහදු ක්‍රියාවලියක් අනුගමනය කළේය: මුල් විෂය පථය පුළුල් විය (සියලු රජයේ
      ලේඛන), පළමු පුනරාවර්තනය පටු කළේය (අමාත්‍යාංශ ලේඛන පමණි), දෙවන පුනරාවර්තනය අවධානය යොමු කළේය (විශේෂයෙන් චක්‍රලේඛ,
      gazette දැන්වීම් සහ අයවැය වෙන්කිරීම් බැහැර කරමින්). එක් එක් පුනරාවර්තනයේදී විෂය පථ ශක්‍යතාව සති 10ක කාලරාමුවට
      එරෙහිව තක්සේරු කළ අතර අවසාන විෂය පථය අභිලාෂකාමී නමුත් ජයගත හැකි සමතුලිතතාවක් විය. පුනරාවර්තනීය විෂය පථ පිරිපහදුව
      Agile ක්‍රමවේදයේ ප්‍රායෝගික යෙදුමක් පෙන්වයි.'
    - 'තාක්ෂණ විෂය පථ සීමා දෘඪාංග සීමා පිළිබිඹු කරයි: සංවර්ධන යන්ත්‍ර පිරිවිතර (16GB RAM, Intel i7, කැප වූ GPU නැත)
      Ollama ආකෘති තේරීමට බලපෑවේය. llama3.2:3b (පරාමිති බිලියන 3) සංවර්ධන දෘඪාංග මත සුවපහසුවෙන් ධාවනය වන අතර විශාල
      ආකෘති (7B, 13B) මතක පීඩනය ඇති කරයි. තාක්ෂණ විෂය පථය දෘඪාංග-දැනුවත්ය: කාර්ය සාධන මිනුම්කෝදණ්ඩ සංවර්ධන යන්ත්‍රය
      baseline ලෙස ගනී; නිෂ්පාදන දෘඪාංග වෙනස් පිරිවිතර නිසා Phase 6 හි කාර්ය සාධන නැවත තක්සේරුව අවශ්‍ය වේ.'
    - 'විෂය පථ ලේඛනගත කිරීම නිබන්ධන අනුබද්ධයේ සම්පූර්ණ විෂය පථ න්‍යාසයක් ඇතුළත් කරයි: එක් එක් විභව විශේෂාංගය විෂය
      පථය තුළ/පිටත වර්ගීකරණය, තර්කනය සහ අදියර පැවරීම (Phase 5 විරුද්ධව Phase 6). විෂය පථ න්‍යාසය පාර්ශ්වකරු සන්නිවේදන
      මෙවලමකි: අධීක්ෂක අපේක්ෂා කළමනාකරණය කරයි, තක්සේරු නිර්ණායක පැහැදිලි කරයි සහ අනාගත කාර්ය පාරදෘශ්‍යව සැලසුම්
      කරයි. විෂය පථ ලේඛනගත කිරීම ව්‍යාපෘති කළමනාකරණ පරිණතභාවය පෙන්වන අතර ad hoc විෂය පථ තීරණ වළක්වයි.'
    - 'පරීක්ෂණ විෂය පථ නිර්වචනය පැහැදිලිය: ඒකක පරීක්ෂණ (තනි ශ්‍රිත), ඒකාබද්ධ පරීක්ෂණ (බහු-සංරචක කාර්යප්‍රවාහ), පද්ධති
      පරීක්ෂණ (අන්තයේ සිට අන්තයට පරිශීලක ගමන් මාර්ග) සහ පිළිගැනීමේ පරීක්ෂණ (UAT) මට්ටම් නිර්වචනය කරයි. Phase 5 විෂය
      පථය ඒකක හා ඒකාබද්ධ පරීක්ෂණ සම්පූර්ණව ආවරණය කරන අතර පද්ධති පරීක්ෂණ අදියර සත්‍යාපන scripts මගින් ආවරණය කරයි;
      පිළිගැනීමේ පරීක්ෂණ සැලසුම් කර ඇති නමුත් pending වේ. පරීක්ෂණ විෂය පථ සීමා අවංකය: load testing, ආරක්ෂක penetration
      testing සහ හරස්-බ්‍රවුසර ගැළපුම් පරීක්ෂණ පැහැදිලිව Phase 5 විෂය පථයෙන් පිටතය.'
  structure:
    paragraphs:
    - නිබන්ධන වාර්තාව පරිච්ඡේද හතක රේඛීය ප්‍රගතියක් අනුගමනය කර ගැටලු හඳුනා ගැනීමේ සිට විසඳුම් ක්‍රියාත්මක කිරීම,
      තක්සේරුව සහ නිගමන දක්වා ගලා යයි. එක් එක් පරිච්ඡේදය පෙර සොයාගැනීම් මත ගොඩනැගෙන අතර හරස්-යොමු පාඨක සංචලනය පහසු
      කරයි. වාර්තා ව්‍යුහය BSc Computer Science නිබන්ධන සම්මුතීන් අනුගමනය කරමින් ප්‍රායෝගික මෘදුකාංග ව්‍යාපෘති විශේෂතා
      උපයෝගී කර ගනියි.
    - 'පරිච්ඡේදය 1 (හැඳින්වීම) ව්‍යාපෘති සන්දර්භය ස්ථාපිත කරයි: අමාත්‍යාංශ චක්‍රලේඛ ගැටලු වසම, පාර්ශ්වකරු අභියෝග,
      EasyCircular විසඳුම් දළ විශ්ලේෂණය, මැනිය හැකි අරමුණු පහක් සහිත ප්‍රාථමික අරමුණ, විෂය පථ සීමා (විෂය පථය තුළ
      විරුද්ධව පිටත) සහ වාර්තා සංවිධානය. පාඨකයා මෙම පරිච්ඡේදය කියවීමෙන් ව්‍යාපෘති තර්කනය සහ අපේක්ෂිත බෙදාහැරීම්
