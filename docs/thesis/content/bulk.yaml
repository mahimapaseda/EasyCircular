      දෙක තාක්ෂණික නැවත නිර්මාණයකින් තොරව තක්සේරු විශ්වාසය වැඩි කරයි.'
    - 'මධ්‍ය කාලීනව සිංහල NER සංවර්ධනයට සටහන්ගත කෝපස් එකක්, multilingual ආකෘති fine-tuning සහ entity-මට්ටමේ නිරවද්‍යතා
