      සහ custom EntityRuler patterns එකට යොදා EasyCircular DATE, ORG සහ LAW entities extract කරයි. Action items
      අනිවාර්ය වාක්‍ය heuristics මගින් වෙනම ලැයිස්තුවක ඉදිරිපත් කෙරේ.
