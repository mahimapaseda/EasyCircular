ch01_introduction:
  aim:
    closing_paragraphs:
    - EasyCircular ව්‍යාපෘතියේ ප්‍රාථමික අරමුණ අමාත්‍යාංශ චක්‍රලේඛ අවබෝධ ක්‍රියාවලිය ස්වයංක්‍රීය කිරීමෙන් අධ්‍යාපන
      පාර්ශ්වකරුවන්ගේ භාරය අඩු කිරීමයි. සාම්ප්‍රදායික අතින් ක්‍රියාවලියේදී චක්‍රලේඛයක් කියවීම, ප්‍රධාන කරුණු නිස්සාරණය
      කිරීම සහ කාර්ය මණ්ඩලයට බෙදා හැරීම සඳහා සාරාංශ කිරීමට පැය ගණනක් ගත වන අතර AI-සහායිත pipeline එක මෙය මිනිත්තු
      කිහිපයකට සංක්ෂිප්ත කරයි. අරමුණ ඉටු කිරීමට මැනිය හැකි අරමුණු පහක් නිර්වචනය කර එක් එක් අරමුණ නිශ්චිත බෙදාහැරිය
      හැකි කෘති සමඟ සිතියම්ගත කර ඇත.
    - අරමුණු සහ අරමුණුවල විස්තර සමීක්ෂණ ප්‍රතිඵලවලින් සෘජුව ව්‍යුත්පන්න වී පාර්ශ්වකරු අවශ්‍යතා ආමන්ත්‍රණය කරයි.
      Respondents 97.6%ක් සාරාංශ විශේෂාංගය ඉල්ලූ බැවින් සාරාංශකරණ pipeline එක මූලික අරමුණ වේ. 78%ක් entity highlighting
      ප්‍රයෝජනවත් ලෙස ශ්‍රේණිගත කළ බැවින් NER ක්‍රියාත්මක කිරීම ප්‍රමුඛ අරමුණකි. 68.3%ක් AI භාවිතයට පැකිලුණු බැවින්
      දේශීය LLM විකල්පය සහ human-in-the-loop නිර්මාණය විශ්වාස ගොඩනැගීමේ අරමුණක් ලෙස ඇතුළත් කර ඇත.
    - 'අරමුණු මැනිය හැකිබව ව්‍යාපෘති සාර්ථකත්ව තක්සේරුව සක්‍රීය කිරීමේ තීරණාත්මක ලක්ෂණයකි. එක් එක් අරමුණට මැනිය
      හැකි නිර්ණායක සම්බන්ධ වේ: PDF නිස්සාරණ පරීක්ෂණ කෝපස් සාර්ථක අනුපාතය, NER entity හඳුනා ගැනීමේ නිරවද්‍යතාව (pytest
      සත්‍යාපනය), සාරාංශ ගුණාත්මකභාවය (ROUGE මිනුම්), යෙදවීමේ ක්‍රියාකාරීත්වය (අදියර සත්‍යාපන scripts) සහ තක්සේරු
      සම්පූර්ණත්වය (පරීක්ෂණ ගණන, ROUGE ලේඛන ගණන). මැනිය හැකි අරමුණු ආත්මීය සාර්ථකත්ව ප්‍රකාශ වළක්වා වෛෂයික සාධක-පාදක
      තක්සේරුව කළ හැකි කරයි.'
  bg:
    paragraphs:
    - ශ්‍රී ලංකා අධ්‍යාපන පරිපාලනයේ ධුරාවලි ව්‍යුහය අමාත්‍යාංශයේ සිට පළාත්, කලාප සහ පාසල් දක්වා චක්‍රලේඛ බෙදාහැරීම
      බහුමට්ටම් පෙරහනක් බවට පත් කරයි. කලාප අධ්‍යක්ෂවරු චක්‍රලේඛ සාරාංශ කර පාසල් වෙත යවන නමුත් සාරාංශ ගුණාත්මකභාවය
      පුද්ගලයා මත රඳා පවතින අතර අසමාන වේ. ස්වයංක්‍රීය හා නැවත නිපදවිය හැකි සාරාංශකරණය ආයතනික මතකය ශක්තිමත් කර කාර්ය
      මණ්ඩල මාරුවීම් අතර දැනුම් අහිමි වීම අඩු කරයි. G G M P Kusumsiri (ශිෂ්‍ය අංකය 2540881) BSc Computer Science
      අවසන් වසර ව්‍යාපෘතිය ලෙස මෙම පරතරය පිරවීමට EasyCircular සංවර්ධනය කළේය.
    - අධ්‍යාපන පාර්ශ්වකරුවන් චක්‍රලේඛ අවබෝධ ක්‍රියාවලියේදී සංජානන භාර කළමනාකරණය වැදගත් සාධකයකි. ගුරුවරු දිනකට බහු
      චක්‍රලේඛ සකසන අතර විභාග කාල චක්‍රලේඛ, වැටුප් සංශෝධන දැනුම්දීම්, ශිෂ්‍ය සුබසාධන නියෝග සහ ආරක්ෂක අනුකූලතා ලේඛන
      එකවර කළමනාකරණය කළ යුතුය. සංජානන අධිභාරය තොරතුරු සැකසුම් දෝෂ ඇති කරන අතර තීරණාත්මක කාලසීමා මඟහැරීම සහ අනුකූලතා
      උල්ලංඝනයන් ඇති විය හැක. AI-සහායිත සාරාංශකරණය සංජානන භාරය අඩු කර තීරණ ගුණාත්මකභාවය වැඩි දියුණු කරයි.
  scope:
    paragraphs:
    - EasyCircular විෂය පථ නිර්වචනය සති 10ක නිබන්ධන කාලරාමුව, තනි සංවර්ධක සම්පත් සීමාව සහ ලබා ගත හැකි අමාත්‍යාංශ
      චක්‍රලේඛ නියමු නියැදි මත පදනම් වේ. විෂය පථය තුළ ඇති බෙදාහැරීම් අතර ක්‍රියාකාරී මෘදුකාංග කෘතිය, තක්සේරු සාධක
      (ROUGE ලකුණු, පරීක්ෂණ ප්‍රතිඵල) සහ ශාස්ත්‍රීය ලේඛනගත කිරීම (නිබන්ධන වාර්තාව) ඇතුළත් වේ. විෂය පථ සීමා පැහැදිලිව
      වෙන් කිරීම යථාර්ථවාදී අපේක්ෂා සකසා ශාස්ත්‍රීය අවංකභාවය පවත්වා ගනියි.
    - විෂය පථ කළමනාකරණය Agile ක්‍රමවේදය සමඟ පෙළගැසී sprint-පාදක ප්‍රමුඛතාකරණය අනුගමනය කරයි. Phase 1 (Foundation)
      මූලික යටිතල පහසුකම්, Phase 2 (Ingestion) PDF pipeline, Phase 3 (AI Core) NER/සාරාංශකරණය, Phase 4 (MVP) ඒකාබද්ධ
      වෙබ් යෙදුම සහ Phase 5 (Validate and Release) පරීක්ෂණ/තක්සේරුව බෙදා හරියි. එක් එක් අදියර නිශ්චිත විෂය පථ අයිතමවලට
      කැප වී අදියර පිටවීමේ දොරටු මගින් සත්‍යාපනය කරයි.
    - 'විෂය පථ සීමා නිර්වචනය පුනරාවර්තනීය පිරිපහදු ක්‍රියාවලියක් අනුගමනය කළේය: මුල් විෂය පථය පුළුල් විය (සියලු රජයේ
      ලේඛන), පළමු පුනරාවර්තනය පටු කළේය (අමාත්‍යාංශ ලේඛන පමණි), දෙවන පුනරාවර්තනය අවධානය යොමු කළේය (විශේෂයෙන් චක්‍රලේඛ,
      gazette දැන්වීම් සහ අයවැය වෙන්කිරීම් බැහැර කරමින්). එක් එක් පුනරාවර්තනයේදී විෂය පථ ශක්‍යතාව සති 10ක කාලරාමුවට
      එරෙහිව තක්සේරු කළ අතර අවසාන විෂය පථය අභිලාෂකාමී නමුත් ජයගත හැකි සමතුලිතතාවක් විය. පුනරාවර්තනීය විෂය පථ පිරිපහදුව
      Agile ක්‍රමවේදයේ ප්‍රායෝගික යෙදුමක් පෙන්වයි.'
  structure:
    paragraphs:
    - 'පරිච්ඡේද අන්තර් සම්බන්ධතාව හිතාමතා නිර්මාණය කර ඇත: පරිච්ඡේදය 2 හි පරතර හඳුනා ගැනීම පරිච්ඡේදය 1 හි ගැටලු ප්‍රකාශය
      ශක්තිමත් කරයි; පරිච්ඡේදය 3 හි නිර්මාණය පරිච්ඡේදය 2 නිර්දේශ කළ ප්‍රවේශ මූර්තිමත් කරන අතර එහි අවශ්‍යතා පරිච්ඡේදය
      2 හි සමීක්ෂණ සොයාගැනීම්වලින් ව්‍යුත්පන්න වේ; පරිච්ඡේදය 4 හි සංවර්ධනය සහ පරීක්ෂණය පරිච්ඡේදය 3 හි නිර්මාණය
      ක්‍රියාත්මක කර සත්‍යාපනය කරයි; පරිච්ඡේදය 5 හි තක්සේරුව පරිච්ඡේදය 4 හි ක්‍රියාත්මක කිරීම Appendix A සැලසුම්
      කළ නිර්ණායක සමඟ මුහුණට මුහුණ ලා තක්සේරු කරයි; පරිච්ඡේදය 6 සියලු පරිච්ඡේද සංශ්ලේෂණය කරයි. රේඛීය නමුත් අන්තර්
      සම්බන්ධිත ව්‍යුහය සුසංයුක්ත ආඛ්‍යානයක් නිර්මාණය කරයි.'
ch02_literature:
  nlp:
    paragraphs:
    - ස්වභාවික භාෂා සැකසුමේ ඉතිහාසය නීති-පාදක පද්ධතිවල සිට සංඛ්‍යානමය ආකෘති දක්වාත්, පසුව Transformer පූර්ව-පුහුණු
      ආකෘති දක්වාත් විකාශනය වී ඇත. Self-attention මගින් දිගු පෙළ තුළ යැපීම් ග්‍රහණය කිරීම පහසු වූ අතර, BERT සහ GPT
      වැනි ආකෘති NER සහ සාරාංශකරණය වැනි downstream කාර්යයන්ට fine-tune කිරීමට හැකි විය. EasyCircular මෙම ප්‍රගතිය
      ප්‍රායෝගිකව යොදා ගනිමින් SpaCy NER සහ Ollama LLM summarization ඒකාබද්ධ කරයි.
    - සිංහල NLP සම්පත්-හිඟ තත්ත්වයේ පවතින බැවින්, Phase 5 හි ඉංග්‍රීසි NER ප්‍රමුඛ වන අතර සිංහල/දෙමළ සඳහා OCR සහ
      extractive fallback භාවිත වේ. මෙය අධ්‍යාපන අමාත්‍යාංශ ත්‍රිභාෂික ලේඛන සන්දර්භයට ගැලපෙන ප්‍රායෝගික තේරීමකි.
      සම්පූර්ණ බහුභාෂික NER Phase 6 අනාගත කාර්යයක් ලෙස හඳුනා ගැනේ.
    - 'පරිපාලන ලේඛන NLP සාමාන්‍ය පුවත් සාරාංශකරණයට වඩා වෙනස් අභියෝග ඉදිරිපත් කරයි: නීතිමය භාෂාව, හරස්-යොමු, වගු
      සහ කාලසීමා නිවැරදිව ආරක්ෂා කිරීම අත්‍යවශ්‍යය. EasyCircular guardrails සහ human-in-the-loop මගින් මෙම අවදානම
      අවම කරයි.'
  sum:
    paragraphs:
    - සාරාංශකරණය extractive සහ abstractive ලෙස ප්‍රධාන වශයෙන් බෙදේ. Extractive ක්‍රම මුල් වාක්‍ය තෝරා ගනිමින් කරුණු
      විශ්වාසනීයත්වය ආරක්ෂා කරන අතර, abstractive ක්‍රම කියවීමේ පහසුව වැඩි කරන නමුත් hallucination අවදානම වැඩි කරයි.
      EasyCircular hybrid ප්‍රවේශයක් භාවිත කර entity-anchored LLM summary සහ TextRank fallback ලබා දෙයි.
    - 'දිගු චක්‍රලේඛ සඳහා map-reduce strategy එකක් භාවිත වේ: ලේඛනය කොටස් වලට බෙදා අර්ධ සාරාංශ ජනනය කර අවසානයේ ඒකාබද්ධ
      කරයි. Date guardrails මගින් මුල් පෙළේ නොමැති දින ඉවත් කර factual fidelity ආරක්ෂා කෙරේ.'
    - සාරාංශ ගුණාත්මකභාවය තක්සේරු කිරීමේදී ROUGE වැනි ස්වයංක්‍රීය මිනුම් සහ මානව තක්සේරුව එකට භාවිත කිරීම හොඳම පරිචයයි.
      මෙම ව්‍යාපෘතිය ROUGE baseline ලබා දෙන අතර UAT අනාගත මානව තක්සේරුව සඳහා සැලසුම් කර ඇත.
  ner:
    paragraphs:
    - පරිපාලන ලේඛනවල NER මගින් දින, සංවිධාන සහ නීතිමය සම්බන්ධතා ස්වයංක්‍රීයව හඳුනා ගැනීම තීරණාත්මකය. SpaCy en_core_web_sm
      සහ custom EntityRuler patterns එකට යොදා EasyCircular DATE, ORG සහ LAW entities extract කරයි. Action items
      අනිවාර්ය වාක්‍ය heuristics මගින් වෙනම ලැයිස්තුවක ඉදිරිපත් කෙරේ.
    - සමීක්ෂණයේ 78% respondents entity highlighting ප්‍රයෝජනවත් යැයි පැවසූ බැවින් NER ඉහළ ප්‍රමුඛතා අවශ්‍යතාවයක්
      ලෙස තහවුරු විය. සිංහල NER සීමාව අවංකව පිළිගෙන extractive සහාය සහ අනාගත multilingual models යෝජනා කෙරේ.
    - Entity linking සහ nested NER අනාගත වැඩිදියුණු කිරීම් ලෙස හඳුනා ගත හැකි අතර, වර්තමාන MVP එක flat entity spans
      සහ frontend highlighting මත අවධානය යොමු කරයි. මෙය පරිශීලකයාට දින සහ නීති ඉක්මනින් දැකීමට උපකාරී වේ.
  rouge:
    paragraphs:
    - ROUGE මගින් ජනනය කළ සාරාංශය යොමු සාරාංශයට සාපේක්ෂව n-gram overlap මනියි. EasyCircular තක්සේරුවේදී චක්‍රලේඛ
      6ක් සමඟ macro ROUGE-1 F1 අගය 0.414, ROUGE-2 F1 අගය 0.215 සහ ROUGE-L F1 අගය 0.292 ලැබුණි. මෙය extractive fallback
      මාදිලියේ reproducible baseline එකකි.
    - 'ROUGE සීමාවන් තේරුම් ගත යුතුය: ඉහළ ලකුණු නීතිමය නිවැරදිබව සහතික නොකරයි. එබැවින් මෙම වාර්තාව ROUGE ප්‍රතිඵල
      automated evidence ලෙස පමණක් ඉදිරිපත් කරන අතර මානව සමාලෝචනය සහ UAT අනාගත අවශ්‍යතාවයක් ලෙස සටහන් කරයි.'
    - ROUGE-1 අන්තර්ගත ආවරණයත්, ROUGE-2 වාක්‍යාංශ සමානතාවත්, ROUGE-L අනුපිළිවෙල සංරක්ෂණයත් මනියි. පරිපාලන වසමේ ලකුණු
      පුවත් benchmark සමඟ සෘජුව සසඳන්නට නොහැකි බැවින් අභ්‍යන්තර baseline ලෙස භාවිත වේ.
  compare:
    paragraphs:
    - ChatGPT සහ Gemini වැනි සාමාන්‍ය මෙවලම් නම්‍යශීලී වුවද MOE circular domain සඳහා structured entities, local
      privacy සහ built-in guardrails ලබා නොදෙයි. Enterprise නීතිමය AI මෙවලම් මිල අධික වන අතර අධ්‍යාපන චක්‍රලේඛ සඳහා
      tune කර නොමැත.
    - EasyCircular open-source, self-hostable stack එකකින් OCR, human-in-the-loop, NER සහ guarded summarization
      ඒකාබද්ධ කරන බැවින් ශ්‍රී ලංකා පාසල් සන්දර්භයට වඩා ගැලපේ. වගුව 2.1 මෙම වෙනස්කම් සංසන්දනය කරයි.
    - 'දත්ත රහස්‍යතාව තීරණාත්මක වෙනසකි: cloud API මගින් ලේඛන බාහිර සර්වර වෙත යවන අතර EasyCircular local Ollama මාර්ගයෙන්
      ආයතනික දත්ත පාලනය පවත්වා ගනී. සමීක්ෂණයේ 17 දෙනෙකු privacy concern ලෙස සඳහන් කළහ.'
  survey:
    paragraphs:
    - Primary research Google Forms සමීක්ෂණය (n=41) ගුරුවරු 30, විදුහල්පතිවරු 8 සහ අධ්‍යාපන නිලධාරීන් 3 දෙනෙකුගෙන්
      සමන්විත විය. 97.6% සාරාංශයක් අවශ්‍ය බවත්, 78% entity highlighting ප්‍රයෝජනවත් බවත්, 68.3% AI භාවිතයට willing
      නොවන බවත් පෙන්වා දුන්නේය.
    - ප්‍රධාන බාධක ලෙස ලේඛන දිග (21) සහ රහස්‍යතාව (17) හඳුනා ගන්නා ලදී. මෙම findings EasyCircular හි local Ollama
      option සහ human review step සඳහා සෘජු design justification ලබා දෙයි. සමීක්ෂණ ප්‍රස්ථාර පහත ඉදිරිපත් කෙරේ.
    - කියවීමේ දුෂ්කරතා අතර Too long ප්‍රධාන වූ අතර Lack of time සහ Complex language ද්විතීයික විය. 78% EasyCircular
      වැනි පද්ධතියක් කාර්යක්ෂමතාව වැඩි කරන බව විශ්වාස කළහ. මෙය value proposition තහවුරු කරයි.
  gap:
    paragraphs:
    - සාහිත්‍යය සහ සමීක්ෂණය සංශ්ලේෂණය කිරීමෙන් පෙනී යන්නේ MOE circular domain සඳහා OCR, NER, guarded summarization
      සහ ව්‍යුහගත වෙබ් UI ඒකාබද්ධ කරන open-source පද්ධතියක් නොමැති බවයි. General LLMs සහ enterprise legal AI මෙවලම්
      මෙම පරතරය සම්පූර්ණයෙන් පුරවන්නේ නැත.
    - EasyCircular මෙම පරතරයට ප්‍රතිචාර දක්වන working artefact එකක් ලෙස ඉදිරිපත් වන අතර, සිංහල NER සහ formal UAT
      තවමත් සීමාවන් ලෙස අවංකව පිළිගනියි. මීළඟ පරිච්ඡේදවල සැලසුම, ක්‍රියාත්මක කිරීම සහ තක්සේරුව මෙම gap closing ප්‍රවේශය
      විස්තර කරයි.
    - 'පර්යේෂණ පරතරය ත්‍රිත්ව සාධක මත පදනම් වේ: සාහිත්‍ය සීමාවන්, සමීක්ෂණ ඉල්ලුම සහ තාක්ෂණික ශක්‍යතාව. EasyCircular
      මෙම ත්‍රිකෝණයට ප්‍රතිචාර දක්වන නමුත් සම්පූර්ණ නිෂ්පාදන පරිමාණය Phase 6 දක්වා දිගු වේ.'
ch03_design:
  intro:
    paragraphs:
    - පරිච්ඡේදය 3 EasyCircular පද්ධතියේ තාක්ෂණික නිර්මාණය සහ ක්‍රියාත්මක කිරීමේ තීරණ සවිස්තරව ලේඛනගත කරයි. ක්‍රමවේද
      කොටස ප්‍රාථමික පර්යේෂණ සමීක්ෂණයේ (n=41) සොයාගැනීම්වලින් ක්‍රියාකාරී අවශ්‍යතා ව්‍යුත්පන්න කිරීම, ත්‍රි-ස්ථර
      microservices ගෘහනිර්මාණය, තාක්ෂණ stack තේරීමේ තර්කනය, PDF සැකසුම් pipeline අදියර, AI ඇල්ගොරිතම (NER, සාරාංශකරණය)
      ක්‍රියාත්මක කිරීම, ආරක්ෂක පාලන සහ API නිර්මාණය විස්තර කරයි.
    - 'නිර්මාණ තීරණ සාධක-පාදක හඹා යා හැකිබව පවත්වා ගනියි: සමීක්ෂණ සොයාගැනීමේ සිට අවශ්‍යතාව දක්වා ගෘහනිර්මාණ තීරණය
      දක්වා ක්‍රියාත්මක කිරීමේ විස්තරය දක්වා. 97.6% සාරාංශ ඉල්ලුම සාරාංශකරණ pipeline සාධාරණීකරණය කරයි, 78% entity
      highlighting NER ක්‍රියාත්මක කිරීම සාධාරණීකරණය කරයි, 68.3% AI විශ්වාස හිඟය human-in-the-loop නිර්මාණය සාධාරණීකරණය
      කරයි, ප්‍රතිචාර දැක්වූවන් 17කගේ රහස්‍යතා කනස්සල්ල දේශීය යෙදවීමේ විකල්පය සාධාරණීකරණය කරයි. එක් එක් ක්‍රමවේද
      කොටස අදාළ සමීක්ෂණ සාධක යොමු කරයි.'
    - 'ක්‍රියාත්මක කිරීමේ ප්‍රවේශය Agile පුනරාවර්තනීය සංවර්ධනය අනුගමනය කරයි: Phase 1 (Foundation) යටිතල පහසුකම්
      ස්ථාපිත කරයි, Phase 2 (Ingestion) PDF pipeline ගොඩනගයි, Phase 3 (AI Core) NER/සාරාංශකරණය ක්‍රියාත්මක කරයි,
      Phase 4 (MVP) ඒකාබද්ධ යෙදුම බෙදා හරියි. ක්‍රමවේද පරිච්ඡේදය Phases 1 සිට 4 දක්වා තාක්ෂණික විස්තර ඉදිරිපත් කරන
      අතර තක්සේරුව (Phase 5) පරිච්ඡේදය 5 ආවරණය කරයි.'
    - G G M P Kusumsiri (ශිෂ්‍ය අංකය 2540881) තනි සංවර්ධකයා ලෙස සියලු ක්‍රියාත්මක කිරීමේ කාර්ය සිදු කර ඇත. තනි සංවර්ධනය
      තීරණ ගැනීමේ චපලතාව සපයන අතර bus factor අවදානම හඳුන්වා දෙයි. සම්පූර්ණ ලේඛනගත කිරීම, ස්වයංක්‍රීය පරීක්ෂණ සහ
      Docker Compose නැවත නිපදවිය හැකි පරිසරය දැනුම් සංරක්ෂණය සහතික කරයි. BSc Computer Science විෂයමාලා කුසලතා (වෙබ්
      සංවර්ධනය, දත්ත සමුදා, Python) සෘජුව යොදා ගනියි.
    - 'තාක්ෂණ තේරීමේ නිර්ණායක: open-source ලබා ගත හැකිබව (ශුන්‍ය බලපත්‍ර පිරිවැය), ප්‍රජා සහාය (ලේඛනගත කිරීම, නිබන්ධන,
