      චක්‍රලේඛ අවබෝධය නිශ්චිත පිවිසුම් ලක්ෂ්‍යයක් ලෙස පුළුල් ඩිජිටල් සාක්ෂරතා වැඩිදියුණු කිරීමට දායක වේ. අරමුණු
      සන්දර්භීය වැදගත්කම නිබන්ධන හැඳින්වීමේදී ස්ථාපිත කරයි.
