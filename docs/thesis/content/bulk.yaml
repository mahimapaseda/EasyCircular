      (තීරණාත්මක/ඉහළ/මධ්‍යස්ථ) තක්සේරු කර නිශ්චිත ක්‍රියාත්මක කළ අවමන ශිල්පක්‍රම ලැයිස්තුගත කර සත්‍යාපන සාධක සපයයි.
      වගු ආකෘතිය අවදානම් කළමනාකරණ පාරදෘශ්‍යතාව වැඩි දියුණු කරයි.
    - 'දුර්වල PDF නිස්සාරණ අවදානමේ අවමනය ත්‍රි-අතිරික්තතා ප්‍රවේශයකි: pdfplumber ප්‍රාථමික, PyMuPDF ද්විතීයික, Tesseract
      OCR තෘතීයික. Human-in-the-loop පෙළ සංස්කරණය අවසාන ගුණාත්මක සහතිකයයි. අවමනය සත්‍යාපනය කර ඇත: නියමු PDF (ඩිජිටල්,
      ස්කෑන්, මිශ්‍ර) සාර්ථකව නිස්සාරණය විය; පරීක්ෂණ කෝපස් අසාර්ථක අනුපාතය 0% වේ.'
    - 'LLM hallucination අවදානමේ අවමනය වඩාත් තීරණාත්මකය: දින සත්‍යාපන guardrail සාරාංශ දින regex මගින් නිස්සාරණය
      කර මූලාශ්‍රයට එරෙහිව සත්‍යාපනය කරයි; අඩු LLM උෂ්ණත්ව සැකසුම නිර්මාණාත්මක ජනනය අඩු කරයි; entity-නැංගුරම් prompts
      කරුණු පදනම්කරණය සපයයි; extractive TextRank fallback ආරක්ෂිත උපස්ථයයි. Pytest අවස්ථා 91ක් guardrail හැසිරීම
      සත්‍යාපනය කරයි.'
    - 'API පිරිවැය අවදානමේ අවමනයේ ප්‍රාථමික යාන්ත්‍රණය content hash caching වේ: SHA-256 hash සමාන පෙළ නැවත සැකසීම
      වළක්වයි; cache hit ~114ms විරුද්ධව තත්පර ගණනක LLM සැකසීම. Ollama දේශීය යෙදවීම ශුන්‍ය per-token පිරිවැය සපයයි.
      Chunk ප්‍රමාණ සීමා සහ rate limiting ටෝකන් පරිභෝජනය පාලනය කරයි. Caching පිරිවැය අවදානම නාටකාකාරී ලෙස අඩු කරයි.'
    - 'සිංහල NLP පරතර අවමනය අදියරගත ප්‍රවේශයකි: Phase 5 හි Tesseract OCR සිංහල පෙළ නිස්සාරණය සපයයි, extractive වාක්‍ය
      තේරීම සිංහල සාරාංශ ජනනය කරයි, ඉංග්‍රීසි කොටස් සම්පූර්ණ NER pipeline එකෙන් සකසයි. Phase 6 සිංහල NER ආකෘති සංවර්ධනය/ඒකාබද්ධ
      කිරීම සැලසුම් කර ඇත. අදියරගත අවමනය අර්ධ ක්‍රියාකාරීත්වය පවත්වා ගනිමින් සම්පූර්ණ විසඳුම් මාර්ග සිතියම සපයයි.'
    - 'UAT ප්‍රතික්ෂේප අවදානමේ අවමනය නිර්මාණ-පාදකය: human-in-the-loop අනිවාර්ය සමාලෝචන පියවර විශ්වාසය ගොඩනගයි, ව්‍යුහගත
      ප්‍රතිදානය (chatbot නොවේ) වෘත්තීය පෙනුම පවත්වා ගනියි, දේශීය යෙදවීම රහස්‍යතාව සහතික කරයි, පැහැදිලි AI සහාය
      අස්වැන්නුම් සපයයි. නිර්මාණ-පාදක අවමනය UAT ප්‍රතිපෝෂණයට පෙර විශ්වාස බාධකය ආමන්ත්‍රණය කරයි.'
    - 'අවදානම් අවමන ඵලදායීතා තක්සේරුව: එක් එක් අවමනයේ සැබෑ ඵලදායීතාව තක්සේරු කරයි (guardrail පරීක්ෂණ සාර්ථක අනුපාතය,
      cache hit අනුපාතය, නිස්සාරණ සාර්ථක අනුපාතය). ඵලදායීතා දත්ත අවදානම් ලේඛනය යාවත්කාලීන කරයි: අවමනය ක්‍රියා කරන්නේද
      නැද්ද යන්න සාධක මත පදනම් වේ. ඵලදායීතා තක්සේරුව අවදානම් කළමනාකරණය ජීවමාන ක්‍රියාවලියක් බවට පත් කරයි.'
    - 'අවශේෂ අවදානම් පිළිගැනීමේ නිර්ණායක: අවශේෂ අවදානම් මට්ටම පිළිගත හැකිදැයි තීරණය කරයි. ශාස්ත්‍රීය ව්‍යාපෘතියක
      මධ්‍යස්ථ අවශේෂය පිළිගත හැක; නිෂ්පාදන යෙදවීමට අඩු අවශේෂය අවශ්‍ය වේ. සිංහල NER අවශේෂ අවදානම Phase 5 හි පිළිගෙන
      Phase 6 ට කල් දමා ඇත. අවශේෂ අවදානම් පිළිගැනීම අවංක තක්සේරුවකි.'
    - 'අවදානම් සන්නිවේදන උපාය: නිබන්ධන වාර්තාව අවදානම් පාරදෘශ්‍යව ඉදිරිපත් කරයි (අවම නොකර හෝ අතිශයෝක්ති නොකර); අධීක්ෂකට
      නිතිපතා අවදානම් තත්ත්ව යාවත්කාලීන; ස්වයං-තක්සේරුව සතිපතා අවදානම් සමාලෝචනය. පාරදෘශ්‍ය අවදානම් සන්නිවේදනය විශ්වාසය
      ගොඩනගන අතර ශාස්ත්‍රීය පරිණතභාවය පෙන්වයි.'
  api:
    paragraphs:
    - 'EasyCircular REST API backend ස්ථරයෙන් නිරාවරණය වේ: සත්‍යාපන endpoints (POST /api/auth/register, POST /api/auth/login,
      GET /api/auth/profile), චක්‍රලේඛ CRUD (POST /api/circulars, GET /api/circulars, GET /api/circulars/:id, DELETE
      /api/circulars/:id), සැකසුම් endpoints (PATCH පෙළ සංස්කරණය, POST සැකසීම) සහ අමාත්‍යාංශ කැටලොග් ආයාතය. API
      සම්පූර්ණ පරිශීලක කාර්යප්‍රවාහය ආවරණය කරයි.'
    - 'AI සේවා අභ්‍යන්තර API: GET /health සේවා තත්ත්වය (SpaCy ආකෘතිය පැටවී ඇත්ද, LLM සම්බන්ධතාව), POST /v1/parse/pdf
      (ආදානය: ගොනු මාර්ගය; ප්‍රතිදානය: නිස්සාරණ පෙළ, පිටු ගණන, භාවිත කළ ක්‍රමය), POST /v1/pipeline (ආදානය: අනුමත
      පෙළ; ප්‍රතිදානය: entities, සාරාංශය, ක්‍රියාකාරී අයිතම, මාදිලිය). අභ්‍යන්තර API backend සංවිධානයට සේවා කරයි.'
    - 'API නිර්මාණය RESTful මූලධර්ම අනුගමනය කරයි: සම්පත්-පාදක URL (/api/circulars/:id), HTTP ක්‍රම අර්ථමය (GET කියවීම,
      POST නිර්මාණය, PATCH යාවත්කාලීන, DELETE ඉවත් කිරීම), රාජ්‍ය-රහිත ඉල්ලීම් (එක් එක් ඉල්ලීමේ JWT ටෝකන්). RESTful
      නිර්මාණය නඩත්තුව සහ frontend ඒකාබද්ධ කිරීම පහසු කරයි.'
    - 'API ලේඛනගත කිරීම: FastAPI ස්වයංක්‍රීය OpenAPI/Swagger ලේඛනගත කිරීම /docs endpoint එකේ ජනනය කරයි. Backend
      API endpoints README.md හි ලේඛනගත කර ඇත; විස්තීර්ණ API යොමුව නිබන්ධන අනුබද්ධයේ ඇතුළත් වේ. API අනුවාදකරණය:
      AI සේවාව /v1/ උපසර්ගය භාවිත කර අනාගත අනුවාද සඳහා ඉඩ තබයි.'
