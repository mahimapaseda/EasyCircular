      සහ සංවර්ධක නුහුරුකම (විෂයමාලා පෙළගැස්ම). එක් එක් තාක්ෂණ stack සංරචකය මෙම නිර්ණායකවලට එරෙහිව තක්සේරු කර තෝරා
      ගෙන ඇත.'
    - 'නිර්මාණ පරිච්ඡේද ව්‍යුහය: කොටස 3.2 අවශ්‍යතා, කොටස 3.3 ගෘහනිර්මාණ දළ විශ්ලේෂණය, කොටස 3.4 Class diagram,
      කොටස 3.5 අතුරුමුහුණත් නිර්මාණය, කොටස 3.6 තාක්ෂණ stack එක. අනුරූප ක්‍රියාත්මක කිරීමේ විස්තර පරිච්ඡේදය 4 හි
      ඉදිරිපත් වේ (කොටස 4.1 PDF pipeline, කොටස 4.2 AI ඇල්ගොරිතම, කොටස 4.3 ආරක්ෂාව, කොටස 4.4 අවදානම් අවමන උපාය,
      කොටස 4.5 API endpoints). කොටස් ස්වයං-අන්තර්ගත නමුත් හරස්-යොමු කර ඇත; පාඨකයා නිශ්චිත මාතෘකා වෙත සංචලනය කළ හැක.'
    - 'ක්‍රමවේද වලංගුකරණ ප්‍රවේශය: නිර්මාණ තීරණ න්‍යායාත්මක මනාපයන් නොවේ; එක් එක් තීරණයට අනුභූතික සාධාරණීකරණයක්
      ඇත (සමීක්ෂණ දත්ත, මිනුම්කෝදණ්ඩ ප්‍රතිඵල, තාක්ෂණ සංසන්දනය). වලංගුකරණ සාධක ක්‍රමවේද කොටස පුරා කාවද්දා ඇත: සමීක්ෂණ
      සංඛ්‍යාලේඛන අවශ්‍යතා සාධාරණීකරණය කරයි, මිනුම්කෝදණ්ඩ කාල කාර්ය සාධනය තහවුරු කරයි, පරීක්ෂණ ප්‍රතිඵල නිවැරදිබව
      සත්‍යාපනය කරයි. සාධක-කාවද්දන ලද ක්‍රමවේදය ශාස්ත්‍රීය දැඩිබව පෙන්වයි.'
    - 'ක්‍රමවේද පරිච්ඡේද ලිවීමේ ප්‍රවේශය තාක්ෂණික නිරවද්‍යතාව පවත්වා ගනිමින් කියවිය හැකි ආඛ්‍යානයක් ගොඩනගයි. කේත
      ලැයිස්තු අවම කරන අතර repository යොමුව සපයයි; ගෘහනිර්මාණ රූප දෘශ්‍ය අවබෝධය වැඩි දියුණු කරයි; එක් එක් තාක්ෂණ
      තේරීමේ තීරණ තර්කනය පැහැදිලි කරයි. ලිවීමේ සමතුලිතතාව: ප්‍රතිනිෂ්පාදනය සක්‍රීය කිරීමට ප්‍රමාණවත් විස්තර, පාඨකයා
      අධිභාරණය නොකරන තරමට. ක්‍රමවේද පරිච්ඡේදය අනාගත සංවර්ධකයකුට ව්‍යාපෘතිය නැවත නිර්මාණය කිරීමේ ක්‍රියාත්මක කිරීමේ
      මාර්ගෝපදේශයක් විය හැක.'
    - 'ක්‍රියාත්මක කිරීම හරහා ක්‍රමවේද වලංගුකරණය: නිර්මාණ තීරණ න්‍යායාත්මක උපකල්පන නොවේ; එක් එක් තීරණය ක්‍රියාත්මක
      කර, පරීක්ෂා කර, මනින ලදී. ක්‍රියාත්මක කිරීමේ වලංගුකරණ සාධක: නිස්සාරණය ක්‍රියා කරයි (පරීක්ෂණ කෝපස්), NER entities
      හඳුනා ගනියි (pytest), සාරාංශකරණය ප්‍රතිදානය නිපදවයි (ROUGE මනින ලදී), guardrails hallucinations ප්‍රතික්ෂේප
      කරයි (pytest), caching කාර්ය සාධනය වැඩි දියුණු කරයි (~114ms). ක්‍රියාත්මක කළ ක්‍රමවේදය න්‍යායාත්මක ක්‍රමවේදය
      ඉක්මවයි; ක්‍රියාකාරී කෘතිය ශක්තිමත්ම ක්‍රමවේද වලංගුකරණයයි.'
    - 'පර්යේෂණ ක්‍රමවේදය මිශ්‍ර ක්‍රම ප්‍රවේශයකි: ප්‍රමාණාත්මක දත්ත (සමීක්ෂණ සංඛ්‍යාලේඛන, ROUGE ලකුණු, පරීක්ෂණ සමත්
      අනුපාත, කාල මිනුම්කෝදණ්ඩ) සහ ගුණාත්මක විශ්ලේෂණය (සාහිත්‍ය සමාලෝචන සංශ්ලේෂණය, නිර්මාණ තර්කනය, සීමා සාකච්ඡාව)
      එකට සංයුක්ත කරයි. මිශ්‍ර ක්‍රම සම්පූර්ණ අවබෝධය සපයයි: සංඛ්‍යා ගුණාත්මකභාවය මනියි, ආඛ්‍යානය සන්දර්භය පැහැදිලි
      කරයි. මිශ්‍ර ක්‍රම ප්‍රවේශය BSc Computer Science නිබන්ධනයට සුදුසුය: තාක්ෂණික ක්‍රියාත්මක කිරීම ප්‍රමාණාත්මකය,
      ශාස්ත්‍රීය විශ්ලේෂණය ගුණාත්මකය.'
