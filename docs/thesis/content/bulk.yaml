      අමාත්‍යාංශ ලේඛනයක් සාමාන්‍ය ලක්ෂණ සහිත (බහු-පිටු, මිශ්‍ර අන්තර්ගතය, දින, සංවිධාන, ක්‍රියාකාරී නියෝග). තක්සේරුව
      නිස්සාරණයේ සිට සාරාංශය දක්වා සම්පූර්ණ කාර්යප්‍රවාහය ආවරණය කරයි.'
