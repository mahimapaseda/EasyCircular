ch01_introduction:
  aim:
    paragraphs:
    - EasyCircular ව්‍යාපෘතියේ ප්‍රාථමික අරමුණ අමාත්‍යාංශ චක්‍රලේඛ අවබෝධ ක්‍රියාවලිය ස්වයංක්‍රීය කිරීමෙන් අධ්‍යාපන
      පාර්ශ්වකරුවන්ගේ භාරය අඩු කිරීමයි. සාම්ප්‍රදායික අතින් ක්‍රියාවලියේදී චක්‍රලේඛයක් කියවීම, ප්‍රධාන කරුණු නිස්සාරණය
      කිරීම සහ කාර්ය මණ්ඩලයට බෙදා හැරීම සඳහා සාරාංශ කිරීමට පැය ගණනක් ගත වන අතර AI-සහායිත pipeline එක මෙය මිනිත්තු
      කිහිපයකට සංක්ෂිප්ත කරයි. අරමුණ ඉටු කිරීමට මැනිය හැකි අරමුණු පහක් නිර්වචනය කර එක් එක් අරමුණ නිශ්චිත බෙදාහැරිය
      හැකි කෘති සමඟ සිතියම්ගත කර ඇත.
    - 'අරමුණු 1: ඩිජිටල් හා ස්කෑන් කළ චක්‍රලේඛ හැසිරවිය හැකි PDF ආයාත pipeline එකක් සංවර්ධනය කිරීම. pdfplumber ප්‍රාථමික
      නිස්සාරණය, PyMuPDF ද්විතීයික fallback සහ Tesseract OCR (sin+eng+tam) රූප-පාදක පිටු සැකසීම යන ත්‍රි-අදියර ප්‍රවේශය
      නිර්මාණය කර ක්‍රියාත්මක කර ඇත. Pipeline එකේ දෘඪතාව විවිධ PDF ආකෘති මත පරීක්ෂා කර සත්‍යාපනය කර ඇත.'
    - 'අරමුණු 2: පරිපාලන ලේඛනවල තීරණාත්මක තොරතුරු ස්වයංක්‍රීයව හඳුනා ගැනීමට Named Entity Recognition (NER) ක්‍රියාත්මක
      කිරීම. SpaCy en_core_web_sm ආකෘතිය DATE, ORG සහ LAW entity වර්ග හඳුනා ගන්නා අතර අභිරුචි EntityRuler රටා අමාත්‍යාංශ-විශේෂිත
      entities (චක්‍රලේඛ අංක, අධ්‍යාපන ආඥාපනත වගන්ති) අනුපූරක කරයි. Entity නිස්සාරණය ව්‍යුහගත JSON ආකාරයෙන් MongoDB
      හි ගබඩා කර frontend එකේ දර්ශනය කරයි.'
    - 'අරමුණු 3: Hallucination අවදානම අවම කර කරුණු විශ්වාසනීයත්වය පවත්වා ගනිමින් සාරාංශකරණ pipeline එකක් නිර්මාණය
      කිරීම. LangChain map-reduce chain එක වින්‍යාසගත chunk ප්‍රමාණයකින් ක්‍රියාත්මක කරන අතර guardrails නිර්මිත
      දින හඳුනා ප්‍රතික්ෂේප කර extractive TextRank fallback එකක් සපයයි. මෙම ප්‍රවේශය ශාස්ත්‍රීය සාහිත්‍යය නිර්දේශ
      කරන සංයුක්ත extractive-abstractive උපාය ප්‍රායෝගිකව යොදයි.'
    - 'අරමුණු 4: Docker Compose පරිසරයක ත්‍රි-ස්ථර වෙබ් යෙදුම් ගෘහනිර්මාණයක් deploy කිරීම. Frontend, backend, AI
      සේවාව සහ MongoDB වෙන් වූ containers තුළ ධාවනය වන අතර තනි විධානයකින් (docker-compose up) සංවර්ධන පිහිටුවීම
      සම්පූර්ණ වේ. ගෘහනිර්මාණය ස්වාධීන ස්ථර පරිමාණනය, තාක්ෂණ ආදේශනය (උදා: වෙනස් LLM ආකෘතිය) සහ නඩත්තුව සරල කරයි.'
    - 'අරමුණු 5: ස්වයංක්‍රීය පරීක්ෂණ, ROUGE මිනුම් සහ අදියර සත්‍යාපන scripts මගින් පද්ධති ගුණාත්මකභාව තක්සේරුව සිදු
      කිරීම. Pytest අවස්ථා 91ක් AI සේවාවේ guardrails, නිස්සාරණ ශ්‍රිත සහ NER නිරවද්‍යතාව සත්‍යාපනය කරන අතර backend
      පරීක්ෂණ 13ක් API endpoints, සත්‍යාපනය සහ ගොනු හැසිරවීම වලංගු කරයි. ROUGE තක්සේරුව නියමු චක්‍රලේඛ 6ක gold සාරාංශ
      සමඟ සංසන්දනය කර සාරාංශ ගුණාත්මකභාවය ප්‍රමාණනය කරයි.'
    - අරමුණු සහ අරමුණුවල විස්තර සමීක්ෂණ ප්‍රතිඵලවලින් සෘජුව ව්‍යුත්පන්න වී පාර්ශ්වකරු අවශ්‍යතා ආමන්ත්‍රණය කරයි.
      Respondents 97.6%ක් සාරාංශ විශේෂාංගය ඉල්ලූ බැවින් සාරාංශකරණ pipeline එක මූලික අරමුණ වේ. 78%ක් entity highlighting
      ප්‍රයෝජනවත් ලෙස ශ්‍රේණිගත කළ බැවින් NER ක්‍රියාත්මක කිරීම ප්‍රමුඛ අරමුණකි. 68.3%ක් AI භාවිතයට පැකිලුණු බැවින්
      දේශීය LLM විකල්පය සහ human-in-the-loop නිර්මාණය විශ්වාස ගොඩනැගීමේ අරමුණක් ලෙස ඇතුළත් කර ඇත.
    - 'ව්‍යාපෘති අරමුණ BSc Computer Science ශාස්ත්‍රීය අවශ්‍යතා සමඟ සමතුලිත වේ: පර්යේෂණ ක්‍රමවේදය පෙන්වීම (සාහිත්‍ය
      සමාලෝචනය, ප්‍රාථමික සමීක්ෂණය), තාක්ෂණික ක්‍රියාත්මක කිරීමේ සාධක (ක්‍රියාකාරී කෘතිය), තක්සේරු දැඩිබව (ප්‍රමාණාත්මක
      ROUGE, ස්වයංක්‍රීය පරීක්ෂණ) සහ අවංක සීමා පිළිගැනීම (සිංහල NER පරතරය, pending UAT). සන්දර්භීය වාර්තාව (පරිච්ඡේද
      1 සිට 4) ස්ථාපිත කළ පදනම සම්පූර්ණ නිබන්ධනය දක්වා දිගු කර සම්පූර්ණ ශාස්ත්‍රීය ලේඛනයක් නිපදවයි.'
    - 'අරමුණු සැකසීමේ ක්‍රියාවලිය පුනරාවර්තනීය විය: මුල් අරමුණ පුළුල් වූ අතර (අධ්‍යාපන ලේඛන සැකසීම), සාහිත්‍ය සමාලෝචනය
      එය පටු කළේය (විශේෂයෙන් අමාත්‍යාංශ චක්‍රලේඛ), සමීක්ෂණය වලංගු කළේය (පාර්ශ්වකරු ඉල්ලුම තහවුරු කිරීම). අවසාන අරමුණ
      නිශ්චිතභාවය පිළිබිඹු කරයි: නිශ්චිත වසම (අමාත්‍යාංශ චක්‍රලේඛ), නිශ්චිත ශිල්පක්‍රමය (guardrails සහිත AI සාරාංශකරණය),
      නිශ්චිත තක්සේරුව (ROUGE සහ ස්වයංක්‍රීය පරීක්ෂණ). අරමුණු නිශ්චිතභාවය මැනිය හැකි ජයග්‍රහණය සක්‍රීය කරයි.'
    - නිබන්ධනයෙන් ඔබ්බට දිගුකාලීන ව්‍යාපෘති අරමුණ වන්නේ EasyCircular නිෂ්පාදන යෙදවීමෙන් ශ්‍රී ලංකා අධ්‍යාපන පද්ධතියට
