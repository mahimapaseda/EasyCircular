    paragraphs:
    - ආරක්ෂක නිර්මාණය සමීක්ෂණයේ රහස්‍යතා කනස්සල්ල (ප්‍රතිචාර දැක්වූවන් 17ක්) සහ සම්මත වෙබ් යෙදුම් ආරක්ෂක හොඳම පරිචයන්
      ආමන්ත්‍රණය කරයි. සත්‍යාපනය, අවසරදීම, සේවා-අන්තර් ආරක්ෂාව, දත්ත ආරක්ෂාව සහ ආදාන වලංගුකරණය සම්පූර්ණ ආරක්ෂක ස්ථරයක්
      සාදයි. ආරක්ෂාව තනි විශේෂාංගයක් නොව පද්ධති-පුරා ගොඩනැගුණු ගුණාංගයකි.
    - 'JWT සත්‍යාපන ක්‍රියාත්මක කිරීම: පරිශීලක ලියාපදිංචියේදී bcrypt මගින් මුරපද hash කරයි (වින්‍යාසගත salt rounds);
      login අක්තපත්‍ර සත්‍යාපනය කර jsonwebtoken පුස්තකාලයෙන් JWT ටෝකන් ජනනය කරයි; JWT_SECRET පරිසර විචල්‍යයෙන් අත්සන්
      කරයි. ටෝකන් කල් ඉකුත් වීම වින්‍යාසගතය. ආරක්ෂිත මාර්ග Authorization Bearer ශීර්ෂය අවශ්‍ය කරයි.'
    - 'මුරපද ආරක්ෂාව: bcrypt අනුවර්තනීය hash ශ්‍රිතයක් වන අතර ගණනය කිරීමේ පිරිවැය salt rounds මගින් සීරුමාරු කළ
      හැක; rainbow table ප්‍රහාරවලට ප්‍රතිරෝධී වේ. මුරපද අවශ්‍යතා අවම දිග වලංගුකරණ middleware මගින් බලාත්මක කරයි.
      මුරපද plain text ලෙස කිසි විටෙකත් ගබඩා හෝ log නොකරයි. මුරපද ආරක්ෂාව පරිශීලක ගිණුම් ආරක්ෂාවේ පදනමයි.'
    - 'AI සේවා සේවා-අන්තර් සත්‍යාපනය: Backend සිට AI සේවාවට යන ඉල්ලීම්වල X-AI-Token ශීර්ෂය ඇතුළත් වේ. AI_SERVICE_TOKEN
      පරිසර විචල්‍යය බෙදාගත් රහස නිර්වචනය කරයි. AI සේවා middleware ටෝකන් සත්‍යාපනය කර අනවසර ඉල්ලීම් ප්‍රතික්ෂේප
      කරයි. සේවා-අන්තර් සත්‍යාපනය අභ්‍යන්තර API නිරාවරණය වළක්වයි.'
    - 'Rate limiting ක්‍රියාත්මක කිරීම: express-rate-limit middleware api/circulars/:id/process endpoint ආරක්ෂා
      කරයි. වින්‍යාසය: කවුළුව මිනිත්තු 15ක්, උපරිම ඉල්ලීම් වින්‍යාසගත (පෙරනිමි 10). Rate limit ඉක්මවූ විට HTTP 429
      Too Many Requests ආපසු ලබා දෙයි. Rate limiting අනිසි භාවිතය සහ සම්පත් අධිභාරණය වළක්වයි.'
    - 'CORS (Cross-Origin Resource Sharing) වින්‍යාසය: CORS_ORIGINS පරිසර විචල්‍යය අනුමත මූලාශ්‍ර නිර්වචනය කරයි
      (සංවර්ධනයේදී localhost:3002). දැඩි CORS අනවසර frontend වසම්වලට API ප්‍රවේශය වළක්වයි. නිෂ්පාදන වින්‍යාසය නිශ්චිත
      වසම් නාම පමණක් අනුමත කළ යුතුය. CORS වින්‍යාසය බ්‍රවුසර-පාදක ප්‍රහාර මතුපිට අඩු කරයි.'
    - 'ගොනු උඩුගත ආරක්ෂාව: multer middleware ගොනු ප්‍රමාණ සීමාව බලාත්මක කරයි (වින්‍යාසගත පෙරනිමි 10MB); ගොනු වර්ග
      වලංගුකරණය PDF MIME වර්ගය පරීක්ෂා කරයි; ගොනු දිගුව වලංගුකරණය .pdf පමණි; PDF magic byte සත්‍යාපනය අනුපිටපත්
      නාමකරණය වළක්වයි. ගොනු උඩුගත ආරක්ෂාව අනිසි ගොනු උඩුගත කිරීම වළක්වයි.'
    - 'දත්ත රහස්‍යතා නිර්මාණය: දේශීය Ollama යෙදවීම ලේඛන බාහිර සර්වර් වෙත සම්ප්‍රේෂණය නොකරයි; ස්වයං-ධාරිත MongoDB
      දත්ත දේශීය ගබඩාවේ පවත්වා ගනියි. Cloud LLM API විකල්ප පරිසර විචල්‍ය මාරුවකින් ලබා ගත හැකි නමුත් පෙරනිමි වින්‍යාසය
      දේශීයය. රහස්‍යතා-සවිඥානක නිර්මාණය සමීක්ෂණ කනස්සල්ලට සෘජු ප්‍රතිචාරයකි.'
    - 'ආරක්ෂක පරීක්ෂණ ප්‍රවේශය: backend පරීක්ෂණ සත්‍යාපන කාර්යප්‍රවාහය සත්‍යාපනය කරයි (වලංගු/අවලංගු අක්තපත්‍ර, කල්
      ඉකුත් ටෝකන්, මඟහැරුණු ශීර්ෂ); ගොනු උඩුගත ආරක්ෂක පරීක්ෂණ non-PDF ප්‍රතික්ෂේප කිරීම, ප්‍රමාණ සීමා බලාත්මක කිරීම
      සහ magic byte සත්‍යාපනය ආවරණය කරයි. ආරක්ෂක පරීක්ෂණ ආරක්ෂක පාලන නිවැරදිව ක්‍රියා කරන බව තහවුරු කරයි.'
    - 'සිදුවීම් ප්‍රතිචාර සලකා බැලීම: වර්තමාන සංවර්ධන පරිසරය තනි පරිශීලක දේශීය යෙදවීමකට සීමා වන අතර නිෂ්පාදන යෙදවීමට
      ආරක්ෂක සිදුවීම් හැසිරවීමේ ක්‍රියා පටිපාටි අවශ්‍ය වේ. Log අධීක්ෂණය, අනතුරු ඇඟවීම් වින්‍යාසය සහ ප්‍රවේශ විගණන
      මංපෙත් Phase 6 ට ඇතුළත් වේ. සිදුවීම් ප්‍රතිචාර සැලසුම්කරණය නිෂ්පාදන සූදානමේ කොටසකි.'
    - 'ආරක්ෂක තර්ජන ආකෘතිකරණය STRIDE රාමුව සලකා බලයි: Spoofing JWT සත්‍යාපනය වළක්වයි; Tampering content hash අඛණ්ඩතාව
      සත්‍යාපනය කරයි; Repudiation විගණන logging Phase 6 සැලසුම් කර ඇත; Information Disclosure දේශීය යෙදවීම අවම කරයි;
      Denial of Service rate limiting අවම කරයි; Elevation of Privilege වර්තමාන තනි-භූමිකා ආකෘතියේදී සීමිතය (RBAC
      Phase 6). STRIDE පද්ධතිමය තර්ජන ආවරණය සපයයි.'
    - 'ආදාන වලංගුකරණය ගැඹුරින්-ආරක්ෂාව: frontend පෝරම වලංගුකරණය (client-side), backend middleware වලංගුකරණය (server-side),
      AI සේවා Pydantic ආකෘති වලංගුකරණය (service-side). බහු වලංගුකරණ ස්ථර තනි අසාර්ථකත්ව ලක්ෂ්‍යයක් වළක්වයි. ආදාන
      වලංගුකරණය injection සහ අනිසි දත්ත ප්‍රහාරවලට එරෙහි පළමු ආරක්ෂක රේඛාවයි.'
    - 'ආරක්ෂක විගණන ලැයිස්තුව සංවර්ධන අදියරේදී: OWASP Top 10 දැනුවත්භාවය, SQL injection අදාළ නොවේ (MongoDB), XSS
      වැළැක්වීම React පෙරනිමි escaping, CSRF ටෝකන් සලකා බැලීම, යැපීම් අවදානම් ස්කෑන් (npm audit, pip safety). විගණන
      ලැයිස්තුව ආරක්ෂක පරිණතභාවයේ පදනම ස්ථාපිත කරයි; සම්පූර්ණ penetration testing Phase 6 ට කල් දමා ඇත.'
  risk_table:
    paragraphs:
    - අවදානම් අවමන උපාය වගුව (වගුව 4.1) ප්‍රධාන අවදානම් පහක සම්පූර්ණ අවමන ලේඛනගත කරයි. එක් එක් අවදානමේ බලපෑම් මට්ටම
      (තීරණාත්මක/ඉහළ/මධ්‍යස්ථ) තක්සේරු කර නිශ්චිත ක්‍රියාත්මක කළ අවමන ශිල්පක්‍රම ලැයිස්තුගත කර සත්‍යාපන සාධක සපයයි.
      වගු ආකෘතිය අවදානම් කළමනාකරණ පාරදෘශ්‍යතාව වැඩි දියුණු කරයි.
    - 'දුර්වල PDF නිස්සාරණ අවදානමේ අවමනය ත්‍රි-අතිරික්තතා ප්‍රවේශයකි: pdfplumber ප්‍රාථමික, PyMuPDF ද්විතීයික, Tesseract
      OCR තෘතීයික. Human-in-the-loop පෙළ සංස්කරණය අවසාන ගුණාත්මක සහතිකයයි. අවමනය සත්‍යාපනය කර ඇත: නියමු PDF (ඩිජිටල්,
      ස්කෑන්, මිශ්‍ර) සාර්ථකව නිස්සාරණය විය; පරීක්ෂණ කෝපස් අසාර්ථක අනුපාතය 0% වේ.'
    - 'LLM hallucination අවදානමේ අවමනය වඩාත් තීරණාත්මකය: දින සත්‍යාපන guardrail සාරාංශ දින regex මගින් නිස්සාරණය
      කර මූලාශ්‍රයට එරෙහිව සත්‍යාපනය කරයි; අඩු LLM උෂ්ණත්ව සැකසුම නිර්මාණාත්මක ජනනය අඩු කරයි; entity-නැංගුරම් prompts
      කරුණු පදනම්කරණය සපයයි; extractive TextRank fallback ආරක්ෂිත උපස්ථයයි. Pytest අවස්ථා 91ක් guardrail හැසිරීම
      සත්‍යාපනය කරයි.'
    - 'API පිරිවැය අවදානමේ අවමනයේ ප්‍රාථමික යාන්ත්‍රණය content hash caching වේ: SHA-256 hash සමාන පෙළ නැවත සැකසීම
      වළක්වයි; cache hit ~114ms විරුද්ධව තත්පර ගණනක LLM සැකසීම. Ollama දේශීය යෙදවීම ශුන්‍ය per-token පිරිවැය සපයයි.
      Chunk ප්‍රමාණ සීමා සහ rate limiting ටෝකන් පරිභෝජනය පාලනය කරයි. Caching පිරිවැය අවදානම නාටකාකාරී ලෙස අඩු කරයි.'
    - 'සිංහල NLP පරතර අවමනය අදියරගත ප්‍රවේශයකි: Phase 5 හි Tesseract OCR සිංහල පෙළ නිස්සාරණය සපයයි, extractive වාක්‍ය
      තේරීම සිංහල සාරාංශ ජනනය කරයි, ඉංග්‍රීසි කොටස් සම්පූර්ණ NER pipeline එකෙන් සකසයි. Phase 6 සිංහල NER ආකෘති සංවර්ධනය/ඒකාබද්ධ
      කිරීම සැලසුම් කර ඇත. අදියරගත අවමනය අර්ධ ක්‍රියාකාරීත්වය පවත්වා ගනිමින් සම්පූර්ණ විසඳුම් මාර්ග සිතියම සපයයි.'
    - 'UAT ප්‍රතික්ෂේප අවදානමේ අවමනය නිර්මාණ-පාදකය: human-in-the-loop අනිවාර්ය සමාලෝචන පියවර විශ්වාසය ගොඩනගයි, ව්‍යුහගත
      ප්‍රතිදානය (chatbot නොවේ) වෘත්තීය පෙනුම පවත්වා ගනියි, දේශීය යෙදවීම රහස්‍යතාව සහතික කරයි, පැහැදිලි AI සහාය
      අස්වැන්නුම් සපයයි. නිර්මාණ-පාදක අවමනය UAT ප්‍රතිපෝෂණයට පෙර විශ්වාස බාධකය ආමන්ත්‍රණය කරයි.'
    - 'අවදානම් අවමන ඵලදායීතා තක්සේරුව: එක් එක් අවමනයේ සැබෑ ඵලදායීතාව තක්සේරු කරයි (guardrail පරීක්ෂණ සාර්ථක අනුපාතය,
      cache hit අනුපාතය, නිස්සාරණ සාර්ථක අනුපාතය). ඵලදායීතා දත්ත අවදානම් ලේඛනය යාවත්කාලීන කරයි: අවමනය ක්‍රියා කරන්නේද
      නැද්ද යන්න සාධක මත පදනම් වේ. ඵලදායීතා තක්සේරුව අවදානම් කළමනාකරණය ජීවමාන ක්‍රියාවලියක් බවට පත් කරයි.'
    - 'අවශේෂ අවදානම් පිළිගැනීමේ නිර්ණායක: අවශේෂ අවදානම් මට්ටම පිළිගත හැකිදැයි තීරණය කරයි. ශාස්ත්‍රීය ව්‍යාපෘතියක
      මධ්‍යස්ථ අවශේෂය පිළිගත හැක; නිෂ්පාදන යෙදවීමට අඩු අවශේෂය අවශ්‍ය වේ. සිංහල NER අවශේෂ අවදානම Phase 5 හි පිළිගෙන
      Phase 6 ට කල් දමා ඇත. අවශේෂ අවදානම් පිළිගැනීම අවංක තක්සේරුවකි.'
    - 'අවදානම් සන්නිවේදන උපාය: නිබන්ධන වාර්තාව අවදානම් පාරදෘශ්‍යව ඉදිරිපත් කරයි (අවම නොකර හෝ අතිශයෝක්ති නොකර); අධීක්ෂකට
      නිතිපතා අවදානම් තත්ත්ව යාවත්කාලීන; ස්වයං-තක්සේරුව සතිපතා අවදානම් සමාලෝචනය. පාරදෘශ්‍ය අවදානම් සන්නිවේදනය විශ්වාසය
      ගොඩනගන අතර ශාස්ත්‍රීය පරිණතභාවය පෙන්වයි.'
  api:
    paragraphs:
    - 'EasyCircular REST API backend ස්ථරයෙන් නිරාවරණය වේ: සත්‍යාපන endpoints (POST /api/auth/register, POST /api/auth/login,
      GET /api/auth/profile), චක්‍රලේඛ CRUD (POST /api/circulars, GET /api/circulars, GET /api/circulars/:id, DELETE
      /api/circulars/:id), සැකසුම් endpoints (PATCH පෙළ සංස්කරණය, POST සැකසීම) සහ අමාත්‍යාංශ කැටලොග් ආයාතය. API
      සම්පූර්ණ පරිශීලක කාර්යප්‍රවාහය ආවරණය කරයි.'
    - 'AI සේවා අභ්‍යන්තර API: GET /health සේවා තත්ත්වය (SpaCy ආකෘතිය පැටවී ඇත්ද, LLM සම්බන්ධතාව), POST /v1/parse/pdf
      (ආදානය: ගොනු මාර්ගය; ප්‍රතිදානය: නිස්සාරණ පෙළ, පිටු ගණන, භාවිත කළ ක්‍රමය), POST /v1/pipeline (ආදානය: අනුමත
