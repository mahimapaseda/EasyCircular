      පථයට සීමා වන අතර අනාගත කාර්ය කොටස් මධ්‍ය හා දිගුකාලීන අරමුණු ලේඛනගත කරයි. යථාර්ථවාදී අරමුණු ධුරාවලිය අපේක්ෂා
