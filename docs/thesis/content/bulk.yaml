      ලෙස තහවුරු විය. සිංහල NER සීමාව අවංකව පිළිගෙන extractive සහාය සහ අනාගත multilingual models යෝජනා කෙරේ.
    - Entity linking සහ nested NER අනාගත වැඩිදියුණු කිරීම් ලෙස හඳුනා ගත හැකි අතර, වර්තමාන MVP එක flat entity spans
      සහ frontend highlighting මත අවධානය යොමු කරයි. මෙය පරිශීලකයාට දින සහ නීති ඉක්මනින් දැකීමට උපකාරී වේ.
  rouge:
    paragraphs:
    - ROUGE මගින් ජනනය කළ සාරාංශය යොමු සාරාංශයට සාපේක්ෂව n-gram overlap මනියි. EasyCircular තක්සේරුවේදී චක්‍රලේඛ
      6ක් සමඟ macro ROUGE-1 F1 අගය 0.414, ROUGE-2 F1 අගය 0.215 සහ ROUGE-L F1 අගය 0.292 ලැබුණි. මෙය extractive fallback
      මාදිලියේ reproducible baseline එකකි.
    - 'ROUGE සීමාවන් තේරුම් ගත යුතුය: ඉහළ ලකුණු නීතිමය නිවැරදිබව සහතික නොකරයි. එබැවින් මෙම වාර්තාව ROUGE ප්‍රතිඵල
      automated evidence ලෙස පමණක් ඉදිරිපත් කරන අතර මානව සමාලෝචනය සහ UAT අනාගත අවශ්‍යතාවයක් ලෙස සටහන් කරයි.'
    - ROUGE-1 අන්තර්ගත ආවරණයත්, ROUGE-2 වාක්‍යාංශ සමානතාවත්, ROUGE-L අනුපිළිවෙල සංරක්ෂණයත් මනියි. පරිපාලන වසමේ ලකුණු
      පුවත් benchmark සමඟ සෘජුව සසඳන්නට නොහැකි බැවින් අභ්‍යන්තර baseline ලෙස භාවිත වේ.
  compare:
    paragraphs:
    - ChatGPT සහ Gemini වැනි සාමාන්‍ය මෙවලම් නම්‍යශීලී වුවද MOE circular domain සඳහා structured entities, local
      privacy සහ built-in guardrails ලබා නොදෙයි. Enterprise නීතිමය AI මෙවලම් මිල අධික වන අතර අධ්‍යාපන චක්‍රලේඛ සඳහා
      tune කර නොමැත.
    - EasyCircular open-source, self-hostable stack එකකින් OCR, human-in-the-loop, NER සහ guarded summarization
      ඒකාබද්ධ කරන බැවින් ශ්‍රී ලංකා පාසල් සන්දර්භයට වඩා ගැලපේ. වගුව 2.1 මෙම වෙනස්කම් සංසන්දනය කරයි.
    - 'දත්ත රහස්‍යතාව තීරණාත්මක වෙනසකි: cloud API මගින් ලේඛන බාහිර සර්වර වෙත යවන අතර EasyCircular local Ollama මාර්ගයෙන්
      ආයතනික දත්ත පාලනය පවත්වා ගනී. සමීක්ෂණයේ 17 දෙනෙකු privacy concern ලෙස සඳහන් කළහ.'
  survey:
    paragraphs:
    - Primary research Google Forms සමීක්ෂණය (n=41) ගුරුවරු 30, විදුහල්පතිවරු 8 සහ අධ්‍යාපන නිලධාරීන් 3 දෙනෙකුගෙන්
      සමන්විත විය. 97.6% සාරාංශයක් අවශ්‍ය බවත්, 78% entity highlighting ප්‍රයෝජනවත් බවත්, 68.3% AI භාවිතයට willing
      නොවන බවත් පෙන්වා දුන්නේය.
    - ප්‍රධාන බාධක ලෙස ලේඛන දිග (21) සහ රහස්‍යතාව (17) හඳුනා ගන්නා ලදී. මෙම findings EasyCircular හි local Ollama
      option සහ human review step සඳහා සෘජු design justification ලබා දෙයි. සමීක්ෂණ ප්‍රස්ථාර පහත ඉදිරිපත් කෙරේ.
    - කියවීමේ දුෂ්කරතා අතර Too long ප්‍රධාන වූ අතර Lack of time සහ Complex language ද්විතීයික විය. 78% EasyCircular
      වැනි පද්ධතියක් කාර්යක්ෂමතාව වැඩි කරන බව විශ්වාස කළහ. මෙය value proposition තහවුරු කරයි.
  gap:
    paragraphs:
    - සාහිත්‍යය සහ සමීක්ෂණය සංශ්ලේෂණය කිරීමෙන් පෙනී යන්නේ MOE circular domain සඳහා OCR, NER, guarded summarization
      සහ ව්‍යුහගත වෙබ් UI ඒකාබද්ධ කරන open-source පද්ධතියක් නොමැති බවයි. General LLMs සහ enterprise legal AI මෙවලම්
      මෙම පරතරය සම්පූර්ණයෙන් පුරවන්නේ නැත.
    - EasyCircular මෙම පරතරයට ප්‍රතිචාර දක්වන working artefact එකක් ලෙස ඉදිරිපත් වන අතර, සිංහල NER සහ formal UAT
      තවමත් සීමාවන් ලෙස අවංකව පිළිගනියි. මීළඟ පරිච්ඡේදවල සැලසුම, ක්‍රියාත්මක කිරීම සහ තක්සේරුව මෙම gap closing ප්‍රවේශය
      විස්තර කරයි.
    - 'පර්යේෂණ පරතරය ත්‍රිත්ව සාධක මත පදනම් වේ: සාහිත්‍ය සීමාවන්, සමීක්ෂණ ඉල්ලුම සහ තාක්ෂණික ශක්‍යතාව. EasyCircular
      මෙම ත්‍රිකෝණයට ප්‍රතිචාර දක්වන නමුත් සම්පූර්ණ නිෂ්පාදන පරිමාණය Phase 6 දක්වා දිගු වේ.'
ch03_design:
  intro:
    paragraphs:
    - පරිච්ඡේදය 3 EasyCircular පද්ධතියේ තාක්ෂණික නිර්මාණය සහ ක්‍රියාත්මක කිරීමේ තීරණ සවිස්තරව ලේඛනගත කරයි. ක්‍රමවේද
      කොටස ප්‍රාථමික පර්යේෂණ සමීක්ෂණයේ (n=41) සොයාගැනීම්වලින් ක්‍රියාකාරී අවශ්‍යතා ව්‍යුත්පන්න කිරීම, ත්‍රි-ස්ථර
      microservices ගෘහනිර්මාණය, තාක්ෂණ stack තේරීමේ තර්කනය, PDF සැකසුම් pipeline අදියර, AI ඇල්ගොරිතම (NER, සාරාංශකරණය)
      ක්‍රියාත්මක කිරීම, ආරක්ෂක පාලන සහ API නිර්මාණය විස්තර කරයි.
    - 'නිර්මාණ තීරණ සාධක-පාදක හඹා යා හැකිබව පවත්වා ගනියි: සමීක්ෂණ සොයාගැනීමේ සිට අවශ්‍යතාව දක්වා ගෘහනිර්මාණ තීරණය
      දක්වා ක්‍රියාත්මක කිරීමේ විස්තරය දක්වා. 97.6% සාරාංශ ඉල්ලුම සාරාංශකරණ pipeline සාධාරණීකරණය කරයි, 78% entity
      highlighting NER ක්‍රියාත්මක කිරීම සාධාරණීකරණය කරයි, 68.3% AI විශ්වාස හිඟය human-in-the-loop නිර්මාණය සාධාරණීකරණය
      කරයි, ප්‍රතිචාර දැක්වූවන් 17කගේ රහස්‍යතා කනස්සල්ල දේශීය යෙදවීමේ විකල්පය සාධාරණීකරණය කරයි. එක් එක් ක්‍රමවේද
      කොටස අදාළ සමීක්ෂණ සාධක යොමු කරයි.'
    - 'ක්‍රියාත්මක කිරීමේ ප්‍රවේශය Agile පුනරාවර්තනීය සංවර්ධනය අනුගමනය කරයි: Phase 1 (Foundation) යටිතල පහසුකම්
      ස්ථාපිත කරයි, Phase 2 (Ingestion) PDF pipeline ගොඩනගයි, Phase 3 (AI Core) NER/සාරාංශකරණය ක්‍රියාත්මක කරයි,
      Phase 4 (MVP) ඒකාබද්ධ යෙදුම බෙදා හරියි. ක්‍රමවේද පරිච්ඡේදය Phases 1 සිට 4 දක්වා තාක්ෂණික විස්තර ඉදිරිපත් කරන
      අතර තක්සේරුව (Phase 5) පරිච්ඡේදය 5 ආවරණය කරයි.'
    - G G M P Kusumsiri (ශිෂ්‍ය අංකය 2540881) තනි සංවර්ධකයා ලෙස සියලු ක්‍රියාත්මක කිරීමේ කාර්ය සිදු කර ඇත. තනි සංවර්ධනය
      තීරණ ගැනීමේ චපලතාව සපයන අතර bus factor අවදානම හඳුන්වා දෙයි. සම්පූර්ණ ලේඛනගත කිරීම, ස්වයංක්‍රීය පරීක්ෂණ සහ
      Docker Compose නැවත නිපදවිය හැකි පරිසරය දැනුම් සංරක්ෂණය සහතික කරයි. BSc Computer Science විෂයමාලා කුසලතා (වෙබ්
      සංවර්ධනය, දත්ත සමුදා, Python) සෘජුව යොදා ගනියි.
    - 'තාක්ෂණ තේරීමේ නිර්ණායක: open-source ලබා ගත හැකිබව (ශුන්‍ය බලපත්‍ර පිරිවැය), ප්‍රජා සහාය (ලේඛනගත කිරීම, නිබන්ධන,
      Stack Overflow), කාර්ය සාධන ලක්ෂණ (ප්‍රතිචාර කාලය, සම්පත් භාවිතය), ඒකාබද්ධ ගැළපුම (microservices සන්නිවේදනය)
      සහ සංවර්ධක නුහුරුකම (විෂයමාලා පෙළගැස්ම). එක් එක් තාක්ෂණ stack සංරචකය මෙම නිර්ණායකවලට එරෙහිව තක්සේරු කර තෝරා
      ගෙන ඇත.'
    - 'නිර්මාණ පරිච්ඡේද ව්‍යුහය: කොටස 3.2 අවශ්‍යතා, කොටස 3.3 ගෘහනිර්මාණ දළ විශ්ලේෂණය, කොටස 3.4 Class සහ ER ආකෘති,
      කොටස 3.5 අතුරුමුහුණත් නිර්මාණය, කොටස 3.6 තාක්ෂණ stack එක. අනුරූප ක්‍රියාත්මක කිරීමේ විස්තර පරිච්ඡේදය 4 හි
