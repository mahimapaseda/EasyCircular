      ඇත (සමීක්ෂණ දත්ත, මිනුම්කෝදණ්ඩ ප්‍රතිඵල, තාක්ෂණ සංසන්දනය). වලංගුකරණ සාධක ක්‍රමවේද කොටස පුරා කාවද්දා ඇත: සමීක්ෂණ
