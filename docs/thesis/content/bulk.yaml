    - 'Phase 2 සහ Phase 3 සත්‍යාපනය අනිත්‍ය විය: අතින් පරීක්ෂණ PDF නිස්සාරණය විවිධ ලේඛන මත, අතින් NER ප්‍රතිදාන
      සමාලෝචනය, guardrail පරීක්ෂණ කට්ටලය pytest ක්‍රියාත්මක කිරීම. විධිමත් සත්‍යාපන scripts Phases 1 සහ 4 සඳහා ප්‍රමුඛතා
      දෙන ලදී මන්ද ඒවා ප්‍රධාන ඒකාබද්ධ සන්ධිස්ථාන වේ. අනාගත වැඩිදියුණු කිරීම Phases 2 සහ 3 සඳහාත් විධිමත් scripts
      එකතු කළ හැක.'
    - 'අදියර සත්‍යාපන කාලය: Phase 1 සත්‍යාපකය තත්පර ~10කින් ක්‍රියාත්මක වේ (health checks, සත්‍යාපන කාර්යප්‍රවාහය);
      Phase 4 සත්‍යාපකය තත්පර ~30කින් ක්‍රියාත්මක වේ (ගොනු උඩුගත කිරීම සහ AI සැකසීම ඇතුළු සම්පූර්ණ කාර්යප්‍රවාහය).
      කෙටි ක්‍රියාත්මක කාලය නිතර සත්‍යාපනය ප්‍රායෝගික කරයි.'
    - 'අදියර ගේට් බලාත්මක කිරීම: Phase 1 ගේට් සමත් වීම Phase 2 සංවර්ධනය ආරම්භ කිරීමට පෙර අවශ්‍ය වේ; Phase 4 ගේට්
      සමත් වීම Phase 5 තක්සේරුව සිදු කිරීමට පෙර අවශ්‍ය වේ. ගේට් විනය අසම්පූර්ණ කාර්ය ඊළඟ අදියරට පැතිරීම වළක්වයි.
      ගේට් බලාත්මක කිරීම ව්‍යාපෘති කළමනාකරණ විනය පෙන්වයි.'
    - 'සත්‍යාපන script නඩත්තුව: scripts repository එකේ අනුවාද-පාලිතය; සේවා endpoint වෙනස්කම්වලදී script යාවත්කාලීන
      අවශ්‍ය වේ. සත්‍යාපන scripts ජීවමාන ලේඛනගත කිරීමකි: පද්ධතියේ අපේක්ෂිත හැසිරීම ක්‍රියාත්මක කළ හැකි ආකාරයෙන්
      නියම කරයි. අනාගත සත්‍යාපන scripts අමතර පරීක්ෂා (කාර්ය සාධන මිනුම්කෝදණ්ඩ) එකතු කළ හැක.'
    - 'අදියර සත්‍යාපනයේ ශාස්ත්‍රීය වටිනාකම: අදියර ගේට් සාධක ව්‍යාපෘති කළමනාකරණ විනය පෙන්වයි. තක්සේරු නිර්ණායක: පද්ධතිමය
      සංවර්ධන ප්‍රවේශය (ad hoc නොවේ), ගුණාත්මක පරීක්ෂණ ලකුණු (අවසාන මොහොතේ පරීක්ෂණ නොවේ), වර්ධක බෙදාහැරීම. අදියර
      සත්‍යාපනය Agile ක්‍රමවේදයේ ප්‍රායෝගික සාධකයකි.'
    - 'අදියර සත්‍යාපන regression හඳුනා ගැනීම: Phase 4 සත්‍යාපකය Phase 1 පරීක්ෂා ද ඇතුළත් කරයි (health endpoints
      ඒකාබද්ධ කිරීමෙන් පසුත් ක්‍රියාකාරීද). Regression හඳුනා ගැනීම ඒකාබද්ධ පැති බලපෑම් හඳුනා ගනියි: නව සංරචකයක්
      පවතින ක්‍රියාකාරීත්වය කඩාකප්පල් කළහොත් සත්‍යාපකය අසාර්ථක වේ. Regression ආරක්ෂාව ඒකාබද්ධ කිරීමේ අවදානම අඩු
      කරයි.'
    - 'අදියර සත්‍යාපන ලේඛනගත කිරීම: එක් එක් සත්‍යාපන ධාවනයේ timestamp, කාලසීමාව, සමත්/අසාර්ථක ගණන සහ අසාර්ථක පරීක්ෂා
      විස්තර වාර්තා කරයි. සත්‍යාපන ඉතිහාසය සංවර්ධන කාලරේඛා සාධකයකි: අදියර කවදා සම්පූර්ණ වූයේද සහ කී උත්සාහයන් අවශ්‍ය
      වූයේද. ලේඛනගත කිරීම ශාස්ත්‍රීය තක්සේරුවට සහාය දෙයි.'
    - 'සත්‍යාපන script දෝෂ වාර්තාකරණය: පැහැදිලි අසාර්ථකත්ව පණිවිඩ නිශ්චිත පරීක්ෂාව හඳුනා ගනියි; පොදු අසාර්ථකත්ව
      සඳහා යෝජිත නිවැරදි කිරීමේ ඉඟි සපයයි; verbose මාදිලිය විස්තරාත්මක ඉල්ලීම්/ප්‍රතිචාර log සපයයි. දෝෂ වාර්තාකරණය
      සංවර්ධක ඵලදායිතාව වැඩි දියුණු කර නිදොස්කරණ කාලය අඩු කරයි.'
  test_cases:
    paragraphs:
    - 'නියෝජිත පරීක්ෂණ අවස්ථා වගුව (වගුව 4.4) ස්වයංක්‍රීය පරීක්ෂණ කට්ටලයේ ඉස්මතු අවස්ථා ඉදිරිපත් කරයි: එක් එක් අවස්ථාවට
      පරීක්ෂණ ID, විස්තරය, අපේක්ෂිත ප්‍රතිඵලය, සැබෑ ප්‍රතිඵලය සහ සමත්/අසාර්ථක තත්ත්වය ලේඛනගත කරයි. වගුව තක්සේරු
      සාධකයක් ලෙස නියෝජිත ආවරණය පෙන්වයි.'
    - 'පරීක්ෂණ අවස්ථාව TC-001: PDF magic byte වලංගුකරණය. ආදානය: PDF නොවන ගොනුවක් උඩුගත කිරීම (.txt ගොනුව .pdf ලෙස
      නැවත නම් කළ). අපේක්ෂිත: සුදුසු දෝෂ පණිවිඩයක් සමඟ ප්‍රතික්ෂේප කිරීම. සැබෑ: HTTP 400 Bad Request, PDF අවශ්‍ය
      යන පණිවිඩය. තත්ත්වය: සමත්.'
    - 'පරීක්ෂණ අවස්ථාව TC-002: Tesseract OCR සිංහල පෙළ නිස්සාරණය. ආදානය: ස්කෑන් කළ සිංහල චක්‍රලේඛ පිටුවක්. අපේක්ෂිත:
      OCR sin භාෂා ඇසුරුමෙන් සිංහල පෙළ නිස්සාරණය. සැබෑ: සිංහල පෙළ නිස්සාරණය විය (අක්ෂර නිරවද්‍යතාව මුද්‍රණ ගුණාත්මකභාවය
      මත රඳා පවතී). තත්ත්වය: සමත්.'
    - 'පරීක්ෂණ අවස්ථාව TC-003: SpaCy NER දින entity නිස්සාරණය. ආදානය: effective from 15th March 2026 අඩංගු පෙළ.
      අපේක්ෂිත: DATE entity 15th March 2026 හඳුනා ගැනීම. සැබෑ: DATE entity නිවැරදිව හඳුනා ගන්නා ලදී. තත්ත්වය: සමත්.
      මෙම පරීක්ෂණය මූලික NER ක්‍රියාකාරීත්වය තහවුරු කරයි.'
    - 'පරීක්ෂණ අවස්ථාව TC-004: Guardrail නිර්මිත දින ප්‍රතික්ෂේප කිරීම. ආදානය: මූලාශ්‍ර පෙළෙහි නොමැති 01/01/2099
      දිනය අඩංගු LLM සාරාංශය. අපේක්ෂිත: සාරාංශය ප්‍රතික්ෂේප කිරීම සහ fallback මාදිලිය ක්‍රියාත්මක කිරීම. සැබෑ: දින
      සත්‍යාපනය අසාර්ථක වී extractive fallback ක්‍රියාත්මක විය. තත්ත්වය: සමත්.'
    - 'පරීක්ෂණ අවස්ථාව TC-005: Content hash cache hit. ආදානය: පෙර සැකසූ පෙළ නැවත ඉදිරිපත් කිරීම. අපේක්ෂිත: cache
      කළ ප්‍රතිඵලය ආපසු ලැබීම, AI සේවාව ඇමතීම නොවීම, ප්‍රතිචාර කාලය <500ms. සැබෑ: cache hit ~114ms, AI සේවාව ඇමතුවේ
      නැත. තත්ත්වය: සමත්. Caching කාර්ය සාධන අරමුණ ඉක්මවා සපුරාලයි.'
    - 'පරීක්ෂණ අවස්ථාව TC-006: JWT සත්‍යාපන ආරක්ෂිත මාර්ගය. ආදානය: Authorization ශීර්ෂයකින් තොරව GET /api/circulars.
      අපේක්ෂිත: HTTP 401 Unauthorized. සැබෑ: HTTP 401, ටෝකන් සපයා නැත යන පණිවිඩය. තත්ත්වය: සමත්. මෙම පරීක්ෂණය ආරක්ෂක
      පාලනය තහවුරු කරයි.'
    - 'පරීක්ෂණ අවස්ථාව TC-007: Rate limiting බලාත්මක කිරීම. ආදානය: මිනිත්තු 15ක කවුළුව තුළ අනුක්‍රමික POST /api/circulars/:id/process
      ඉල්ලීම් 11ක් (සීමාව: 10). අපේක්ෂිත: 11වන ඉල්ලීම HTTP 429 Too Many Requests. සැබෑ: 11වන ඉල්ලීම 429 ආපසු ලබා
      දුන්නේය. තත්ත්වය: සමත්.'
    - 'පරීක්ෂණ අවස්ථාව TC-008: Extractive fallback සාරාංශ ජනනය. ආදානය: LLM අක්‍රිය කළ පෙළ (Ollama නතර කළ). අපේක්ෂිත:
      extractive TextRank සාරාංශය ජනනය, මාදිලිය fallback. සැබෑ: TextRank වාක්‍ය තේරීම සාරාංශය නිපදවා මාදිලිය fallback
      ලෙස සලකුණු කරන ලදී. තත්ත්වය: සමත්. Fallback ලබා ගත හැකිබව තහවුරු කරයි.'
    - 'පරීක්ෂණ අවස්ථාව TC-009: ක්‍රියාකාරී අයිතම නිස්සාරණය. ආදානය: All principals must submit reports by March 31
      අඩංගු පෙළ. අපේක්ෂිත: මූලාශ්‍ර වාක්‍ය යොමුව සමඟ ක්‍රියාකාරී අයිතමයක් හඳුනා ගැනීම. සැබෑ: ක්‍රියාකාරී අයිතමය
      හඳුනා ගෙන මූලාශ්‍ර වාක්‍යයට සම්බන්ධ කරන ලදී. තත්ත්වය: සමත්.'
    - 'පරීක්ෂණ අවස්ථාව TC-010: Health check endpoint සත්‍යාපනය. ආදානය: frontend (3002), backend (4000) සහ AI සේවාව
      (5000) වෙත GET /health ඉල්ලීම්. අපේක්ෂිත: HTTP 200 සේවා තත්ත්වය සමඟ. සැබෑ: ස්ථර තුනේම 200 ප්‍රතිචාර. තත්ත්වය:
      සමත්. Health checks මෙහෙයුම් අධීක්ෂණයේ පදනමයි.'
    - 'පරීක්ෂණ අවස්ථා තේරීමේ තර්කනය: නියෝජිත අවස්ථා තීරණාත්මක ක්‍රියාකාරීත්ව මාර්ග, ආරක්ෂක සීමා, කාර්ය සාධන මිනුම්කෝදණ්ඩ
      සහ ආන්තික අවස්ථා ආවරණය කරයි. සම්පූර්ණ පරීක්ෂණ භාණ්ඩාගාරය අවස්ථා 104ක් වන අතර වගුව නියෝජිත උපකුලකයක් (10ක්)
      ඉදිරිපත් කරයි. නියෝජිත තේරීම තක්සේරු පාඨකයාට ආවරණයේ පළල පෙන්වයි.'
    - 'පරීක්ෂණ අවස්ථා නිර්මාණ ක්‍රමවේදය: සමානතා කොටස්කරණය ආදාන කාණ්ඩ හඳුනා ගෙන එක් එක් කාණ්ඩයෙන් නියෝජිතයකු තෝරයි;
      සීමා අගය විශ්ලේෂණය සීමා පරීක්ෂා කරයි (නිවැරදිව 10MB ගොනුව, 10.1MB ගොනුව); දෝෂ අනුමානය පොදු දෝෂ රටා පරීක්ෂා
      කරයි. ක්‍රමවේදය පද්ධතිමය පරීක්ෂණ නිර්මාණය පෙන්වයි.'
    - 'පරීක්ෂණ අවස්ථා නඩත්තු අභියෝගය: යෙදුම් වෙනස්කම් පරීක්ෂණ යාවත්කාලීන අවශ්‍ය කරයි; නඩත්තු නොකළ පරීක්ෂණ ව්‍යාජ
      අසාර්ථකත්ව නිපදවයි; පරීක්ෂණ කේතය වෙනස් වන නමුත් යෙදුම පිළිබිඹු නොකරයි. පරීක්ෂණ නඩත්තු උපාය: යෙදුම් වෙනස්කම්
      සමඟ පරීක්ෂණ යාවත්කාලීන කිරීම අනිවාර්ය කරයි. නඩත්තු විනය දිගුකාලීන පරීක්ෂණ වටිනාකම පවත්වා ගනියි.'
    - 'පරීක්ෂණ අවස්ථා ක්‍රියාත්මක කිරීමේ මිනුම්: 91 pytest සාමාන්‍යයෙන් තත්පර ~45කින් ක්‍රියාත්මක වේ; backend පරීක්ෂණ
      13ක් සාමාන්‍යයෙන් තත්පර ~12කින් ක්‍රියාත්මක වේ; මුළු කට්ටලය තත්පර 60කට අඩුය. ක්‍රියාත්මක කිරීමේ වේගය සංවර්ධක
      ප්‍රතිපෝෂණ ලූපය කෙටි කරන අතර නිතර පරීක්ෂණ ක්‍රියාත්මක කිරීම ප්‍රායෝගික කරයි.'
ch05_evaluation:
  ops:
    paragraphs:
    - 'මෙහෙයුම් තක්සේරුවේ අරමුණ වන්නේ නිපැයුම ධාවන කාලයේදී ක්‍රියාකාරී බවට පමණක් නොව, පාසල් පරිපාලන කාර්යප්‍රවාහයකට
      ගැලපෙන ප්‍රතිචාර කාල මට්ටමක පවතින බවටද සාක්ෂි ලබා දීමයි. එබැවින් සෞඛ්‍ය පරීක්ෂාවන්ට අමතරව නිස්සාරණ කාලය,
      LLM සැකසුම් කාලය සහ cache ඵලදායිතාව වාර්තා කෙරිණි.'
    - 'සමස්ත මෙහෙයුම් තක්සේරුවෙන් පෙනී යන්නේ පද්ධතිය සංවර්ධන පරිසරයේ ස්ථායීව යෙදවිය හැකි බවයි. නැවත ලබා ගත හැකි
      exit-gate සත්‍යාපනය මගින් තෙවන පාර්ශවයකටද මෙම ප්‍රතිඵල නැවත පරීක්ෂා කළ හැක. එහෙත් මෙය නිෂ්පාදන පරිමාණ සූදානමේ
      සම්පූර්ණ සාක්ෂියක් නොවේ.'
    - 'මෙහෙයුම් ප්‍රතිඵල පරිච්ඡේදය 4 හි පරීක්ෂණ සාක්ෂි සමඟ එකට තැබූ විට, නිපැයුමේ ක්‍රියාකාරී විශ්වාසය ඉහළය. ස්වයංක්‍රීය
      පරීක්ෂණ regression අවදානම අඩු කරන අතර, exit-gate සත්‍යාපනය යෙදවීමේ සෞඛ්‍යය තහවුරු කරයි. මෙම ද්විතල සාක්ෂි
      ප්‍රවේශය තනි අතින් ප්‍රදර්ශනයකට වඩා දැඩි තක්සේරුවකි. එසේ වුවද, පාසල් පරිසරයේ දිගුකාලීන භාවිතය තවම මනින ලද්දේ
      නැති බැවින් මෙහෙයුම් තක්සේරුව සීමිත කාල රාමුවකට අයත් වේ.'
  rouge_results:
    paragraphs:
    - 'ROUGE ප්‍රතිඵල අර්ථකථනය කිරීමේදී පුවත්-වසම් benchmark අගයන් සමඟ සෘජු සංසන්දනය නුසුදුසුය. අමාත්‍යාංශ චක්‍රලේඛ
      වසමට ප්‍රසිද්ධ සම්මත මිනුම්කෝදණ්ඩයක් නොමැත. එබැවින් මෙහි ලකුණු අභ්‍යන්තර baseline එකක් ලෙස සලකා, අනාගත
      වැඩිදියුණු කිරීම් සංසන්දනය කිරීමට භාවිත කළ යුතුය.'
    - 'තවද, extractive fallback මාදිලිය අහඹු වාක්‍ය තේරීමකට වඩා වැඩි unigram අතිච්ඡාදනයක් පෙන්වන බව අභ්‍යන්තර
      සංසන්දනයකින් දැකිය හැක. මෙය TextRank ආකාරයේ තේරීම පරිපාලන ලේඛනවල ප්‍රයෝජනවත් පදනමක් බවට සහය දක්වයි. එහෙත්
      එය නීතිමය වලංගුතාවේ සාක්ෂියක් ලෙස ඉදිරිපත් නොකෙරේ.'
  sample_eval:
    paragraphs:
    - 'නියමු තක්සේරුවෙන් ලැබෙන ප්‍රධාන පාඩම වන්නේ ලේඛන ලක්ෂණ අනුව pipeline හැසිරීම වෙනස් වන බවයි. කෙටි digital
      ලේඛනවලදී entity නිස්සාරණය සහ ක්‍රියාකාරී අයිතම හඳුනා ගැනීම වඩා ස්ථායී විය. දිගු හෝ scanned ලේඛනවලදී පරිශීලක
      සංස්කරණයේ වැදගත්කම වැඩි විය. එබැවින් තක්සේරුව තනි සාර්ථකත්ව අනුපාතයකට සීමා නොවී, ලේඛන වර්ග අනුව කොන්දේසිගත
      අර්ථකථනයක් ඉල්ලයි.'
  llm:
    paragraphs:
    - 'ද්වි-මාදිලි නිර්මාණයේ තක්සේරු ප්‍රතිඵලය වන්නේ එක් මාදිලියක් සැමවිටම උසස් නොවන බවයි. Fluency අවශ්‍ය වූ විට
      LLM වාසිදායක වන අතර, කරුණු විශ්වාසනීයත්වය සහ නැවත ලබා ගත හැකි බව අවශ්‍ය වූ විට fallback ආරක්ෂිතය. Guardrail
      මගින් මෙම තේරීම ස්වයංක්‍රීය කිරීම තක්සේරුවේ ප්‍රායෝගික නිර්දේශයයි.'
  uat:
    paragraphs:
    - 'UAT අසම්පූර්ණ වීම ඉලක්කය 5 හි ප්‍රයෝජ්‍යතා කොටසට සෘජුව බලපායි. එහෙත් තාක්ෂණික තක්සේරු සාධක නොමැති බවක්
      නොවේ. ROUGE, ස්වයංක්‍රීය පරීක්ෂණ සහ මෙහෙයුම් සත්‍යාපනය මගින් නිරවද්‍යතා/ක්‍රියාකාරිත්ව මානය ආවරණය වේ. අසම්පූර්ණ
      වන්නේ මානව පිළිගැනීමේ මානය පමණි.'
  ai_dev_results:
    paragraphs:
    - 'AI සහායක සංවර්ධනයේ තක්සේරු නිගමනය වන්නේ ඵලදායිතා ලාභය සහ අවදානම යන දෙකම තිබෙන බවයි. ලාභය ලැබෙන්නේ අඩු නිර්මාණාත්මක
      අගයක් ඇති කාර්යයන්ට AI සීමා කළ විටය. අවදානම වැඩි වන්නේ වසම් තර්කය හෝ ආරක්ෂක විස්තර AI වෙත පැවරූ විටය. මෙම
      ව්‍යාපෘතියේ පරීක්ෂණ-පළමු සත්‍යාපන ප්‍රවේශය එම අවදානම පාලනය කිරීමට උපකාරී විය.'
  ai_ethics:
    paragraphs:
    - 'ආචාර ධාර්මික තක්සේරුවේ අවසාන තීන්දුව වන්නේ AI භාවිතය තහනම් කිරීම නොව, එය විනිවිදභාවය, අවබෝධය, වගකීම සහ රහස්‍යතාව
      යන කොන්දේසි යටතේ පාලනය කිරීමයි. EasyCircular එම කොන්දේසි සපුරා ඇති බව මෙම පරිච්ඡේදයේ සහ කොටස 4.6 හි සාක්ෂි
      මගින් තහවුරු කෙරේ.'
    - 'තවද, AI සහායක සංවර්ධනයේදී සැබෑ අමාත්‍යාංශ ලේඛන අන්තර්ගතය බාහිර මෙවලම් වෙත යවා නොමැති බව ව්‍යාපෘතියේ privacy-first
      දර්ශනය සමඟ අනුකූල වේ. මෙය සමීක්ෂණයේදී ඉස්මතු වූ රහස්‍යතා කනස්සල්ලට සෘජු ප්‍රතිචාරයකි. එබැවින් ආචාර ධාර්මික
      තක්සේරුව කේත ප්‍රකාශනයට පමණක් සීමා නොවී, දත්ත පාලනය ද ආවරණය කරයි.'
    - 'සමස්ත තක්සේරු පරිච්ඡේදයෙන් ලැබෙන නිගමනය වන්නේ EasyCircular තාක්ෂණිකව ක්‍රියාකාරී සහ අර්ධ වශයෙන් තක්සේරු කළ
      නිපැයුමක් බවයි. නිරවද්‍යතා සාක්ෂි ප්‍රබලය. ප්‍රයෝජ්‍යතා සාක්ෂි අසම්පූර්ණය. භාෂා ආවරණය අර්ධය. මෙම තුන් මානය
      පරිච්ඡේදය 6 හි ඉලක්ක සාක්ෂාත්කරණය සහ අනාගත කාර්යයන්ට සෘජුව සම්බන්ධ වේ.'
ch06_conclusion:
  summary:
    paragraphs:
    - 'පර්යේෂණ ප්‍රශ්නවලට සාපේක්ෂව, මෙම ව්‍යාපෘතිය පෙන්වා දුන්නේ අමාත්‍යාංශ චක්‍රලේඛ අවබෝධය සඳහා OCR, NER සහ guarded
      summarization ඒකාබද්ධ කළ වෙබ් කෘතියක් තාක්ෂණිකව ශක්‍ය බවයි. එසේම, දේශීය LLM විකල්පය සහ human-in-the-loop
      නිර්මාණය AI පිළිගැනීමේ බාධකවලට ප්‍රායෝගික ප්‍රතිචාරයක් විය හැකි බව සමීක්ෂණ සාධක සමඟ පෙළගැස්විය හැක.'
    - 'තාක්ෂණික ජයග්‍රහණ අතර බහු-පුස්තකාල PDF නිස්සාරණය, ත්‍රිභාෂික OCR, ව්‍යුහගත entity ඉස්මතු කිරීම, date guardrails
      සහිත සාරාංශකරණය සහ නැවත ලබා ගත හැකි තක්සේරු ක්‍රමවේදය විශේෂයෙන් වැදගත්ය. මෙම ජයග්‍රහණ තනි විශේෂාංග ලැයිස්තුවකට
      වඩා, අවදානම්-දැනුවත් පද්ධති නිර්මාණයක ප්‍රතිඵලයකි.'
    - 'එසේම ව්‍යාපෘතිය open-source තාක්ෂණ කට්ටලයක් මත ගොඩනැගී ඇති බැවින්, අනාගත පර්යේෂකයන්ට හෝ අධ්‍යාපන ආයතනවලට
      එය නැවත යෙදවීමට සහ දිගු කිරීමට මූලික පදනමක් ලබා දේ. නැවත ලබා ගත හැකි බව මෙහි ශාස්ත්‍රීය වටිනාකමේ කොටසකි.'
    - 'සමස්ත ගමන තුළ Agile අදියර පහක් හරහා වර්ධක බෙදාහැරීම සිදු විය. මුල් අදියරවලදී යටිතල පහසුකම් සහ නිස්සාරණ අවදානම්
      අඩු කෙරුණු අතර, පසු අදියරවලදී AI හරය, MVP ඒකාබද්ධ කිරීම සහ තක්සේරුව කේන්ද්‍රගත විය. මෙම අනුපිළිවෙල තනි සංවර්ධක
      ව්‍යාපෘතියකදී විෂය පථ පාලනයට උපකාරී විය.'
    - 'නිබන්ධන වාර්තාවද බෙදාහැරීමකි. එය ගැටලුව, සාහිත්‍යය, නිර්මාණය, සංවර්ධනය, තක්සේරුව සහ නිගමනය රේඛීයව සම්බන්ධ
      කරයි. විශේෂයෙන්, සීමාවන් අවංකව පිළිගැනීම සහ අනාගත කාර්යයන් ප්‍රමුඛතාකරණය කිරීම මගින් වාර්තාව තාක්ෂණික නිරූපණයකට
      වඩා විවේචනාත්මක තක්සේරුවක් බවට පත් කරයි.'
  objectives:
    paragraphs:
    - 'ඉලක්ක සාක්ෂාත්කරණය සමස්තයක් ලෙස ධනාත්මකය. සම්පූර්ණයෙන් සාක්ෂාත් වූ ඉලක්ක තුනක්, භාෂා-සීමිත සාක්ෂාත්කරණයක්
      සහ අර්ධ සාක්ෂාත්කරණයක් ඇත. මෙය සති දහයක තනි-සංවර්ධක ව්‍යාපෘතියකට යථාර්ථවාදී ප්‍රතිඵලයකි. වැදගත් වන්නේ අසම්පූර්ණ
      කොටස් සඟවා නොගෙන Table 6.1 හි පැහැදිලිව වාර්තා කිරීමයි.'
    - 'අතිරේක දායකත්ව දෙක - ත්‍රිස්ථර යෙදවීම සහ AI සහායක සංවර්ධන ප්‍රකාශනය - මුල් ඉලක්ක ලැයිස්තුවෙන් ඔබ්බට ගියද,
      නිපැයුමේ නැවත ලබා ගත හැකි බවට සහ අධ්‍යයන අවංකභාවයට සෘජුව දායක වේ. එබැවින් ඒවා වෙනම පේළි ලෙස ඉදිරිපත් කිරීම
      යෝග්‍ය විය.'
  limits:
    paragraphs:
    - 'සීමාවන් පිළිගැනීම නිබන්ධනයේ දුර්වලතාවක් නොව, විවේචනාත්මක තක්සේරුවකි. සිංහල NLP පරතරය තාක්ෂණිකය. UAT පරතරය
      ක්‍රමවේදීය. තනි සංවර්ධක සීමාව සම්පත්මය. මෙම තුන් මානය එකට ගත් විට, වත්මන් නිපැයුම තාක්ෂණික සාධනයක් ලෙස ශක්තිමත්
      නමුත් ආයතනික යෙදවීමට පෙර අමතර සත්‍යාපනයක් අවශ්‍ය බව පැහැදිලි වේ.'
    - 'තවද සාරාංශය නීතිමය අධිකාරී මූලාශ්‍රයක් ලෙස භාවිත නොකළ යුතු බව අස්වැන්නුමක් ලෙස පැහැදිලිව සටහන් කළ යුතුය.
      පද්ධතිය තීරණ සහායක මෙවලමකි. අවසාන අර්ථකථන වගකීම මානව පරිශීලකයා සහ අදාළ නිලධාරීන් සතුය.'
    - 'තවද, ROUGE නියැදි ප්‍රමාණය සහ තනි සටහන්කරු යොමු සාරාංශ භාවිතය තක්සේරු සාමාන්‍යකරණය සීමා කරයි. මෙය නිපැයුමේ
      ක්‍රියාකාරිත්වය අවලංගු නොකරයි. එහෙත් ප්‍රතිඵල ඉදිරිපත් කිරීමේදී ඒවා ව්‍යාපෘති-අභ්‍යන්තර baseline එකක් ලෙස
      පමණක් අර්ථකථනය කිරීම අවශ්‍යය. විශාල කෝපස් එකක් සහ බහු සටහන්කරු එකඟතාව අනාගතයේදී මෙම සීමාව අඩු කරයි.'
  future:
    paragraphs:
    - 'අනාගත කාර්යයේදී ප්‍රමුඛතාකරණය බලපෑම සහ උත්සාහය අනුව කළ යුතුය. UAT සම්පූර්ණ කිරීම සහ ROUGE කට්ටලය පුළුල්
      කිරීම ඉහළ බලපෑමක් සහිත නමුත් සාපේක්ෂව අඩු උත්සාහයකි. සිංහල NER ඉහළ බලපෑමක් සහිත නමුත් ඉහළ උත්සාහයකි. නිෂ්පාදන
      cloud යෙදවීම ආයතනික සහයෝගය අවශ්‍ය කරයි.'
    - 'අවසාන වශයෙන්, EasyCircular හි ඉදිරි ගමන තනි සංවර්ධකයකුගේ කාර්යයට පමණක් සීමා නොවිය යුතුය. විශ්වවිද්‍යාල NLP
      කණ්ඩායම්, අධ්‍යාපන නිලධාරීන් සහ open-source දායකයන් සමඟ සහයෝගීතාව භාෂා ආවරණය සහ UAT යන දෙකටම වේගවත් ප්‍රගතියක්
      ලබා දිය හැක. එම සහයෝගීතාව සාක්ෂාත් වන තුරු, වත්මන් කෘතිය තාක්ෂණික සහ ශාස්ත්‍රීය පදනමක් ලෙස පවතී.'
    - 'කෙටි කාලීන න්‍යාය පත්‍රයේ පළමු පියවර විය යුත්තේ පාසල් කාර්ය මණ්ඩල සහභාගිවන්නන් සමඟ ව්‍යුහගත UAT සැසි පැවැත්වීමයි.
