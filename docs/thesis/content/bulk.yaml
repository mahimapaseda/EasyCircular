      අවශ්‍යතාව; FR7 (චක්‍රලේඛ ලැයිස්තුව/සෙවීම) ලේඛන කළමනාකරණය; FR8 (අමාත්‍යාංශ කැටලොග් ආයාතය) අන්තර්ගත ලබා ගැනීම.
    - 'ක්‍රියාකාරී නොවන අවශ්‍යතා ගුණාත්මක ගුණාංග නිර්වචනය කරයි: NFR1 කාර්ය සාධනය (cache ප්‍රතිචාරය <500ms, ජයග්‍රහණය
      ~114ms); NFR2 ආරක්ෂාව (JWT සත්‍යාපනය, AI ටෝකන්, rate limiting); NFR3 විශ්වාසනීයත්වය (සියලු ස්ථරවල health checks);
      NFR4 භාවිතාව (ජංගම-ප්‍රතිචාරී, සහජ කාර්යප්‍රවාහය); NFR5 රහස්‍යතාව (දේශීය LLM විකල්පය, අනිවාර්ය බාහිර දත්ත
      බෙදාගැනීමක් නැත); NFR6 නඩත්තුව (Docker Compose, ස්වයංක්‍රීය පරීක්ෂණ, ලේඛනගත කිරීම). එක් එක් NFR මැනිය හැකි
      නිර්ණායක නිර්වචනය කරයි.'
    - 'අවශ්‍යතා ප්‍රමුඛතාකරණය MoSCoW ක්‍රමය භාවිත කරයි: Must-have (FR1 සිට FR6, NFR1 සිට NFR3), Should-have (FR7,
      FR8, NFR4), Could-have (NFR5 Ollama දේශීය විකල්පය), Won''t-have-this-time (සිංහල NER, ද්විභාෂික UI, async
      queue). Must-have අවශ්‍යතා Phases 1 සිට 4 දක්වා බෙදා හරියි; Should-have Phase 4 ට ඇතුළත් වේ; Could-have Phases
      4 සිට 5; Won''t-have Phase 6 ට කල් දමයි. MoSCoW රාමුව සති 10ක කාලරාමුවේ යථාර්ථවාදී විෂය පථය කළමනාකරණය කරයි.'
    - 'අවශ්‍යතා හඹා යා හැකිබවේ න්‍යාසය (RTM) සමීක්ෂණ ප්‍රශ්නයේ සිට අවශ්‍යතාව දක්වා ක්‍රියාත්මක කිරීමේ සංරචකය දක්වා
      පරීක්ෂණ අවස්ථාව දක්වා සිතියම්ගත කරයි. RTM සම්පූර්ණ ලේඛනගත කිරීම නිබන්ධන අනුබද්ධයේ ඇතුළත් වන අතර ක්‍රමවේද කොටස
      සාරාංශ අනුවාදයක් ඉදිරිපත් කරයි. හඹා යා හැකිබව ශාස්ත්‍රීය දැඩිබව පෙන්වයි: තීරණ අත්තනෝමතික නොවේ, සාධක-පාදකය.'
    - 'සීමා අවශ්‍යතා: තනි සංවර්ධකයා (සති 10ක කාලරාමුව), ඉංග්‍රීසි NER පමණි (SpaCy ආකෘති ලබා ගත හැකිබව), දේශීය සංවර්ධන
      දෘඪාංග (Ollama RAM අවශ්‍යතා), නිබන්ධන ශාස්ත්‍රීය ප්‍රමිතීන් (ලේඛනගත කිරීමේ ගැඹුර, තක්සේරු සාධක). සීමා විෂය
      පථ තීරණවලට බලපායි: සිංහල NER කල් දමන ලදී (ආකෘති පුහුණු සම්පත් නොමැත), නිෂ්පාදන යෙදවීම කල් දමන ලදී (යටිතල පහසුකම්
      පිරිවැය), විධිමත් UAT කාලසටහන්කරණය අභියෝගයට ලක් විය (සහභාගිවන්නන්ගේ ලබා ගත හැකිබව).'
    - 'කල් දැමූ අවශ්‍යතා ලේඛනගත කිරීම: සිංහල/දෙමළ NER (සටහන්ගත දත්ත කට්ටලය සහ ආකෘති පුහුණුව අවශ්‍ය), ද්විභාෂික UI
      (පරිවර්තන උත්සාහය සහ සංස්කෘතික අනුවර්තනය), async job queue (RabbitMQ/Redis යටිතල පහසුකම්), admin විශ්ලේෂණ
      (dashboard සංවර්ධනය), භූමිකා-පාදක ප්‍රවේශය (අවසර ආකෘති නිර්මාණය). එක් එක් කල් දැමූ අවශ්‍යතාවේ ශක්‍යතාව, ඇස්තමේන්තු
      උත්සාහය සහ ප්‍රමුඛතාව Phase 6 backlog එකේ ලේඛනගත කර ඇත.'
    - 'අවශ්‍යතා එකතු කිරීමේ ශිල්පක්‍රම: සමීක්ෂණ ප්‍රශ්නාවලිය (ප්‍රාථමික ප්‍රමාණාත්මක), සාහිත්‍ය සමාලෝචනය (ද්විතීයික
      ගුණාත්මක), තරඟකාරී විශ්ලේෂණය (පරතර හඳුනා ගැනීම), සංවර්ධක විශේෂඥතාව (තාක්ෂණික ශක්‍යතාව). බහු එකතු කිරීමේ ශිල්පක්‍රම
      අවශ්‍යතා සම්පූර්ණත්වය වැඩි දියුණු කරයි; තනි ශිල්පක්‍රමය අන්ධ ස්ථාන නිර්මාණය කරයි. අවශ්‍යතා හඹා යා හැකිබව එක්
      එක් අවශ්‍යතාව එකතු කිරීමේ මූලාශ්‍රයට සම්බන්ධ කරයි; සමීක්ෂණ ප්‍රශ්නයේ සිට අවශ්‍යතාවට සිතියම්ගත කිරීම ලේඛනගත
      කර ඇත.'
    - 'ක්‍රියාකාරී නොවන අවශ්‍යතා මිනුම් ක්‍රමවේදය: NFR1 කාර්ය සාධනය cache hit ප්‍රතිචාර කාලය මනියි (මිනුම්කෝදණ්ඩ
      script ක්‍රියාත්මක කර පුනරාවර්තන 10ක සාමාන්‍යය), NFR2 ආරක්ෂාව සත්‍යාපන පරීක්ෂණ (වලංගු/අවලංගු අක්තපත්‍ර, කල්
      ඉකුත් ටෝකන්), NFR3 විශ්වාසනීයත්වය health check uptime (අධීක්ෂණ කාලයේ සේවා ලබා ගත හැකිබව), NFR4 භාවිතාව ප්‍රතිචාරී
      නිර්මාණ viewport පරීක්ෂණ (Chrome DevTools උපාංග අනුකරණය). මිනුම් ක්‍රමවේදය NFR අනුකූලතාව වෛෂයිකව සත්‍යාපනය
      කිරීම සක්‍රීය කරයි.'
    - 'අවශ්‍යතා වෙනස්කම් කළමනාකරණය Agile ප්‍රවේශයකි: වෙනස්කම් ඉල්ලීම් backlog එකට එකතු කරයි, පවතින අයිතමවලට එරෙහිව
      ප්‍රමුඛතාව තක්සේරු කරයි, sprint/අදියර විෂය පථය සීරුමාරු කරයි. ප්‍රධාන වෙනස්කම් උදාහරණය: මුල් අවශ්‍යතාව සම්පූර්ණ
      සිංහල NER විය, Phase 3 තක්සේරුවේදී සිංහල NER සම්පත් අවශ්‍යතාව ඉක්මවන බව පෙනී ගියේය, වෙනස්කම් ඉල්ලීම සිංහල
      NER Phase 6 ට කල් දැමීය. වෙනස්කම් කළමනාකරණ ලේඛනගත කිරීම නිබන්ධන අවංක තක්සේරුවකි: මුල් සැලැස්ම විරුද්ධව සැබෑ
      බෙදාහැරීමේ පාරදෘශ්‍ය සංසන්දනය.'
  arch:
    paragraphs:
    - 'ත්‍රි-ස්ථර ගෘහනිර්මාණය වගකීම් වෙන් කිරීමේ මූලධර්මය ක්‍රියාත්මක කරයි: ඉදිරිපත් කිරීම (frontend), යෙදුම් තර්කනය
      (backend), දත්ත/AI සැකසීම (AI සේවාව සහ දත්ත සමුදාය) වෙන් වූ ස්ථර ස්වාධීනව සංවර්ධනය, deploy සහ පරිමාණනය කළ
      හැක. එක් එක් ස්ථරයට නිශ්චිත වගකීමක් ඇත; ස්ථර සීමා REST API ගිවිසුම් මගින් නිර්වචනය කරයි. Microservices රටාව
      monolithic යෙදුම් සීමා (දැඩි සම්බන්ධතාව, තාක්ෂණ අගුලු දැමීම, පරිමාණන සීමා) වළක්වයි.'
    - 'Frontend ස්ථරය Next.js 14 App Router රාමුව භාවිත කරයි: React server components, TypeScript වර්ග ආරක්ෂාව,
      Tailwind CSS ප්‍රතිචාරී ශෛලීකරණය. Port 3002 සංවර්ධන මාදිලියේ සේවා සපයයි. Client-side JWT ටෝකන් කළමනාකරණය සත්‍යාපිත
      API ඉල්ලීම් සක්‍රීය කරයි. ප්‍රතිචාරී නිර්මාණය ජංගම viewport ප්‍රශස්තකරණය කරයි; dashboard, චක්‍රලේඛ ලැයිස්තුව,
      උඩුගත කිරීම සහ සාරාංශ විස්තර දසුන් ක්‍රියාත්මක කර ඇත.'
    - 'Backend ස්ථරය Express.js 4 Node.js 20 runtime මත REST API සපයයි: සත්‍යාපන මාර්ග (login, register, profile),
      චක්‍රලේඛ CRUD මෙහෙයුම්, ගොනු උඩුගත කිරීම (multer middleware), AI සේවා සංවිධානය, content hash cache සෙවීම සහ
      rate limiting. Port 4000 හි සවන් දෙයි. Mongoose ODM MongoDB එකතු (users, circulars) ආකෘතිගත කරයි. Backend
      රාජ්‍ය-රහිත නිර්මාණය තිරස් පරිමාණනය පහසු කරයි (අනාගත නිෂ්පාදන යෙදවීම).'
    - 'AI සේවා ස්ථරය FastAPI Python 3.11 රාමුවෙන් ඉහළ-කාර්ය සාධන API endpoints සපයයි: /health සේවා ලබා ගත හැකිබව
      පරීක්ෂාව, /v1/parse/pdf PDF පෙළ නිස්සාරණය, /v1/pipeline NER සහ සාරාංශකරණ සැකසීම. Port 5000 හි Uvicorn ASGI
      සර්වරය ධාවනය වේ. Python පරිසරයේ NLP පුස්තකාල (SpaCy, LangChain, pdfplumber, PyMuPDF, pytesseract) සෘජුව උපයෝගී
      කර ගනියි; Node.js backend HTTP ඇමතුම් මගින් හරස්-භාෂා ඒකාබද්ධ කිරීම ක්‍රියාත්මක කරයි.'
    - 'MongoDB 7 ලේඛන දත්ත සමුදාය port 27017 හි easycircular දත්ත සමුදාය ගබඩා කරයි: users එකතුව (අක්තපත්‍ර, JWT
      metadata), circulars එකතුව (PDF metadata, නිස්සාරණ පෙළ, entities, සාරාංශ, සැකසුම් තත්ත්වය, content hash).
      ලේඛන ආකෘතිය නම්‍ය schema එකකින් චක්‍රලේඛ සැකසුම් අදියර (uploaded, extracted, processed) උපයෝගී කර ගනියි; කාවද්දන
      ලද ලේඛන (entities අරාව, සාරාංශ වස්තුව) තනි-විමසුම් ලබාගැනීම සක්‍රීය කරයි.'
    - 'Docker Compose සංවර්ධන පරිසරය සියලු සේවා සංවිධානය කරයි: docker-compose.yml ගොනුව frontend, backend, ai-service
      සහ mongodb containers නිර්වචනය කරයි. තනි විධානයකින් (docker-compose up) සම්පූර්ණ stack එක ආරම්භ වේ; පරිසර
      විචල්‍ය (.env ගොනු) වින්‍යාසය කළමනාකරණය කරයි. Docker Compose සංවර්ධක ආරම්භය සරල කරයි, පරිසර අනුකූලතාව සහතික
      කරයි සහ සේවා හුදකලාව පවත්වා ගනියි.'
    - 'ස්ථර-අන්තර් සන්නිවේදන රටා: Frontend සිට Backend (REST API ඇමතුම්, JWT Bearer ශීර්ෂය), Backend සිට AI සේවාව
      (අභ්‍යන්තර HTTP ඇමතුම්, X-AI-Token ශීර්ෂය), Backend සිට MongoDB (Mongoose ODM විමසුම්). සමකාලීන ඉල්ලීම්-ප්‍රතිචාර
      රටාව වර්තමාන ක්‍රියාත්මක කිරීමයි; async job queue (දිගු-ධාවන චක්‍රලේඛ සැකසීම) Phase 6 වැඩිදියුණු කිරීමකි.
      Health check endpoints (/health) එක් එක් ස්ථරයේ ලබා ගත හැකිබව අධීක්ෂණය සක්‍රීය කරයි.'
    - 'ගෘහනිර්මාණ පරිමාණන සලකා බැලීම්: frontend ස්ථිතික වත්කම් CDN මත deploy කිරීම (නිෂ්පාදන), backend අවස්ථා load-balancer
      පිටුපස තිරස් පරිමාණනය, AI සේවාව GPU අවස්ථා වෙනම පරිමාණනය, MongoDB replica set ඉහළ ලබා ගත හැකිබව. වර්තමාන සංවර්ධනය
      තනි-අවස්ථාව ප්‍රමාණවත්ය; නිෂ්පාදන ගෘහනිර්මාණ සැලසුම්කරණය Phase 6 ට ඇතුළත් වේ. Docker Compose සිට Kubernetes
      වෙත සංක්‍රමණය නිෂ්පාදන යෙදවීමේ මාර්ගයකි.'
    - 'ගෘහනිර්මාණ තීරණ වාර්තා (ADRs): ප්‍රධාන තීරණ සන්දර්භය, සලකා බැලූ විකල්ප සහ තීරණ තර්කනය සමඟ ලේඛනගත කර ඇත. ADR-001:
      Microservices විරුද්ධව monolith (තීරණය: තාක්ෂණ-සුදුසු මෙවලම් සඳහා microservices). ADR-002: MongoDB විරුද්ධව
      PostgreSQL (තීරණය: චක්‍රලේඛ නම්‍යතාව සඳහා ලේඛන ආකෘතිය). ADR-003: දේශීය LLM විරුද්ධව cloud API (තීරණය: දෙකම
      සහාය දක්වයි, රහස්‍යතාව සඳහා දේශීය පෙරනිමිය). ADRs හඹා යා හැකිබව ශාස්ත්‍රීය තක්සේරුව සපුරාලයි.'
    - 'ගෘහනිර්මාණ රූපය (රූපය 4.1) පද්ධති සංරචක, දත්ත ගලායාම සහ සේවා-අන්තර් සන්නිවේදනයේ දෘශ්‍ය නිරූපණය සපයයි. UML
      සංරචක රූපය සම්මත සංකේතනය භාවිත කරයි; සේවා සීමා, API ගිවිසුම් සහ දත්ත ගබඩා පැහැදිලිව දක්වයි. ගෘහනිර්මාණ රූපය
      පාර්ශ්වකරු සන්නිවේදන මෙවලමකි: තාක්ෂණික කණ්ඩායමට ක්‍රියාත්මක කිරීමේ මාර්ගෝපදේශය, අධීක්ෂකට තක්සේරු සාධකය, නිබන්ධන
      පාඨකයාට පද්ධති අවබෝධය. රූප ගුණාත්මකභාවය ගෘහනිර්මාණ අවබෝධයට සෘජුව බලපායි.'
    - 'සේවා සොයා ගැනීමේ වර්තමාන ක්‍රියාත්මක කිරීම දැඩි-කේතිත URL භාවිත කරයි (පරිසර විචල්‍ය): frontend සිට backend
      (NEXT_PUBLIC_API_URL), backend සිට AI සේවාව (AI_SERVICE_URL). දැඩි-කේතිත URL සංවර්ධනයට ප්‍රමාණවත්ය; නිෂ්පාදන
