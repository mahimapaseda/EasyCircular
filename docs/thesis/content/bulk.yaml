      volume කළමනාකරණය, තනි-විධාන ආරම්භය/නැවැත්වීම. සංවර්ධන පරිසර අනුකූලතාව සහතික කරයි: සියලු සංවර්ධකයන්ට සහ CI
      වෙත එකම වින්‍යාසය. Docker Compose තනි-යන්ත්‍ර යෙදවීම ආයතනික ස්වයං-ධාරණයට ගැලපේ.'
    - 'අනුවාද පින් කිරීමේ උපාය: package-lock.json (Node.js) සහ requirements.txt (Python) නිශ්චිත අනුවාද පින් කරයි.
      යැපීම් යාවත්කාලීන පාලනය කරයි: ආරක්ෂක පැච් ඉක්මනින් යාවත්කාලීන කරයි, ප්‍රධාන අනුවාද වෙනස්කම් තක්සේරු කර පසුව
      යාවත්කාලීන කරයි. Docker images පදනම් අනුවාද පින් කර ප්‍රතිනිෂ්පාදනය සහතික කරයි.'
    - 'සංවර්ධන පරිසර මෙවලම්: VS Code IDE ප්‍රාථමික සංවර්ධන මෙවලම, ESLint JavaScript linting, Prettier කේත ආකෘතිකරණය,
      Python Black formatter, Git අනුවාද පාලනය, GitHub දුරස්ථ repository. ස්ථිර මෙවලම් කට්ටලය කේත ගුණාත්මකභාවය සහ
      සහයෝගීතා සූදානම පවත්වා ගනියි (අනාගත බහු-සංවර්ධක අනුවර්තනය).'
    - 'තාක්ෂණ stack මුළු සංරචක ගණන: වෙනස් තාක්ෂණ/පුස්තකාල 15කට වැඩි ගණනක් ඒකාබද්ධ පද්ධතිය සමන්විත කරයි. ඒකාබද්ධ
      සංකීර්ණතාව microservices රටාවේ අභියෝගයකි; Docker Compose පරිසර අනුකූලතාව සපයයි. එක් එක් තාක්ෂණයට නිශ්චිත විශේෂඥතාව
      අවශ්‍ය වන අතර තනි සංවර්ධකයා ඉගෙනුම් වක්‍රය කළමනාකරණය කළේය.'
    - 'තාක්ෂණ stack ඒකාබද්ධ සංකීර්ණතාව: තාක්ෂණ 15කට වැඩි ගණනක් එකට සංයුක්ත වී පද්ධතිය සාදයි; එක් එක් තාක්ෂණයට තමන්ගේ
      වින්‍යාසය, යැපීම් කළමනාකරණය සහ අනුවාද ගැළපුම අවශ්‍ය වේ. ඒකාබද්ධ පරීක්ෂණ තීරණාත්මකය: තාක්ෂණය A යාවත්කාලීන කිරීම
      තාක්ෂණය B කඩාකප්පල් කළ හැක. අනුවාද පින් කිරීම සහ Docker Compose මෙම අවදානම අවම කරයි.'
    - 'තාක්ෂණ තක්සේරු න්‍යාසය එක් එක් සංරචකයට: ක්‍රියාකාරීත්ව ලකුණු 1-5, කාර්ය සාධන ලකුණු 1-5, ප්‍රජා සහාය ලකුණු
      1-5, ඉගෙනුම් වක්‍ර ලකුණු 1-5, ඒකාබද්ධ පහසුව ලකුණු 1-5. බර තැබූ මුළු ලකුණු තේරීමට මග පෙන්වයි. න්‍යාස ප්‍රවේශය
      ආත්මීය මනාපයන් වළක්වා සාධක-පාදක තේරීමක් සපයයි.'
    - 'Open-source බලපත්‍ර අනුකූලතාව: සියලු තාක්ෂණ stack සංරචක අනුමත බලපත්‍ර (MIT, BSD, Apache 2.0) භාවිත කරයි.
      බලපත්‍ර ගැළපුම සත්‍යාපනය කර ඇත: ඒකාබද්ධ යෙදවීමේ බලපත්‍ර ගැටුමක් නැත. Open-source අනුකූලතාව ආයතනික අනුග්‍රහණයට
      සහාය දෙන අතර ශාස්ත්‍රීය ව්‍යාපෘති බෙදාහැරීමට බාධාවක් නොවේ.'
ch04_development:
  pipeline:
    paragraphs:
    - 'PDF සැකසුම් pipeline එක EasyCircular AI සේවාවේ /v1/parse/pdf endpoint එකේ ක්‍රියාත්මක වන අතර බහු-අදියර ප්‍රවේශයක්
      අනුගමනය කරයි. Pipeline ආදානය: backend උඩුගත නාමාවලියේ ගබඩා කළ PDF ගොනු මාර්ගය. Pipeline ප්‍රතිදානය: නිස්සාරණය
      කළ පෙළ, පිටු ගණන, භාවිත කළ ක්‍රමය සහ විශ්වාස metadata. බහු-අදියර නිර්මාණය ආකෘති විවිධත්වය හැසිරවීමට ඉඩ දෙයි.'
    - 'අදියර 1 pdfplumber නිස්සාරණය: pdfplumber පුස්තකාලය PDF ව්‍යුහාත්මක මූලද්‍රව්‍ය (පෙළ, වගු, රූප, metadata)
      විග්‍රහ කරයි. Layout-දැනුවත් නිස්සාරණය තීරු ව්‍යුහ, ශීර්ෂ/පාදක සහ වගු කොටු නිවැරදිව හඳුනා ගනියි. ඩිජිටල් උපත
      ලද අමාත්‍යාංශ චක්‍රලේඛවලට මෙම අදියර බොහෝ විට ප්‍රමාණවත් වේ.'
    - 'අදියර 2 PyMuPDF fallback: pdfplumber නිස්සාරණ අසාර්ථකත්වය හෝ අඩු-ගුණාත්මක ප්‍රතිදානය හඳුනා ගත් විට PyMuPDF
      (fitz) විකල්ප නිස්සාරණය උත්සාහ කරයි. PyMuPDF C-පාදක පුස්තකාලයක් වන අතර වේගවත් කාර්ය සාධනය සපයයි සහ වෙනස් PDF
      ව්‍යුහ රටා හසුරුවයි. Fallback අතිරික්තතාව නිස්සාරණ සාර්ථකත්ව අනුපාතය වැඩි දියුණු කරයි.'
    - 'අදියර 3 Tesseract OCR: රූප-පාදක පිටු සහ ස්කෑන් ලේඛන හඳුනා ගෙන OCR යොදයි. හඳුනා ගැනීමේ heuristic: පිටුවක පෙළ
      අන්තර්ගතය සීමාවට වඩා අඩු නම් (උදා: පිටුවකට අක්ෂර 50කට අඩු) රූප-පාදක ලෙස වර්ගීකරණය කරයි. Tesseract sin+eng+tam
      භාෂා ඇසුරුම් ත්‍රිභාෂික නිස්සාරණය සපයයි. OCR අදියර ස්කෑන් චක්‍රලේඛවලට අත්‍යවශ්‍ය වේ.'
    - 'අදියර 4 පසු-සැකසුම: නිස්සාරණය කළ පෙළ පිරිසිදු කිරීමේ මෙහෙයුම් අතරට අධික හිස් ඉඩ සාමාන්‍යකරණය, පිටු විරාම
      සලකුණු ඇතුළත් කිරීම, හිස් පිටු ඉවත් කිරීම, ශීර්ෂ/පාදක නැවත නැවත අන්තර්ගතය හඳුනා ගැනීම සහ Unicode සාමාන්‍යකරණය
      (NFC ආකාරය) අයත් වේ. පසු-සැකසුම NER සහ සාරාංශකරණ ආදාන ගුණාත්මකභාවය වැඩි දියුණු කරයි.'
    - 'අදියර 5 මානව සමාලෝචනය: frontend පෙළ සංස්කාරකය නිස්සාරණය කළ පෙළ දර්ශනය කරන අතර පරිශීලකයා OCR දෝෂ නිවැරදි කරයි,
      නිස්සාරණ කෘතිම කොටස් (විකෘති අක්ෂර, අනුපිටපත් ශීර්ෂ) ඉවත් කරයි. සංස්කරණය කළ පෙළ backend වෙත යවා සාරාංශකරණයට
      පෙර අනුමත කරයි. මෙම පියවර සමීක්ෂණයේ AI විශ්වාස හිඟයට සෘජු ප්‍රතිචාරයකි.'
    - 'Pipeline දෝෂ හැසිරවීම: එක් එක් අදියර try-except තුළ එතී ඇත; අදියර අසාර්ථකත්වය log කර ඊළඟ අදියර fallback ලෙස
      ක්‍රියාත්මක වේ. සම්පූර්ණ නිස්සාරණ අසාර්ථකත්වය (සියලු අදියර අසාර්ථක) MongoDB වාර්තාවේ දෝෂ තත්ත්වයක් ලෙස සටහන්
      වන අතර පරිශීලකයාට පැහැදිලි දෝෂ පණිවිඩයක් ලැබේ. දෝෂ හැසිරවීම පද්ධති දෘඪතාව වැඩි දියුණු කරයි.'
    - 'Pipeline කාර්ය සාධන සලකා බැලීම්: සමගාමී පිටු සැකසීමේ සමාන්තරකරණ අවස්ථාව Phase 6 ට ඇතුළත් වේ; මතක කළමනාකරණය
      විශාල PDF ගොනු ප්‍රවාහනය, තාවකාලික ගොනු පිරිසිදු කිරීම සහ සම්පත් සීමා වින්‍යාසය (Tesseract නූල් ගණන) සලකා
      බලයි. වර්තමාන ක්‍රියාත්මක කිරීම අනුක්‍රමික පිටු සැකසීම කරන අතර සංවර්ධන භාරයට ප්‍රමාණවත් වේ.'
    - 'Pipeline පරීක්ෂණ උපාය: ඒකක පරීක්ෂණ තනි අදියර ශ්‍රිත (නිස්සාරණය, OCR, පිරිසිදු කිරීම) ආවරණය කරයි; ඒකාබද්ධ
      පරීක්ෂණ බහු-අදියර pipeline එක PDF සිට පිරිසිදු පෙළ දක්වා පරීක්ෂා කරයි; නියමු ලේඛන පරීක්ෂණ විවිධ ආකෘති (ඩිජිටල්,
      ස්කෑන්, මිශ්‍ර) ආවරණය කරයි. පරීක්ෂණ කෝපස් නිස්සාරණ සාර්ථකත්වය සත්‍යාපනය කරයි.'
    - 'PDF නිස්සාරණ ගුණාත්මකභාව මිනුම්: අක්ෂර නිරවද්‍යතා අනුපාතය (නිස්සාරණය කළ පෙළ විරුද්ධව මුල් පෙළ අක්ෂර සංසන්දනය),
      ව්‍යුහ සංරක්ෂණ ලකුණු (වගු, තීරු, ශීර්ෂ නිවැරදිව හඳුනා ගැනීම), සම්පූර්ණත්ව අනුපාතය (සියලු පිටු ආවරණය). මෙම
      මිනුම් නිස්සාරණ ගුණාත්මකභාවය ප්‍රමාණනය කර pipeline වැඩිදියුණු කිරීම් මග පෙන්වයි.'
    - 'OCR විශ්වාස ලකුණුකරණය: Tesseract ප්‍රතිදානය විශ්වාස අගයන් සපයයි: ඉහළ විශ්වාස අක්ෂර (90%කට වැඩි) විශ්වාසනීයය,
      අඩු විශ්වාස අක්ෂර (70%කට අඩු) විභව දෝෂ දක්වයි. EasyCircular වර්තමාන ක්‍රියාත්මක කිරීම විශ්වාස ලකුණු log කරන
      නමුත් ස්වයංක්‍රීය ප්‍රතික්ෂේප කිරීම තවම ක්‍රියාත්මක නොකරයි; මානව සමාලෝචනය අඩු-විශ්වාස කොටස් නිවැරදි කරයි.
      Phase 6 විශ්වාස-පාදක අනතුරු ඇඟවීම් එකතු කළ හැක.'
    - 'Pipeline විස්තීර්ණතා නිර්මාණය: නව නිස්සාරණ පුස්තකාලයක් plug-in ගෘහනිර්මාණයකින් එකතු කළ හැක, නව OCR යන්ත්‍රයක්
      අතුරුමුහුණු වියුක්තීකරණයෙන් ඒකාබද්ධ කළ හැක, නව පසු-සැකසුම් පියවරක් pipeline middleware රටාවෙන් ඇතුළත් කළ හැක.
      විස්තීර්ණ නිර්මාණය අනාගත තාක්ෂණ වැඩිදියුණු කිරීම්වලට බාධාවකින් තොරව ගැලපේ.'
    - OCR fallback scanned circulars සඳහා අත්‍යවශ්‍යය. Tesseract sin+eng+tam මගින් ත්‍රිභාෂික පිටු හැසිරවීමට හැකි
      වේ.
    - Human edit step OCR දෝෂ නිවැරදි කිරීමට අවස්ථාව ලබා දෙයි. මෙය AI trust deficit ආමන්ත්‍රණය කරයි.
    - Content hash caching නැවත නැවත LLM කැඳවීම අඩු කර කාර්ය සාධනය වැඩි කරයි.
  ai:
    paragraphs:
    - 'AI සැකසුම් මොඩියුලය /v1/pipeline endpoint එක සංවිධානය කරයි: ආදානය නිස්සාරණයෙන් පසු මානව-අනුමත පෙළ වන අතර
      ප්‍රතිදානය ව්‍යුහගත JSON (entities, සාරාංශය, ක්‍රියාකාරී අයිතම, මාදිලි metadata) වේ. Pipeline එක අනුක්‍රමික
      පියවර ක්‍රියාත්මක කරයි: NER, ක්‍රියාකාරී අයිතම නිස්සාරණය, සාරාංශකරණය, guardrail සත්‍යාපනය සහ caching. එක්
      එක් පියවරේ ප්‍රතිදානය ඊළඟ පියවරේ ආදානය වේ.'
    - 'SpaCy NER ක්‍රියාත්මක කිරීමේ විස්තරය: en_core_web_sm ආකෘතිය යෙදුම් ආරම්භයේදී පටවා මතකයේ cache කරයි; ආදාන
      පෙළ nlp() මගින් සකසා doc.ents entity spans නිස්සාරණය කරයි. Entity පෙරහන: DATE, ORG, LAW, PERSON වර්ග රඳවා
      ගනිමින් අඩු-අදාළ වර්ග (PRODUCT, EVENT) ඉවත් කරයි. මතකයේ cache කිරීම නැවත පැටවීමේ පිරිවැය වළක්වයි.'
    - 'අභිරුචි EntityRuler ක්‍රියාත්මක කිරීම: SpaCy pipeline එකට EntityRuler සංරචකය එකතු කරයි. නීති රටා JSON ලෙස
      නිර්වචනය කරයි: චක්‍රලේඛ අංක රටා, අධ්‍යාපන ආඥාපනත වගන්ති, අමාත්‍යාංශ නාම විචලනයන් සහ දින ආකෘති. නීති රටා සංඛ්‍යානමය
      ආකෘති අනාවැකිවලට අනුපූරක වී recall වැඩි දියුණු කරයි. වසම්-විශේෂිත entities සාමාන්‍ය NER මඟහැරීම වළක්වයි.'
    - 'ක්‍රියාකාරී අයිතම නිස්සාරණ ඇල්ගොරිතම: SpaCy වාක්‍ය සීමා හඳුනා ගැනීමෙන් වාක්‍ය ටෝකනය කරන අතර එක් එක් වාක්‍යය
      අනිවාර්ය දර්ශක සඳහා පරීක්ෂා කරයි (must, shall, required to, directed to, ensure that, with immediate effect).
      ගැලපෙන වාක්‍ය ක්‍රියාකාරී අයිතම ලෙස වර්ගීකරණය කර මූලාශ්‍ර වාක්‍ය දර්ශකයට සම්බන්ධ කරයි. හඹා යා හැකිබව පාර්ශ්වකරු
      විශ්වාසය වැඩි දියුණු කරයි.'
    - 'LangChain map-reduce සාරාංශකරණ ක්‍රියාත්මක කිරීම: RecursiveCharacterTextSplitter මගින් පෙළ chunks වලට බෙදයි
      (chunk ප්‍රමාණය වින්‍යාසගත ~2000, overlap ~200); map පියවරේදී එක් එක් chunk LLM prompt template එකකින් entity
      anchors සමඟ සාරාංශ කරයි; reduce පියවරේදී අර්ධ සාරාංශ ඒකාබද්ධ කර අවසාන සාරාංශය නිපදවයි. Map-reduce දිගු චක්‍රලේඛ
      context window සීමා තුළ හසුරුවයි.'
    - 'Guardrail ක්‍රියාත්මක කිරීමේ විස්තරය: සාරාංශකරණයෙන් පසු දින සත්‍යාපන පියවර. ඇල්ගොරිතම: (1) ජනනය කළ සාරාංශයෙන්
      සියලු දින රටා regex මගින් නිස්සාරණය කරයි, (2) දින ආකෘති සාමාන්‍යකරණය කරයි (DD/MM/YYYY, YYYY-MM-DD, ලිඛිත දින),
      (3) එක් එක් දිනය මූලාශ්‍ර පෙළෙහි පවතින්නේදැයි සත්‍යාපනය කරයි, (4) සත්‍යාපනය නොකළ දින තිබේ නම් සාරාංශය ප්‍රතික්ෂේප
      කර extractive fallback ක්‍රියාත්මක කරයි.'
    - 'Extractive fallback ක්‍රියාත්මක කිරීම: TextRank-ශෛලී වාක්‍ය ලකුණුකරණය. ඇල්ගොරිතම: (1) වාක්‍ය ටෝකනය, (2) TF-IDF
      වාක්‍ය දෛශික ගණනය, (3) cosine සමානතා න්‍යාසය ගොඩනැගීම, (4) ප්‍රස්ථාර-පාදක ශ්‍රේණිගත කිරීම (PageRank අනුවර්තනය),
      (5) ඉහළම ලකුණු සහිත වාක්‍ය තෝරා මුල් අනුපිළිවෙලින් ඉදිරිපත් කිරීම. Fallback කරුණු විශ්වාසනීයත්වය සහතික කරයි
      මන්ද මුල් වාක්‍ය verbatim භාවිත වේ.'
    - 'Content hash caching ක්‍රියාත්මක කිරීම: ආදාන පෙළේ SHA-256 hash ගණනය කර MongoDB චක්‍රලේඛ ලේඛනයේ contentHash
      ක්ෂේත්‍රයේ ගබඩා කරයි. සැකසුම් ඉල්ලීමකදී backend hash ගණනය කර පවතින ලේඛන ගැලපීම සොයයි. Cache hit එකකදී AI සේවාව
      ඇමතීමෙන් තොරව ගබඩා කළ ප්‍රතිඵල ආපසු ලබා දෙයි (~114ms). Caching පුනරාවර්තක සැකසීමේ පිරිවැය සහ ප්‍රමාදය නාටකාකාරී
      ලෙස අඩු කරයි.'
    - 'AI pipeline වින්‍යාසය: පරිසර විචල්‍ය මගින් LLM endpoint URL, ආකෘති නාමය, chunk ප්‍රමාණය, overlap, උෂ්ණත්වය,
      උපරිම ටෝකන් සහ fallback සීමාව වින්‍යාස කරයි. වින්‍යාස නම්‍යතාව විවිධ යෙදවීමේ අවස්ථා සක්‍රීය කරයි (දේශීය Ollama,
      විකල්ප cloud API). කේත වෙනස් කිරීමකින් තොරව වින්‍යාසය සීරුමාරු කිරීම නඩත්තුව පහසු කරයි.'
    - 'AI pipeline logging සහ අධීක්ෂණය: එක් එක් pipeline පියවරේ කාලය log කරයි, NER entity ගණන log කරයි, සාරාංශකරණ
      මාදිලිය (LLM/fallback) log කරයි, guardrail ක්‍රියාකාරී සිදුවීම් log කරයි. ව්‍යුහගත logging JSON ආකාරයෙන් Docker
      container logs වෙත යයි. Logging නිදොස්කරණය සහ කාර්ය සාධන විශ්ලේෂණය සක්‍රීය කරයි.'
    - 'AI pipeline විස්තීර්ණතා නිර්මාණය: නව NER entity වර්ග අභිරුචි නීතිවලින් එකතු කළ හැක, නව සාරාංශකරණ උපාය chain
      මාරුවෙන් ආදේශ කළ හැක, නව guardrail පරීක්ෂා pipeline එකට ඇතුළත් කළ හැක, නව LLM ආකෘති Ollama හරහා මාරු කළ හැක.
      විස්තීර්ණ නිර්මාණය අනාගත වැඩිදියුණු කිරීම්වලට පද්ධති නැවත ලිවීමකින් තොරව ඉඩ දෙයි.'
    - 'AI pipeline නිරීක්ෂණය: එක් එක් සැකසුම් පියවර ව්‍යුහගත log ඇතුළත් කිරීමක් විමෝචනය කරයි (timestamp, පියවර නාමය,
      කාලසීමාව, ආදාන ප්‍රමාණය, ප්‍රතිදාන ප්‍රමාණය, දෝෂ තත්ත්වය). නිරීක්ෂණය නිෂ්පාදන නිදොස්කරණය සක්‍රීය කරයි: සැකසුම්
      බාධක, මන්දගාමී පියවර සහ අසාමාන්‍ය දෝෂ අනුපාත හඳුනා ගත හැක. වර්තමාන ක්‍රියාත්මක කිරීම log-පාදක නිරීක්ෂණය භාවිත
      කරයි; Phase 6 metrics dashboard එකතු කළ හැක.'
    - 'Prompt template අනුවාදකරණය: සාරාංශකරණ prompt පුනරාවර්තන අනුවාද-පාලිතය (prompt v1, prompt v2, prompt v3).
      එක් එක් අනුවාදයේ වැඩිදියුණු කිරීමේ තර්කනය ලේඛනගත කර ඇත: v1 මූලික උපදෙස්, v2 entity anchor එකතු කිරීම, v3 පරිපාලන
      වසම් සන්දර්භය ශක්තිමත් කිරීම. Prompt අනුවාදකරණය සාරාංශ ගුණාත්මකභාව වෙනස්කම් හඹා යා හැකි කරයි.'
    - 'AI pipeline දෝෂ ප්‍රතිසාධනය කරුණාවන්ත පිරිහීම ක්‍රියාත්මක කරයි: LLM timeout එකකදී extractive fallback, NER
      ආකෘති පැටවීම අසාර්ථක වූ විට මූලික regex entity නිස්සාරණය, සම්පූර්ණ නිස්සාරණ අසාර්ථකත්වයේදී පැහැදිලි දෝෂ පණිවිඩයක්
      සහිත දෝෂ තත්ත්වය. කරුණාවන්ත පිරිහීම සම්පූර්ණ පද්ධති අසාර්ථකත්වය වළක්වා අර්ධ ක්‍රියාකාරීත්වය පවත්වා ගනියි.'
