      සහ සාහිත්‍ය පරතර හඳුනා ගැනීම එකට එකතු වී අරමුණු නිශ්චිතභාවය ලබා ගත්තේය. ත්‍රිත්ව සාධක අභිමුඛතාව (සමීක්ෂණ ඉල්ලුම,
