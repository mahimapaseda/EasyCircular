      විශ්වාසනීයව ප්‍රතිනිෂ්පාදනය කළේය. වගු අන්තර්ගතය නිවැරදිව විග්‍රහ විය; ශීර්ෂ/පාදක නැවත නැවත යාම හඳුනා සලකුණු
      කරන ලදී. පිටු සීමා සංරක්ෂණය විය. නිස්සාරණ ගුණාත්මකභාවය පහළ-ප්‍රවාහ සැකසීමට ප්‍රමාණවත් විය.'
    - 'NER තක්සේරුව: SpaCy සහ EntityRuler entities නිස්සාරණය කළේය. DATE entities: චක්‍රලේඛ බලාත්මක දින, කාලසීමා
      දින සහ යොමු කාල පරාස දින නිවැරදිව හඳුනා ගන්නා ලදී. ORG entities: Ministry of Education සහ අදාළ ජාතික ආයතන
      හඳුනා ගන්නා ලදී. LAW entities: ආඥාපනත වගන්ති යොමු හඳුනා ගන්නා ලදී. NER ප්‍රතිදානය පරිපාලන භාවිතයට ප්‍රයෝජනවත්
      විය.'
    - 'සාරාංශ තක්සේරුව: extractive fallback මාදිලියේ සාරාංශය ජනනය කරන ලදී. TextRank ලකුණුකරණයෙන් ඉහළම වාක්‍ය 5ක්
      තෝරා මුල් අනුපිළිවෙලින් ඉදිරිපත් කරන ලදී. සාරාංශය ප්‍රධාන චක්‍රලේඛ අරමුණ, ප්‍රධාන නියෝග සහ වැදගත් දින ආවරණය
      කළේය. සාරාංශ ගුණාත්මකභාවය පරිපාලන සහාය අරමුණට ප්‍රමාණවත් විය.'
    - 'ක්‍රියාකාරී අයිතම තක්සේරුව: අනිවාර්ය වාක්‍ය හඳුනා ගැනීමෙන් ක්‍රියාකාරී අයිතම 4ක් හඳුනා ගන්නා ලදී. අයිතම අතරට
      විදුහල්පතිවරු අනුකූලතාව තහවුරු කළ යුතු බව, පාසල් වාර්තා ඉදිරිපත් කළ යුතු බව සහ ගුරුවරු කාලසීමාවලට අනුකූල විය
      යුතු බව ඇතුළත් විය. ක්‍රියාකාරී අයිතම මූලාශ්‍ර වාක්‍යවලට සම්බන්ධ කර ඇත.'
    - 'Entity ගණන් සාරාංශය: DATE entities 7ක්, ORG entities 4ක්, LAW entities 2ක් සහ PERSON entity 1ක් හඳුනා ගන්නා
      ලදී. Entity බෙදාහැරීම පරිපාලන ලේඛනවල සාමාන්‍ය රටාව පෙන්වයි: දින නිතරම දක්නට ලැබේ, සංවිධාන ද්විතීයිකය, නීතිමය
      යොමු අඩු නමුත් තීරණාත්මකය. Entity බෙදාහැරීම highlighting UI නිර්මාණයට දැනුම් දෙයි.'
    - 'අන්තයේ සිට අන්තයට කාලය: PDF උඩුගත කිරීම ~1 තත්පර, නිස්සාරණය ~1 තත්පර (ඩිජිටල් උපත), පෙළ සමාලෝචනය පරිශීලක
      මත රඳා පවතී, සැකසුම් ඉල්ලීම LLM මාදිලියේ ~15 තත්පර හෝ fallback මාදිලියේ ~3 තත්පර. සම්පූර්ණ කාර්යප්‍රවාහය මිනිත්තු
      කිහිපයකින් සම්පූර්ණ විය හැක (මානව සමාලෝචන කාලය ඇතුළුව).'
    - 'නියමු තක්සේරුවේ ප්‍රධාන අවබෝධය: පද්ධතිය තනි අමාත්‍යාංශ චක්‍රලේඛයක් සාර්ථකව සකසා අර්ථවත් entities නිස්සාරණය
      කර අදාළ සාරාංශයක් ජනනය කර ප්‍රායෝගික ක්‍රියාකාරී අයිතම හඳුනා ගනියි. ගුණාත්මකභාවය පරිපාලන සහාය අරමුණට ප්‍රමාණවත්ය.
      නියමු තක්සේරුව අන්තයේ සිට අන්තයට ක්‍රියාකාරීත්වය ප්‍රායෝගිකව පෙන්වයි.'
    - 'බහු නියමු තක්සේරු රටාව: විවිධ චක්‍රලේඛ වර්ග විවිධ සැකසුම් ලක්ෂණ පෙන්වයි. ප්‍රතිපත්ති යාවත්කාලීන චක්‍රලේඛ:
      ඉහළ entity ඝනත්වය (දින, දෙපාර්තමේන්තු), සංක්ෂිප්ත සාරාංශ ඵලදායීය. විභාග කාලසටහන් චක්‍රලේඛ: දින ඉහළ ඝනත්වය,
      ක්‍රියාකාරී අයිතම බහුලය. රටා විශ්ලේෂණය විශේෂාංග ප්‍රමුඛතාකරණයට දැනුම් දෙයි.'
    - 'බහු-ලේඛන නියමු තක්සේරු අනුකූලතා තක්සේරුව: විවිධ චක්‍රලේඛ 3ක් එකම තක්සේරු ක්‍රමවේදයට යොදා ප්‍රතිඵල අනුකූලතාව
      සත්‍යාපනය කරන ලදී. අනුකූල entity හඳුනා ගැනීමේ රටාව: දින සියලු ලේඛනවල වඩාත් විශ්වාසනීය entity වර්ගයයි; සංවිධාන
      මධ්‍යස්ථ විශ්වාසනීයත්වයක් ඇත. අනුකූලතාව පද්ධති ස්ථායිතාව පෙන්වයි.'
    - 'දෝෂ විශ්ලේෂණ නියමු තක්සේරුව: ව්‍යාජ ධනාත්මක entities (entity නොවන පෙළ entity ලෙස වර්ගීකරණය), ව්‍යාජ ඍණාත්මක
      entities (සැබෑ entities මඟහැරීම), සීමා දෝෂ (අර්ධ entity span හඳුනා ගැනීම). දෝෂ රටා විශ්ලේෂණය NER පිරිපහදුවට
      මග පෙන්වයි: EntityRuler රටා වැඩි දියුණු කිරීම recall වැඩි දියුණු කළ හැක.'
    - 'නියමු තක්සේරුවේ පරිශීලක දෘෂ්ටිකෝණය: විදුහල්පතිවරයකු චක්‍රලේඛය උඩුගත කරන අතර නිස්සාරණ සමාලෝචනයේදී අවම නිවැරදි
      කිරීම් අවශ්‍ය වේ; සැකසීම ක්‍රියාත්මක කර සාරාංශය සමාලෝචනය කරයි. විදුහල්පති ප්‍රතිපෝෂණ අනුකරණය: සාරාංශය ප්‍රධාන
      නියෝගය නිවැරදිව ග්‍රහණය කරයි; ඉස්මතු කළ දින ප්‍රයෝජනවත්ය. පරිශීලක දෘෂ්ටිකෝණය ප්‍රායෝගික වටිනාකම පෙන්වයි.'
    - 'නියමු තක්සේරු සැකසුම් මාදිලි සංසන්දනය: එකම චක්‍රලේඛය LLM මාදිලිය සහ fallback මාදිලිය අතර පැති-පැති තක්සේරු
      කරන ලදී. LLM මාදිලිය: වඩා චතුර සාරාංශය, ස්වභාවික භාෂා ගුණාත්මකභාවය ඉහළ නමුත් අවස්ථානුකූලව guardrail ක්‍රියාකාරී
      වේ. Fallback මාදිලිය: නිර්ණයාත්මක, කරුණු-විශ්වාසනීය, අඩු චතුරතාව. ද්වි-මාදිලි නිර්මාණය දෙපාර්ශ්වයේ වාසි උපයෝගී
      කර ගනියි.'
  llm:
    paragraphs:
    - 'LLM (Large Language Model) ඒකාබද්ධ කිරීම EasyCircular ද්වි-මාදිලි මෙහෙයුම සක්‍රීය කරයි: LLM මාදිලිය Ollama
      ලබා ගත හැකි විට abstractive සාරාංශකරණය; fallback මාදිලිය LLM නොමැති විට හෝ guardrail ක්‍රියාකාරී වූ විට extractive
      සාරාංශකරණය. ද්වි-මාදිලි නිර්මාණය ලබා ගත හැකිබව සහ කරුණු විශ්වාසනීයත්වය යන දෙකම සහතික කරයි.'
    - 'Ollama දේශීය LLM යෙදවීමේ වාසි: ශුන්‍ය per-token පිරිවැය (API බිල්පත් නැත), දත්ත රහස්‍යතාව (ලේඛන දේශීයව සකසයි),
