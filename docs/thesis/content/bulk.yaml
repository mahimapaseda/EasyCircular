      දෙයි.'
    - 'LLM ප්‍රතිදාන අනුකූලතා විශ්ලේෂණය: එකම ආදාන පෙළ සහ එකම prompt තුන් වතාවකට වඩා සකසා ප්‍රතිදාන විචලනය මනින ලදී.
      උෂ්ණත්වය 0.2 දී මධ්‍යස්ථ විචලනය නිරීක්ෂණය විය: ප්‍රධාන අන්තර්ගතය අනුකූලය, වාක්‍ය ගති වෙනස් වේ. අනුකූලතා විශ්ලේෂණය
      LLM අනිර්ණයාත්මකභාවය ප්‍රමාණනය කරයි; fallback නැවත නිපදවිය හැකිබව සපයයි.'
    - 'LLM context window කළමනාකරණය: llama3.2:3b context window ටෝකන් 4096ක්; දිගු අමාත්‍යාංශ චක්‍රලේඛ map-reduce
      chunking මගින් context window තුළ පවත්වා ගනියි. Chunk overlap අක්ෂර ~200ක් සන්දර්භ අඛණ්ඩතාව පවත්වා ගනියි.
      Context window කළමනාකරණය දිගු ලේඛන සාරාංශකරණයට අත්‍යවශ්‍යය.'
    - 'LLM inference ප්‍රශස්තකරණ උපාය: ආකෘති quantization (4-bit, 8-bit) මතකය අඩු කරමින් ගුණාත්මකභාවය පවත්වා ගනියි;
      KV cache ප්‍රශස්තකරණය නැවත නැවත inference වේගවත් කරයි; කණ්ඩායම් සැකසීම බහු chunks එකවර සකසයි. වර්තමාන ක්‍රියාත්මක
      කිරීම මූලික inference භාවිත කරයි; ප්‍රශස්තකරණය Phase 6 කාර්ය සාධන වැඩිදියුණු කිරීමකි.'
    - 'LLM ආකෘති සංසන්දන තක්සේරුව: llama3.2:3b ප්‍රාථමික ආකෘතිය; විකල්ප ආකෘති (mistral:7b, phi-3:3.8b) සීමිත සංසන්දන
      පරීක්ෂණයකට ලක් කරන ලදී. සංසන්දන ප්‍රතිඵල: llama3.2:3b ප්‍රමාණවත් සාරාංශ ගුණාත්මකභාවය, යථාර්ථවාදී inference
      වේගය සහ මධ්‍යස්ථ මතක භාවිතය ලබා දෙයි. ආකෘති සංසන්දනය තේරීම සාධාරණීකරණය කරයි.'
  uat:
    paragraphs:
    - 'පරිශීලක පිළිගැනීමේ පරීක්ෂණය (User Acceptance Testing, UAT) විධිමත් තක්සේරු ක්‍රමවේදයකි: පාසල් කාර්ය මණ්ඩල
      සහභාගිවන්නන් (අවම වශයෙන් ගුරුවරු, විදුහල්පතිවරු සහ අධ්‍යාපන නිලධාරීන් 5ක්) EasyCircular පද්ධතිය සැබෑ අමාත්‍යාංශ
      චක්‍රලේඛ මත සකසා සාරාංශ තක්සේරු කර entity highlighting භාවිතාව තක්සේරු කරයි. UAT ප්‍රායෝගික වටිනාකමේ මානව
      සාධකය සපයයි.'
    - 'UAT සැලසුම් තත්ත්වය: ප්‍රොටෝකෝලය නිර්මාණය කර ඇත, තක්සේරු ආකෘති සූදානම් කර ඇත, සහභාගිවන්නන් බඳවා ගැනීම ආරම්භ
      කර ඇත; ඉලක්ක සහභාගිවන්නන්: සමීක්ෂණ ප්‍රතිචාර දැක්වූවන් අතරින් සහභාගී වීමට කැමති ගුරුවරු සහ විදුහල්පතිවරු.
      කාලසටහන් අභියෝග: පාසල් පරිපාලන කාලසටහන්, විභාග කාල සීමා සහ සම්බන්ධීකරණ පොරොත්තු. UAT තත්ත්වය pending ලෙස පවතී.'
    - 'UAT තක්සේරු මාන සැලසුම් කර ඇත: කරුණු නිරවද්‍යතාව (සාරාංශය චක්‍රලේඛ අන්තර්ගතය නිවැරදිව පිළිබිඹු කරයිද, පරිමාණය
      1 සිට 5), සම්පූර්ණත්වය (ප්‍රධාන තොරතුරු ඇතුළත්ද, පරිමාණය 1 සිට 5), entity ප්‍රයෝජනය (highlighting ප්‍රයෝජනවත්ද,
      පරිමාණය 1 සිට 5), භාවිතාව (කාර්යප්‍රවාහය සහජද) සහ සමස්ත තෘප්තිය. මාන සම්පූර්ණ මානව තක්සේරුවක් සපයයි.'
    - 'UAT pending අවංක තර්කනය: නිබන්ධන ඉදිරිපත් කිරීමේ කාලසීමාව ස්ථිරය; සහභාගිවන්නන් කාලසටහන්කරණයට සම්බන්ධීකාරක
      භූමිකාව සහ අධ්‍යාපන නිලධාරී සහයෝගය අවශ්‍ය වේ; COVID-19 උරුම දුරස්ථ වැඩ රටා පාසල් සංචාර සංකීර්ණ කරයි; සදාචාර
      අනුමත කිරීමේ කාලය. Pending තත්ත්වය අවංකව වාර්තා කිරීම ශාස්ත්‍රීය අඛණ්ඩතාව පෙන්වයි.'
    - 'UAT සම්පූර්ණ කිරීමේ බලපෑම් තක්සේරුව: ධනාත්මක UAT ප්‍රතිඵල පද්ධති ප්‍රායෝගික වටිනාකම වලංගු කරයි, පාර්ශ්වකරු
      පිළිගැනීම පෙන්වයි සහ යෙදවීමේ නිර්දේශය ශක්තිමත් කරයි. ඍණාත්මක UAT ප්‍රතිපෝෂණය නිර්මාණ වැඩිදියුණු කිරීම්වලට
      දැනුම් දෙයි, භාවිතාවේ ගැටලු හඳුනා ගනියි සහ විශ්වාස බාධක ඉස්මතු කරයි. ඕනෑම ප්‍රතිඵලයක් වටිනා ඉගෙනීමක් සපයයි.'
    - 'ඉදිරිපත් කිරීමෙන් පසු UAT සැලැස්ම: පාසල් විදුහල්පතිවරුන් 2 සිට 3ක් සමඟ සම්බන්ධීකරණය කර පැය 1ක තක්සේරු සැසි
      පවත්වා ව්‍යුහගත ප්‍රතිපෝෂණ එකතු කර ප්‍රතිඵල විශ්ලේෂණය කර අනුමත නම් addendum එකක් ප්‍රකාශ කිරීම. UAT සොයාගැනීම්
      අනාගත වැඩිදියුණු කිරීම්වලට සෘජුව දැනුම් දෙයි.'
    - 'UAT විකල්ප සාධක: විධිමත් UAT pending වන අතර අනිත්‍ය පරිශීලක ප්‍රතිපෝෂණය සංවර්ධනය අතරතුර එකතු කරන ලදී (අධීක්ෂක
      ප්‍රදර්ශනය, සගයන් සමාලෝචන සැසිය, වසම් පරිශීලකයකු ලෙස ස්වයං-තක්සේරුව). අනිත්‍ය ප්‍රතිපෝෂණය ධනාත්මක විය: කාර්යප්‍රවාහය
      තේරුම් ගත හැකි බව, සාරාංශය ප්‍රයෝජනවත් බව. අනිත්‍ය සාධක විධිමත් UAT ආදේශ නොකරන නමුත් මූලික දිශානතිය සපයයි.'
    - 'UAT ප්‍රොටෝකෝල නිර්මාණය SUS (System Usability Scale) ක්‍රමවේදය අනුවර්තනය කරයි: අයිතම 10ක ප්‍රශ්නාවලිය ප්‍රමිතිගත
      භාවිතාව මිනුම, ලකුණු 5ක Likert පරිමාණ ප්‍රතිචාර, SUS ලකුණු ගණනය 0-100 පරාසයේ. SUS ලකුණු 68කට වැඩි සාමාන්‍යයට
      වඩා උසස් භාවිතාව දක්වයි. SUS ප්‍රමිතිගත, සංසන්දනය කළ හැකි භාවිතාවේ මිනුමක් සපයයි.'
    - 'UAT සහභාගිවන්නන් තේරීමේ නිර්ණායක: අවම වශයෙන් ගුරුවරු 2ක්, විදුහල්පතිවරු 2ක් සහ අධ්‍යාපන නිලධාරියකු 1ක් (විවිධ
      දෘෂ්ටිකෝණ); මූලික පරිගණක සාක්ෂරතාව (විද්‍යුත් තැපෑල සහ වෙබ් බ්‍රවුසිං); අමාත්‍යාංශ චක්‍රලේඛ නිතිපතා කියවන
      අය. තේරීමේ නිර්ණායක නියෝජිත ප්‍රතිපෝෂණය සහතික කරයි.'
    - 'UAT සදාචාරාත්මක සලකා බැලීම්: සහභාගිවන්නන්ගේ දැනුවත් කැමැත්ත ආකෘතිය, දත්ත නාමරහිතකරණය (ප්‍රකාශිත ප්‍රතිඵලවල
      පුද්ගලික හඳුනාගැනීම් නැත), ස්වේච්ඡාවෙන් ඉවත් වීමේ අයිතිය, රැවටීමක් නැත, පද්ධතිය AI-බලගැන්වූ බව පැහැදිලිව සන්නිවේදනය
      කිරීම, දත්ත රහස්‍යතාව. සදාචාරාත්මක සලකා බැලීම් ශාස්ත්‍රීය පර්යේෂණ ප්‍රමිතීන් අනුගමනය කරයි.'
ch06_conclusion:
  summary:
    paragraphs:
    - EasyCircular ව්‍යාපෘතිය අමාත්‍යාංශ චක්‍රලේඛ අවබෝධ අභියෝගය ආමන්ත්‍රණය කරන AI-බලගැන්වූ වෙබ් යෙදුමක් සාර්ථකව
      නිර්මාණය කර, ක්‍රියාත්මක කර, තක්සේරු කළේය. ත්‍රි-ස්ථර microservices ගෘහනිර්මාණය Next.js frontend, Express
      backend, FastAPI AI සේවාව සහ MongoDB ඒකාබද්ධ කරයි. ව්‍යාපෘතිය ක්‍රියාකාරී කෘතියක් සහ ශාස්ත්‍රීය ලේඛනගත කිරීමක්
      යන දෙකම බෙදා හැරියේය.
    - ප්‍රාථමික පර්යේෂණ සමීක්ෂණය (n=41) පාර්ශ්වකරු අවශ්‍යතා ප්‍රමාණනය කර නිර්මාණ තීරණවලට දැනුම් දුන්නේය. 97.6% සාරාංශ
      ඉල්ලුම මූලික විශේෂාංගය සාධාරණීකරණය කළේය; 78% entity highlighting NER ක්‍රියාත්මක කිරීමට පෙළඹවීය; 68.3% AI
      පැකිලීම human-in-the-loop නිර්මාණයට සහ දේශීය යෙදවීමට පෙළඹවීය. සමීක්ෂණ සාධක සාධක-පාදක සංවර්ධනයේ පදනම විය.
    - 'තාක්ෂණික ක්‍රියාත්මක කිරීම Agile අදියර පහකින් බෙදා හැරියේය: Foundation (යටිතල පහසුකම් සහ සත්‍යාපනය), Ingestion
      (PDF pipeline සහ OCR), AI Core (NER, සාරාංශකරණය, guardrails), MVP (ඒකාබද්ධ වෙබ් යෙදුම) සහ Validate and Release
      (පරීක්ෂණ සහ තක්සේරුව). පස්-අදියර බෙදාහැරීම වර්ධක ප්‍රගතිය සහ මුල් අවදානම් අඩු කිරීම සක්‍රීය කළේය.'
    - 'තක්සේරු සාධක බහු මාන ආවරණය කරයි: ROUGE මිනුම් (R1 F1=0.414, R2 F1=0.215, RL F1=0.292) සාරාංශ ගුණාත්මකභාවය
      ප්‍රමාණනය කරයි; ස්වයංක්‍රීය පරීක්ෂණ (91 pytest සහ backend පරීක්ෂණ 13ක්) නිවැරදිබව සත්‍යාපනය කරයි; මෙහෙයුම්
      මිනුම් (නිස්සාරණය ~6.8s OCR, cache ~114ms) කාර්ය සාධනය පෙන්වයි. බහුමාන තක්සේරුව සම්පූර්ණ ගුණාත්මකභාව රූපයක්
      සපයයි.'
    - 'ප්‍රධාන තාක්ෂණික ජයග්‍රහණ: pdfplumber, PyMuPDF සහ Tesseract OCR ත්‍රි-අතිරික්තතා නිස්සාරණය; SpaCy NER සහ
      අභිරුචි EntityRuler වසම් රටා; LangChain map-reduce ආරක්ෂිත සාරාංශකරණය; දින සත්‍යාපන guardrails hallucination
      ප්‍රතික්ෂේප කිරීම; content hash caching. ජයග්‍රහණ තාක්ෂණික ගැඹුර සහ ප්‍රායෝගික ඉංජිනේරු කිරීම පෙන්වයි.'
    - 'Open-source තාක්ෂණ stack එක ශුන්‍ය බලපත්‍ර පිරිවැයක් ඇත: Next.js, Express, FastAPI, MongoDB, SpaCy, LangChain,
      Ollama සහ Tesseract open-source වේ. ස්වයං-ධාරිත යෙදවීම ආයතනික දත්ත පරමාධිපත්‍යය පවත්වා ගනියි. Docker Compose
      නැවත නිපදවිය හැකි යෙදවීම සපයයි. Open-source තේරීම ආයතනික ප්‍රවේශ්‍යතාව සක්‍රීය කරයි.'
    - 'ව්‍යාපෘති දායකත්ව සාරාංශය: EasyCircular ශ්‍රී ලංකා අමාත්‍යාංශ චක්‍රලේඛ අවබෝධ වසම ආමන්ත්‍රණය කරන පළමු දන්නා
      අරමුණු-නිර්මිත, open-source, ස්වයං-ධාරිත AI පද්ධතියයි. සාහිත්‍ය සමාලෝචනය සහ සමීක්ෂණය හඳුනා ගත් පර්යේෂණ පරතරය
      ප්‍රායෝගික කෘතියකින් ආමන්ත්‍රණය කරයි. දායකත්වය යෙදුම් හා ක්‍රමවේද යන දෙකම ආවරණය කරයි.'
    - 'BSc Computer Science ශාස්ත්‍රීය අවශ්‍යතා සපුරාලයි: පර්යේෂණ ක්‍රමවේදය (සාහිත්‍ය සමාලෝචනය, ප්‍රාථමික සමීක්ෂණය),
      තාක්ෂණික ක්‍රියාත්මක කිරීම (ක්‍රියාකාරී බහු-ස්ථර යෙදුම), තක්සේරුව (ප්‍රමාණාත්මක මිනුම්, ස්වයංක්‍රීය පරීක්ෂණ),
      විවේචනාත්මක විශ්ලේෂණය (සීමා, අනාගත කාර්ය). ශාස්ත්‍රීය අවශ්‍යතා සහ ප්‍රායෝගික බෙදාහැරීම යන දෙකම සමතුලිත වේ.'
    - 'ඉගෙන ගත් පාඩම් සාරාංශය: AI ඒකාබද්ධ ව්‍යාපෘතිවලට පුනරාවර්තනීය guardrail පිරිපහදුව අවශ්‍ය වේ (මුල් දැඩිබව ක්‍රමයෙන්
      සීරුමාරු කිරීම); බහුභාෂික NLP ව්‍යාපෘතිවලට මුල් භාෂා සම්පත් තක්සේරුව අවශ්‍ය වේ (සිංහල පරතරය කලින් හඳුනා ගත
      යුතු විය); තනි-සංවර්ධක ව්‍යාපෘතිවල විෂය පථ විනය තීරණාත්මකය. පාඩම් අනාගත සමාන ව්‍යාපෘතිවලට වටිනාය.'
    - 'ව්‍යාපෘති බලපෑම් විභව තක්සේරුව: EasyCircular ශ්‍රී ලංකා අධ්‍යාපන පද්ධතියේ deploy කළහොත් චක්‍රලේඛ අවබෝධ කාර්යක්ෂමතාව
      සැලකිය යුතු ලෙස වැඩි දියුණු කිරීමේ විභවය ඇත. ඇස්තමේන්තු කාල ඉතිරිකිරීම: චක්‍රලේඛයකට මිනිත්තු 30 සිට 60 දක්වා
      (සම්පූර්ණ කියවීම විරුද්ධව සාරාංශ සමාලෝචනය). බලපෑම් විභවය නිෂ්පාදන යෙදවීම සහ UAT මත රඳා පවතී.'
    - 'EasyCircular සංවර්ධන ගමන තනි සංවර්ධකයකු අභිලාෂකාමී විෂය පථය කළමනාකරණය කිරීමේ පරිචය පෙන්වයි: සති 10ක කාලරාමුව,
      පස්-අදියර බෙදාහැරීම, තාක්ෂණ ඉගෙනුම් වක්‍රය (LangChain, FastAPI, Docker Compose පෙර නුහුරු), පර්යේෂණ ක්‍රමවේදය
      සහ තක්සේරු දැඩිබව. ගමන තාක්ෂණික සහ ශාස්ත්‍රීය වර්ධනය යන දෙකම ලේඛනගත කරයි.'
    - 'පද්ධති ගෘහනිර්මාණ දිගුකාලීනත්ව තක්සේරුව: microservices ගෘහනිර්මාණය පද්ධති නැවත නිර්මාණයකින් තොරව තාක්ෂණ සංරචක
      යාවත්කාලීන කිරීමට ඉඩ දෙයි. වසර පහක ප්‍රක්ෂේපණය: Next.js අනුප්‍රාප්තික රාමුව frontend ආදේශ කළ හැක; වඩා හොඳ
      LLM ආකෘතියක් Ollama හරහා මාරු කළ හැක; සිංහල NER සේවාව එකතු කළ හැක. ගෘහනිර්මාණ දිගුකාලීනත්වය අනාගත ආයෝජන ආරක්ෂා
      කරයි.'
    - 'ව්‍යාපෘති නැවත නිපදවිය හැකිබව තක්සේරුව: ඕනෑම සංවර්ධකයකුට repository clone කර Docker Compose ක්‍රියාත්මක කර
      පද්ධතිය ධාවනය කළ හැක. නැවත නිපදවිය හැකිබව පරීක්ෂා කර ඇත: පිරිසිදු යන්ත්‍රයක ස්ථාපන ලේඛනගත කිරීම අනුගමනය කර
      පද්ධතිය සාර්ථකව ආරම්භ විය. නැවත නිපදවිය හැකිබව ශාස්ත්‍රීය දායකත්වයකි: අනාගත පර්යේෂකයන්ට ප්‍රතිනිෂ්පාදනය සහ
      දිගු කිරීම කළ හැක.'
    - 'නිබන්ධන වාර්තාවම ව්‍යාපෘති බෙදාහැරීමකි: පර්යේෂණ ක්‍රියාවලිය, තාක්ෂණික ක්‍රියාත්මක කිරීම, තක්සේරු ප්‍රතිඵල
      සහ අවංක සීමා පිළිබඳ සම්පූර්ණ ලේඛනගත කිරීම. වාර්තා ගුණාත්මකභාවය ශාස්ත්‍රීය තක්සේරු නිර්ණායකයකි; වාර්තා අන්තර්ගතය
      සහ ඉදිරිපත් කිරීම යන දෙකම තක්සේරු වේ. වාර්තාව කෘතියට ශාස්ත්‍රීය සන්දර්භය සපයයි.'
    - EasyCircular purpose-built working artefact එකක් ලෙස ලබා දී ඇත. Architecture, pipeline සහ evaluation evidence
      ලේඛනගතය.
    - Survey demand සහ technical delivery අතර පරතරය අඩු කිරීම මෙම ව්‍යාපෘතියේ ප්‍රධාන දායකත්වයයි.
    - සීමාවන් අවංකව පිළිගැනීම අධ්‍යයන විනය පෙන්වයි. Phase 6 roadmap ඊළඟ පියවර පැහැදිලි කරයි.
  objectives:
    paragraphs:
    - 'අරමුණු 1 PDF ආයාත pipeline: ජයග්‍රහණය කර ඇත. pdfplumber, PyMuPDF සහ Tesseract OCR ත්‍රි-පුස්තකාල ප්‍රවේශය
      ක්‍රියාත්මක කර ඩිජිටල් උපත, ස්කෑන් සහ මිශ්‍ර PDF සාර්ථකව සකසයි. ත්‍රිභාෂික OCR (sin+eng+tam) ශ්‍රී ලංකා චක්‍රලේඛ
      යථාර්ථය ආමන්ත්‍රණය කරයි. සාධක: පරීක්ෂණ කෝපස් සාර්ථක අනුපාතය 100%.'
    - 'අරමුණු 2 NER ක්‍රියාත්මක කිරීම: අර්ධ වශයෙන් ජයග්‍රහණය කර ඇත. SpaCy en_core_web_sm ඉංග්‍රීසි entities (DATE,
      ORG, LAW, PERSON) සාර්ථකව හඳුනා ගනියි; අභිරුචි EntityRuler අමාත්‍යාංශ-විශේෂිත රටා (චක්‍රලේඛ අංක) අනුපූරක කරයි.
      සීමාව: සිංහල/දෙමළ NER ලබා ගත නොහැක. අර්ධ ජයග්‍රහණය අවංකව වාර්තා කර ඇත.'
    - 'අරමුණු 3 සාරාංශකරණ pipeline: ජයග්‍රහණය කර ඇත. LangChain map-reduce chain එක වින්‍යාසගත chunk සැකසීම සමඟ ක්‍රියාත්මකය;
      Ollama දේශීය LLM ඒකාබද්ධ කිරීම ක්‍රියාකාරීය; hallucination guardrails (දින සත්‍යාපනය, extractive fallback)
      ක්‍රියාත්මකය. සංයුක්ත extractive-abstractive උපාය ප්‍රායෝගිකව යොදා ඇත. සාධක: ROUGE ලකුණු සහ pytest guardrail
      පරීක්ෂණ.'
    - 'අරමුණු 4 ත්‍රි-ස්ථර යෙදවීම: ජයග්‍රහණය කර ඇත. Docker Compose පරිසරය සේවා හතරක් (frontend:3002, backend:4000,
      ai-service:5000, mongodb:27017) සංවිධානය කරයි; තනි-විධාන ආරම්භය, පරිසර විචල්‍ය වින්‍යාසය සහ health check අධීක්ෂණය.
      සාධක: අදියර සත්‍යාපන scripts සහ සාර්ථක docker-compose up.'
    - 'අරමුණු 5 ගුණාත්මකභාව තක්සේරුව: අර්ධ වශයෙන් ජයග්‍රහණය කර ඇත. ROUGE තක්සේරුව සම්පූර්ණය (ලේඛන 6ක්, macro ලකුණු
      වාර්තා); ස්වයංක්‍රීය පරීක්ෂණ සම්පූර්ණය (91 pytest, backend 13); අදියර සත්‍යාපන scripts ක්‍රියාකාරීය. සීමාව:
      විධිමත් UAT pending. අර්ධ ජයග්‍රහණය තාක්ෂණික තක්සේරුව ප්‍රබල නමුත් මානව තක්සේරුව අසම්පූර්ණ බව පිළිගනියි.'
    - 'අරමුණු ජයග්‍රහණ සාරාංශය: සම්පූර්ණයෙන් ජයග්‍රහණය කළ අරමුණු 3ක් (PDF pipeline, සාරාංශකරණය, යෙදවීම); අර්ධ වශයෙන්
      ජයග්‍රහණය කළ අරමුණු 2ක් (NER ඉංග්‍රීසි-පමණ, තක්සේරුව UAT pending). අර්ධ ජයග්‍රහණය අවංකව වාර්තා කිරීම ශාස්ත්‍රීය
      අඛණ්ඩතාව පෙන්වයි. සම්පූර්ණත්වය ප්‍රකාශ නොකර යථාර්ථවාදී තක්සේරුවක් සපයයි.'
    - 'අරමුණු ජයග්‍රහණ ප්‍රමාණාත්මක සාරාංශය: PDF නිස්සාරණ සාර්ථක අනුපාතය 100% (පරීක්ෂණ කෝපස්); NER precision ඉංග්‍රීසි
      අන්තර්ගතයේ ඉහළය; ROUGE-1 F1=0.414 (ලේඛන 6ක්); ස්වයංක්‍රීය පරීක්ෂණ සමත් අනුපාතය 100% (91/91 සහ 13/13). ප්‍රමාණාත්මක
      සාරාංශය වෛෂයික ජයග්‍රහණ සාධක සපයයි.'
    - 'අරමුණු පරතර විශ්ලේෂණය: සිංහල NER පරතරය සම්පූර්ණ ශ්‍රී ලංකා යෙදවීමට සැලකිය යුතුය; ඉංග්‍රීසි NER ඉංග්‍රීසි
      භාෂා චක්‍රලේඛවලට ප්‍රමාණවත්ය. UAT පරතරය තක්සේරු සම්පූර්ණත්වය අඩු කරයි; තාක්ෂණික තක්සේරුව ප්‍රබල නමුත් ප්‍රායෝගික
      භාවිතාවේ සාධක අසම්පූර්ණය. පරතර විශ්ලේෂණය අනාගත ප්‍රමුඛතා මග පෙන්වයි.'
    - 'අරමුණු සමීක්ෂණ සොයාගැනීම් සමඟ පෙළගැස්ම: 97.6% සාරාංශ ඉල්ලුම අරමුණු 3 සාරාංශකරණයෙන් සපුරාලයි; 78% entity ඉල්ලුම
      අරමුණු 2 NER (ඉංග්‍රීසි) මගින් සපුරාලයි; 68.3% විශ්වාස හිඟය human-in-the-loop (අරමුණු 1 සහ 3 හි කොටස) මගින්
      ආමන්ත්‍රණය කරයි. පෙළගැස්ම සාධක-පාදක අරමුණු ජයග්‍රහණය පෙන්වයි.'
    - 'සමස්ත අරමුණු තක්සේරුව: ව්‍යාපෘතිය AI-බලගැන්වූ අමාත්‍යාංශ චක්‍රලේඛ සාරාංශකරණයේ ශක්‍යතාව, ප්‍රායෝගික ක්‍රියාත්මක
      කිරීම සහ මැනිය හැකි තක්සේරුව සාර්ථකව පෙන්වයි. අරමුණු විෂය පථය සති 10ක කාලරාමුවට සහ තනි සංවර්ධකයකුට යථාර්ථවාදී
      විය; මූලික ක්‍රියාකාරීත්ව ජයග්‍රහණය සැලකිය යුතුය. සමස්ත තක්සේරුව ධනාත්මකය.'
    - 'අරමුණු මුල් යෝජනාව සමඟ සංසන්දනය: සියලු මූලික අරමුණු (PDF ආයාතය, NER, සාරාංශකරණය, වෙබ් යෙදවීම) යෝජනා කළ පරිදි
      බෙදා හැරියේය. විෂය පථ සීරුමාරු: සිංහල NER කල් දැමීම (සම්පත් අවශ්‍යතා අඩුවෙන් ඇස්තමේන්තු කළා), UAT කාලසටහන්
      අභියෝග. සංසන්දනය යථාර්ථවාදී අනුවර්තනය පෙන්වයි.'
    - 'අරමුණු ජයග්‍රහණ විශ්වාස මට්ටම්: අරමුණු 1 PDF pipeline ඉහළ විශ්වාසය (විස්තීර්ණ පරීක්ෂණ, බහු ආකෘති සත්‍යාපනය);
      අරමුණු 2 NER මධ්‍යස්ථ විශ්වාසය (ඉංග්‍රීසි ක්‍රියාකාරී, සිංහල පරතරය); අරමුණු 3 සාරාංශකරණය ඉහළ විශ්වාසය (ROUGE
      සහ guardrails); අරමුණු 4 යෙදවීම ඉහළ විශ්වාසය; අරමුණු 5 තක්සේරුව මධ්‍යස්ථ විශ්වාසය (UAT pending). විශ්වාස මට්ටම්
      අවංක තක්සේරුවකි.'
    - 'අරමුණු අන්තර් යැපීම් විශ්ලේෂණය: අරමුණු 1 නිස්සාරණය සියලු පසුකාලීන අරමුණුවල පූර්ව අවශ්‍යතාවයි; නිස්සාරණ අසාර්ථකත්වය
      දාම බලපෑමක් ඇති කරයි. අරමුණු 2 NER අරමුණු 3 සාරාංශකරණයට entity anchors සපයයි; NER ගුණාත්මකභාවය සාරාංශ ගුණාත්මකභාවයට
      බලපායි. අන්තර් යැපීම් විශ්ලේෂණය තීරණාත්මක මාර්ගය ඉස්මතු කරයි.'
    - 'අරමුණු ජාත්‍යන්තර ප්‍රමිතීන් සමඟ පෙළගැස්ම: PDF නිස්සාරණය ප්‍රවේශ්‍යතා මාර්ගෝපදේශ (WCAG 2.1 පෙළ විකල්ප) සමඟ
      පෙළගැසේ; NER තක්සේරු ක්‍රමවේදය CoNLL ආකෘති entity-මට්ටමේ මිනුම් සමඟ පෙළගැසේ; සාරාංශකරණ තක්සේරුව ROUGE සම්මත
      පරිචයයි; යෙදවීම Docker සම්මතය අනුගමනය කරයි. පෙළගැස්ම ශාස්ත්‍රීය හා කර්මාන්ත ප්‍රමිතීන්ට ගරු කරයි.'
    - 'අරමුණු අනාගත මිනුම් වැඩිදියුණු කිරීම: අරමුණු 2 NER සිංහල entity හඳුනා ගැනීමේ නිරවද්‍යතා මිනුම් එකතු කිරීම;
      අරමුණු 3 සාරාංශකරණයට BERTScore අර්ථමය සමානතා මිනුම් එකතු කිරීම; අරමුණු 5 තක්සේරුවට UAT SUS ලකුණු එකතු කිරීම.
      අනාගත මිනුම් තක්සේරු සම්පූර්ණත්වය වැඩි දියුණු කරයි.'
  limits:
    paragraphs:
    - 'සිංහල NLP සීමාව වඩාත් සැලකිය යුතු තාක්ෂණික සීමාවයි: SpaCy en_core_web_sm ඉංග්‍රීසි-පමණ ආකෘතියක් වන අතර සිංහල/දෙමළ
      entity හඳුනා ගැනීම ලබා ගත නොහැක. සිංහල-ප්‍රධාන චක්‍රලේඛ (අමාත්‍යාංශ ලේඛනවල බහුතරය) entity highlighting නොමැතිව
      අඩු ක්‍රියාකාරීත්වයක් ලබා ගනියි. මෙම සීමාව Phase 6 හි ඉහළම ප්‍රමුඛතාවයි.'
    - 'UAT pending සීමාව තක්සේරු සම්පූර්ණත්වයට බලපායි: ස්වයංක්‍රීය තක්සේරුව (ROUGE, පරීක්ෂණ) තාක්ෂණික ගුණාත්මකභාව
      සාධක සපයන අතර සැබෑ පරිශීලක අත්දැකීම, ප්‍රායෝගික ප්‍රයෝජනය සහ කාර්යප්‍රවාහ ඒකාබද්ධ කිරීමේ තක්සේරුව නොමැත. මානව
      තක්සේරුව තාක්ෂණික තක්සේරුවට අනුපූරක අත්‍යවශ්‍ය මානයකි. UAT සම්පූර්ණ කිරීම අනාගත ප්‍රමුඛතාවකි.'
    - 'තනි සංවර්ධක සීමාව: bus factor 1 (උපස්ථ සංවර්ධකයෙක් නැත); සමාලෝචන ගුණාත්මකභාවය ස්වයං-සමාලෝචනය පමණි (සගයන්
      සමාලෝචනය නැත); පරීක්ෂණ දෘෂ්ටිකෝණය සීමිතය (තනි පරීක්ෂක, අන්ධ ස්ථාන විය හැක). අවමන: සම්පූර්ණ ලේඛනගත කිරීම, ස්වයංක්‍රීය
      පරීක්ෂණ සහ Docker Compose නැවත නිපදවිය හැකි පරිසරය. තනි සංවර්ධක සීමාව BSc ව්‍යාපෘතිවල පොදුය.'
    - 'සිංහල OCR ගුණාත්මකභාව සීමාව: Tesseract sin භාෂා ඇසුරුම සිංහල පෙළ නිස්සාරණය කරන අතර නිරවද්‍යතාව වෙනස් වේ (පිරිසිදු
      මුද්‍රණය ඉහළ නිරවද්‍යතාව, මැකුණු/අඩු-විභේදන අඩු නිරවද්‍යතාව). OCR දෝෂ පහළ-ප්‍රවාහ NER/සාරාංශකරණයට පැතිරේ:
      වැරදි පෙළ වැරදි entities සහ සාරාංශ ඇති කරයි. Human-in-the-loop සංස්කරණය මෙම සීමාව අර්ධ වශයෙන් අවම කරයි.'
    - 'LLM guardrail සීමාවේ විෂය පථය: දින සත්‍යාපන guardrail ක්‍රියාත්මක සහ ඵලදායීය; දින නොවන hallucinations (නිර්මිත
      සංවිධාන, ප්‍රබන්ධ නීතිමය යොමු, වැරදි අනුකූලතා අවශ්‍යතා) හඳුනා ගැනීම නොමැත. සම්පූර්ණ කරුණු සත්‍යාපනයට NLI-පාදක
      entailment පරීක්ෂා අවශ්‍ය වේ (Phase 6). Guardrail සීමාව ආරක්ෂක ආවරණයේ පරතරයක් ඉතිරි කරයි.'
    - 'කාර්ය සාධන පරිමාණන සීමාව: වර්තමාන සංවර්ධන-ප්‍රශස්ත තනි-අවස්ථා යෙදවීම නිෂ්පාදන භාරය මත පරීක්ෂා කර නැත. සමගාමී
      පරිශීලක පරීක්ෂණ නැත; විශාල චක්‍රලේඛ සැකසීම (පිටු 20කට වැඩි) පරිමාණයේදී කාලය නොදනී. Ollama මතක භාවිතය සමගාමී
      inference සීමා කරයි. පරිමාණන සීමාව නිෂ්පාදන යෙදවීමට පෙර ආමන්ත්‍රණය කළ යුතුය.'
    - 'නීතිමය අස්වැන්නුම් සීමාව: AI-ජනිත සාරාංශ පරිපාලන සහාය මෙවලමක් වන අතර නීතිමය වලංගුතා සහතිකයක් නැත. නිල චක්‍රලේඛ
      අර්ථකථනය මානව වගකීම ලෙස පවතී. පද්ධතිය සාරාංශ තීරණ සහාය සපයන අතර තනි අධිකාරී මූලාශ්‍රය ලෙස සේවා නොකරයි. අස්වැන්නුම්
      ආයතනික අනුග්‍රහණයට අත්‍යවශ්‍යය.'
    - 'බ්‍රවුසර ගැළපුම් සීමාව: සංවර්ධන පරීක්ෂණය Chrome ප්‍රාථමික, Firefox ද්විතීයික; Safari, Edge සහ ජංගම බ්‍රවුසර
      සීමිත පරීක්ෂණයකට ලක් විය. හරස්-බ්‍රවුසර ගැළපුම නිෂ්පාදන යෙදවීමේ අවශ්‍යතාවකි; CSS/JavaScript polyfill Phase
      6 ට ඇතුළත් වේ. ප්‍රතිචාරී නිර්මාණය ජංගම viewport ආවරණය කරන නමුත් සම්පූර්ණ උපාංග පරීක්ෂණය අසම්පූර්ණය.'
    - 'ජාත්‍යන්තරකරණ සීමාව: වර්තමාන UI ඉංග්‍රීසි ලේබල පමණි; ශ්‍රී ලංකා පරිශීලකයන් සිංහල/දෙමළ අතුරුමුහුණතට කැමති
      විය හැක. i18n රාමු ඒකාබද්ධ කිරීමේ උත්සාහය, පරිවර්තන කළමනාකරණය සහ දකුණු-සිට-වම සලකා බැලීම (අනාගත අරාබි සහාය
      විභවය) Phase 6 ට ඇතුළත් වේ. ජාත්‍යන්තරකරණය ආයතනික අනුග්‍රහණයට වැදගත්ය.'
    - 'සීමා වර්ගීකරණය: තාක්ෂණික සීමා (සිංහල NER, OCR ගුණාත්මකභාවය), තක්සේරු සීමා (නියැදි ප්‍රමාණය, pending UAT),
      සම්පත් සීමා (තනි සංවර්ධකයා, දෘඪාංග සීමා), කාලීන සීමා (සති 10ක කාලරාමුව). වර්ගීකරණය සීමා විවිධ මූලාශ්‍රවලින්
      පැමිණෙන බව පෙන්වන අතර අවමන උපාය වෙනස් වේ.'
    - 'සීමා බරපතලකම් ශ්‍රේණිගත කිරීම: සිංහල NER වඩාත් බරපතලය (බහුතර අමාත්‍යාංශ ලේඛන සිංහල); UAT pending මධ්‍යස්ථය
      (තාක්ෂණික සාධක වන්දි ගෙවයි); නියැදි ප්‍රමාණය මධ්‍යස්ථය (ලේඛන 6ක් දර්ශක); තනි සංවර්ධකයා අපේක්ෂිතය. ශ්‍රේණිගත
      කිරීම අනාගත සම්පත් වෙන්කිරීමට මග පෙන්වයි.'
    - 'සීමා සමාන ව්‍යාපෘති සමඟ සංසන්දනය: BSc අවසන් වසර ව්‍යාපෘති සාමාන්‍යයෙන් සමාන සීමා ඇත (කාල සීමා, සම්පත් සීමා,
      අර්ධ තක්සේරුව). EasyCircular සීමා විශේෂ නොවේ නමුත් අපේක්ෂිතය; අවංක වාර්තාකරණය සමාන ව්‍යාපෘතිවලට වඩා උසස් විය
      හැක. සංසන්දනය සීමා සන්දර්භගත කරයි.'
    - 'දැනටමත් ක්‍රියාත්මක කළ සීමා අවමන: සිංහල NER පරතරය extractive fallback අර්ධ ක්‍රියාකාරීත්වය පවත්වා ගනී; UAT
      pending තාක්ෂණික තක්සේරුවෙන් වන්දි ගෙවයි (සම්පූර්ණ ස්වයංක්‍රීය සාධක); නියැදි ප්‍රමාණය ROUGE නැවත නිපදවිය හැකි
      ක්‍රමවේදයෙන් අනුපූරක වේ. අවමන සීමා බලපෑම අඩු කරන නමුත් ඉවත් නොකරයි.'
  future:
    paragraphs:
    - 'Phase 6 සිංහල/දෙමළ NER සංවර්ධනය ඉහළම ප්‍රමුඛතා අනාගත කාර්යයයි: සටහන්ගත සිංහල NER දත්ත කට්ටල නිර්මාණය (අමාත්‍යාංශ
      චක්‍රලේඛ කෝපස් අතින් සටහන්ගත කිරීම), multilingual BERT (mBERT හෝ XLM-RoBERTa) fine-tuning, සිංහල entity නිරවද්‍යතා
      තක්සේරුව. සිංහල NER සම්පූර්ණ ශ්‍රී ලංකා යෙදවීමට අත්‍යවශ්‍යය.'
    - 'විධිමත් UAT ක්‍රියාත්මක කිරීම වහාම අනාගත ප්‍රමුඛතාවකි: පාසල් කාර්ය මණ්ඩල සහභාගිවන්නන් (ගුරුවරු, විදුහල්පතිවරු,
      අධ්‍යාපන නිලධාරීන්) සම්බන්ධීකරණය කර ව්‍යුහගත තක්සේරු සැසි පවත්වා කාර්ය-පාදක කාර්යප්‍රවාහ පරීක්ෂණ සිදු කර ප්‍රමාණාත්මක
      ශ්‍රේණිගත කිරීම් (Likert) එකතු කිරීම. UAT ප්‍රායෝගික වටිනාකම වලංගු කරයි.'
    - 'නිෂ්පාදන cloud යෙදවීම අනාගත කාර්යයකි: AWS/GCP යටිතල පහසුකම් පිහිටුවීම, SSL සහතික වින්‍යාසය, වසම් නාම ලියාපදිංචිය,
      nginx reverse proxy, Docker Compose සිට Kubernetes සංක්‍රමණය හෝ කළමනාකරණය කළ container සේවා. නිෂ්පාදන යෙදවීම
      ආයතනික පරිමාණ ප්‍රවේශය සක්‍රීය කරයි.'
    - 'ද්විභාෂික UI සංවර්ධනය: සිංහල, දෙමළ සහ ඉංග්‍රීසි අතුරුමුහුණු ලේබල පරිවර්තන, දකුණු-සිට-වම පෙළ සහාය සලකා බැලීම
      (අරාබි යොමුව), දෙමළ ද්විදිශා භාෂාව, පරිශීලක මනාප භාෂා තේරීම, internationalization (i18n) රාමු ඒකාබද්ධ කිරීම.
      ද්විභාෂික UI ආයතනික අනුග්‍රහණය වැඩි දියුණු කරයි.'
    - 'Async job queue ක්‍රියාත්මක කිරීම: RabbitMQ හෝ Redis queue දිගු-ධාවන චක්‍රලේඛ සැකසීම (පිටු 20කට වැඩි) පසුබිමේ
      සකසයි; ප්‍රගති දැනුම්දීම WebSocket හෝ SSE මගින් පරිශීලකයාට දැනුම් දෙයි; queue අධීක්ෂණ dashboard. Async සැකසීම
      දිගු ලේඛන කාර්යප්‍රවාහය වැඩි දියුණු කරයි.'
    - 'උසස් guardrail සංවර්ධනය: NLI (Natural Language Inference) පාදක entailment සත්‍යාපනය (ජනනය කළ සාරාංශය මූලාශ්‍ර
      පෙළෙන් ගෙන එයිදැයි පරීක්ෂා කිරීම), entity grounding (සාරාංශ entities මූලාශ්‍ර entities සමඟ ගැලපේදැයි සත්‍යාපනය).
      උසස් guardrails දින නොවන hallucination ආවරණය පුළුල් කරයි.'
    - 'Admin විශ්ලේෂණ dashboard: චක්‍රලේඛ සැකසුම් සංඛ්‍යාලේඛන (පරිමාව, කාලය, මාදිලි බෙදාහැරීම), පරිශීලක ක්‍රියාකාරකම්
      මිනුම්, පද්ධති කාර්ය සාධන අධීක්ෂණය, NER නිරවද්‍යතා ලුහුබැඳීම, ROUGE ලකුණු ප්‍රවණතා, දෝෂ අනුපාත අධීක්ෂණය. Dashboard
      මෙහෙයුම් තීරණ ගැනීමට දත්ත සපයයි.'
    - 'අමාත්‍යාංශ නිල API ඒකාබද්ධ කිරීම: ස්වයංක්‍රීය චක්‍රලේඛ බාගත කිරීම, නව චක්‍රලේඛ හඳුනා ගැනීම, PDF බාගත කිරීම,
      metadata ආයාතය (චක්‍රලේඛ අංකය, මාතෘකාව, දිනය, කාණ්ඩය), සම්පූර්ණ කැටලොග් සමමුහුර්තකරණය, නව චක්‍රලේඛ දැනුම්දීම්
      පද්ධතිය. නිල API ඒකාබද්ධ කිරීම අතින් උඩුගත කිරීමේ භාරය අඩු කරයි.'
    - 'භූමිකා-පාදක ප්‍රවේශ පාලනය (RBAC): admin භූමිකාව (පද්ධති වින්‍යාසය, පරිශීලක කළමනාකරණය, විශ්ලේෂණ ප්‍රවේශය),
      editor භූමිකාව (චක්‍රලේඛ උඩුගත කිරීම, සැකසීම, සංස්කරණය), viewer භූමිකාව (සාරාංශ කියවීම, entities බැලීම). RBAC
      ආයතනික යෙදවීමේ ආරක්ෂක අවශ්‍යතාවකි.'
    - 'විස්තීර්ණ තක්සේරු පර්යේෂණය: විශාල චක්‍රලේඛ කෝපස් (ලේඛන 50කට වැඩි) ROUGE තක්සේරුව, බහු මානව සටහන්කරුවන් (අන්තර්-සටහන්කරු
      එකඟතාව මිනුම), LLM මාදිලි කැප වූ තක්සේරුව (නිර්ණයාත්මක seed, බහු ධාවන, විශ්වාස පරාස). විස්තීර්ණ තක්සේරුව තක්සේරු
      දැඩිබව වැඩි දියුණු කරයි.'
    - 'ප්‍රජා සහ සහයෝගීතා අනාගත දිශාව: EasyCircular open-source නිකුතුව GitHub ප්‍රජා දායකත්ව ආරාධනා කරයි. දායකත්ව
      ක්ෂේත්‍ර: සිංහල NLP පර්යේෂකයන් NER ආකෘති දායක කිරීම, UI/UX නිර්මාණකරුවන් අතුරුමුහුණත වැඩි දියුණු කිරීම, අධ්‍යාපන
      වෘත්තිකයන් UAT සහභාගී වීම. ප්‍රජා සහයෝගීතාව විෂය පථය තනි සංවර්ධකයකුට ඔබ්බට විහිදුවයි.'
