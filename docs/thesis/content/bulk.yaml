      පටු අරමුණ පළලට වඩා ගැඹුරට ප්‍රමුඛතාව දෙයි: සාරාංශකරණය, NER සහ guardrails ගැඹුරින් ක්‍රියාත්මක කර පුළුල් විශේෂාංග
      කට්ටලයක් මතුපිටින් ආවරණය නොකරයි. අරමුණු අවධානය ගුණාත්මක බෙදාහැරීම සක්‍රීය කරයි.'
