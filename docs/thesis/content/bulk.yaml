      FR8, NFR4), Could-have (NFR5 Ollama දේශීය විකල්පය), Won''t-have-this-time (සිංහල NER, ද්විභාෂික UI, async
      queue). Must-have අවශ්‍යතා Phases 1 සිට 4 දක්වා බෙදා හරියි; Should-have Phase 4 ට ඇතුළත් වේ; Could-have Phases
      4 සිට 5; Won''t-have Phase 6 ට කල් දමයි. MoSCoW රාමුව සති 10ක කාලරාමුවේ යථාර්ථවාදී විෂය පථය කළමනාකරණය කරයි.'
    - 'අවශ්‍යතා හඹා යා හැකිබවේ න්‍යාසය (RTM) සමීක්ෂණ ප්‍රශ්නයේ සිට අවශ්‍යතාව දක්වා ක්‍රියාත්මක කිරීමේ සංරචකය දක්වා
      පරීක්ෂණ අවස්ථාව දක්වා සිතියම්ගත කරයි. RTM සම්පූර්ණ ලේඛනගත කිරීම නිබන්ධන අනුබද්ධයේ ඇතුළත් වන අතර ක්‍රමවේද කොටස
      සාරාංශ අනුවාදයක් ඉදිරිපත් කරයි. හඹා යා හැකිබව ශාස්ත්‍රීය දැඩිබව පෙන්වයි: තීරණ අත්තනෝමතික නොවේ, සාධක-පාදකය.'
    - 'සීමා අවශ්‍යතා: තනි සංවර්ධකයා (සති 10ක කාලරාමුව), ඉංග්‍රීසි NER පමණි (SpaCy ආකෘති ලබා ගත හැකිබව), දේශීය සංවර්ධන
      දෘඪාංග (Ollama RAM අවශ්‍යතා), නිබන්ධන ශාස්ත්‍රීය ප්‍රමිතීන් (ලේඛනගත කිරීමේ ගැඹුර, තක්සේරු සාධක). සීමා විෂය
      පථ තීරණවලට බලපායි: සිංහල NER කල් දමන ලදී (ආකෘති පුහුණු සම්පත් නොමැත), නිෂ්පාදන යෙදවීම කල් දමන ලදී (යටිතල පහසුකම්
      පිරිවැය), විධිමත් UAT කාලසටහන්කරණය අභියෝගයට ලක් විය (සහභාගිවන්නන්ගේ ලබා ගත හැකිබව).'
    - 'කල් දැමූ අවශ්‍යතා ලේඛනගත කිරීම: සිංහල/දෙමළ NER (සටහන්ගත දත්ත කට්ටලය සහ ආකෘති පුහුණුව අවශ්‍ය), ද්විභාෂික UI
      (පරිවර්තන උත්සාහය සහ සංස්කෘතික අනුවර්තනය), async job queue (RabbitMQ/Redis යටිතල පහසුකම්), admin විශ්ලේෂණ
      (dashboard සංවර්ධනය), භූමිකා-පාදක ප්‍රවේශය (අවසර ආකෘති නිර්මාණය). එක් එක් කල් දැමූ අවශ්‍යතාවේ ශක්‍යතාව, ඇස්තමේන්තු
      උත්සාහය සහ ප්‍රමුඛතාව Phase 6 backlog එකේ ලේඛනගත කර ඇත.'
    - 'අවශ්‍යතා එකතු කිරීමේ ශිල්පක්‍රම: සමීක්ෂණ ප්‍රශ්නාවලිය (ප්‍රාථමික ප්‍රමාණාත්මක), සාහිත්‍ය සමාලෝචනය (ද්විතීයික
      ගුණාත්මක), තරඟකාරී විශ්ලේෂණය (පරතර හඳුනා ගැනීම), සංවර්ධක විශේෂඥතාව (තාක්ෂණික ශක්‍යතාව). බහු එකතු කිරීමේ ශිල්පක්‍රම
      අවශ්‍යතා සම්පූර්ණත්වය වැඩි දියුණු කරයි; තනි ශිල්පක්‍රමය අන්ධ ස්ථාන නිර්මාණය කරයි. අවශ්‍යතා හඹා යා හැකිබව එක්
      එක් අවශ්‍යතාව එකතු කිරීමේ මූලාශ්‍රයට සම්බන්ධ කරයි; සමීක්ෂණ ප්‍රශ්නයේ සිට අවශ්‍යතාවට සිතියම්ගත කිරීම ලේඛනගත
      කර ඇත.'
    - 'ක්‍රියාකාරී නොවන අවශ්‍යතා මිනුම් ක්‍රමවේදය: NFR1 කාර්ය සාධනය cache hit ප්‍රතිචාර කාලය මනියි (මිනුම්කෝදණ්ඩ
      script ක්‍රියාත්මක කර පුනරාවර්තන 10ක සාමාන්‍යය), NFR2 ආරක්ෂාව සත්‍යාපන පරීක්ෂණ (වලංගු/අවලංගු අක්තපත්‍ර, කල්
      ඉකුත් ටෝකන්), NFR3 විශ්වාසනීයත්වය health check uptime (අධීක්ෂණ කාලයේ සේවා ලබා ගත හැකිබව), NFR4 භාවිතාව ප්‍රතිචාරී
      නිර්මාණ viewport පරීක්ෂණ (Chrome DevTools උපාංග අනුකරණය). මිනුම් ක්‍රමවේදය NFR අනුකූලතාව වෛෂයිකව සත්‍යාපනය
      කිරීම සක්‍රීය කරයි.'
    - 'අවශ්‍යතා වෙනස්කම් කළමනාකරණය Agile ප්‍රවේශයකි: වෙනස්කම් ඉල්ලීම් backlog එකට එකතු කරයි, පවතින අයිතමවලට එරෙහිව
      ප්‍රමුඛතාව තක්සේරු කරයි, sprint/අදියර විෂය පථය සීරුමාරු කරයි. ප්‍රධාන වෙනස්කම් උදාහරණය: මුල් අවශ්‍යතාව සම්පූර්ණ
      සිංහල NER විය, Phase 3 තක්සේරුවේදී සිංහල NER සම්පත් අවශ්‍යතාව ඉක්මවන බව පෙනී ගියේය, වෙනස්කම් ඉල්ලීම සිංහල
      NER Phase 6 ට කල් දැමීය. වෙනස්කම් කළමනාකරණ ලේඛනගත කිරීම නිබන්ධන අවංක තක්සේරුවකි: මුල් සැලැස්ම විරුද්ධව සැබෑ
      බෙදාහැරීමේ පාරදෘශ්‍ය සංසන්දනය.'
  arch:
    paragraphs:
    - 'ත්‍රි-ස්ථර ගෘහනිර්මාණය වගකීම් වෙන් කිරීමේ මූලධර්මය ක්‍රියාත්මක කරයි: ඉදිරිපත් කිරීම (frontend), යෙදුම් තර්කනය
      (backend), දත්ත/AI සැකසීම (AI සේවාව සහ දත්ත සමුදාය) වෙන් වූ ස්ථර ස්වාධීනව සංවර්ධනය, deploy සහ පරිමාණනය කළ
      හැක. එක් එක් ස්ථරයට නිශ්චිත වගකීමක් ඇත; ස්ථර සීමා REST API ගිවිසුම් මගින් නිර්වචනය කරයි. Microservices රටාව
      monolithic යෙදුම් සීමා (දැඩි සම්බන්ධතාව, තාක්ෂණ අගුලු දැමීම, පරිමාණන සීමා) වළක්වයි.'
    - 'Frontend ස්ථරය Next.js 14 App Router රාමුව භාවිත කරයි: React server components, TypeScript වර්ග ආරක්ෂාව,
      Tailwind CSS ප්‍රතිචාරී ශෛලීකරණය. Port 3002 සංවර්ධන මාදිලියේ සේවා සපයයි. Client-side JWT ටෝකන් කළමනාකරණය සත්‍යාපිත
      API ඉල්ලීම් සක්‍රීය කරයි. ප්‍රතිචාරී නිර්මාණය ජංගම viewport ප්‍රශස්තකරණය කරයි; dashboard, චක්‍රලේඛ ලැයිස්තුව,
      උඩුගත කිරීම සහ සාරාංශ විස්තර දසුන් ක්‍රියාත්මක කර ඇත.'
