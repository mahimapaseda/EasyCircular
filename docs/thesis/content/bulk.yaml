  ops:
    paragraphs:
    - මෙහෙයුම් ප්‍රතිඵල EasyCircular පද්ධතියේ ධාවන කාල කාර්ය සාධනය, සේවා සෞඛ්‍යය, නිස්සාරණ කාලය, caching ඵලදායීතාව
      සහ සම්පත් උපයෝගීතාව පෙන්වයි. සංවර්ධන පරිසර පරීක්ෂණ Docker Compose stack එකේ සියලු සේවා සමගාමීව ධාවනය වන විට
      සිදු කරන ලදී. මෙහෙයුම් මිනුම් ප්‍රායෝගික යෙදවීමේ සූදානම තක්සේරු කරයි.
    - 'Health check සත්‍යාපනය: ස්ථර තුනේම health endpoints HTTP 200 සාර්ථකව ප්‍රතිචාර දක්වයි. Frontend Next.js සංවර්ධන
      සර්වරය port 3002 හි සේවා සපයයි; backend Express සර්වරය port 4000 හි සූදානම්ය; AI සේවාව port 5000 හි SpaCy
      ආකෘතිය පැටවී ඇති බව වාර්තා කරයි; MongoDB port 27017 හි සම්බන්ධතාව ස්ථාපිතය. සෞඛ්‍ය අධීක්ෂණය මෙහෙයුම් විශ්වාසනීයත්වයේ
      පදනමයි.'
    - 'PDF නිස්සාරණ කාල ප්‍රතිඵල: පෙළ ස්ථරය ඇති ඩිජිටල් උපත ලද PDF ලේඛනයකට නිස්සාරණ කාලය තත්පර 1කට අඩු (pdfplumber);
      ස්කෑන් PDF සඳහා Tesseract OCR පිටුවකට සාමාන්‍යයෙන් ~6.8 තත්පර. නිස්සාරණ කාලය ලේඛන ආකෘතිය සහ පිටු ගණන මත රඳා
      පවතී. OCR කාලය ස්කෑන් ලේඛන කාර්යප්‍රවාහයේ ප්‍රධාන පිරිවැයයි.'
    - 'Content hash caching ප්‍රතිඵල: පළමු සැකසුම් ඉල්ලීම cache miss වන අතර සම්පූර්ණ AI pipeline එක ක්‍රියාත්මක
      වේ (NER සහ සාරාංශකරණය තත්පර ගණනක්). පසුකාලීන සමාන පෙළ සැකසුම් ඉල්ලීම cache hit වන අතර ප්‍රතිචාර කාලය ~114ms
      වේ. Caching නැවත නැවත සැකසීමේ පිරිවැය ඉවත් කර පරිශීලක අත්දැකීම නාටකාකාරී ලෙස වැඩි දියුණු කරයි.'
    - 'LLM inference කාර්ය සාධනය: Ollama llama3.2:3b තනි චක්‍රලේඛ සාරාංශකරණය map-reduce chain එකෙන් ලේඛන දිග අනුව
      තත්පර 10 සිට 45 දක්වා ගත වේ. ටෝකන් ජනන අනුපාතය දෘඪාංග මත රඳා පවතී (CPU inference). Inference කාලය පරිශීලක
      රැඳී සිටීමේ කාලයට බලපාන අතර fallback මාදිලිය වේගවත් විකල්පයක් සපයයි.'
    - 'මතක උපයෝගීතාව Docker Compose stack එකේදී: MongoDB ~200MB, AI සේවාව (SpaCy + FastAPI) ~500MB, Ollama ආකෘතිය
      පැටවූ විට ~4GB, Backend Express ~100MB, Frontend Next.js ~200MB. මුළු stack එක ආසන්න වශයෙන් 5GB RAM භාවිත
      කරයි. මතක අවශ්‍යතා යෙදවීමේ දෘඪාංග සැලසුම්කරණයට දැනුම් දෙයි.'
    - 'දෝෂ හැසිරවීමේ මෙහෙයුම් ප්‍රතිඵල: PDF නිස්සාරණ අසාර්ථක අනුපාතය පරීක්ෂණ කෝපස් එකේ 0% (සියලු පරීක්ෂණ ලේඛන සාර්ථකව
      නිස්සාරණය විය); LLM timeout සිදුවීම් සංවර්ධන පරීක්ෂණයේදී දුර්ලභය; Ollama දේශීය යෙදවීම විශ්වාසනීයය. දෝෂ හැසිරවීමේ
      දෘඪතාව මෙහෙයුම් ස්ථායිතාව පෙන්වයි.'
    - 'දත්ත සමුදා කාර්ය සාධනය: MongoDB තනි ලේඛන විමසුම ~10ms, චක්‍රලේඛ ලැයිස්තු විමසුම (පිටුකරණය සහිත) ~50ms, පෙළ
      යාවත්කාලීන PATCH ~20ms. Index වින්‍යාසය: පෙරනිමි _id ට අමතරව userId, status සහ createdAt indexes. දත්ත සමුදා
      කාර්ය සාධනය සංවර්ධන භාරයට ප්‍රමාණවත්ය; නිෂ්පාදන පරිමාණයේදී අමතර indexes අවශ්‍ය විය හැක.'
    - 'Rate limiting මෙහෙයුම් සත්‍යාපනය: /api/circulars/:id/process endpoint හි rate limit පරීක්ෂා කර අතිරේක ඉල්ලීම්
      HTTP 429 නිවැරදිව ආපසු ලබා දුන්නේය. Rate limit කවුළුව මිනිත්තු 15ක් වන අතර උපරිම ඉල්ලීම් වින්‍යාසගතය. Rate
      limiting අනිසි භාවිතය වළක්වා සම්පත් ආරක්ෂා කරයි.'
    - 'සමස්ත මෙහෙයුම් තක්සේරුව: පද්ධතිය සංවර්ධන පරිසරයේ ස්ථායීය, Docker Compose යෙදවීම නැවත නිපදවිය හැක, ප්‍රතිචාර
      කාල පිළිගත හැක (ඩිජිටල් නිස්සාරණය ~1s, ස්කෑන් ~6.8s, cache ~114ms), සම්පූර්ණ සෞඛ්‍ය අධීක්ෂණය දෘඪය. මෙහෙයුම්
      ප්‍රතිඵල ප්‍රායෝගික භාවිතයට ප්‍රමාණවත් ස්ථායිතාව පෙන්වයි.'
    - 'සමගාමී ඉල්ලීම් හැසිරවීමේ තක්සේරුව: සංවර්ධන පරීක්ෂණය ප්‍රධාන වශයෙන් අනුක්‍රමික ඉල්ලීම් භාවිත කළ අතර සීමිත
      සමගාමී පරීක්ෂණ (එකවර පරිශීලකයන් 2 සිට 3) Express backend පිරිහීමකින් තොරව හැසිරවීය. AI සේවාව තනි-ඉල්ලීම් සැකසීමට
      ප්‍රශස්ත කර ඇත; ඉහළ සමගාමීතාවට async queue (Phase 6) අවශ්‍ය වේ.'
    - 'Docker Compose සම්පත් අධීක්ෂණය: docker stats විධානය තත්කාලීන container CPU, මතක, ජාල I/O දර්ශනය කරයි. උපරිම
      මතක භාවිතය: AI සේවාව SpaCy ආකෘතිය පැටවීමේදී සහ LLM සැකසීම එකවර සිදු වන විට. සම්පත් අධීක්ෂණය බාධක හඳුනා ගැනීමට
      සහ යෙදවීමේ සැලසුම්කරණයට උපකාරී වේ.'
    - 'සේවා ආරම්භ අනුපිළිවෙල Docker Compose සංවිධානය කරයි: MongoDB පළමුව (දත්ත ස්ථර පදනම), AI සේවාව දෙවනුව (SpaCy
      ආකෘති පැටවීම ~15 තත්පර), backend තෙවනුව (MongoDB සම්බන්ධතාව ස්ථාපිත කර AI සේවාව සෞඛ්‍ය පරීක්ෂා කරයි), frontend
      අවසානයේ. ආරම්භ අනුපිළිවෙල යැපීම් ගැටලු වළක්වයි.'
    - 'ජාල කාර්ය සාධනය Docker Compose අභ්‍යන්තර ජාලයේදී: සේවා-සේවා සන්නිවේදනය උප-මිලිතත්පර ප්‍රමාදයක් ඇත; docker
      ජාල කලාප පළල localhost ට සමානය. ජාල කාර්ය සාධනය සංවර්ධන යෙදවීමේදී බාධකයක් නොවේ; නිෂ්පාදන යෙදවීමේදී වෙනම ධාරකවල
      ජාල ප්‍රමාදය සලකා බැලිය යුතුය.'
    - 'Log විශ්ලේෂණය සංවර්ධන පරීක්ෂණයේදී: යෙදුම් logs ව්‍යුහගත JSON ආකෘතියෙන් වන අතර Docker container logs docker
      logs විධානයෙන් ප්‍රවේශ වේ. Log පරිමාව සංවර්ධන තනි-පරිශීලක භාවිතයේදී මධ්‍යස්ථය. Log විශ්ලේෂණ රටා හඳුනා ගනියි:
      නිතර සිදු වන දෝෂ, මන්දගාමී ඉල්ලීම් සහ guardrail ක්‍රියාකාරී සිදුවීම්.'
    - 'කරුණාවන්ත වසා දැමීම ක්‍රියාත්මක කිරීම: Docker Compose නැවැත්වීමේ සංඥාව (SIGTERM) සේවා ලබා ගනී; ක්‍රියාකාරී
      ඉල්ලීම් සම්පූර්ණ වීමට වින්‍යාසගත timeout එකක් රැඳී සිටී; දත්ත සමුදා සම්බන්ධතා නිසි ලෙස වසා දමයි; තාවකාලික
      ගොනු පිරිසිදු කරයි. කරුණාවන්ත වසා දැමීම දත්ත දූෂණය වළක්වා මෙහෙයුම් විශ්වාසනීයත්වය වැඩි දියුණු කරයි.'
    - Health checks සියලු සේවා සාර්ථකව ප්‍රතිචාර දැක්වූ අතර MVP flow upload සිට summary දක්වා සම්පූර්ණ විය.
    - OCR extract කාලය තත්පර ~6.8ක් වූ අතර cache hit ~114ms විය. මෙය ප්‍රායෝගික භාවිතයට පිළිගත හැකි මට්ටමකි.
    - UI screenshots මගින් dashboard, upload සහ summary detail තිර ක්‍රියාකාරී බව පෙන්වයි.
  rouge_results:
    paragraphs:
    - 'ROUGE තක්සේරුව අමාත්‍යාංශ නියමු චක්‍රලේඛ 6ක් මානව-රචිත යොමු සාරාංශ සමඟ සංසන්දනය කර පද්ධති-ජනිත සාරාංශ ගුණාත්මකභාවය
      ප්‍රමාණනය කරයි. තක්සේරු දත්ත කට්ටල චක්‍රලේඛ IDs: 10-2026 සහ 12-2026 ශ්‍රේණිය; ප්‍රධාන වශයෙන් ඉංග්‍රීසි අන්තර්ගතය
      NER සහ සාරාංශකරණයට සුදුසුය. තක්සේරුව ප්‍රමාණාත්මක සාරාංශ ගුණාත්මකභාව සාධකයක් සපයයි.'
    - 'තක්සේරු script එක scripts/evaluate-rouge.mjs ක්‍රියාත්මක කිරීම: එක් එක් චක්‍රලේඛයේ පද්ධති-ජනිත සාරාංශය යොමු
      සාරාංශය සමඟ සංසන්දනය කර ROUGE-1, ROUGE-2 සහ ROUGE-L precision, recall සහ F1 ගණනය කරයි; ලේඛන-මට්ටමේ ලකුණු වාර්තා
      කර macro-average එකතු ලකුණු ගණනය කරයි. Script එක rouge-report.json ප්‍රතිදානය ජනනය කරයි.'
    - 'ROUGE-1 unigram ප්‍රතිඵල: macro F1 අගය 0.414. තනි ලේඛන ලකුණු 0.32 සිට 0.52 දක්වා පරාසයක පවතී. ROUGE-1 අන්තර්ගත
      වචන අතිච්ඡාදනය මනින අතර 0.414 ලකුණු මධ්‍යස්ථ ආවරණයක් දක්වයි (ආසන්න වශයෙන් 41.4% unigram අතිච්ඡාදනය). මෙම ලකුණු
      extractive සාරාංශකරණයට පිළිගත හැකි මට්ටමකි.'
    - 'ROUGE-2 bigram ප්‍රතිඵල: macro F1 අගය 0.215. Bigram අතිච්ඡාදනය දැඩි මිනුමක් වන අතර අනුක්‍රමික වචන යුගල ගැලපීම
      අවශ්‍ය කරයි. 0.215 ලකුණු වාක්‍යාංශ සමානතාව මධ්‍යස්ථ-අඩු ලෙස දක්වයි. Extractive සාරාංශ මුල් වාක්‍යාංශ සංරක්ෂණය
      කරන අතර යොමු සාරාංශ paraphrase කර ඇති බැවින් bigram ලකුණු අඩු වේ.'
    - 'ROUGE-L දිගම පොදු උප-අනුක්‍රම ප්‍රතිඵල: macro F1 අගය 0.292. LCS වාක්‍ය ව්‍යුහ සමානතාව මනින අතර වචන අනුපිළිවෙල
      සංරක්ෂණය තක්සේරු කරයි. 0.292 ලකුණු මධ්‍යස්ථ ව්‍යුහ සමානතාව දක්වයි. Extractive වාක්‍ය තේරීම මුල් අනුපිළිවෙල
      පවත්වා ගන්නා නමුත් යොමු සාරාංශයේ ව්‍යුහයට සම්පූර්ණයෙන් නොගැලපේ.'
    - 'ලේඛන-මට්ටමේ විශ්ලේෂණය ලේඛන-විශේෂිත රටා හෙළි කරයි: කෙටි චක්‍රලේඛ (පිටු 3 සිට 5) ඉහළ ROUGE ලකුණු ලබා ගනියි
      මන්ද ප්‍රධාන අන්තර්ගත අනුපාතය ඉහළය; දිගු චක්‍රලේඛ (පිටු 10කට වැඩි) අඩු ලකුණු ලබා ගනියි මන්ද සාරාංශ සම්පීඩන
      අනුපාතය ඉහළය. ලේඛන දිග ROUGE ලකුණුවලට බලපාන සාධකයකි.'
    - 'Fallback extractive මාදිලිය විරුද්ධව LLM මාදිලි සංසන්දනය: තක්සේරුව ප්‍රධාන වශයෙන් fallback මාදිලියේ සිදු
      කර නැවත නිපදවිය හැකිබව සහතික කරයි; LLM ප්‍රතිදානය අනිර්ණයාත්මකය. සීමිත LLM මාදිලි පරීක්ෂණ විචල්‍ය ප්‍රතිඵල
      පෙන්වයි: සමහර ලේඛනවල ඉහළ ROUGE, සමහරකදී guardrail ක්‍රියාකාරී වී fallback වෙත ආපසු යාම. ප්‍රාථමික වාර්තාකරණය
      fallback baseline මත පදනම් වේ.'
    - 'ROUGE ලකුණු සන්දර්භීය අර්ථකථනය: ශාස්ත්‍රීය සාරාංශකරණ මිනුම්කෝදණ්ඩ (CNN/DailyMail) ROUGE-1 0.40 සිට 0.45 පරාසය
      extractive ආකෘතිවලට සාමාන්‍යය. EasyCircular අමාත්‍යාංශ චක්‍රලේඛ වසමට සෘජු මිනුම්කෝදණ්ඩයක් නොමැත; ලකුණු අභ්‍යන්තර
      baseline ලෙස ව්‍යාපෘති ගුණාත්මකභාව ලුහුබැඳීමට සේවය කරයි. සන්දර්භ රහිත ලකුණු සංසන්දනය නුසුදුසුය.'
    - 'ROUGE තක්සේරු සීමා පිළිගනු ලැබේ: ලේඛන 6ක නියැදි ප්‍රමාණය සීමිතය (විශාල කෝපස් වඩා දෘඪ ඇස්තමේන්තු සපයයි); යොමු
      සාරාංශ තනි සටහන්කරුවකුගේ (අන්තර්-සටහන්කරු එකඟතාව මනින ලද්දේ නැත); fallback මාදිලිය ප්‍රධාන වශයෙන් තක්සේරු
      කර ඇත. සීමා තිබුණද ROUGE ප්‍රතිඵල නැවත නිපදවිය හැකි ප්‍රමාණාත්මක සාධකයක් සපයයි.'
    - 'ROUGE ප්‍රතිඵල නිබන්ධන දායකත්වය: පද්ධති සාරාංශකරණ හැකියාවේ ප්‍රමාණාත්මක සාධක පෙන්වයි, අනාගත වැඩිදියුණු කිරීම්
      සංසන්දනය කිරීමට baseline මිනුම් ස්ථාපිත කරයි, ස්වයංක්‍රීය තක්සේරු ක්‍රමවේදය ස්ථාපිත කරයි (නැවත නිපදවිය හැකි
      scripts). ROUGE නීතිමය වලංගුතා සාධනයක් ලෙස ඉදිරිපත් නොකරයි; එය ස්වයංක්‍රීය ගුණාත්මකභාව baseline එකකි.'
    - 'ROUGE ලකුණු වැඩිදියුණු කිරීමේ උපාය Phase 6 ට ඇතුළත් වේ: entity-දැනුවත් සාරාංශකරණය (entities අඩංගු වාක්‍යවලට
      ඉහළ බර), යොමු සාරාංශ පෙළගැස්ම (abstractive මාදිලිය යොමු ලිවීමේ ශෛලියට ගැලපීම), ලේඛන-විශේෂිත සීරුමාරුව (චක්‍රලේඛ
      වර්ග අනුව). වැඩිදියුණු කිරීම් උපාය වත්මන් baseline මත ගොඩනැගේ.'
    - 'ROUGE තක්සේරු ස්වයංක්‍රීයකරණයේ වටිනාකම: අතින් සාරාංශ සංසන්දනය ආත්මීයය, කාලය ගත කරයි සහ නැවත නිපදවිය නොහැක.
      ස්වයංක්‍රීය ROUGE තක්සේරු script ක්‍රියාත්මක කිරීම තත්පර කිහිපයකින් සම්පූර්ණ වන අතර ප්‍රතිඵල වෛෂයික, නැවත
      නිපදවිය හැකි සහ සංවර්ධන පුනරාවර්තන හරහා සංසන්දනය කළ හැක. තක්සේරු ස්වයංක්‍රීයකරණය අඛණ්ඩ ගුණාත්මකභාව ලුහුබැඳීම
      සක්‍රීය කරයි.'
    - 'ලේඛන-මට්ටමේ ROUGE විචල්‍යතා විශ්ලේෂණය: ලේඛන 6 හරහා සම්මත විචලනය ROUGE-1 F1 ~0.08, ROUGE-2 F1 ~0.05, ROUGE-L
      F1 ~0.06. මධ්‍යස්ථ විචල්‍යතාව ලේඛන ලක්ෂණ බලපෑම දක්වයි: සමජාතීය නියැදියකට වඩා විවිධ චක්‍රලේඛ වර්ග ඇතුළත් වේ.
      විචල්‍යතා විශ්ලේෂණය තක්සේරු නියැදි විවිධත්වය පිළිබිඹු කරයි.'
    - 'ROUGE precision විරුද්ධව recall විශ්ලේෂණය: extractive සාරාංශ සාමාන්‍යයෙන් ඉහළ precision ලබා ගනියි (තෝරා ගත්
      වාක්‍ය නිවැරදිය) නමුත් අඩු recall (යොමු සාරාංශ ආවරණය සීමිතය). EasyCircular ROUGE F1 සමබර මිනුමක් ලෙස precision
      සහ recall යන දෙකම සලකා බලයි. F1 වාර්තාකරණය තනි මානයකට අධික අවධානය වළක්වයි.'
    - 'ROUGE තක්සේරු නැවත නිපදවිය හැකිබව සත්‍යාපනය: තක්සේරු script එක තුන් වරක් ක්‍රියාත්මක කර ප්‍රතිඵල සමාන බව
      තහවුරු කර ඇත; extractive මාදිලිය නිර්ණයාත්මකය. නැවත නිපදවිය හැකිබව විද්‍යාත්මක දැඩිබවට අත්‍යවශ්‍යය: ඕනෑම පර්යේෂකයකුට
      එකම script එක සහ එකම දත්ත සමඟ සමාන ප්‍රතිඵල ලබා ගත හැක.'
    - 'ROUGE baseline සංසන්දනය: අහඹු වාක්‍ය තේරීමේ baseline (ලේඛනයකට අහඹු වාක්‍ය 3ක්) ROUGE-1 F1 ~0.25 ඇස්තමේන්තුවකි.
      TextRank තේරීම අහඹුට වඩා වැඩිදියුණු කිරීමකි: 0.414 විරුද්ධව 0.25 (ආසන්න වශයෙන් 65.6% සාපේක්ෂ වැඩිදියුණු කිරීම).
      Baseline සංසන්දනය පද්ධති දායකත්වය ප්‍රමාණනය කරයි.'
    - ROUGE ලකුණු පරිපාලන පෙළ සඳහා සාධාරණ baseline එකක් ලෙස අර්ථකථනය කළ හැක. නීතිමය වලංගුතාව මැනීමට ප්‍රමාණවත් නොවේ.
    - Fallback mode reproducibility සඳහා ප්‍රධාන තක්සේරු මාදිලිය ලෙස භාවිත විය. LLM mode Ollama ලබා ගත හැකි බව අනුව
      වෙනස් වේ.
    - Gold briefs 6ක් human-authored බැවින් සංසන්දනය සාධාරණ පදනමක් ඇත.
