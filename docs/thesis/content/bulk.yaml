    - ව්‍යාපෘති අරමුණ ශ්‍රී ලංකා අධ්‍යාපන ඩිජිටල් පරිවර්තනයේ පුළුල් සන්දර්භය තුළ ස්ථානගත කරයි. රජයේ ඩිජිටල්කරණ මුලපිරීම්
      (LankaPay, e-Government සේවා, ඩිජිටල් හැඳුනුම්පත්) සමාන්තර සන්දර්භයක් සපයන අතර අධ්‍යාපන අංශයේ ඩිජිටල් මෙවලම්
