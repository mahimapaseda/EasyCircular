- title: 2.2 සාරාංශකරණය (Summarization)
  id: sum
  level: 2
  paragraphs:
  - 'පෙළ සාරාංශකරණය යනු මුල් ලේඛනයේ ප්‍රධාන තොරතුරු සම්පීඩනය (compress) කර කෙටි ආකෘතියකින් ඉදිරිපත් කිරීමයි. සාරාංශකරණ
    ශිල්පක්‍රම ප්‍රධාන වශයෙන් දෙකකි: නිස්සාරණ සාරාංශකරණය (extractive summarization) එනම් මූලාශ්‍ර වාක්‍ය සෘජුවම
    තෝරා ගැනීම සහ සාරාංශ සාරාංශකරණය (abstractive summarization) එනම් නව වාක්‍ය ජනනය කිරීමයි. අධ්‍යාපන අමාත්‍යාංශ
    චක්‍රලේඛ නීතිමය/පරිපාලන ස්වභාවය නිසා නිස්සාරණ ක්‍රම කරුණු-පිළිබඳ විශ්වාසනීයත්වය (factual fidelity) ආරක්ෂා කරන
    අතර, abstractive ක්‍රම කියවීමේ හැකියාව (readability) වැඩි දියුණු කරන නමුත් hallucination අවදානම වැඩි කරයි.'
  - නිස්සාරණ සාරාංශකරණයේදී ප්‍රස්ථාර-පාදක ක්‍රම (TextRank), integer linear programming සහ ස්නායුක වාක්‍ය වර්ගීකරණ
    ක්‍රම භාවිත කරයි. TextRank ඇල්ගොරිතමය PageRank ඇල්ගොරිතමය යොදා වාක්‍ය වැදගත්කම ලකුණු කරයි. TF-IDF බර තැබීම ප්‍රධාන
    පදාවලි හඳුනා ගනියි. EasyCircular fallback සාරාංශකරණ මාදිලිය (LLM නොමැති විට හෝ guardrail අසාර්ථක විට) TextRank-ආකෘතියේ
    නිස්සාරණ pipeline එකක් භාවිත කරයි. විශේෂයෙන් ඉංග්‍රීසි SpaCy NER අකාර්යක්ෂම වන සිංහල/දෙමළ කොටස් වලට මෙය විශේෂයෙන්
    අදාළ වේ.
  - 'සාරාංශ සාරාංශකරණයේදී sequence-to-sequence ආකෘති (BART, T5, Pegasus) සහ LLM prompting භාවිත කරයි. Map-reduce
    සාරාංශකරණය දිගු ලේඛන හැසිරවීමට භාවිත වේ: ලේඛනය කොටස් (chunks) වලට බෙදා, සෑම කොටසකටම අර්ධ සාරාංශයක් (partial
    summary) ජනනය කර, අර්ධ සාරාංශ එක්කොට අවසාන සාරාංශය නිපදවයි. EasyCircular AI service එකේ /v1/pipeline endpoint
    එක LangChain map-reduce chain එකක් ක්‍රියාත්මක කරයි. chunk size සහ overlap environment variables මගින් වින්‍යාස
    කළ හැකිය.'
  - 'සංයුක්ත සාරාංශකරණය (hybrid summarization) නිස්සාරණ පූර්ව-සැකසුම (ප්‍රධාන වාක්‍ය තේරීම, entity anchoring) සහ
    abstractive පිරිපහදුව එකට සංයුක්ත කරයි. EasyCircular ප්‍රවේශය: (1) SpaCy NER මගින් entities නිස්සාරණය කර, (2)
    LLM prompt එකේ entities anchor කර, (3) LLM abstractive සාරාංශයක් ජනනය කර, (4) පසු-සැකසුම් guardrails දින සත්‍යාපනය
    කර, (5) අසාර්ථක අවස්ථාවල නිස්සාරණ fallback ප්‍රතිඵල ලබා දෙයි. මෙම pipeline එකේ ROUGE තක්සේරු macro F1 ලකුණු
    (ROUGE-1: 0.414, ROUGE-2: 0.215, ROUGE-L: 0.292) fallback මාදිලියේ මනිනු ලැබ ඇත.'
  - සාරාංශකරණ ගුණාත්මකභාවය තක්සේරු කිරීමේදී ස්වයංක්‍රීය මිනුම් (ROUGE, BLEU, METEOR) සහ මානව තක්සේරුව (කියවීමේ හැකියාව,
    නිවැරදිබව, සම්පූර්ණත්වය) සංයුක්ත කිරීම හොඳම පරිචය (best practice) ලෙස පිළිගැනේ. ROUGE n-gram overlap මනින අතර,
    නීතිමය ලේඛන වල නිවැරදි phrase matching තීරණාත්මක වන බැවින් ROUGE-2 (bigram overlap) විශේෂයෙන් අදාළ වේ. මානව
    තක්සේරුව UAT සැසිවලදී පාසල් කාර්ය මණ්ඩලය කරුණු නිවැරදිබව ශ්‍රේණිගත කරන අතර, නිබන්ධනය ඉදිරිපත් කරන විට UAT pending
    තත්ත්වය අවංකව වාර්තා කරයි.
  bullets: []
  numbered: []
  figures: []
- title: 2.3 නාමිත සංචිත හඳුනා ගැනීම (NER) සහ SpaCy
  id: ner
  level: 2
  paragraphs:
  - නාමිත සංචිත හඳුනා ගැනීම (Named Entity Recognition, NER) යනු ව්‍යුහගත නොවූ පෙළ තුළ පූර්ව-නිර්වචිත කාණ්ඩ වන පුද්ගලයන්,
    සංවිධාන, දින, ස්ථාන සහ නීතිමය සම්බන්ධතා වලට අයත් token spans හඳුනා ගැනීම සහ label කිරීමයි. පරිපාලන ලේඛනවල NER
    මගින් තීරණාත්මක දින (කාලසීමා, ක්‍රියාත්මක වන දින), නිකුත් කරන සංවිධාන (අධ්‍යාපන අමාත්‍යාංශය, ජාතික අධ්‍යාපන
    ආයතනය), නීතිමය සම්බන්ධතා (අධ්‍යාපන ආඥාපනත වගන්ති) සහ ක්‍රියාකාරී ක්‍රියාපද (shall, must, required) නිස්සාරණය
    කිරීමට හැකි වේ.
  - 'SpaCy යනු Python NLP පුස්තකාලයක් වන අතර නිෂ්පාදන-සුදානම් (production-ready) pipelines සපයයි. en_core_web_sm
    ඉංග්‍රීසි ආකෘතිය PERSON, ORG, GPE, DATE, MONEY සහ LAW (custom patterns) entity වර්ග හඳුනා ගනියි. EasyCircular
    AI service එක SpaCy pipeline එක දිගු කර LAW entity වර්ගය regex patterns (උදා: ''Section \d+'', ''Chapter \d+'')
    සහ DATE normalization යොදයි. නිස්සාරණය කළ entities MongoDB circular ලේඛනයේ ව්‍යුහගත JSON field එකක ගබඩා කර frontend
    එකේ highlight ලෙස දර්ශනය කරයි.'
  - නීති-පාදක entity patterns පරිපාලන ලේඛනවල වසම්-විශේෂිත පදාවලි හැසිරවීමට SpaCy සංඛ්‍යානමය NER එකට අනුපූරක (supplement)
    වේ. අධ්‍යාපන අමාත්‍යාංශ චක්‍රලේඛවල 'Circular No. XX/YYYY', 'Ministry of Education', 'National Institute of Education'
    වැනි නැවත නැවත ඇති patterns custom EntityRuler component එකක් හරහා ගැලපේ. ක්‍රියාකාරී අයිතම (action items) අවශ්‍ය
    වාක්‍ය ('සියලුම විදුහල්පතිවරුන්ට උපදෙස් දෙනු ලැබේ...', 'පාසල් සහතික කළ යුතුය...') වාක්‍ය-මට්ටමේ heuristics මගින්
    හඳුනා ගෙන වෙනම ලැයිස්තුවක ඉදිරිපත් කරයි.
  - 'NER නිවැරදිබව ඉංග්‍රීසි අධ්‍යාපන අමාත්‍යාංශ චක්‍රලේඛවල පිළිගත හැකි ප්‍රතිඵල ලබා දෙන අතර, සිංහල/දෙමළ කොටස් SpaCy
    ඉංග්‍රීසි ආකෘතිය මගින් හැසිරවීමට නොහැකිය. Phase 5 විසඳුම ලෙස: සිංහල/දෙමළ පෙළ OCR මගින් නිස්සාරණය කර නිස්සාරණ
    සාරාංශය සපයන අතර, ඉංග්‍රීසි කොටස් සඳහා සම්පූර්ණ NER සහ abstractive pipeline යොදයි. Phase 6 අනාගත කාර්යයක් ලෙස
    සිංහල NER ආකෘති (උදා: fine-tuned multilingual BERT) ඒකාබද්ධ කිරීම සැලසුම් කර ඇත.'
  bullets: []
  numbered: []
  figures: []
- title: 2.4 ROUGE මගින් තක්සේරුව
  id: rouge
  level: 2
  paragraphs:
  - ROUGE (Recall-Oriented Understudy for Gisting Evaluation) සාරාංශකරණ ගුණාත්මකභාවය ස්වයංක්‍රීයව තක්සේරු කිරීමට
    පුළුල් ලෙස භාවිත වන මිනුම් පවුලකි. ROUGE-N මගින් ජනනය කළ සාරාංශය සහ මිනිසා විසින් ලියන ලද යොමු සාරාංශය අතර n-gram
    overlap (unigram ROUGE-1, bigram ROUGE-2) මනියි. ROUGE-L මගින් දිගම පොදු උප-අනුක්‍රමය (longest common subsequence,
    LCS) පදනම් F1 ලකුණ ගණනය කරන අතර, වචන අනුපිළිවෙල සංරක්ෂණය (word order preservation) ග්‍රහණය කරයි.
  - 'EasyCircular තක්සේරු දත්ත කට්ටලය අධ්‍යාපන අමාත්‍යාංශ නියමු චක්‍රලේඛ 6ක් (IDs: 10-2026, 12-2026, ආදිය) මිනිසා
    විසින් රචනා කළ යොමු සාරාංශ සමඟ ඇතුළත් වේ. scripts/evaluate-rouge.mjs script එක ජනනය කළ සාරාංශ යොමු සාරාංශ සමඟ
    සංසන්දනය කර rouge-report.json නිපදවයි. සාමාන්‍යගත ප්‍රතිඵල (macro-averaged): ROUGE-1 F1 අගය 0.414, ROUGE-2 F1
    අගය 0.215, ROUGE-L F1 අගය 0.292 (fallback/extractive මාදිලිය). LLM මාදිලියේ ප්‍රතිඵල Ollama ලබා ගත හැකි බව අනුව
    වෙනස් වේ. නැවත නිපදවිය හැකි බව (reproducibility) සඳහා තක්සේරුව ප්‍රධාන වශයෙන් fallback මාදිලියේ සිදු කරන ලදී.'
  - 'ROUGE සීමාවන්: n-gram overlap අර්ථමය සමානතාවය (semantic equivalence) ග්‍රහණය නොකරයි. නිවැරදි ලෙස paraphrase
    කළ සාරාංශ අඩු ලකුණු ලබා ගත හැක. නීතිමය ලේඛනවල ROUGE ඉහළ ලකුණු කරුණු නිවැරදිබව (factual accuracy) සහතික නොකරයි.
    මානව සමාලෝචනය අත්‍යවශ්‍ය වේ. නිබන්ධන වාර්තාව ROUGE ප්‍රතිඵල ස්වයංක්‍රීය baseline ලෙස ඉදිරිපත් කරන අතර, නීතිමය
    වලංගුතා සාධනය ලෙස ප්‍රකාශ නොකරයි (පරිච්ඡේදය 6 සීමාවන්).'
