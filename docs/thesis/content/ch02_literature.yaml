title: 2. වෙළඳපොළ පර්යේෂණ සහ සාහිත්‍ය සමාලෝචනය (Market Research and Literature Review)
sections:
- title: 2.1 ස්වභාවික භාෂා සැකසුම (NLP) සහ Transformer ආකෘති
  id: nlp
  level: 2
  paragraphs:
  - ස්වභාවික භාෂා සැකසුම (Natural Language Processing, NLP) යනු මිනිස් භාෂාව පරිගණකයට තේරුම් ගත හැකි ආකෘතියකට පරිවර්තනය
    කර, විශ්ලේෂණය කර, අවබෝධ කර ගෙන ජනනය කිරීමේ විද්‍යාවයි. පරිපාලන ලේඛන වන නීතිමය චක්‍රලේඛ, ප්‍රතිපත්ති සටහන් සහ
    නියාමන දැනුම්දීම් සඳහා NLP යෙදීමේදී පෙළ නිස්සාරණය (text extraction), සංචිත හඳුනා ගැනීම (entity recognition),
    සාරාංශකරණය (summarization), වර්ගීකරණය (classification) සහ ප්‍රශ්නෝත්තර (question answering) වැනි කාර්යයන් අදාළ
    වේ. අධ්‍යාපන අමාත්‍යාංශ චක්‍රලේඛ ඉංග්‍රීසි, සිංහල සහ දෙමළ මිශ්‍ර බහුභාෂික පරිපාලන ලේඛන වන බැවින් NLP pipeline
    නිර්මාණය කිරීමට අභියෝගයක් ඉදිරිපත් කරයි.
  - සාම්ප්‍රදායික NLP ප්‍රවේශයන් නීති-පාදක පද්ධති (rule-based systems), සංඛ්‍යානමය ආකෘති (n-grams, TF-IDF) සහ යන්ත්‍ර
    ඉගෙනුම් වර්ගීකාරක (SVM, CRF) මත යැපුණු අතර, නාමිත සංචිත හඳුනා ගැනීම සහ සාරාංශකරණය සඳහා අතින් නිර්මාණය කළ විශේෂාංග
    (hand-crafted features) අවශ්‍ය විය. මෙම ප්‍රවේශයන් විශාල-පරිමාණ ලේඛන එකතු කිරීම් වල පරිමාණනය (scalability) සීමා
    කළ අතර, වසම්-විශේෂිත වචන මාලාව (අධ්‍යාපන ප්‍රතිපත්ති පදාවලි) හැසිරවීම දුෂ්කර විය.
  - 2017 වසරේ Vaswani et al. විසින් හඳුන්වා දුන් Transformer ගෘහනිර්මාණ ශිල්පය self-attention mechanism එක මගින්
    අනුක්‍රමික දත්ත (sequential data) සමාන්තරව සැකසීමට හැකි වීම නිසා NLP ක්ෂේත්‍රය විප්ලවකාරී ලෙස වෙනස් කළේය. Transformer
    ආකෘති දිගු-පරාසයේ යැපීම් (long-range dependencies) ග්‍රහණය කිරීමට RNN/LSTM ආකෘතිවලට වඩා effective වන අතර, BERT
    (Bidirectional Encoder Representations from Transformers), GPT (Generative Pre-trained Transformer) සහ T5 (Text-to-Text
    Transfer Transformer) වැනි පූර්ව-පුහුණු ආකෘති downstream කාර්යයන් සඳහා fine-tune කිරීමට හැකි විය.
  - BERT-ආකෘතියේ ආකෘති ද්විදිශා සන්දර්භය (bidirectional context) භාවිත කර පෙළ වර්ගීකරණය, NER සහ ප්‍රශ්නෝත්තර කාර්යයන්
    සඳහා fine-tune කළ හැක. GPT-ආකෘතියේ autoregressive ආකෘති abstractive summarization සහ සංවාද වැනි පෙළ ජනනය කාර්යයන්
    සඳහා සුදුසු වේ. EasyCircular ව්‍යාපෘතියේ සාරාංශකරණ pipeline එක LangChain framework එක හරහා map-reduce strategy
    එකක් භාවිත කර LLM (Ollama local llama3.2:3b) call කරයි. NER කාර්යය සඳහා SpaCy en_core_web_sm ආකෘතිය ඉංග්‍රීසි
    entity labels (DATE, ORG, LAW) හඳුනා ගනියි.
  - 'විශාල භාෂා ආකෘති (Large Language Models, LLMs) billions of parameters සහ web-scale corpora මත පූර්ව-පුහුණු
    වන අතර, few-shot prompting මගින් වසම්-විශේෂිත කාර්යයන් ඉටු කිරීමට හැකි වේ. එහෙත් LLMs hallucination අවදානමක්
    ඉදිරිපත් කරයි, එනම් මූලාශ්‍ර ලේඛනයේ නොමැති කරුණු ජනනය කිරීමයි. නීතිමය/පරිපාලන ලේඛනවල වැරදි දින හෝ ව්‍යාජ අනුකූලතා
    අවශ්‍යතා විනාශකාරී ප්‍රතිවිපාක ගෙන ඒමට හැකිය. EasyCircular මෙම අවදානම අවම කිරීමට ආරක්ෂක පියවර (guardrails) ක්‍රියාත්මක
    කරයි: සාරාංශ output එකේ දින මුල් පෙළෙහි සත්‍යාපනය කර, සත්‍යාපනය නොකළ දින ඉවත් කර නිස්සාරණ fallback භාවිත කරයි.'
  - සිංහල NLP පර්යේෂණ සංසන්දනාත්මක ලෙස සම්පත්-හිඟ (under-resourced) තත්ත්වයේ පවතී. සිංහල tokenizers, POS taggers
    සහ NER ආකෘති ඉංග්‍රීසි ප්‍රතිරූපයන්ට සාපේක්ෂව සීමිත ප්‍රවේශ්‍යතාවයක් (limited availability) ඇත. ශ්‍රී ලංකා රජයේ
    ලේඛන ත්‍රිභාෂික (සිංහල, දෙමළ, ඉංග්‍රීසි) ස්වභාවය OCR භාෂා ඇසුරුම් (Tesseract sin, eng, tam) අවශ්‍ය කරයි. Phase
    5 ක්‍රියාත්මක කිරීමේදී ඉංග්‍රීසි NER සහ සිංහල/දෙමළ නිස්සාරණ සාරාංශකරණය (sentence selection) සංයුක්ත ප්‍රවේශයක්
    (hybrid approach) අනුගමනය කර, සම්පූර්ණ බහුභාෂික NLP Phase 6 අනාගත කාර්යයක් ලෙස කල් දමා ඇත.
