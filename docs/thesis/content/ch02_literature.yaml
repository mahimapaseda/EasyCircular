      - MOE circular comprehension
      - General assistant
      - Legal contract review
- title: 2.6 ප්‍රාථමික වෙළඳපොළ පර්යේෂණ සමීක්ෂණය (n=41)
  id: survey
  level: 2
  paragraphs:
  - 'EasyCircular අවශ්‍යතා තහවුරු කිරීමට Google Forms මාර්ගගත සමීක්ෂණයක් 2026 පෙබරවාරි සිට මාර්තු දක්වා බෙදා හැර
    වලංගු ප්‍රතිචාර 41ක් එකතු කරන ලදී. සහභාගීවන්නන්: ගුරුවරු 30 (73.2%), විදුහල්පතිවරු 8 (19.5%), අධ්‍යාපන නිලධාරීන්
    3 (7.3%). සමීක්ෂණය සිංහල/ඉංග්‍රීසි මිශ්‍ර ප්‍රශ්න මගින් චක්‍රලේඛ කියවීමේ වාරගණන (frequency), අවබෝධ දුෂ්කරතාව,
    අපේක්ෂිත විශේෂාංග, AI කැමැත්ත සහ රහස්‍යතා ගැටලු ආවරණය කරන ලදී.'
  - 'ප්‍රධාන සොයාගැනීම 1: respondents 97.6% (41 දෙනාගෙන් 40) අධ්‍යාපන අමාත්‍යාංශ චක්‍රලේඛ සඳහා සාරාංශ විශේෂාංගයක්
    (summary feature) අවශ්‍ය බව පෙන්වා දුන්නේය. එක් respondent පමණක් සාරාංශය අනවශ්‍ය ලෙස සලකුණු කළේය. මෙය ප්‍රධාන
    value proposition එක තහවුරු කරයි.'
  - 'ප්‍රධාන සොයාගැනීම 2: respondents 68.3% (41 දෙනාගෙන් 28) AI-බලගැන්වූ පද්ධතියක් භාවිත කිරීමට කැමති නොවීය (No).
    කැමති respondents 13 (31.7%). රහස්‍යතාව, නිවැරදිබව පිළිබඳ අවිශ්වාසය සහ AI සමඟ නුහුරුකම ප්‍රධාන හේතු විය. EasyCircular
    local Ollama deployment සහ human-in-the-loop design මෙම ගැටලු විසඳීමට අරමුණු කරයි.'
  - 'ප්‍රධාන සොයාගැනීම 3: respondents 78% (41 දෙනාගෙන් 32) entity highlighting (දින, නම්, නීති) ඉතා ප්‍රයෝජනවත්
    (very useful) ලෙස ශ්‍රේණිගත කළහ. NER විශේෂාංගය ඉහළ ප්‍රමුඛතා අවශ්‍යතාවයක් ලෙස තහවුරු විය.'
  - 'ප්‍රධාන සොයාගැනීම 4: කියවීමේ දුෂ්කරතා අතර ''ඉතා දිගු'' (Too long) respondents 21 දෙනෙකු, ''කාලය මදි'' (Lack
    of time) ද්විතීයික, ''සංකීර්ණ භාෂාව'' (Complex language) තෘතීයික ලෙස හඳුනා ගන්නා ලදී. රහස්‍යතා ගැටලුව respondents
    17 දෙනෙකු AI adoption බාධකයක් ලෙස උපුටා දැක්වීය.'
  - 'ප්‍රධාන සොයාගැනීම 5: respondents 78% EasyCircular වැනි පද්ධතියක් වැඩ කාර්යක්ෂමතාව (work efficiency) වැඩි කරන
    බව විශ්වාස කළහ. භූමිකා බෙදීම (ගුරුවරු ප්‍රමුඛ) පෙන්වන්නේ ප්‍රාථමික පරිශීලකයන් පන්තිකාමර-මට්ටමේ අධ්‍යාපකයන් බවයි.'
  - පහත ප්‍රස්ථාර (රූප 2.1 සිට 2.10 දක්වා) සමීක්ෂණ ප්‍රතිචාර දෘශ්‍යමාන කරයි. දත්ත CSV exports docs/survey/ නාමාවලියේ
    ගබඩා කර ඇති අතර, ප්‍රස්ථාර ජනනය scripts නැවත නිපදවිය හැකිය.
