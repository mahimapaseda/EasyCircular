    - - MOE PDF upload + OCR
      - Yes (pdfplumber, Tesseract sin+eng+tam)
      - Partial (file upload limits)
      - Enterprise scan pipelines
    - - Structured entity output
      - Yes (DATE, ORG, LAW, actions)
      - Unstructured text
      - Contract clause extraction
    - - Hallucination guardrails
      - Date verification + fallback
      - Limited / user responsibility
      - Domain-trained, audited
    - - Data privacy
      - Local Ollama option; self-hosted
      - Cloud API; data sent externally
      - On-premise enterprise
    - - Human-in-the-loop text edit
      - Built-in review step
      - Chat re-prompt only
      - Annotation workflows
