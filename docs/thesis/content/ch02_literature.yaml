- title: 2.7 පර්යේෂණ පරතරය (Research Gap)
  id: gap
  level: 2
  paragraphs:
  - 'සාහිත්‍ය සමාලෝචනය සහ ප්‍රාථමික සමීක්ෂණය සංශ්ලේෂණය කිරීමෙන් පසු පහත පර්යේෂණ පරතරය හඳුනා ගන්නා ලදී: ශ්‍රී ලංකා
    අධ්‍යාපන අමාත්‍යාංශ චක්‍රලේඛ වසම සඳහා ඒකාබද්ධ PDF ආයාත කිරීම, OCR (ත්‍රිභාෂික), මිනිසා-සමාලෝචිත පෙළ නිස්සාරණය,
    NER, ආරක්ෂිත සාරාංශකරණය සහ ව්‍යුහගත වෙබ් UI ලබා දෙන open-source, self-hostable පද්ධතියක් නොමැත.'
  - 'සාමාන්‍ය LLM chatbots නම්‍යශීලී (flexible) වුවද ආයතනික adoption බාධක නිර්මාණය කරයි: රහස්‍යතාව (68.3% willing
    නොවීම), ව්‍යුහගත නොවූ output, MOE-විශේෂිත guardrails නොමැති බව. Enterprise නීතිමය AI මෙවලම් ශ්‍රී ලංකාවේ පාසල්
    සඳහා මිල-ගණන් දරා ගත නොහැකි අතර අධ්‍යාපන චක්‍රලේඛ සඳහා tune කර නොමැත.'
  - EasyCircular මෙම පරතරය විසඳීමට Agile-developed, ත්‍රිස්ථර, Docker-deployable නිපැයුමක් ලෙස ඉදිරිපත් කර, තක්සේරුව
    (ROUGE, ස්වයංක්‍රීය පරීක්ෂණ, pending UAT) විනිවිදභාවය (transparency) සමඟ වාර්තා කරයි. සිංහල/දෙමළ සම්පූර්ණ NLP
    පිළිගත් සීමාවක් ලෙස පවතින අතර Phase 6 අනාගත කාර්යයන් මෙහෙයවයි.
