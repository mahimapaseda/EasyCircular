- title: 2.5 EasyCircular, ChatGPT සහ නීතිමය ලේඛන AI මෙවලම් සංසන්ධනය
  id: compare
  level: 2
  paragraphs:
  - අධ්‍යාපන අමාත්‍යාංශ චක්‍රලේඛ සැකසීම සඳහා පවතින විසඳුම් අර්ධ පිළිතුරු සපයන නමුත්, purpose-built ඒකාබද්ධ workflow
    එකක් කිසිවක් ඉදිරිපත් නොකරයි. වගුව 2.1 මගින් EasyCircular, සාමාන්‍ය-කාර්ය ChatGPT සහ නීතිමය ලේඛන AI මෙවලම් (Kira,
    Luminance-ආකෘතියේ පද්ධති) ප්‍රධාන මානයන් අනුව සංසන්දනය කරයි. EasyCircular පද්ධතිය අධ්‍යාපන අමාත්‍යාංශ චක්‍රලේඛ
    සඳහා විශේෂයෙන් නිර්මාණය කර ඇති අතර, local Ollama LLM deployment, content-hash caching, human-in-the-loop text
    review සහ hallucination guardrails වැනි විශේෂාංග ChatGPT හෝ enterprise නීතිමය AI මෙවලම් වල දක්නට නොලැබේ.
  - ChatGPT සහ Gemini වැනි සාමාන්‍ය-කාර්ය chatbots චක්‍රලේඛ upload කිරීමට හැකි වුවද, hallucination අවදානම, දත්ත
    රහස්‍යතා ගැටලු (data privacy concerns), ව්‍යුහගත output නොමැති බව සහ ශ්‍රී ලංකාවේ අධ්‍යාපන framework එකට fine-tune
    නොවීම නිසා ආයතනික (institutional) adoption අඩු වේ. සමීක්ෂණ ප්‍රතිඵලවලින් 68.3% (28/41) AI පද්ධතියක් භාවිත කිරීමට
    willing නොවූ අතර, රහස්‍යතා ගැටලු (respondents 17ක්) ප්‍රධාන බාධකයක් ලෙස හඳුනා ගන්නා ලදී. EasyCircular local
    deployment path එක මෙම ගැටලුවට සෘජුවම ප්‍රතිචාර දක්වයි.
  - Enterprise නීතිමය AI මෙවලම් (Kira, Luminance) ගිවිසුම් විශ්ලේෂණය සඳහා නිර්මාණය කර ඇති අතර, ශ්‍රී ලංකාවේ පාසල්වලට
    මිල-ගණන් දරා ගත නොහැකි (cost-prohibitive) enterprise licenses අවශ්‍ය වේ. මෙම මෙවලම් අධ්‍යාපන චක්‍රලේඛ සඳහා tune
    කර නොමැති අතර, සිංහල/දෙමළ OCR සහාය සීමිතය. EasyCircular මෙම පරතරය පිරවීමට open-source stack එකකින් (Next.js,
    Express.js, FastAPI, MongoDB, Ollama) self-hostable විසඳුමක් ලෙස නිර්මාණය කර ඇත.
