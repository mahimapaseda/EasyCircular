- title: A.2 පස්-අදියර ක්‍රියාත්මක කිරීමේ සැලැස්ම
  id: phases
  level: 3
  paragraphs:
  - Table A.1 මගින් ක්‍රියාත්මක කිරීමේ අදියර පහ, ඒවායේ කාලසීමා, ප්‍රධාන ප්‍රතිඵල සහ exit gates සාරාංශගත කර ඇත. කාලසටහන
    IMPLEMENTATION_PLAN.md සහ contextual report හි පරිච්ඡේදය 3 සමඟ අනුකූල වේ.
  - 'EasyCircular ක්‍රියාත්මක කිරීම පස්-අදියර සැලැස්මක් අනුගමනය කරන අතර එක් එක් අදියර නිශ්චිත බෙදාහැරීම්, කාල ඇස්තමේන්තු
    සහ පිටවීමේ නිර්ණායක නිර්වචනය කර ඇත. Phase 1: Foundation (සති 1 සිට 2) මූලික යටිතල පහසුකම් ස්ථාපිත කරයි; Phase
    2: Ingestion (සති 3 සිට 4) PDF pipeline ගොඩනගයි; Phase 3: AI Core (සති 5 සිට 6) NER සහ සාරාංශකරණය ක්‍රියාත්මක
    කරයි; Phase 4: MVP (සති 7 සිට 8) ඒකාබද්ධ වෙබ් යෙදුම බෙදා හරියි; Phase 5: Validate and Release (සති 9 සිට 10)
    පරීක්ෂණ සහ තක්සේරුව සිදු කරයි.'
  - 'Phase 1 (Foundation) බෙදාහැරීම්: ව්‍යාපෘති repository පිහිටුවීම, Docker Compose වින්‍යාසය (Next.js, Express,
    FastAPI, MongoDB containers), MongoDB schema නිර්මාණය, JWT සත්‍යාපන ක්‍රියාත්මක කිරීම, සියලු ස්ථරවල health check
    endpoints සහ මූලික CI pipeline පිහිටුවීම. Phase 1 සත්‍යාපන script එක health endpoints පරීක්ෂා කර දත්ත සමුදා
    සම්බන්ධතාව සත්‍යාපනය කරයි. Foundation අදියර පසුකාලීන අදියරවලට ස්ථායී වේදිකාවක් සපයයි.'
  - 'Phase 2 (Ingestion) බෙදාහැරීම්: PDF උඩුගත API (multer ගොනු හැසිරවීම, ප්‍රමාණ වලංගුකරණය), pdfplumber පෙළ නිස්සාරණය,
    PyMuPDF fallback නිස්සාරණය, Tesseract OCR ඒකාබද්ධ කිරීම (sin+eng+tam භාෂා ඇසුරුම්), human-in-the-loop පෙළ සංස්කරණ
    API (PATCH endpoint) සහ MongoDB හි නිස්සාරණ තත්ත්ව ලුහුබැඳීම. Phase 2 විවිධ PDF වර්ග (ඩිජිටල් උපත, ස්කෑන්, මිශ්‍ර)
    සාර්ථකව නිස්සාරණය කරන බව සත්‍යාපනය කරයි.'
  - 'Phase 3 (AI Core) බෙදාහැරීම්: SpaCy NER pipeline (en_core_web_sm සහ අභිරුචි EntityRuler), LangChain map-reduce
    සාරාංශකරණ chain එක, Ollama දේශීය LLM ඒකාබද්ධ කිරීම, hallucination guardrails (දින සත්‍යාපනය, extractive fallback),
    ක්‍රියාකාරී අයිතම නිස්සාරණ heuristics, content hash caching යාන්ත්‍රණය සහ AI සේවා ටෝකන් සත්‍යාපනය. Phase 3 guardrails
    pytest පරීක්ෂණ කට්ටලයෙන් සත්‍යාපනය කරයි.'
  - 'Phase 4 (MVP) බෙදාහැරීම්: ඒකාබද්ධ වෙබ් යෙදුම (චක්‍රලේඛ ලැයිස්තුව, උඩුගත කිරීම, නිස්සාරණය, සංස්කරණය, සැකසුම්
    කාර්යප්‍රවාහය), frontend entity දර්ශනය (වර්ණ-කේතිත highlights), සාරාංශ සහ ක්‍රියාකාරී අයිතම දර්ශනය, ජංගම-ප්‍රතිචාරී
    නිර්මාණය, අමාත්‍යාංශ කැටලොග් ආයාත endpoint සහ rate limiting ක්‍රියාත්මක කිරීම. Phase 4 අන්තයේ සිට අන්තයට කාර්යප්‍රවාහය
    සම්පූර්ණ පරිශීලක ගමන් මාර්ගය පෙන්වයි. Phase 4 සත්‍යාපන script එක ඒකාබද්ධ ක්‍රියාකාරීත්වය පරීක්ෂා කරයි.'
  - 'Phase 5 (Validate and Release) බෙදාහැරීම්: ROUGE තක්සේරුව (නියමු චක්‍රලේඛ 6ක්, macro-averaged ලකුණු), විස්තීර්ණ
    pytest කට්ටලය (AI සේවා පරීක්ෂණ 91ක්), backend පරීක්ෂණ කට්ටලය (පරීක්ෂණ 13ක්), අදියර සත්‍යාපන scripts ලේඛනගත කිරීම,
