  - 'අදියර සංක්‍රමණ නිර්ණායක විධිමත් ලේඛනගත කිරීම: එක් එක් අදියර සම්පූර්ණ කිරීමේ ලැයිස්තුව, බෙදාහැරීම් සමාලෝචනය,
