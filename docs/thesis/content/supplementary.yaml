  numbered: []
  figures: []
- title: A.1 Agile SDLC තෝරා ගැනීමේ තාර්කිකත්වය
  id: agile
  level: 3
  paragraphs:
  - EasyCircular මෘදුකාංග සංවර්ධනය Agile Software Development Life Cycle (SDLC) ක්‍රමවේදය අනුගමනය කරමින් ක්‍රියාත්මක
    කරන ලදී. සම්ප්‍රදායික Waterfall ආකෘතිය අවශ්‍යතා මුල් අවස්ථාවේදීම සම්පූර්ණයෙන් නිර්ණය කර, අදියර අනුපිළිවෙලින්
    සම්පූර්ණ කර, ව්‍යාපෘතිය අවසානයේ පමණක් නිපැයුම ලබා දෙයි. එහෙත් AI සහ NLP ව්‍යාපෘතිවල අවශ්‍යතා (LLM ගුණාත්මකභාවය,
    OCR නිරවද්‍යතාව, පරිශීලක පිළිගැනීම) මුල් අවස්ථාවේ අනිශ්චිත වන බැවින් එවැනි ආකෘතියක් නොසුදුසු වේ.
  - Agile ක්‍රමවේදය පුනරාවර්තන සංවර්ධනය, කෙටි sprint කාලසීමා (සති 1-2), නිරන්තර stakeholder ප්‍රතිචාර සහ ක්‍රියාකාරී
    මෘදුකාංග නිතර ලබා දීම අවධාරණය කරයි. EasyCircular ව්‍යාපෘතියේ සති 10ක නිබන්ධන කාලසීමාව අදියර 5ක් හරහා sprint
    8ක් ලෙස බෙදා, එක් එක් sprint සඳහා නිශ්චිත deliverable එකක් සහ phase exit gate එකක් නිර්ණය කරන ලදී.
  - 'අදියර 1 (Foundation, සතිය 1): Docker Compose පරිසරය, health endpoints සහ service scaffolding. අදියර 2 (Ingestion,
    සති 2-3): PDF upload, පෙළ නිස්සාරණය, OCR සහ human edit UI. අදියර 3 (AI Core, සති 4-6): NER, සාරාංශකරණය සහ guardrails.
    අදියර 4 (MVP, සතිය 7): authentication, ආරක්ෂාව සහ demo-ready නිපැයුම. අදියර 5 (Validate and Release, සති 8-10):
    ROUGE තක්සේරුව, පරීක්ෂණ, UAT සැලසුම සහ ලේඛනගත කිරීම.'
  - Agile තෝරා ගැනීමේ තාර්කිකත්වය පහත කරුණු මත පදනම් විය. පළමුව, LLM output ගුණාත්මකභාවය පුරෝකථනය කළ නොහැකි බැවින්
    මුල් අවස්ථාවේම prototype එකක් සෑදීම අත්‍යවශ්‍ය විය. දෙවනුව, සැබෑ MOE PDF ලේඛන මත OCR පරීක්ෂා කිරීමෙන් පමණක්
    නිස්සාරණ ගැටලු හඳුනාගත හැකි විය. තෙවනුව, සමීක්ෂණ ප්‍රතිචාර (68.3% AI භාවිතයට කැමති නොවීම) ව්‍යාපෘතිය මධ්‍යයේදී
    privacy සහ දේශීය LLM තීරණවලට බලපෑම් කළේය. සිව්වනුව, supervisor සමාලෝචන මගින් scope සීමා කිරීමට ඉඩ ලැබුණි - උදාහරණයක්
    ලෙස bilingual UI අදියර 6 වෙත කල් දමන ලදී.
  - 'Scrum ආශ්‍රිත ceremonies ව්‍යාපෘතියට ගැලපෙන ලෙස අනුවර්තනය කරන ලදී: sprint planning (IMPLEMENTATION_PLAN.md
    මගින් කාර්ය බෙදීම), දෛනික ප්‍රගති නිරීක්ෂණය (Git commits සහ verify scripts), sprint review (phase exit gate
    සත්‍යාපනය) සහ retrospective (commit messages සහ plan යාවත්කාලීන කිරීම්). Product Owner සහ Scrum Master වැනි
    විධිමත් Scrum භූමිකා පවරා නොමැත - මෙය එක් සංවර්ධකයෙකු සහ stakeholder ලෙස supervisor සිටින ව්‍යාපෘතියකි.'
  - 'Agile මගින් අවදානම් අවම කිරීම: අසාර්ථක LLM ඇමතුම් fallback මාදිලිය මගින් මුල් අවස්ථාවේම හඳුනාගත් අතර, PDF නිස්සාරණ
    ගැටලු AI pipeline එක ගොඩනැගීමට පෙර අදියර 2 හිදී විසඳන ලදී. Authentication තක්සේරුවට පෙර අදියර 4 හිදී එකතු කිරීමෙන්
    පසුව සිදු කිරීමට වන ආරක්ෂක rework වළක්වා ගන්නා ලදී. Phase exit gates මගින් නිශ්චිත සම්පූර්ණ කිරීමේ නිර්ණායක
    නිර්ණය කර අකාලයේ ඊළඟ අදියරට යාම වළක්වන ලදී.'
  - මෘදුකාංග සංවර්ධන ජීවන චක්‍ර (Software Development Life Cycle, SDLC) ක්‍රමවේද තේරීම ව්‍යාපෘති සාර්ථකත්වයට සැලකිය
    යුතු සාධකයකි. සාම්ප්‍රදායික Waterfall ක්‍රමවේදය රේඛීය අනුක්‍රමික අදියර (අවශ්‍යතා, නිර්මාණය, ක්‍රියාත්මක කිරීම,
    පරීක්ෂණ, යෙදවීම) අනුගමනය කරන අතර අවශ්‍යතා මුලින්ම සම්පූර්ණයෙන් නිර්වචනය කළ යුතු යැයි උපකල්පනය කරයි. EasyCircular
    ව්‍යාපෘතියේ අවශ්‍යතා සමීක්ෂණ සොයාගැනීම් සමඟ පරිණාමය වූ අතර (පුනරාවර්තනීය සොයා ගැනීම) AI pipeline නිර්මාණය පර්යේෂණාත්මක
    ස්වභාවයක් දරයි; දෘඪ Waterfall ප්‍රවේශය නුසුදුසු වේ.
  - 'Agile ක්‍රමවේදය පුනරාවර්තනීය හා වර්ධක සංවර්ධනය ප්‍රවර්ධනය කරයි: ක්‍රියාකාරී මෘදුකාංග නිතර බෙදා හැරීම, වෙනස්
    වන අවශ්‍යතා උපයෝගී කර ගැනීම, පාර්ශ්වකරු ප්‍රතිපෝෂණය අඛණ්ඩව ඒකාබද්ධ කිරීම සහ තාක්ෂණික අවදානම් මුල් පුනරාවර්තනවලදී
    ආමන්ත්‍රණය කිරීම. EasyCircular තනි-සංවර්ධක ව්‍යාපෘතිය Agile මූලධර්ම අනුවර්තනය කරයි: කෙටි පුනරාවර්තන (අදියර),
    ක්‍රියාකාරී වර්ධක (එක් එක් අදියර බෙදාහැරීම) සහ අඛණ්ඩ ඒකාබද්ධ කිරීම (ස්වයංක්‍රීය පරීක්ෂණ එක් එක් අදියර සත්‍යාපනය
    කරයි).'
  - 'Scrum රාමුව Agile ක්‍රියාත්මක කිරීමේ ජනප්‍රිය ප්‍රවේශයකි: Sprint සැලසුම් කිරීම, දෛනික standup, sprint සමාලෝචනය
    සහ retrospective උත්සව නිර්වචනය කරයි. තනි-සංවර්ධක ව්‍යාපෘතියේ විධිමත් Scrum උත්සව වෙනස් කරයි: ස්වයං-සැලසුම්
    සැසි sprint සැලසුම් කිරීම ආදේශ කරයි; ප්‍රගති ලුහුබැඳීම GitHub issues/commits මගින් සිදු වේ; අදියර සම්පූර්ණ කිරීමේ
    සමාලෝචනය sprint සමාලෝචනයට සමාන වේ. Agile ආත්මය පවත්වා ගනිමින් උත්සව පොරොත්තු අවම කරයි.'
  - Agile අවදානම් කළමනාකරණය පුනරාවර්තනීය ප්‍රවේශයෙන් මුල් අවදානම් හඳුනා ගැනීම සක්‍රීය කරයි. Phase 1 (Foundation)
    තාක්ෂණ stack වලංගුකරණය; Phase 2 (Ingestion) PDF නිස්සාරණ අභියෝගය; Phase 3 (AI Core) LLM ඒකාබද්ධ කිරීම සහ hallucination
    අවදානම; එක් එක් අදියර නිශ්චිත අවදානම් ආමන්ත්‍රණය කරයි. අවදානමක් මුල් අදියරකදී සොයා ගත් පසු පසුකාලීන අදියර සීරුමාරු
    කිරීමට Agile නම්‍යතාව සපයයි. Waterfall ආකෘතියේ ප්‍රමාද අදියර අවදානම් සොයා ගැනීම මිල අධික නැවත වැඩ අවශ්‍ය කරයි.
  - 'Agile ක්‍රමවේදයේ ශාස්ත්‍රීය ව්‍යාපෘති සන්දර්භය මෙසේය: නිබන්ධන කාලරාමුව ස්ථිරය (සති 10), විෂය පථය සීරුමාරු කළ
    හැක (Phase 6 කල් දැමූ අයිතම), ගුණාත්මකභාවය සාකච්ඡා කළ නොහැක (ස්වයංක්‍රීය පරීක්ෂණ, ROUGE තක්සේරුව). ස්ථිර-කාලරාමු
    Agile ප්‍රභේදය කාල-කොටු පුනරාවර්තන නිර්වචනය කර විෂය පථය ප්‍රමුඛතා-අනුපිළිවෙල backlog එකකින් කළමනාකරණය කරයි.
    තීරණාත්මක විශේෂාංග (PDF නිස්සාරණය, NER, සාරාංශකරණය) මුල් අදියරවල ක්‍රියාත්මක කරන අතර අතිරේක විශේෂාංග (ද්විභාෂික
    UI, admin dashboard) කල් දැමූ backlog එකේ පවත්වා ගනියි.'
  - Continuous Integration (CI) Agile පරිචය ස්වයංක්‍රීය පරීක්ෂණ ඒකාබද්ධ කරයි. EasyCircular GitHub Actions CI pipeline
    එක එක් එක් commit එකේදී ස්වයංක්‍රීය පරීක්ෂණ ධාවනය කරයි. අදියර සත්‍යාපන scripts (npm run verify:phase1, verify:phase4)
    ඒකාබද්ධ කිරීමේ පරීක්ෂණ ලකුණු සපයයි. අසාර්ථක පරීක්ෂණ වහාම ප්‍රතිපෝෂණ ලූපයක් නිර්මාණය කර regression වළක්වයි. CI
    පරිචය Agile ගුණාත්මක සහතික මූලධර්මය ප්‍රායෝගිකව ක්‍රියාත්මක කරයි.
  - 'Agile ලේඛනගත කිරීමේ සමතුලිතතාව මෙසේය: නිර්මාණ තීරණ වාර්තා කිරීමට හා ශාස්ත්‍රීය අවශ්‍යතා සපුරාලීමට ප්‍රමාණවත්
    ලේඛනගත කිරීම; අධික ලේඛනගත කිරීමෙන් සංවර්ධන වේගය පූජා නොකිරීම. EasyCircular සන්දර්භීය වාර්තාව (පරිච්ඡේද 1 සිට
    4) මුල් ලේඛනගත කිරීම වන අතර සම්පූර්ණ නිබන්ධනය විස්තීර්ණ තක්සේරුව, ප්‍රතිඵල සහ නිගමන එකතු කරයි. කේත අදහස්, API
    ලේඛනගත කිරීම, README ගොනු සහ පරීක්ෂණ විස්තර ක්‍රියාකාරී ලේඛනගත කිරීමට අනුපූරක වේ.'
  - 'Agile ක්‍රමවේද තේරීමේ සාධාරණීකරණ සාරාංශය මෙසේය: පුනරාවර්තනීය සංවර්ධනය AI පර්යේෂණාත්මක ස්වභාවය උපයෝගී කර ගනියි,
    අදියර-පාදක බෙදාහැරීම වර්ධක ප්‍රගතිය පෙන්වයි, ස්වයංක්‍රීය පරීක්ෂණ අඛණ්ඩ ගුණාත්මකභාවය සහතික කරයි සහ නම්‍ය විෂය
    පථය Phase 6 කල් දැමීම සක්‍රීය කරයි. තනි-සංවර්ධක අනුවර්තනය විධිමත් උත්සව සරල කරන නමුත් මූලික Agile අගයන් (ක්‍රියාකාරී
    මෘදුකාංග, වෙනසට ප්‍රතිචාර දැක්වීම, අඛණ්ඩ වැඩිදියුණු කිරීම) පවත්වා ගනියි.'
  - 'අනුවාද පාලනය Agile පරිචයකි: Git repository එකේ feature branches, විස්තරාත්මක commit පණිවිඩ, pull request ස්වයං-සමාලෝචනය
    (තනි සංවර්ධක) සහ ප්‍රධාන ශාඛාව ස්ථායීව පවත්වා ගැනීම. GitHub repository එකේ කේත ඉතිහාසය සම්පූර්ණ සංවර්ධන ආඛ්‍යානයක්
    සපයන අතර commits කාලානුක්‍රමික ප්‍රගති සාධකයි. අනුවාද පාලනය ශාස්ත්‍රීය තක්සේරු සාධකයකි: ක්‍රියාත්මක කිරීමේ උත්සාහය,
    සංවර්ධන කාලරේඛාව සහ කේත පරිණාමය පෙන්විය හැක.'
  - 'Agile retrospective සමානකම: එක් එක් අදියර සම්පූර්ණ වීමේදී ප්‍රතිබිම්බන සටහන් ලේඛනගත කරයි (හොඳින් ගිය දේ, අභියෝග,
    ඊළඟ අදියරේ වැඩිදියුණු කළ යුතු දේ). Phase 2 ප්‍රතිබිම්බනය: Tesseract සිංහල වින්‍යාසය අපේක්ෂිත කාලයට වඩා ගත විය;
    ඉගෙන ගත් පාඩම: බාහිර යැපීම් ඒකාබද්ධ කිරීම මුල් spike එකකින් පරීක්ෂා කළ යුතුය. Phase 3 ප්‍රතිබිම්බනය: guardrail
    සංවර්ධනය පුනරාවර්තනීය විය (මුල් අනුවාදය ඉතා දැඩි, ක්‍රමයෙන් ලිහිල් කළා); පාඩම: AI සංරචකවල වර්ධක පිරිපහදුව සුදුසුය.'
  - 'Sprint වේග ලුහුබැඳීම තනි-සංවර්ධක ව්‍යාපෘතියට අනුවර්තනය කර ඇත: එක් එක් කාර්යයට story points ඇස්තමේන්තු කර අදියරකට
    සම්පූර්ණ කළ ලකුණු වේගය ගණනය කරයි. Phase 1 වේගය baseline ස්ථාපිත කරන අතර පසුකාලීන අදියරවල වේග සංසන්දනය ප්‍රගති
    ප්‍රවණතාව හඳුනා ගනියි. වේග ප්‍රවණතා විශ්ලේෂණය ඉතිරි කාර්ය ඇස්තමේන්තු කරයි: Phase 3 අඩු වේගය (AI සංකීර්ණතාව)
    Phase 4 වන්දි ගෙවයි (ඒකාබද්ධ කිරීම සුමට). වේග ලුහුබැඳීම Agile ප්‍රමාණාත්මක ව්‍යාපෘති කළමනාකරණ සාධකයක් සපයයි.'
  - 'Agile මූලධර්මය වන ක්‍රියාකාරී මෘදුකාංග සම්පූර්ණ ලේඛනගත කිරීමට වඩා වටිනා යන්න BSc නිබන්ධන සන්දර්භයේ ආතතියක්
    ඇති කරයි: ශාස්ත්‍රීය තක්සේරුව සම්පූර්ණ ලේඛනගත කිරීම ඉල්ලා සිටින අතර Agile ලේඛනගත කිරීම අවම කිරීමට කැමතිය. සමතුලිත
    උපාය: ජීවමාන ලේඛනගත කිරීම (README, API docs, කේත අදහස්) සංවර්ධනය සමඟ පවත්වා ගනිමින් ශාස්ත්‍රීය ලේඛනගත කිරීම
    (නිබන්ධන පරිච්ඡේද) අදියර සම්පූර්ණ කිරීමේ සන්ධිස්ථානවලදී ලියයි. ද්විත්ව ලේඛනගත කිරීමේ ප්‍රවේශය Agile මූලධර්ම
    සහ ශාස්ත්‍රීය අවශ්‍යතා යන දෙකම සපුරාලයි.'
  - 'Kanban පුවරුව තනි-සංවර්ධක Agile දෘශ්‍යකරණයකි: GitHub Projects පුවරු තීරු (Backlog, In Progress, Review, Done)
    කාර්ය ගලායාම දෘශ්‍යකරණය කරයි. Work-in-progress (WIP) සීමාව එකවර කාර්ය 2කි: අවධානය පවත්වා ගනිමින් සන්දර්භ මාරුවීම
    අවම කරයි. Kanban පුවරු නිබන්ධන තිර රූපය ව්‍යාපෘති කළමනාකරණ පරිචය පෙන්වන සාධකයකි. එක් එක් අදියර සම්පූර්ණ වීමේදී
    පුවරු තත්ත්වය සංරක්ෂණය කරයි.'
