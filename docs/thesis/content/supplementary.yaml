  - 'Gantt ප්‍රස්ථාරය (රූපය 3.1) කාලරේඛාවේ දෘශ්‍ය නිරූපණය සපයයි: හැකි තැන්වල සමාන්තර කාර්ය, තීරණාත්මක මාර්ග යැපීම්
