- title: 'Appendix E: AI-assisted code segments (full disclosure)'
  id: ai_code
  level: 2
  paragraphs:
  - මෙම appendix එක පරිච්ඡේදය 4 කොටස 4.6 හි සාරාංශගත කළ AI-assisted code artefacts සඳහා සම්පූර්ණ ලේඛනගත කිරීමක්
    සපයයි. එක් එක් අයිතමය සඳහා භාවිත කළ මෙවලම, ලබා දුන් prompt එකේ සාරය, ලැබුණු කේතයේ ක්‍රියාකාරිත්වය, ශිෂ්‍යයා
    විසින් සිදු කළ වෙනස්කම් සහ system design එකට ගැලපෙන ආකාරය සඳහන් කර ඇත.
  - 'E.1 - docker-compose.yml (ChatGPT). Prompt සාරය: ''Next.js, Express, FastAPI, MongoDB සහ Ollama සඳහා docker-compose
    service definitions ලබා දෙන්න.'' ලැබුණු කේතය five-service compose file එකක් විය. ශිෂ්‍ය වෙනස්කම්: port mapping
    ව්‍යාපෘතියේ 3002/4000/5000/27017/11434 වෙත වෙනස් කිරීම, Ollama model volume එකතු කිරීම, health-check directives
    එකතු කිරීම සහ environment variable secrets .env file එකට ගෙන යාම. Design fit: deployment layer - reproducible
    local deployment ලබා දෙයි.'
  - 'E.2 - PDF extraction fallback wrapper (ChatGPT). Prompt සාරය: ''pdfplumber අසාර්ථක වූ විට PyMuPDF වෙත fallback
    වන wrapper function එකක්.'' ලැබුණු කේතය සරල try/except cascade එකක් විය. ශිෂ්‍ය වෙනස්කම්: තෙවන stage එක ලෙස
    Tesseract OCR (sin+eng+tam) එකතු කිරීම, empty-text heuristic එකක් මගින් scanned PDF හඳුනා ගැනීම, සහ structured
    logging එකතු කිරීම. Design fit: AI tier extraction stage - Sinhala scanned circulars සඳහා අත්‍යවශ්‍ය robustness
    ලබා දෙයි.'
  - 'E.3 - Date recognition regex patterns (ChatGPT). Prompt සාරය: ''dd/mm/yyyy, yyyy-mm-dd සහ සිංහල මාස නාම හඳුනා
    ගන්නා regex.'' ශිෂ්‍ය වෙනස්කම්: සිංහල මාස නාම ලැයිස්තුව සම්පූර්ණ කිරීම, ශ්‍රී ලංකා චක්‍රලේඛවල භාවිත වන ''2024.05.12''
    ආකෘතිය එකතු කිරීම සහ false positive අවම කිරීමට word-boundary constraints එකතු කිරීම. Design fit: date guardrail
    module - LLM output එකේ ඇති දිනයන් මූලික ලේඛනයේ තිබේද යන්න පරීක්ෂා කර hallucination ප්‍රතික්ෂේප කරයි. මෙය ව්‍යාපෘතියේ
    ප්‍රධාන novelty එකකි.'
  - 'E.4 - LangChain summarization chain (ChatGPT). Prompt සාරය: ''දිගු ලේඛන සඳහා map-reduce summarization chain
    එකක්.'' ලැබුණු කේතය යල් පැන ගිය LangChain API භාවිත කළේය. ශිෂ්‍ය වෙනස්කම්: වත්මන් LangChain API වෙත සම්පූර්ණයෙන්
    නැවත ලිවීම, Ollama (llama3.2:3b) LLM එක සම්බන්ධ කිරීම, චක්‍රලේඛ වසමට විශේෂිත prompt template එකක් ලිවීම සහ extractive
    fallback path එකක් එකතු කිරීම. Design fit: AI tier summarization stage - ROUGE මගින් තක්සේරු කරන ලද ප්‍රධාන
    output එක ජනනය කරයි.'
  - 'E.5 - Content-hash cache middleware (ChatGPT). Prompt සාරය: ''Express middleware එකක් මගින් request body එකේ
    SHA-256 hash එක ගණනය කර cached ප්‍රතිඵලයක් ඇත්නම් එය ලබා දෙන්න.'' ශිෂ්‍ය වෙනස්කම්: MongoDB collection එකක් වෙත
    cache persist කිරීම, TTL logic එකතු කිරීම සහ cache-hit metrics logging. Design fit: application tier - නැවත
    process කිරීම වළක්වා LLM inference පිරිවැය සහ latency අවම කරයි.'
  - 'E.6 - JWT authentication middleware (ChatGPT). Prompt සාරය: ''Express JWT verification middleware.'' ශිෂ්‍ය
    වෙනස්කම්: token expiry error messages වෙන් වෙන් වශයෙන් හැඳින්වීම, user document එක request object එකට attach
    කිරීම සහ bcrypt password hashing integration. Design fit: application tier - multi-user document isolation ලබා
    දෙයි.'
  - 'E.7 - Entity highlighting component (ChatGPT). Prompt සාරය: ''character offsets ලැයිස්තුවක් අනුව පෙළ තුළ කොටස්
    highlight කරන React component එකක්.'' ශිෂ්‍ය වෙනස්කම්: overlapping entity spans හැඳින්වීමේ bug නිවැරදි කිරීම,
    entity type අනුව accessible colour palette එකක් යෙදීම සහ Sinhala Unicode grapheme cluster offsets නිවැරදිව හැඳින්වීම.
    Design fit: presentation tier - primary research හි 78% ඉල්ලූ entity highlighting අවශ්‍යතාව ඉටු කරයි.'
  - 'E.8 - Pytest fixtures (ChatGPT). ශිෂ්‍ය වෙනස්කම්: සියලු assertion logic අතින් ලිවීම, sample MOE circular PDF
    fixtures එකතු කිරීම සහ mock Ollama responses නිර්මාණය කිරීම. Design fit: testing layer - AI service pytest 91
    සහ backend tests 13 සඳහා පදනම.'
  - 'E.9 - python-docx generator helpers (ChatGPT). ශිෂ්‍ය වෙනස්කම්: Iskoola Pota complex-script font attribute
    (w:cs) නිවැරදිව සැකසීම, TOC field code injection සහ caption auto-numbering. Design fit: artefact එකෙන් පිටත
    documentation tooling; නිබන්ධන ආකෘතිය guidelines අනුව ස්වයංක්‍රීයව ජනනය කරයි.'
  - 'E.10 - Rate limiting configuration (ChatGPT). Prompt සාරය: ''express-rate-limit සඳහා පොදු configuration එකක්.''
    ශිෂ්‍ය වෙනස්කම්: upload endpoint එකට වෙනම දැඩි limit එකක් යෙදීම සහ 429 response body එක client UI එකට ගැලපෙන
    පරිදි වෙනස් කිරීම. Design fit: application tier - LLM resource exhaustion සහ abuse වළක්වයි.'
  - 'ප්‍රකාශය: ඉහත සියලු අයිතම සඳහා අවසාන කේතය ශිෂ්‍යයා විසින් සමාලෝචනය කර, වෙනස් කර, පරීක්ෂා කර ඇති අතර ඒවායේ ක්‍රියාකාරිත්වය
    පිළිබඳ පූර්ණ අවබෝධයක් ඇත. භාවිත කළ AI මෙවලම reference ලෙස OpenAI (2024) යටතේ References ලැයිස්තුවේ උපුටා දක්වා
    ඇත.'
  bullets: []
  numbered: []
  figures: []
