- title: 'Appendix B: Survey questions (12)'
  id: survey_q
  level: 2
  paragraphs:
  - මූලික පර්යේෂණය සඳහා භාවිත කළ Google Forms සමීක්ෂණයේ ප්‍රශ්න 12 සිංහල සහ ඉංග්‍රීසි භාෂා දෙකෙන්ම ඉදිරිපත් කරන
    ලදී. සහභාගිවන්නන්ගේ MOE චක්‍රලේඛ කියවීමේ පුරුදු, ඔවුන් මුහුණ දෙන දුෂ්කරතා, අපේක්ෂිත features සහ AI පිළිබඳ ආකල්ප
    තක්සේරු කිරීම මෙම ප්‍රශ්නවල අරමුණ විය.
  bullets: []
  numbered:
  - ඔබගේ වෘත්තීය role එක කුමක්ද? (ගුරුවරයා / විදුහල්පති / අධ්‍යාපන නිලධාරී / Other)
  - MOE circulars කියවන frequency එක කොපමණද? (Very often / Sometimes / Rarely / Never)
  - Circulars comprehensible ද? (Yes / No / Sometimes)
  - Circulars කියවීමේදී ප්‍රධාන දුෂ්කරතාව කුමක්ද? (Too long / Lack of time / Complex language / Other)
  - Circular එකක් comprehensively කියවීමට average time කොපමණ ගතවේද?
  - Circular misunderstood වී compliance issue එකක් originate වී තිබේද?
