- title: A.3 අවදානම් දළ විශ්ලේෂණය
  id: risks
  level: 3
  paragraphs:
  - ව්‍යාපෘති අවදානම් ලේඛනය (risk register) IMPLEMENTATION_PLAN.md හි කොටස 13 මගින් ව්‍යුත්පන්න කර contextual report
    හි Table 3 සමඟ අනුකූල කරන ලදී. ඉහළ බලපෑමක් ඇති අවදානම් ලෙස දුර්වල PDF නිස්සාරණය, LLM hallucination සහ සිංහල
    NLP පරතරය හඳුනාගත් අතර, ඒවා සඳහා පිළියම් ලෙස library දෙකක් සමඟ OCR සහ human edit, guardrails සමඟ දින සත්‍යාපනය,
    සහ අදියර 5 හි සිංහල OCR සමඟ අදියර 6 හි පූර්ණ NLP යෝජනා කරන ලදී.
  - මධ්‍යම මට්ටමේ අවදානම් ලෙස API පිරිවැය (caching සහ දේශීය Ollama මගින් අවම කිරීම), මන්දගාමී සැකසුම (content-hash
    cache මගින් 114ms cached ප්‍රතිචාර), scope creep (phase exit gates මගින් පාලනය) සහ UAT ප්‍රතික්ෂේපය (human-in-the-loop
    සහ privacy පාලන) හඳුනාගත්තෙමු. සෑම අවදානමක්ම එය වඩාත් සිදුවිය හැකි අදියරට පවරා, exit gate එකට පෙර පිළියම ක්‍රියාත්මක
    කරන ලදී.
  - 'අවදානම් නිරීක්ෂණය අඛණ්ඩව සිදු විය: verify:phase1 සහ verify:phase4 scripts මගින් ස්වයංක්‍රීය health checks,
    pytest suite මගින් regression හඳුනා ගැනීම සහ ROUGE තක්සේරුව මගින් සාරාංශ ගුණාත්මක පදනමක් ලබා දුන්නේය. පිළියම්
    නොකළ අවදානමක් ලෙස නිබන්ධන ඉදිරිපත් කිරීමේ අවස්ථාවේ විධිමත් UAT සම්පූර්ණ නොවීම පරිච්ඡේද 5 සහ 6 හි සීමාවක් ලෙස
    ලේඛනගත කර ඇත.'
  - 'අවදානම් කළමනාකරණය Agile සංවර්ධනයේ අනිවාර්ය සංරචකයකි: අවදානම් මුලින් හඳුනා ගනී, තක්සේරු කරයි (සම්භාවිතාව සහ
    බලපෑම), අවමන උපාය නිර්වචනය කරයි සහ අවශේෂ අවදානම අධීක්ෂණය කරයි. EasyCircular අවදානම් ලේඛනය ප්‍රධාන අවදානම් 5ක්
    හඳුනා ගෙන එක් එක් අවදානමට අවමන උපාය ක්‍රියාත්මක කර හෝ සැලසුම් කර ඇත. අවදානම් තක්සේරුව ගුණාත්මක (ඉහළ/මධ්‍යස්ථ/අඩු)
    පරිමාණයක් භාවිත කරයි; ප්‍රමාණාත්මක සම්භාවිතා ඇස්තමේන්තුව තනි-සංවර්ධක ව්‍යාපෘති විෂය පථය ඉක්මවයි.'
  - 'අවදානම 1: දුර්වල PDF නිස්සාරණ ගුණාත්මකභාවය. බලපෑම ඉහළය. අමාත්‍යාංශ චක්‍රලේඛ විවිධ ආකෘති (ඩිජිටල් උපත, ස්කෑන්,
    පැරණි ඡායා පිටපත්, මිශ්‍ර පිරිසැලසුම්) ඉදිරිපත් කරන අතර නිස්සාරණ අසාර්ථකත්වය සම්පූර්ණ පහළ-ප්‍රවාහය (NER, සාරාංශකරණය)
    අවදානමට ලක් කරයි. අවමනය: ත්‍රි-අතිරික්තතා ප්‍රවේශය (pdfplumber ප්‍රාථමික, PyMuPDF fallback, Tesseract OCR) සහ
    human-in-the-loop පෙළ සංස්කරණය පරිශීලක නිවැරදි කිරීම් සක්‍රීය කරයි. පරීක්ෂණ: එක් එක් ආකෘති වර්ගයේ නියමු PDF
    සත්‍යාපනය කර ඇත.'
  - 'අවදානම 2: සාරාංශවල LLM hallucination. බලපෑම තීරණාත්මකය. නීතිමය/පරිපාලන ලේඛනවල නිර්මිත දින, නිර්මිත අවශ්‍යතා
    හෝ ප්‍රබන්ධ සංවිධාන ව්‍යසනකාරී ප්‍රතිවිපාක ඇති කළ හැක: පාසල් වැරදි කාලසීමා අනුගමනය කිරීම, අනුකූලතා උල්ලංඝනය,
    වැරදි ප්‍රතිපත්ති ක්‍රියාත්මක කිරීම. අවමනය: දින guardrails (ජනනය කළ සාරාංශ දින මූලාශ්‍ර පෙළෙන් සත්‍යාපනය), අඩු
    උෂ්ණත්ව සැකසුම, entity-නැංගුරම් prompts, extractive TextRank fallback. පරීක්ෂණ: pytest guardrail පරීක්ෂණ කට්ටලය
    අවස්ථා 91ක්.'
  - 'අවදානම 3: API/LLM මෙහෙයුම් පිරිවැය. බලපෑම මධ්‍යස්ථය. Cloud LLM API per-token මිල ගණන් අයවැය අනපේක්ෂිත කරන අතර
