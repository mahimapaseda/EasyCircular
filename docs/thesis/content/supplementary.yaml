    බෙදාහැරීම්-පාදක වේ (නිර්ණායක සපුරාලීම). බෙදාහැරීම්-පාදක සංක්‍රමණ ගුණාත්මකභාවය සහතික කරයි: අසම්පූර්ණ කාර්ය ඊළඟ
