  - 'ප්‍රමාණාත්මක අවදානම් තක්සේරු උත්සාහය: hallucination සම්භාවිතා ඇස්තමේන්තුව (LLM සාහිත්‍යය කරුණු දෝෂ අනුපාතය
    5-15% යෝජනා කරයි), නිස්සාරණ අසාර්ථක සම්භාවිතාව (පරීක්ෂණ කෝපස් 0%, නිෂ්පාදන නොදනී), සමගාමී පරිශීලක අසාර්ථක සම්භාවිතාව
    (පරීක්ෂා නොකළ, නොදනී). ප්‍රමාණාත්මක ඇස්තමේන්තු අවිනිශ්චිත වන අතර තනි-සංවර්ධක ව්‍යාපෘති විෂය පථය තුළ ගුණාත්මක
    තක්සේරුව ප්‍රාථමික වේ. ප්‍රමාණාත්මක උත්සාහ ඇස්තමේන්තු ක්‍රමවේදය පෙන්වයි; නිශ්චිත සංඛ්‍යා අධික විශ්වාස ප්‍රකාශ
    නොකරයි.'
  - 'අවදානම් ලේඛනය ජීවමාන ලේඛන පරිණාමයකි: Phase 1 මුල් අවදානම් 3ක් හඳුනා ගත්තේය, Phase 3 අවදානම් 5 දක්වා පුළුල්
    විය (AI-විශේෂිත අවදානම් මතු විය), Phase 5 අවසානයේ ප්‍රධාන 5ක් සහ සුළු 3ක් ලේඛනගත කර ඇත. අවදානම් ලේඛන පරිණාමය
    සංවර්ධන ඉගෙනීම පෙන්වයි: සියලු අවදානම් මුලින්ම පුරෝකථනය කළ නොහැක, පුනරාවර්තනීය සොයා ගැනීම ස්වාභාවිකය. ජීවමාන
    අවදානම් ලේඛනය Agile අවදානම් කළමනාකරණය ප්‍රායෝගිකය; ස්ථිතික අවදානම් තක්සේරුව ගතික ව්‍යාපෘතිවලට ප්‍රමාණවත් නොවේ.'
