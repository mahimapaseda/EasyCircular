- title: A.4 Phase exit gates (අදියර නික්මුම් ද්වාර)
  id: gates
  level: 3
  paragraphs:
  - Phase exit gates මගින් නිශ්චිත සමත්/අසමත් නිර්ණායක ලබා දී අසම්පූර්ණ කාර්යයන් ඊළඟ අදියරට ගමන් කිරීම වළක්වයි.
    ස්වයංක්‍රීය සත්‍යාපක (Node.js scripts) මගින් නැවත ලබා ගත හැකි පරීක්ෂණ සපයන අතර, manual checklist අයිතම (UI සමාලෝචනය,
    ලේඛනගත කිරීම) ඒවාට අනුපූරක වේ.
  - 'අදියර පිටවීමේ දොරටු ගුණාත්මක සහතික පරීක්ෂණ ලකුණු ලෙස එක් එක් අදියර සම්පූර්ණ වීම සත්‍යාපනය කරයි. දොරටු නිර්ණායක
    මැනිය හැකි, වෛෂයික කොන්දේසි නිර්වචනය කරයි: ස්වයංක්‍රීය පරීක්ෂණ සමත් වීම, ක්‍රියාකාරීත්වය පෙන්වීම, ලේඛනගත කිරීම
    යාවත්කාලීන කිරීම. දොරටු අකාලික අදියර සංක්‍රමණය වළක්වා අසම්පූර්ණ හෝ අසාර්ථක ක්‍රියාකාරීත්වය ඊළඟ අදියරට පැතිරීම
    වළක්වයි.'
  - 'Phase 1 දොරටු නිර්ණායක: Docker Compose සියලු සේවා ආරම්භ වීම (health check endpoints HTTP 200 ප්‍රතිචාර දැක්වීම),
    MongoDB සම්බන්ධතාව ස්ථාපිත වීම, JWT සත්‍යාපන login/register ක්‍රියාකාරී වීම, CI pipeline කොළ වීම සහ මූලික ව්‍යාපෘති
    ව්‍යුහය සත්‍යාපනය වීම. Phase 1 සත්‍යාපන script එක (npm run verify:phase1) ස්වයංක්‍රීය දොරටු පරීක්ෂාව ක්‍රියාත්මක
    කරයි.'
  - 'Phase 2 දොරටු නිර්ණායක: PDF උඩුගත API ක්‍රියාකාරී වීම (ගොනුව ගබඩා වීම, MongoDB වාර්තාව සෑදීම), pdfplumber නිස්සාරණය
    නියමු ඩිජිටල් PDF සැකසීම, Tesseract OCR නියමු ස්කෑන් PDF සැකසීම, පෙළ සංස්කරණ PATCH endpoint ක්‍රියාකාරී වීම
    සහ නිස්සාරණ තත්ත්වය MongoDB හි ලුහුබැඳීම. අතින් සත්‍යාපනය නියමු චක්‍රලේඛ නිස්සාරණ පෙළ සමාලෝචනය කරයි.'
  - 'Phase 3 දොරටු නිර්ණායක: නියමු පෙළෙන් NER entities නිස්සාරණය (DATE, ORG, LAW හඳුනා ගැනීම), සාරාංශකරණ pipeline
    ප්‍රතිදානය නිපදවීම, guardrails නිර්මිත දින ප්‍රතික්ෂේප කිරීම (pytest සත්‍යාපනය), content hash caching අනුපිටපත්
    ඉල්ලීම් හැසිරවීම සහ AI සේවා ටෝකන් සත්‍යාපනය බලාත්මක කිරීම. Phase 3 දොරටුව pytest කට්ටලයේ බහුතරය සමත් වීම අවශ්‍ය
    කරයි.'
  - 'Phase 4 දොරටු නිර්ණායක: අන්තයේ සිට අන්තයට කාර්යප්‍රවාහය සම්පූර්ණ වීම (උඩුගත කිරීමේ සිට නිස්සාරණය, සංස්කරණය,
    සැකසීම සහ දර්ශනය දක්වා), frontend entities දර්ශනය, ජංගම-ප්‍රතිචාරී පිරිසැලසුම සත්‍යාපනය, rate limiting ක්‍රියාකාරී
    වීම සහ අමාත්‍යාංශ කැටලොග් ආයාතය ක්‍රියාත්මක වීම. Phase 4 සත්‍යාපන script එක (npm run verify:phase4) ඒකාබද්ධ
    පරීක්ෂණ ක්‍රියාත්මක කරයි. පරිශීලක ගමන් මාර්ග ලේඛනගත කිරීම තිර රූප ග්‍රහණය කරයි.'
  - 'Phase 5 දොරටු නිර්ණායක: ROUGE තක්සේරුව සම්පූර්ණ වීම (ලේඛන 6ක්, ලකුණු ලේඛනගත), pytest කට්ටලය 90%කට වැඩි සමත්
    වීම (AI සේවා 91/91, backend 13/13 ඉලක්කය), නිබන්ධන වාර්තා කෙටුම්පත සම්පූර්ණ වීම, දන්නා සීමා ලේඛනගත වීම සහ repository
    පිරිසිදු කිරීම. Phase 5 දොරටුව ශාස්ත්‍රීය ඉදිරිපත් කිරීමේ සූදානම තහවුරු කරයි. UAT තත්ත්වය අවංකව වාර්තා කර ඇත
    (pending).'
  - 'දොරටු අසාර්ථකත්ව හැසිරවීම: දොරටු පරීක්ෂා අසාර්ථක වූ විට නිශ්චිත අසාර්ථක නිර්ණායක හඳුනා ගනී, මූල හේතුව විමර්ශනය
    කරයි, නිවැරදි කිරීම ක්‍රියාත්මක කරයි, නැවත සත්‍යාපනය කරයි. Phase 1 මුල් දොරටුව: MongoDB සම්බන්ධතා timeout (Docker
    ජාල වින්‍යාස ගැටලුව) හඳුනා නිවැරදි කර ඇත. දොරටු නැවත ධාවනය සාර්ථක විය. දොරටු අසාර්ථකත්වය අදියර අසාර්ථකත්වයක්
    නොවේ; පුනරාවර්තනීය නිවැරදි-කර-සත්‍යාපනය Agile ප්‍රවේශයකි. දොරටු විනය ගුණාත්මක තීරුව පවත්වා ගනිමින් ප්‍රගතිය
    ස්ථිරව අවහිර නොකරයි.'
  - 'දොරටු නිර්ණායක පරිණාමය: මුල් දොරටු නිර්ණායක මූලික විය (health checks පමණි); සංවර්ධන අත්දැකීම හරහා පිරිපහදු
    විය (ක්‍රියාකාරී පරීක්ෂා, කාල මිනුම්කෝදණ්ඩ එකතු කිරීම). Phase 4 දොරටු නිර්ණායක වඩාත් සම්පූර්ණය (සම්පූර්ණ කාර්යප්‍රවාහ
    සත්‍යාපනය). දොරටු නිර්ණායක ලේඛනගත කිරීම නිබන්ධන ක්‍රමවේද සාධකයකි: ගුණාත්මක සහතික ක්‍රියාවලිය පද්ධතිමය වන අතර
    ad hoc නොවේ. අනාගත දොරටු නිර්ණායක අමතර මාන (කාර්ය සාධන මිනුම්කෝදණ්ඩ, ආරක්ෂක ස්කෑන්) වැඩි දියුණු කළ හැක.'
  - 'දොරටු නිර්ණායක වෛෂයිකභාවය සහතික කරයි: මානව විනිශ්චය අවම කර ස්වයංක්‍රීය සත්‍යාපනය උපරිම කරයි. ආත්මීය නිර්ණායක
    (කේත ගුණාත්මකභාවය හොඳය) වෛෂයික නිර්ණායකවලින් ආදේශ කරයි (ESLint ශුන්‍ය දෝෂ, pytest 90%කට වැඩි සමත්). වෛෂයික දොරටු
    නැවත නිපදවිය හැකි තක්සේරුව සක්‍රීය කරයි; විවිධ තක්සේරුකරුවන් එකම නිගමනයට එළඹේ. දොරටු වෛෂයිකභාවය ශාස්ත්‍රීය තක්සේරු
    සාධාරණත්වයට සහාය දෙයි.'
  - 'දොරටු අසාර්ථකත්ව ප්‍රතිසාධන කාල ලුහුබැඳීම: Phase 1 MongoDB සම්බන්ධතා අසාර්ථකත්වය පැය 2කින් නිවැරදි කරන ලදී
    (Docker ජාල වින්‍යාසය), Phase 3 guardrail පරීක්ෂණ අසාර්ථකත්වය පැය 4කින් නිවැරදි කරන ලදී (regex රටා පිරිපහදුව),
    Phase 4 CORS ගැටලුව පැය 1කින් නිවැරදි කරන ලදී. ප්‍රතිසාධන කාල දත්ත සංවර්ධන වේග බලපෑම ප්‍රමාණනය කරයි; මුළු දොරටු
    අසාර්ථකත්ව ප්‍රතිසාධනය ආසන්න වශයෙන් පැය 7කි (පැය 200ක ව්‍යාපෘතියේ 3.5%). ප්‍රතිසාධන කාලය යථාර්ථවාදීය; දොරටු
    විනය ව්‍යාපෘති ගුණාත්මකභාවයට ශුද්ධ ධනාත්මක බලපෑමක් ඇති කරයි.'
  - 'දොරටු ස්වයංක්‍රීයකරණය අනාගත වැඩිදියුණු කිරීමකි: වර්තමාන දොරටු අර්ධ-ස්වයංක්‍රීයය (scripts සහ අතින් සමාලෝචනය),
    අනාගත දොරටු සම්පූර්ණයෙන් ස්වයංක්‍රීයව CI pipeline එකට ඒකාබද්ධ කළ හැක. ස්වයංක්‍රීය දොරටු ක්‍රියාත්මක කිරීම සංවර්ධක
    පොරොත්තු අඩු කරන අතර එක් එක් commit එකේදී අඛණ්ඩ දොරටු සත්‍යාපනය ගුණාත්මක පරීක්ෂණ ලකුණු සපයයි. දොරටු ස්වයංක්‍රීයකරණය
    DevOps පරිණතභාව දර්ශකයකි; වර්තමාන අර්ධ-ස්වයංක්‍රීය ප්‍රවේශය සංවර්ධන ව්‍යාපෘතියට ප්‍රමාණවත් වන අතර නිෂ්පාදන ව්‍යාපෘතියට
    සම්පූර්ණ ස්වයංක්‍රීයකරණය අවශ්‍ය වේ.'
  bullets: []
  numbered: []
  figures: []
  table:
    caption: 'Table A.2: Phase exit gate criteria'
    headers:
    - Phase
    - Verifier
    - Pass Criteria
    rows:
    - - '1'
      - verify:phase1.mjs
      - AI /health 200, Backend /health 200 (MongoDB+AI), Frontend HTTP 200
    - - '2'
      - Manual + unit tests
      - PDF upload -> extract -> OCR fallback -> text saved to MongoDB
    - - '3'
      - pytest + manual
      - /v1/pipeline returns summary + entities; guardrail rejects bad dates
    - - '4'
      - verify:phase4.mjs
      - Auth 401 without JWT; process with valid token; rate limit active
    - - '5'
      - ROUGE script + test count
      - rouge-report.json generated; 91 or more pytest pass; thesis draft complete
- title: A.5 සංවර්ධන මෙවලම් සහ AI සහායක මෙවලම් භාවිතය
  id: tools
  level: 3
  paragraphs:
  - සංවර්ධන පරිසරය ලෙස Visual Studio Code, අනුවාද පාලනය සඳහා Git සහ GitHub, container orchestration සඳහා Docker
    Compose, API පරීක්ෂාව සඳහා Postman සහ පරීක්ෂණ සඳහා pytest සහ Node test runner භාවිත කරන ලදී.
  - මේවාට අමතරව OpenAI ChatGPT boilerplate කේත, configuration files සහ test scaffolding සකස් කිරීමේදී සහායක මෙවලමක්
    ලෙස භාවිත කරන ලදී. අධ්‍යයන විනිවිදභාවය සඳහා මෙම භාවිතය පිළිබඳ සම්පූර්ණ ප්‍රකාශයක් නිබන්ධනයේ ආරම්භයේ ඇති AI භාවිත
    ප්‍රකාශයේ, පරිච්ඡේදය 4 කොටස 4.6 හි සහ Appendix E හි ලේඛනගත කර ඇත.
  - AI මෙවලම් sprint කාලසීමා තුළ ඵලදායිතාව වැඩි කිරීමට උපකාරී වූ නමුත්, ඒවා ව්‍යාපෘතියේ නිර්මාණාත්මක තීරණ ගැනීමට
    භාවිත නොකළ බව අවධාරණය කරමි. Architecture තෝරා ගැනීම, guardrail සංකල්පය, evaluation ක්‍රමවේදය සහ අවදානම් විශ්ලේෂණය
    සියල්ල ශිෂ්‍යයාගේ මුල් කාර්යයයි.
  - 'සෑම AI-assisted කේත කොටසක්ම ව්‍යාපෘතියේ code review පියවරට යටත් කරන ලදී: කේතය කියවා තේරුම් ගැනීම, ව්‍යාපෘතියේ
    conventions වෙත ගැලපීම සහ අදාළ phase exit gate එකේ පරීක්ෂණ මගින් සත්‍යාපනය කිරීම. එබැවින් AI භාවිතය quality
    gates මගින් පාලනය කරන ලද ක්‍රියාවලියක කොටසක් විය.'
