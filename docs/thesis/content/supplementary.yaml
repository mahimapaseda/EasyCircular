  - 'අදියර ඒකාබද්ධ පරීක්ෂණ: Phase 4 විශේෂයෙන් තීරණාත්මක ඒකාබද්ධ සන්ධිස්ථානයකි: frontend, backend, AI සේවාව සහ MongoDB
