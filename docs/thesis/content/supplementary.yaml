title: Appendices
sections:
- title: 'Appendix A: ව්‍යාපෘති සැලසුම (Project Plan)'
  id: plan
  level: 2
  paragraphs:
  - නිබන්ධන මාර්ගෝපදේශ අනුව ව්‍යාපෘති සැලසුම මුල් පරිශිෂ්ටය ලෙස ඉදිරිපත් කළ යුතුය. එබැවින් EasyCircular ව්‍යාපෘතියේ
    Agile ක්‍රමවේදය, පස්-අදියර ක්‍රියාත්මක කිරීමේ සැලැස්ම, අවදානම් විශ්ලේෂණය, අදියර නික්මුම් ද්වාර සහ භාවිත කළ සංවර්ධන
    මෙවලම් මෙම පරිශිෂ්ටයේ ලේඛනගත කර ඇත.
  - මෙම සැලසුම ප්‍රධාන පරිච්ඡේදවල විස්තර කර ඇති නිර්මාණය, සංවර්ධනය සහ තක්සේරු කාර්යයන් සිදු කළ ආකාරය සඳහා පදනම සපයයි.
