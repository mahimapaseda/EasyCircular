- title: 4.6 AI-generated content සහ code referencing
  id: ai_generated
  level: 2
  paragraphs:
  - අධ්‍යයන විනිවිදභාවය (academic transparency) සහ ආචාර ධර්ම අවශ්‍යතා අනුව, EasyCircular නිපැයුම සංවර්ධනය කිරීමේදී
    generative AI මෙවලම් භාවිත කළ ආකාරය මෙම කොටසේ ලේඛනගත කෙරේ. භාවිත කළ මෙවලම වූයේ OpenAI ChatGPT (OpenAI, 2024)
    වේ.
  - AI මෙවලම් භාවිත කිරීමේ පොදු තාර්කිකත්වය (rationale) වූයේ boilerplate configuration, නැවත නැවත ලියන utility functions
    සහ test scaffolding වැනි අඩු නිර්මාණාත්මක අගයක් ඇති කාර්යයන් සඳහා ගතවන කාලය අවම කර, ව්‍යාපෘතියේ මූලික අභියෝග
    වන Sinhala OCR නිරවද්‍යතාව, hallucination පාලනය සහ pipeline architecture design සඳහා වැඩි කාලයක් යෙදවීමයි. Agile
    sprint කාලසීමා සීමිත වූ බැවින් මෙය ප්‍රායෝගික තීරණයක් විය.
  - වැදගත් වන්නේ AI විසින් යෝජනා කළ කිසිදු කේත කොටසක් සත්‍යාපනයකින් තොරව පද්ධතියට ඇතුළත් නොකළ බවයි. සෑම යෝජනාවක්ම
    (i) කියවා තේරුම් ගැනීම, (ii) ව්‍යාපෘතියේ coding conventions සහ architecture layer boundaries එකට ගැලපෙන පරිදි
    නැවත ලිවීම, (iii) pytest / manual test මගින් සත්‍යාපනය කිරීම යන පියවර තුනට යටත් කරන ලදී. එබැවින් final artefact
    එකේ author එක ලෙස ශිෂ්‍යයා දැයි වගකීම දරයි.
  - Table 4.3 මගින් AI සහාය ලබා ගත් ප්‍රධාන code artefacts, ඒවා භාවිත කිරීමට හේතුව (reason), ඒවා ඉටු කරන ක්‍රියාකාරිත්වය
    (function) සහ ඒවා system design එකට ගැලපෙන ආකාරය (fit into system design) පෙන්වා ඇත. සම්පූර්ණ code listings
    සහ prompt විස්තර Appendix E හි ඉදිරිපත් කර ඇත.
  - 'AI සහාය ලබා නොගත් ක්ෂේත්‍ර ලෙස පහත සඳහන් කරමි: ත්‍රිස්ථර architecture තීරණය, Ollama local LLM තෝරා ගැනීමේ තීරණය,
    date guardrail විසඳුමේ මූලික සංකල්පය, primary research survey නිර්මාණය සහ විශ්ලේෂණය, ROUGE evaluation ක්‍රමවේදය
    සහ නිබන්ධන තර්කය. මේවා සියල්ල ශිෂ්‍යයාගේ මුල් අධ්‍යයන කාර්යයයි.'
  - 'සීමාවන් සහ අවදානම් ලෙස AI-generated code වල හඳුනාගත් ගැටලු: යල් පැන ගිය library API භාවිත කිරීම (LangChain
    පැරණි chain syntax), error handling අඩුව, සහ security validation නොමැති බව. මෙම ගැටලු code review අවස්ථාවේදී
    හඳුනාගෙන නිවැරදි කරන ලදී - උදාහරණයක් ලෙස upload handler එකට PDF magic-byte validation එක අතින් එකතු කරන ලදී
    (Table 4.4, TC #1 බලන්න).'
  bullets: []
  numbered: []
  figures: []
  table:
    caption: 'Table 4.3: AI-assisted code artefacts - reason, function and system design fit'
    headers:
    - '#'
    - Code Artefact
    - AI Tool
    - Reason for Use
    - Function of Code
    - Fit into System Design
    - Human Verification
    rows:
    - - '1'
      - docker-compose.yml service definitions
      - ChatGPT
      - Boilerplate orchestration config; low design value
      - Defines Frontend, backend, ai-service, MongoDB and Ollama containers with network and volume mappings
      - Deployment layer - runs the three-tier architecture with a single command
      - Manual run + health-check endpoint verification
    - - '2'
      - PDF text extraction fallback wrapper
      - ChatGPT
      - try/except cascade pattern boilerplate
      - Falls back from pdfplumber to PyMuPDF, then Tesseract OCR
      - AI tier - extraction stage 1; ensures robustness
      - Verified with scanned and digital PDF samples; pytest coverage added
    - - '3'
      - Sinhala/English date regex patterns
      - ChatGPT
      - Writing correct regex syntax is time-consuming
      - Detects dd/mm/yyyy, yyyy-mm-dd and Sinhala month names in text
      - AI tier - date guardrail module; rejects hallucinated dates
      - Wrote 12 unit tests and verified edge cases
    - - '4'
      - LangChain map-reduce summarization chain
      - ChatGPT
      - Used as a LangChain API syntax reference
      - Chunks long circulars, summarises each chunk, and returns a combined summary
      - AI tier - summarization stage; provides the prompt pipeline to the Ollama LLM
      - Corrected outdated chain API and rewrote it; evaluated with ROUGE
    - - '5'
      - SHA-256 content-hash cache middleware
      - ChatGPT
      - Repetitive middleware boilerplate
      - Hashes uploaded text and skips re-processing of already processed documents
      - Application tier - Express middleware; reduces LLM cost and latency
      - Confirmed cache hit with a duplicate upload test
    - - '6'
      - JWT authentication middleware skeleton
      - ChatGPT
      - Standard security pattern; redesign not required
      - Verifies Bearer tokens and grants access only to protected routes
      - Application tier - secures all /api/circulars routes
      - Invalid/expired token tests; error handling improved manually
    - - '7'
      - Entity highlighting React component
      - ChatGPT
      - Text offset rendering logic boilerplate
      - Renders entities as colour-coded spans in text according to NER offsets
      - Presentation tier - summary detail view; meets a primary research need (78%)
      - Found and manually fixed an overlapping entity bug
    - - '8'
      - Pytest fixtures and test scaffolding
      - ChatGPT
      - Reduce time spent writing test boilerplate
      - Provides FastAPI TestClient fixtures, sample PDF fixtures and mock LLM responses
      - Testing layer - foundation for the 91 AI service pytest cases
      - All assertions written manually; test logic is the student's work
    - - '9'
      - python-docx thesis generator helpers
      - ChatGPT
      - python-docx XML-level API is complex
      - Provides Iskoola Pota font, 1.5 line spacing, TOC field codes and caption numbering
      - Documentation tooling - outside the artefact; report generation pipeline
      - Verified the generated .docx in Word
    - - '10'
      - Rate limiting configuration
      - ChatGPT
      - express-rate-limit config boilerplate
      - Limits the number of requests per IP within a time window
      - Application tier - prevents abuse and LLM resource exhaustion
      - Confirmed the limit works via a load test script
- title: 4.7 ස්වයංක්‍රීය පරීක්ෂණ
  id: auto
  level: 2
  paragraphs:
  - 'AI සේවා pytest කට්ටලය පරීක්ෂණ අවස්ථා 91ක් ආවරණය කරයි: NER ශ්‍රිත පරීක්ෂණ (entity නිස්සාරණ නිරවද්‍යතාව, entity
    වර්ග වර්ගීකරණය, අභිරුචි EntityRuler රටා ගැලපීම), සාරාංශකරණ පරීක්ෂණ (map-reduce chain, fallback මාදිලිය), guardrail
    පරීක්ෂණ සහ නිස්සාරණ ශ්‍රිත පරීක්ෂණ. Pytest කට්ටලය AI සේවාවේ තීරණාත්මක මාර්ග සවිස්තරව ආවරණය කරයි.'
  - 'Guardrail පරීක්ෂණ අවස්ථා තීරණාත්මක ආරක්ෂක සත්‍යාපනයයි: නිර්මිත දින ප්‍රතික්ෂේප පරීක්ෂණය (මූලාශ්‍රයේ නොමැති
    දින සහිත සාරාංශය හඳුනා ප්‍රතික්ෂේප කිරීම), සත්‍යාපිත දින සමත් පරීක්ෂණය (මූලාශ්‍ර-සත්‍යාපිත දින සහිත සාරාංශය
    පිළිගැනීම), fallback ක්‍රියාකාරී පරීක්ෂණය (ප්‍රතික්ෂේපයෙන් පසු extractive මාදිලිය ක්‍රියාත්මක වීම). Guardrail
    පරීක්ෂණ ආරක්ෂක හැසිරීම තහවුරු කරයි.'
  - 'NER පරීක්ෂණ අවස්ථා entity නිස්සාරණ නිරවද්‍යතාව සත්‍යාපනය කරයි: දින entity පරීක්ෂණය (පරීක්ෂණ පෙළෙහි දන්නා
    දින නිවැරදිව හඳුනා ගැනීම), සංවිධාන entity පරීක්ෂණය (Ministry of Education වැනි සංවිධාන හඳුනා ගැනීම), නීතිමය
    entity පරීක්ෂණය සහ අභිරුචි රටා පරීක්ෂණය. NER පරීක්ෂණ entity pipeline නිවැරදිබව තහවුරු කරයි.'
  - 'Backend පරීක්ෂණ කට්ටලය අවස්ථා 13ක් ආවරණය කරයි: සත්‍යාපන පරීක්ෂණ (ලියාපදිංචිය, login, JWT ටෝකන් වලංගුකරණය,
    ආරක්ෂිත මාර්ග ප්‍රවේශය), චක්‍රලේඛ CRUD පරීක්ෂණ (නිර්මාණය, කියවීම, යාවත්කාලීන, මකා දැමීම), ගොනු උඩුගත පරීක්ෂණ
    සහ සැකසුම් endpoint පරීක්ෂණ. Backend පරීක්ෂණ API ගිවිසුම් අනුකූලතාව සහතික කරයි.'
  - 'පරීක්ෂණ ක්‍රියාත්මක කිරීම: AI සේවා පරීක්ෂණ pytest විධානයෙන් Python අතථ්‍ය පරිසරයේ ධාවනය වේ; backend පරීක්ෂණ
    npm test විධානයෙන් Jest රාමුවේ ධාවනය වේ; CI pipeline එක දෙකම pull request එකකදී ක්‍රියාත්මක කරයි. පරීක්ෂණ
    ක්‍රියාත්මක කිරීම සංවර්ධන කාර්යප්‍රවාහයට ඒකාබද්ධ වේ.'
  - 'පරීක්ෂණ ආවරණ විශ්ලේෂණය: AI සේවාවේ තීරණාත්මක මාර්ග හොඳින් ආවරණය වේ (NER, guardrails); නිස්සාරණ ආන්තික අවස්ථා
    අර්ධ වශයෙන් ආවරණය වේ (අසාමාන්‍ය PDF ආකෘති, අන්ත ලේඛන දිග); ඒකාබද්ධ පරීක්ෂණ සීමිතය. ආවරණ විශ්ලේෂණය අනාගත පරීක්ෂණ
    ප්‍රමුඛතාකරණයට මග පෙන්වයි.'
  - 'Pytest fixtures සහ mocking: test client fixture FastAPI test client සපයයි; mock LLM ප්‍රතිචාර LLM API ඇමතුම
    mock කර නිර්ණයාත්මක පරීක්ෂණ ප්‍රතිදානය සපයයි; නියමු පෙළ fixtures දන්නා entities සහිත පෙළ සපයයි. Fixtures සහ
    mocking පරීක්ෂණ නැවත නිපදවිය හැකිබව සහ වේගය වැඩි දියුණු කරයි.'
  - 'පරීක්ෂණ නඩත්තු උපාය: පරීක්ෂණ නිෂ්පාදන කේතය සමඟ repository එකේ අනුවාද-පාලිතය. නව විශේෂාංග සංවර්ධනයේදී අනුරූප
    පරීක්ෂණ අවස්ථාව ලියයි (පරීක්ෂණ-පාදක සංවර්ධන පරිචය). Refactoring වලදී පරීක්ෂණ යාවත්කාලීන කර සමත් තත්ත්වය පවත්වා
    ගනියි. පරීක්ෂණ නඩත්තුව දිගුකාලීන ගුණාත්මකභාවයට අත්‍යවශ්‍යය.'
  - 'ස්වයංක්‍රීය පරීක්ෂණ සාධක සාරාංශය: 91 pytest සහ backend පරීක්ෂණ 13ක් එකතුවට ස්වයංක්‍රීය පරීක්ෂණ 104ක් සම්පූර්ණ
    පද්ධති සත්‍යාපනය සපයයි. පරීක්ෂණ ප්‍රතිඵල තක්සේරු සාධකයකි: guardrails සත්‍යාපනය කර ඇත, NER නිවැරදිය, API ගිවිසුම්
    පවත්වා ගෙන ඇත. ස්වයංක්‍රීය පරීක්ෂණ ගණන ගුණාත්මකභාව කැපවීම පෙන්වයි.'
  - 'පරීක්ෂණ-පාදක සංවර්ධනය (TDD) අර්ධ අනුග්‍රහණය: guardrail ශ්‍රිත TDD ප්‍රවේශය අනුගමනය කළේය (පළමුව පරීක්ෂණ ලිවීම,
    පසුව ක්‍රියාත්මක කිරීම); අනෙකුත් සංරචක ක්‍රියාත්මක-කිරීම-පළමු පරීක්ෂණය. TDD guardrail සංවර්ධනයට විශේෂයෙන්
    ඵලදායී විය: අපේක්ෂිත හැසිරීම පැහැදිලිව නිර්වචනය විය. අර්ධ TDD ප්‍රායෝගික සමතුලිතතාවකි.'
  - 'අඛණ්ඩ ඒකාබද්ධ කිරීමේ පරීක්ෂණ ක්‍රියාත්මක කිරීම: GitHub Actions workflow එක එක් එක් push/pull request එකේදී
    ස්වයංක්‍රීය පරීක්ෂණ කට්ටලය ධාවනය කරයි. CI කොළ (සියලු පරීක්ෂණ සමත්) merge පූර්ව අවශ්‍යතාවයකි. CI රතු (ඕනෑම
    පරීක්ෂණයක් අසාර්ථක) වහාම අවධානය අවශ්‍ය කරයි. CI අඛණ්ඩ ගුණාත්මකභාව ප්‍රතිපෝෂණ ලූපය සපයයි.'
  - 'පරීක්ෂණ අවස්ථා ප්‍රමුඛතාකරණ උපාය: තීරණාත්මක ආරක්ෂක පරීක්ෂණ (guardrails) ඉහළම ප්‍රමුඛතාව, මූලික ක්‍රියාකාරීත්ව
    පරීක්ෂණ (NER, නිස්සාරණය) ඉහළ ප්‍රමුඛතාව, ආන්තික අවස්ථා පරීක්ෂණ මධ්‍යස්ථ ප්‍රමුඛතාව, අලංකාර පරීක්ෂණ අඩු ප්‍රමුඛතාව.
    ප්‍රමුඛතාකරණය සීමිත සංවර්ධන කාලය තුළ උපරිම අවදානම් ආවරණය සහතික කරයි.'
  - 'Mutation testing සංකල්පය: මූලාශ්‍ර කේතයට හිතාමතා දෝෂ ඇතුළත් කර (mutants) පරීක්ෂණ කට්ටලය mutant හඳුනා ගැනීමේ
    හැකියාව මනියි. Mutation testing පරීක්ෂණ කට්ටල ඵලදායීතාව තක්සේරු කරයි: ඉහළ mutation ලකුණු පරීක්ෂණ දෝෂ හඳුනා
    ගැනීමට හොඳින් ක්‍රියා කරන බව දක්වයි. Mutation testing Phase 6 පරීක්ෂණ වැඩිදියුණු කිරීමක් ලෙස නිර්දේශ කරයි.'
  - 'පරීක්ෂණ පරිසර හුදකලාව: pytest fixtures පරීක්ෂණ දත්ත සමුදාය සංවර්ධන දත්ත සමුදායෙන් වෙන් කරයි; mock වස්තු බාහිර
    සේවා (Ollama) යැපීම හුදකලා කරයි; තාවකාලික ගොනු පරීක්ෂණ ක්‍රියාත්මක කිරීමෙන් පසු පිරිසිදු කරයි. පරිසර හුදකලාව
    පරීක්ෂණ නැවත නිපදවිය හැකිබව සහ පැති බලපෑම් වළක්වයි.'
  - Pytest suite guardrails සහ security paths ප්‍රමුඛ කරයි. Invented date rejection සහ auth 401 tests අත්‍යවශ්‍යය.
  - Backend tests JWT සහ upload validation ආවරණය කරයි. මෙය regression අවදානම අඩු කරයි.
  - CI pipeline lint සහ unit tests ධාවනය කරන අතර Docker-based verifiers දේශීයව ධාවනය වේ.
  - UI critical path සඳහා Selenium IDE suite එකක්ද භාවිත කරන ලදී (docs/thesis/selenium/easycircular.side).
    එය pytest සහ backend ඒකක පරීක්ෂණවලට අමතරව sign-in, PDF උඩුගත කිරීම, පෙළ නිස්සාරණය, සාරාංශ ජනනය සහ
    non-PDF rejection (Table 4.4 TC 1) browser තුළ පරීක්ෂා කරයි. පහත රූප Selenium IDE 3.17.2
    UI එකේ test ලැයිස්තුව, TC-UI-03 command table එක සහ TC-UI-04 Reject non-PDF පෙන්වයි.
