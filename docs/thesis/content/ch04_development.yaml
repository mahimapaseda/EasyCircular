- title: 4.8 අදියර සත්‍යාපන scripts
  id: phase
  level: 2
  paragraphs:
  - verify-phase1.mjs script එක AI service, backend, frontend සහ MongoDB යන සියලු සේවාවන්ගේ health checks සිදු කරයි.
    සියලු සේවා ක්‍රියාත්මක වන විට පමණක් අදියර 1 සමත් වේ.
  - verify-phase4.mjs script එක authenticated upload සිට නිස්සාරණය සහ සැකසීම දක්වා end-to-end MVP ප්‍රවාහය පරීක්ෂා
    කරයි. එසේම authentication නොමැතිව process ඉල්ලීමක් යැවූ විට HTTP 401 ප්‍රතිචාරය ලැබෙන බව තහවුරු කරයි.
  - මෙම scripts මගින් ලබා දෙන ප්‍රතිඵල නැවත ලබා ගත හැකි (reproducible) බැවින්, තෙවන පාර්ශවයකට ද පද්ධතියේ ක්‍රියාකාරිත්වය
    ස්වාධීනව සත්‍යාපනය කළ හැක.
  - පහත code screenshots මගින් Phase 1 health exit gate සහ Phase 4 MVP verifier හි තීරණාත්මක කොටස් පෙන්වා ඇත.
    පළමු රූපය verify-phase1.mjs (AI/backend/frontend /health); දෙවන රූපය verify-phase4.mjs හි upload 401
    සහ upload-extract-process flow checks වේ.
