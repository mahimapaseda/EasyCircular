  id: pipeline
  level: 2
  paragraphs:
  - 'PDF pipeline: pdfplumber primary, PyMuPDF fallback, Tesseract OCR (sin+eng+tam), post-processing, human review,
    SHA-256 content hash.'
  - පහත algorithm flowchart එක upload සිට summary display දක්වා පූර්ණ ක්‍රියාවලිය පෙන්වයි.
  bullets: []
  numbered: []
  figures:
