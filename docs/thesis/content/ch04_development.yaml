  - ui_summary_detail
- title: 4.3 සත්‍යාපනය සහ ආරක්ෂාව ක්‍රියාත්මක කිරීම
  id: security
  level: 2
  paragraphs:
  - JWT auth, AI service token, rate limiting, CORS whitelist සහ PDF magic-byte validation. Local Ollama මගින් privacy
    concerns ආමන්ත්‍රණය කෙරේ.
  bullets: []
  numbered: []
  figures: []
- title: 4.4 සංවර්ධන අවදානම් අවම කිරීම
  id: risk_table
  level: 2
  paragraphs:
  - Table 4.1 අවදානම් සහ mitigations.
  bullets: []
  numbered: []
  figures: []
  table:
    caption: 'Table 4.1: සංවර්ධන අවදානම් සහ mitigation strategies'
    headers:
    - Risk
    - Impact
    - Mitigation (Implemented)
    rows:
    - - Poor PDF extraction
      - High
      - pdfplumber + PyMuPDF + Tesseract + human edit
    - - LLM hallucination
      - Critical
      - Date guardrails + extractive fallback
    - - API / LLM cost
      - Medium
      - Content-hash cache + local Ollama
    - - Sinhala NLP gap
      - High
      - OCR + extractive SI/TA; NER Phase 6
    - - UAT rejection of AI
      - Medium
      - Human-in-the-loop + self-hosted stack
- title: 4.5 API අන්ත ලක්ෂ්‍ය
  id: api
  level: 2
  paragraphs:
  - Table 4.2 ප්‍රධාන REST API endpoints ලැයිස්තුගත කරයි. විස්තීර්ණ ලැයිස්තුව appendix එකේ ඇත.
  - Backend Express router (backend/src/index.js) මගින් /api/auth, /api/circulars සහ /api/moe
    යන prefix තුන mount කරයි. චක්‍රලේඛ කාර්යප්‍රවාහය circulars.js හි ක්‍රියාත්මක වන අතර AI සේවාව
    FastAPI routes_v1.py හි /v1/parse/pdf සහ /v1/pipeline endpoints සපයයි.
  - පහත code screenshots මගින් Table 4.2 හි තීරණාත්මක endpoints තුනක ක්‍රියාත්මක කිරීම පෙන්වා ඇත.
    පළමු රූපය JWT-ආරක්ෂිත PDF උඩුගත route එකයි; දෙවන රූපය process route එකයි (NER + සාරාංශ);
    තෙවන රූපය AI microservice හි parse සහ pipeline handlers වේ.
