- title: 4.2 NER සහ summarization ක්‍රියාත්මක කිරීම
  id: ai
  level: 2
  paragraphs:
  - 'AI service හි /v1/pipeline අන්ත ලක්ෂ්‍යය පියවර කිහිපයක් ඒකාබද්ධව ක්‍රියාත්මක කරයි: SpaCy මගින් NER (DATE, ORG,
    LAW වර්ග), ක්‍රියාකාරී අයිතම හඳුනා ගැනීම, LangChain map-reduce සාරාංශකරණය සහ date guardrails මගින් සත්‍යාපනය.'
  - Guardrail පරීක්ෂාව අසාර්ථක වූ විට හෝ LLM එකට ප්‍රවේශ විය නොහැකි විට පද්ධතිය extractive TextRank ආකාරයේ fallback
    මාදිලියට මාරු වේ. මෙය පද්ධතිය සෑම විටම ප්‍රයෝජනවත් output එකක් ලබා දෙන බව සහතික කරන අතර hallucination අවදානම
    අවම කරයි.
  - පහත රූප මගින් ක්‍රියාත්මක කළ pipeline එකේ ප්‍රතිදානය පෙන්වා ඇත. පළමු රූපයේ LLM විසින් ජනනය කළ ව්‍යුහගත සාරාංශය
    (circular අංකය, නිකුත් කළ ආයතනය, ඉලක්ක පිරිස, sections සහ action items) ඉදිරිපත් වන අතර, දෙවන රූපයේ මූලාශ්‍ර
    පෙළ මත SpaCy NER මගින් හඳුනා ගත් entities වර්ණ ලේබල සමඟ ඉස්මතු කර ඇත.
  bullets: []
  numbered: []
  figures:
