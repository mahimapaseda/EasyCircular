  numbered: []
  figures: []
- title: 4.9 නියෝජිත පරීක්ෂණ අවස්ථා
  id: test_cases
  level: 2
  paragraphs:
  - පහත Table 4.4 මගින් Session Three guideline ආකෘතියට අනුව Expected Result සහ Actual Result තීරු ඇතුළත් කර නියෝජිත
    පරීක්ෂණ අවස්ථා ඉදිරිපත් කර ඇත.
  - 'TC #1 විශේෂයෙන් වැදගත් වේ. AI මෙවලමක් විසින් මුලින් යෝජනා කළ upload handler එකේ file type validation නොතිබූ
    බැවින්, එය අතින් එකතු කර මෙම පරීක්ෂණය මගින් සත්‍යාපනය කරන ලදී - AI-generated code සමාලෝචනය කිරීමේ අවශ්‍යතාව
    මෙය පැහැදිලිව පෙන්වයි.'
