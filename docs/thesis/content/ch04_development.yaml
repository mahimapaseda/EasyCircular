- title: 4.3 සත්‍යාපනය සහ ආරක්ෂාව ක්‍රියාත්මක කිරීම
  id: security
  level: 2
  paragraphs:
  - JWT auth, AI service token, rate limiting, CORS whitelist සහ PDF magic-byte validation. Local Ollama මගින් privacy
    concerns ආමන්ත්‍රණය කෙරේ.
  bullets: []
  numbered: []
  figures: []
- title: 4.4 සංවර්ධන අවදානම් අවම කිරීම
  id: risk_table
  level: 2
  paragraphs:
  - Table 4.1 අවදානම් සහ mitigations.
  bullets: []
  numbered: []
  figures: []
  table:
    caption: 'Table 4.1: සංවර්ධන අවදානම් සහ mitigation strategies'
    headers:
    - Risk
    - Impact
    - Mitigation (Implemented)
    rows:
    - - Poor PDF extraction
      - High
      - pdfplumber + PyMuPDF + Tesseract + human edit
    - - LLM hallucination
