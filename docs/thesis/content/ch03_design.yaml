      - Next.js, TypeScript, Tailwind CSS
      - 14.x App Router, port 3002
    - - Backend
      - Node.js, Express, Mongoose
      - 20.x, port 4000
    - - AI Service
      - Python, FastAPI, Uvicorn
      - 3.11, port 5000
    - - Database
      - MongoDB
      - 7.x, port 27017
    - - PDF Processing
      - pdfplumber, PyMuPDF
      - Dual-library extraction
    - - OCR
      - Tesseract, pytesseract
      - sin + eng + tam
    - - NLP / LLM
      - SpaCy, LangChain, Ollama
      - en_core_web_sm; llama3.2:3b
    - - Auth / Security
      - JWT, bcrypt, rate-limit
      - AI_SERVICE_TOKEN
    - - DevOps
      - Docker Compose, GitHub Actions
      - verify:phase scripts
