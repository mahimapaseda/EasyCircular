- title: 5.6 AI සහායක සංවර්ධනයේ ප්‍රතිඵල සහ සාකච්ඡාව
  id: ai_dev_results
  level: 2
  paragraphs:
  - මෙම කොටස නිපැයුමේ ක්‍රියාකාරී තක්සේරුවට අමතරව, සංවර්ධන ක්‍රියාවලියේදී generative AI භාවිතයේ ප්‍රතිඵල තක්සේරු
    කරයි. කොටස 4.6 හි ලේඛනගත කළ AI-assisted artefacts දහය අතරින් බොහොමයක් boilerplate හෝ configuration ස්වභාවයේ
    වූ අතර නිර්මාණාත්මක හෝ වසම-විශේෂිත තීරණ AI වෙත පවරා නොමැත.
  - 'ධනාත්මක ප්‍රතිඵලය ලෙස, පුනරාවර්තී සැකසුම් කාර්යයන් සඳහා ගතවන කාලය අඩු වී, OCR නිරවද්‍යතාව, hallucination පාලනය සහ pipeline නිර්මාණය වැනි මූලික අභියෝග සඳහා වැඩි කාලයක් යෙදවීමට හැකි විය. එහෙත් AI යෝජනා කිහිපයක වැදගත් දෝෂ තිබුණි: යල් පැන ගිය library API භාවිතය, upload මාර්ගයේ file-type validation නොමැතිකම, සහ entity highlighting හි overlapping span ගැටලුව. මේවා code review සහ පරීක්ෂණ මගින් හඳුනාගෙන නිවැරදි කරන ලදී.'
  - මෙම නිරීක්ෂණයෙන් ලැබෙන තක්සේරු පාඩම වන්නේ AI මෙවලම් සහායක පමණක් බවයි. විශේෂයෙන් සිංහල Unicode සහ ශ්‍රී ලංකා
    පරිපාලන ලේඛන ආකෘති වැනි අඩු නියෝජනයක් ඇති වසම්වලදී AI යෝජනා විශ්වාසදායක නොවිය හැක. ඵලදායිතා ලාභය ආරක්ෂා කිරීමට
    හොඳම ක්‍රමය වන්නේ අඩු අවදානම් කාර්යයන්ට AI භාවිතය සීමා කර, සෑම යෝජනාවක්ම මානව සමාලෝචනයකින් සහ ස්වයංක්‍රීය
    පරීක්ෂණයකින් ආවරණය කිරීමයි. අවසාන නිපැයුමේදී AI-assisted code සම්බන්ධ දෝෂ ඉතිරි නොවූ බව ස්වයංක්‍රීය පරීක්ෂණ
    කට්ටලය සමත් වීමෙන් තහවුරු වේ.
  bullets: []
  numbered: []
  figures: []
- title: 5.7 AI සහායක සංවර්ධනයේ ආචාර ධාර්මික තක්සේරුව
  id: ai_ethics
  level: 2
  paragraphs:
  - මෙම කොටස generative AI භාවිතයේ ආචාර ධාර්මික සහ අධ්‍යයන අවංකභාවය සම්බන්ධ තක්සේරුවක් ඉදිරිපත් කරයි. විශ්වවිද්‍යාල
    මාර්ගෝපදේශ අනුව AI සහාය ලබා ගත් කේත ප්‍රකාශ කිරීම, ඒවායේ ක්‍රියාකාරිත්වය පැහැදිලි කිරීම සහ system design එකට
    ගැලපෙන ආකාරය ලේඛනගත කිරීම අනිවාර්ය වේ. එම අවශ්‍යතාව කොටස 4.6, Appendix E සහ References ලැයිස්තුව මගින් සම්පූර්ණ
    කර ඇත.
  - විනිවිදභාවය අනුව, භාවිත කළ මෙවලම Harvard ආකෘතියෙන් උපුටා දක්වා ඇති අතර AI-assisted artefacts දහයක් හේතුව, ක්‍රියාකාරිත්වය
    සහ design fit සමඟ ලේඛනගත කර ඇත. අවබෝධය අනුව, සෑම යෝජනාවක්ම කියවා තේරුම් ගැනීම අනිවාර්ය පියවරක් විය. වගකීම
    අනුව, අවසාන නිපැයුමේ නිරවද්‍යතාව, ආරක්ෂාව සහ ක්‍රියාකාරිත්වය සම්බන්ධයෙන් වගකීම සම්පූර්ණයෙන් ශිෂ්‍යයා දරයි.
  - දත්ත රහස්‍යතාව අනුව, සැබෑ අමාත්‍යාංශ චක්‍රලේඛ අන්තර්ගතය, පරිශීලක දත්ත හෝ credentials AI මෙවලම් වෙත යවා නොමැත.
    AI සහාය ලබා ගත්තේ පොදු programming pattern සහ library syntax සම්බන්ධ ප්‍රශ්න සඳහා පමණි. සමස්තයක් ලෙස, AI මෙවලම්
    ඵලදායිතා සහායක ලෙස භාවිත කිරීම පූර්ණ ප්‍රකාශනය සහ පරීක්ෂණ මගින් සත්‍යාපනය සමඟ ඒකාබද්ධ වූ විට අධ්‍යයන අවංකභාවයට
    හානි නොවන පිළිගත හැකි භාවිතයක් බව තක්සේරු කෙරේ.
