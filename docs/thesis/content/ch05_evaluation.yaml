- title: 5.6 AI සහායක සංවර්ධනයේ ප්‍රතිඵල සහ සාකච්ඡාව
  id: ai_dev_results
  level: 2
  paragraphs:
  - නිපැයුම සංවර්ධනය කිරීමේදී generative AI මෙවලම් භාවිත කිරීමෙන් ලැබුණු ප්‍රායෝගික ප්‍රතිඵල මෙම කොටසේ සාකච්ඡා කෙරේ.
    කොටස 4.6 හි ලේඛනගත කළ AI-assisted artefacts 10 අතරින් 7ක් boilerplate හෝ configuration ස්වභාවයේ කාර්යයන් වූ
    අතර 3ක් utility logic විය. නිර්මාණාත්මක හෝ වසම-විශේෂිත තීරණ කිසිවක් AI වෙත පවරා නොමැත.
  - 'ධනාත්මක ප්‍රතිඵල: docker-compose සැකසුම, pytest fixtures සහ python-docx helpers වැනි කාර්යයන් සඳහා ගතවන කාලය
    සැලකිය යුතු ලෙස අඩු විය. විශේෂයෙන් python-docx හි XML මට්ටමේ API එක සංකීර්ණ බැවින්, එහි syntax reference එකක්
    ලෙස AI සහාය ලබා ගැනීම ලේඛනගත කිරීමේ කාර්යය වේගවත් කළේය. මෙය Agile sprint කාලසීමා තුළ AI core සංවර්ධනයට වැඩි
    කාලයක් යෙදවීමට ඉඩ ලබා දුන්නේය.'
  - 'සෘණාත්මක ප්‍රතිඵල සහ අවදානම්: AI යෝජනා තුනක් සැලකිය යුතු දෝෂ ඇතුළත් කර තිබුණි. පළමුව, LangChain summarization
    chain එක යල් පැන ගිය API භාවිත කළ බැවින් සම්පූර්ණයෙන් නැවත ලිවීමට සිදු විය. දෙවනුව, upload handler එකේ file
    type validation නොතිබූ බැවින් PDF magic-byte පරීක්ෂාව අතින් එකතු කිරීමට සිදු විය (Table 4.4, TC #1). තෙවනුව,
    entity highlighting component එකේ overlapping spans නිවැරදිව හඳුනා නොගත් බැවින් Sinhala Unicode grapheme cluster
    offsets සම්බන්ධයෙන් නිවැරදි කිරීමක් අවශ්‍ය විය.'
  - 'සාකච්ඡාව: මෙම නිරීක්ෂණ මගින් AI මෙවලම් ''සහායක'' ලෙස පමණක් සලකා බැලීමේ අවශ්‍යතාව තහවුරු වේ. AI යෝජනා නිවැරදි
    යැයි උපකල්පනය කිරීම ආරක්ෂක සහ ක්‍රියාකාරී දෝෂ ඇති කළ හැක. විශේෂයෙන් සිංහල Unicode සහ ශ්‍රී ලංකා පරිපාලන ලේඛන
    ආකෘති වැනි අඩු නියෝජනයක් ඇති වසම් සඳහා AI යෝජනා විශ්වාසදායක නොවේ - මෙය මෙම ව්‍යාපෘතියේ නිරීක්ෂණය කළ පැහැදිලි
    සීමාවකි.'
  - 'පාඩම: AI සහායක සංවර්ධනයේ ඵලදායිතා ලාභය ලබා ගැනීමට හොඳම ක්‍රමය වන්නේ AI භාවිතය අඩු අවදානම් සහිත, පහසුවෙන් පරීක්ෂා
    කළ හැකි කාර්යයන්ට සීමා කර, සෑම යෝජනාවක්ම automated test එකකින් ආවරණය කිරීමයි. මෙම ප්‍රවේශය ව්‍යාපෘතිය පුරා අනුගමනය
    කරන ලද අතර, AI-assisted code සම්බන්ධ දෝෂ නිපැයුමේ අවසාන අනුවාදයට ගමන් නොකළ බව pytest 91 සහ backend පරීක්ෂණ 13
    සමත් වීමෙන් තහවුරු වේ.'
  bullets: []
  numbered: []
  figures: []
- title: 5.7 AI සහායක සංවර්ධනයේ ආචාර ධාර්මික තක්සේරුව
  id: ai_ethics
  level: 2
  paragraphs:
  - මෙම කොටස මගින් ව්‍යාපෘති සංවර්ධනයේදී generative AI මෙවලම් භාවිත කිරීමේ ආචාර ධාර්මික සහ අධ්‍යයන අවංකභාවය සම්බන්ධ
    තක්සේරුවක් ඉදිරිපත් කෙරේ. විශ්වවිද්‍යාල මාර්ගෝපදේශ අනුව AI සහාය ලබා ගත් සියලු කේත ප්‍රකාශ කර, ඒවායේ ක්‍රියාකාරිත්වය
    සහ system design එකට ගැලපෙන ආකාරය පැහැදිලි කිරීම අනිවාර්ය වේ. එම අවශ්‍යතාව කොටස 4.6, Appendix E සහ References
    ලැයිස්තුව මගින් සම්පූර්ණ කර ඇත.
  - 'විනිවිදභාවය: භාවිත කළ මෙවලම (OpenAI ChatGPT) Harvard ආකෘතියෙන් උපුටා දක්වා ඇත. AI-assisted code artefacts 10ක්
    හඳුනාගෙන එක් එක් අයිතමය සඳහා භාවිත කිරීමට හේතුව, ක්‍රියාකාරිත්වය සහ design fit ලේඛනගත කර ඇත.'
  - 'අවබෝධය (understanding): AI මෙවලමක් කේතයක් ලබා දුන් විට එය සරලව copy කිරීම අධ්‍යයන අවංකභාවයට පටහැනි වේ. එබැවින්
    සෑම යෝජනාවක්ම කියවා තේරුම් ගැනීම අනිවාර්ය පියවරක් ලෙස පවත්වා ගන්නා ලදී. LangChain chain එකේ යල් පැන ගිය API
    එක හඳුනාගෙන නැවත ලිවීමට හැකි වූයේ මෙම අවබෝධය නිසාය.'
  - 'වගකීම (accountability): අවසාන නිපැයුමේ නිරවද්‍යතාව, ආරක්ෂාව සහ ක්‍රියාකාරිත්වය සම්බන්ධයෙන් වගකීම සම්පූර්ණයෙන්
    ශිෂ්‍යයා දරයි. AI යෝජනාවක වැරැද්දක් තිබුණ ද එය හඳුනා ගැනීම සහ නිවැරදි කිරීම සංවර්ධකයාගේ වගකීම වේ - TC #1 මගින්
    මෙය නිරූපණය කෙරේ.'
  - 'දත්ත රහස්‍යතාව: AI මෙවලම් වෙත සැබෑ MOE චක්‍රලේඛ අන්තර්ගතය, පරිශීලක දත්ත හෝ credentials කිසිවිටෙකත් යවා නොමැත.
    AI සහාය ලබා ගත්තේ පොදු programming pattern සහ library syntax සම්බන්ධ ප්‍රශ්න සඳහා පමණි. මෙය ව්‍යාපෘතියේ privacy-first
    දර්ශනය සමඟ අනුකූල වේ.'
  - 'නිගමනය: AI මෙවලම් ඵලදායිතා සහායක ලෙස භාවිත කිරීම, පූර්ණ ප්‍රකාශනය සහ පරීක්ෂණ මගින් සත්‍යාපනය සමඟ ඒකාබද්ධ වූ
    විට, අධ්‍යයන අවංකභාවයට හානි නොවන පිළිගත හැකි භාවිතයක් වේ. මෙම නිබන්ධනය එම ප්‍රමිතිය පිළිපදින බව තහවුරු කරමි.'
