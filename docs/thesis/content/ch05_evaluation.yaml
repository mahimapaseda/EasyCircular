title: 5. තක්සේරුව (Evaluation)
sections:
- title: 5.1 මෙහෙයුම් ප්‍රතිඵල
  id: ops
  level: 2
  paragraphs:
  - 'අදියර සත්‍යාපන scripts මගින් නිශ්චිත මෙහෙයුම් සාක්ෂි ලබා දේ. npm run verify:phase1 විධානය August 2026 හි ක්‍රියාත්මක
    කළ විට ලැබුණු ප්‍රතිඵල: AI service GET /health එකෙන් 200 OK; Backend GET /health එකෙන් 200 OK (MongoDB සම්බන්ධ
    සහ AI ලබා ගත හැකි බව සමඟ); Frontend http://localhost:3002 එකෙන් 200 OK. එබැවින් ත්‍රිස්ථර සියල්ල Docker Compose
    stack තුළ ක්‍රියාකාරී විය.'
  - 'npm run verify:phase4 විධානය ක්‍රියාත්මක කළ විට: authentication නොමැති POST /api/circulars/:id/process ඉල්ලීමට
    401 Unauthorized ලැබුණි; authentication සහිත ප්‍රවාහයේ test-digital.pdf සඳහා upload, නිස්සාරණය සහ සැකසීම සම්පූර්ණ
    වී සාරාංශය සහ entities ලැබුණි. එබැවින් අදියර 4 exit gate සමත් බව තහවුරු විය.'
  - 'PDF නිස්සාරණ කාර්ය සාධනය: test-digital.pdf (digital-born ඉංග්‍රීසි චක්‍රලේඛයක්) සඳහා pdfplumber නිස්සාරණය ආසන්න
    වශයෙන් තත්පර 1.2ක් ගත විය. OCR fallback සහිත scanned නියැදි සඳහා ලේඛනයකට සාමාන්‍යයෙන් තත්පර 6.8ක් ගත විය (Tesseract
    sin+eng+tam). පරිශීලකයා සමාලෝචන පියවරේ රැඳී සිටින human-in-the-loop ප්‍රවාහයක් සඳහා මෙය පිළිගත හැකි කාලයකි.'
  - 'AI සැකසුම් කාර්ය සාධනය: ලේඛන දිගට අනුව cold LLM ඇමතුමක් (Ollama llama3.2:3b) තත්පර 8-15ක් ගත විය. එකම content
    hash එකක් සහිත cached සැකසුමක් ආසන්න වශයෙන් 114ms තුළ ලැබුණි - මෙය MongoDB cache hit එකක් වන අතර AI service
    ඇමතුමක් සිදු නොවේ. සුළු සංස්කරණයකින් පසු hash එක වෙනස් වන බැවින් cache ඵලදායිතාව අඩු වන නමුත් නිශ්චිත නැවත ක්‍රියාත්මක
    කිරීම් (demo අවස්ථා) සඳහා ඉතා ඉහළ වේ.'
  - 'නියැදි තක්සේරුව (scripts/sample-evaluation.json): චක්‍රලේඛ 8ක් සකසන ලදී. Entity ගණන් වෙනස් විය: ලේඛනයකට DATE
    entities 3-12, ORG 2-8, LAW 0-4 සහ ක්‍රියාකාරී අයිතම 4-15. Scanned නියැදි 8න් 2ක් සඳහා OCR flag සත්‍ය විය. පිටු
    ගණන 2 සිට 18 දක්වා විය.'
  - 'පද්ධති ලබා ගත හැකි බව: Docker Compose restart policy ලෙස ''unless-stopped'' යොදා ඇති අතර health endpoints monitoring
    ඒකාබද්ධ කිරීමට සුදුසු වේ. production uptime SLA එකක් ප්‍රකාශ නොකරයි - මෙය development සහ staging සැකසුමක් පමණි.'
  bullets: []
  numbered: []
  figures: []
- title: 5.2 ROUGE තක්සේරු ප්‍රතිඵල
  id: rouge_results
  level: 2
  paragraphs:
  - 'ROUGE තක්සේරුව docs/evaluation/rouge-report.json ගොනුවේ ලේඛනගත කර ඇත. යොමු චක්‍රලේඛ 6ක් fallback හෝ extractive
    මාදිලියේ තක්සේරු කරන ලදී - Ollama මත යැපීමකින් තොරව නැවත ලබා ගත හැකි බැවිනි. Macro සාමාන්‍ය අගයන්: ROUGE-1 F1
    = 0.414, ROUGE-2 F1 = 0.215, ROUGE-L F1 = 0.292.'
  - 'ලේඛනයෙන් ලේඛනයට වෙනස්කම්: චක්‍රලේඛ 12-2026 ඉහළම ROUGE-1 අගය (0.416) ලබා දුන් අතර චක්‍රලේඛ 10-2026 හි ROUGE-2
    අගය 0.183 විය. boilerplate පෙළ වැඩි දිගු ලේඛනවල ROUGE-2 අගය අඩු වේ - bigram අතිච්ඡාදනය පරිපාලන වාක්‍ය රටාවලට
    ඉතා සංවේදී වන බැවිනි.'
  - 'සාකච්ඡාව: ROUGE-1 අගය ආසන්න වශයෙන් 0.41 වීම මානව යොමු සාරාංශ සමඟ මධ්‍යම මට්ටමේ unigram අතිච්ඡාදනයක් පෙන්වයි
    - extractive fallback එකක් සඳහා පිළිගත හැකි පදනමකි. ROUGE-2 අගය ආසන්න වශයෙන් 0.22 දක්වා අඩු වන්නේ extractive
    මාදිලියේ පවා වාක්‍ය තෝරා ගැනීම මානව සාරාංශයේ තෝරා ගැනීමෙන් වෙනස් වන බැවිනි. ROUGE-L අගය ආසන්න වශයෙන් 0.29 වීම
    අර්ධ ව්‍යුහාත්මක අනුකූලතාවක් නිරූපණය කරයි.'
  bullets: []
  numbered: []
  figures: []
  table_ref: rouge
  table_caption: 'Table 5.1: ROUGE evaluation results - sample MOE circulars'
- title: 5.3 නියමු චක්‍රලේඛ තක්සේරුව
  id: sample_eval
  level: 2
  paragraphs:
  - ගුණාත්මක නියැදි තක්සේරුව මගින් ROUGE ප්‍රමාණාත්මක මිනුම්වලට අනුපූරක සාක්ෂි ලබා දේ. Table 5.2 මගින් නියැදි PDF
    අටක පිටු ගණන, OCR භාවිතය, entity නිස්සාරණ ගණන් සහ ක්‍රියාකාරී අයිතම සාරාංශගත කර ඇත.
  - 'නිරීක්ෂණ: Digital PDF ලේඛනවල DATE සහ ORG නිස්සාරණ නිරවද්‍යතාව ඉහළ විය. Scanned සිංහල පිටුවල OCR පෙළ අපැහැදිලි
    (noisy) වූ බැවින් සැකසීමට පෙර පරිශීලක සංස්කරණ පියවර ඉතා වැදගත් විය. නීතිමය කොටස් යොමු ඇති ලේඛන LAW entity රටා
    ක්‍රියාත්මක කළේය. ක්‍රියාකාරී අයිතම හඳුනා ගැනීම ''directed'', ''instructed'' සහ ''should'' වැනි යෙදුම්වල ඝනත්වය
    සමඟ සහසම්බන්ධ විය.'
  bullets: []
  numbered: []
  figures: []
  table_ref: sample_eval
  table_caption: 'Table 5.2: Sample circular processing evaluation'
- title: 5.4 LLM සහ fallback මාදිලි සාකච්ඡාව
  id: llm
  level: 2
  paragraphs:
  - 'පද්ධතිය තුළ සාරාංශකරණ මාදිලි දෙකක් ක්‍රියාත්මක වේ: LLM මාදිලිය (Ollama හෝ API ලබා ගත හැකි විට සහ guardrails
    සමත් වූ විට) සහ fallback මාදිලිය (extractive, TextRank ආකාරයේ). ප්‍රතිඵල නැවත ලබා ගත හැකි (reproducible) බව
    සහතික කිරීම සඳහා තක්සේරුව ප්‍රධාන වශයෙන් fallback මාදිලියේ සිදු කරන ලදී. LLM මාදිලිය වඩා සිනිඳු (fluent) සාරාංශ
    ලබා දුන් නමුත් පරීක්ෂණ කට්ටලයේ guardrail ප්‍රතික්ෂේප අනුපාතය ආසන්න වශයෙන් 15% විය - ප්‍රධාන හේතුව මුල් ලේඛනයේ
    නොමැති දින ජනනය කිරීමයි.'
  - 'Trade-off විශ්ලේෂණය: LLM මාදිලිය කියවීමේ පහසුව වැඩි කරයි (සමීක්ෂණයේ 97.6% සාරාංශයක් අවශ්‍ය බව පැවසූ බැවින්
    fluency වැදගත් වේ) නමුත් hallucination අවදානම නිසා guardrails අනිවාර්ය වේ. Fallback මාදිලිය ROUGE අගයන් අනුව
    තරඟකාරී වන අතර දින සම්බන්ධයෙන් hallucination ශුන්‍ය වේ (නව පෙළ ජනනය නොකරන බැවින්), එහෙත් සාරාංශය තරමක් දිගු
    වේ. නිර්දේශිත production හැසිරීම වන්නේ LLM මාදිලිය default ලෙස තබා guardrail අසාර්ථක වූ විට ස්වයංක්‍රීයව fallback
    වීමයි - මෙය දැනටමත් ක්‍රියාත්මක කර ඇත.'
  - Ollama llama3.2:3b දේශීය ආකෘතිය රහස්‍යතා වාසියක් ලබා දෙයි (සමීක්ෂණයේ 68.3% AI භාවිතයට සෘජුව කැමති නොවූ බැවින්
    මෙය වැදගත්) නමුත් ගුණාත්මකභාවය GPT-4 පන්තියේ ආකෘතිවලට වඩා අඩුය. LLM_PROVIDER environment variable එක මගින් ollama,
    openai හෝ gemini අතර මාරු විය හැක. පිරිවැය අනුව දේශීය ක්‍රියාත්මක කිරීම hardware පිරිවැයට පමණක් සීමා වන අතර
    cloud විකල්පය per-token පිරිවැයක් දරයි - එය content-hash cache එක මගින් අවම කර ඇත.
  - Entity නිස්සාරණය LLM මාදිලියෙන් ස්වායත්ත වේ - SpaCy සෑම විටම ක්‍රියාත්මක වේ. එබැවින් සාරාංශ මාදිලිය NER නිරවද්‍යතාවට
    බලපෑම් නොකරයි. ක්‍රියාකාරී අයිතම (action items) heuristic පදනම මත හඳුනා ගන්නා බැවින් මාදිලි දෙකේම එකසේ ක්‍රියා
    කරයි.
