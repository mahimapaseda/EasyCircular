- title: 5.4 LLM සහ fallback මාදිලි සාකච්ඡාව
  id: llm
  level: 2
  paragraphs:
  - EasyCircular තුළ සාරාංශකරණ මාදිලි දෙකක් ක්‍රියාත්මක වේ. LLM මාදිලිය දේශීය Ollama හෝ වින්‍යාසගත API ලබා ගත
    හැකි විටත් date guardrails සමත් වූ විටත් abstractive සාරාංශයක් ජනනය කරයි. Fallback මාදිලිය TextRank ආකාරයේ
    extractive තේරීමක් භාවිත කරයි. තක්සේරුවේ ප්‍රධාන වාර්තාකරණය fallback මත පදනම් වූයේ නැවත ලබා ගත හැකි බව සහ
    බාහිර සේවා යැපීම අවම කිරීම සඳහාය.
  - මාදිලි දෙක අතර වෙළඳාසිය පැහැදිලිය. LLM මාදිලිය කියවීමේ පහසුව වැඩි කරයි. මූලික සමීක්ෂණයේදී 97.6% ක් සාරාංශයක්
    අවශ්‍ය බව පැවසූ බැවින් fluency ප්‍රායෝගිකව වැදගත්ය. එහෙත් නිරීක්ෂිත guardrail ප්‍රතික්ෂේප අනුපාතය ආසන්න වශයෙන්
    15% වූ අතර ප්‍රධාන හේතුව මූලාශ්‍රයේ නොමැති දින ජනනයයි. Fallback මාදිලිය දින hallucination අවදානම බොහෝ දුරට
    ඉවත් කරන නමුත් සාරාංශය තරමක් දිගු සහ අඩු සිනිඳු විය හැක. නිර්දේශිත හැසිරීම වන්නේ LLM default ලෙස තබා guardrail
    අසාර්ථක වූ විට ස්වයංක්‍රීයව fallback වීමයි - එය දැනටමත් ක්‍රියාත්මකය.
  - 'දේශීය llama3.2:3b තේරීම රහස්‍යතා අවශ්‍යතාවට අනුකූල වේ. සමීක්ෂණයේ 68.3% ක් AI භාවිතයට සෘජුව කැමති නොවූ බැවින් දත්ත පරිශීලක පරිසරයෙන් පිටත යැවීම අවම කිරීම වැදගත් විය. Entity නිස්සාරණය SpaCy මගින් සාරාංශ මාදිලියෙන් ස්වායත්තව ක්‍රියාත්මක වන බැවින්, සාරාංශ මාදිලි මාරුව NER නිරවද්‍යතාවට සෘජුව බල නොපායි.'
  - අවසාන වශයෙන්, පාසල් කාර්ය මණ්ඩලය ජංගම උපාංග භාවිත කරන බැවින් සාරාංශ ප්‍රතිඵල කුඩා තිර මතද කියවිය හැකි බව
    තක්සේරුවේ ප්‍රායෝගික මානයකි. පහත රූප mobile dashboard සහ summary අතුරුමුහුණත් පෙන්වයි.
