- title: 5.5 UAT තත්ත්වය සහ ඉලක්ක සමඟ තක්සේරු සම්බන්ධය
  id: uat
  level: 2
  paragraphs:
  - පාසල් කාර්ය මණ්ඩලය සමඟ විධිමත් පරිශීලක පිළිගැනීමේ පරීක්ෂණය (UAT) මෙම ඉදිරිපත් කිරීමේ අවස්ථාව වන විට සම්පූර්ණ
    කර නොමැත. මෙය අවංකව ප්‍රකාශ කිරීම ශාස්ත්‍රීය අවංකභාවයට අනුකූල වේ. මූලික සමීක්ෂණය (n=41) මගින් අවශ්‍යතා සහ
    පිළිගැනීමේ බාධක පිළිබඳ වක්‍ර සාක්ෂි ලැබුණද, එය සැබෑ කාර්යප්‍රවාහයේදී පද්ධතිය භාවිත කිරීමේ UAT එක ප්‍රතිස්ථාපනය
    නොකරයි.
  - ඉලක්ක සමඟ සම්බන්ධ කිරීමේදී, ඉලක්කය 1 සාහිත්‍ය සමාලෝචනය මගින් සාක්ෂාත් වී ඇත. ඉලක්ක 2–4 ක්‍රියාකාරී MVP එකක්,
    ආරක්ෂක පාලනයන් සහ ස්වයංක්‍රීය පරීක්ෂණ මගින් තාක්ෂණිකව සාක්ෂාත් වී ඇත. ඉලක්කය 5 හි නිරවද්‍යතා කොටස ROUGE සහ
    ස්වයංක්‍රීය පරීක්ෂණ මගින් මනිනු ලැබේ. එහෙත් පාසල් කාර්ය මණ්ඩලය සමඟ මැනිය යුතු ප්‍රයෝජ්‍යතා කොටස UAT අසම්පූර්ණ
    බැවින් තවම සම්පූර්ණ නොවේ. එබැවින් ඉලක්කය 5 අර්ධ වශයෙන් පමණක් සාක්ෂාත් වී ඇත.
  - ඉදිරිපත් කිරීමෙන් පසු UAT සම්පූර්ණ කර එහි ප්‍රතිඵල අනුව අදියර 6 ප්‍රමුඛතා නැවත සකස් කිරීම යෝග්‍යය. පහත සමීක්ෂණ
    රූප UAT සාක්ෂි ලෙස ඉදිරිපත් නොකෙරේ. ඒවා කියවීමට ගතවන කාලය, වැරදි තේරුම් ගැනීම සහ AI සම්බන්ධ කනස්සල්ල වැනි
    අවශ්‍යතා/අවදානම් සන්දර්භය පෙන්වන වක්‍ර සාක්ෂි පමණි.
