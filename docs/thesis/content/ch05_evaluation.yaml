title: 5. තක්සේරුව (Evaluation)
sections:
- title: 5.1 මෙහෙයුම් ප්‍රතිඵල
  id: ops
  level: 2
  paragraphs:
  - 'මෙම පරිච්ඡේදය EasyCircular නිපැයුමේ තාක්ෂණික ක්‍රියාකාරිත්වය, සාරාංශ ගුණාත්මකභාවය, මාදිලි තේරීමේ වෙළඳාසි සහ පරිශීලක-ආශ්‍රිත සාක්ෂි තක්සේරු කරයි. තක්සේරු ක්‍රමවේදය තුන් මානයකින් සමන්විත වේ: (i) යෙදවූ පද්ධතියේ මෙහෙයුම් සෞඛ්‍යය සහ pipeline කාර්ය සාධනය; (ii) මානව යොමු සාරාංශ සමඟ ROUGE මගින් ප්‍රමාණාත්මක සාරාංශ තක්සේරුව; (iii) නියමු චක්‍රලේඛ සැකසුම් ප්‍රතිඵල සහ සමීක්ෂණ සාක්ෂි මත පදනම් වූ ගුණාත්මක අර්ථකථනය. විධිමත් පාසල් කාර්ය මණ්ඩල UAT තවම සම්පූර්ණ නොවූ බැවින් එය වෙනම සීමාවක් ලෙස කොටස 5.5 හි ප්‍රකාශ කෙරේ.'
  - මෙහෙයුම් තක්සේරුව Docker Compose පරිසරයේ ත්‍රිස්ථර යෙදවීම (ඉදිරිපත් කිරීමේ ස්ථරය, යෙදුම් ස්ථරය, AI සේවාව
    සහ MongoDB) සමගාමීව ක්‍රියාත්මක වන විට සිදු කරන ලදී. අදියර 1 සත්‍යාපනය මගින් සියලු සේවාවන්ගේ health endpoints
    සාර්ථක ප්‍රතිචාර ලබා දුන් බව තහවුරු විය. අදියර 4 සත්‍යාපනය මගින් අනවසර සැකසුම් ඉල්ලීමක් ප්‍රතික්ෂේප වන බවත්
    (HTTP 401), සත්‍යාපිත පරිශීලක ප්‍රවාහය තුළ PDF උඩුගත කිරීමේ සිට නිස්සාරණය සහ සාරාංශ ජනනය දක්වා end-to-end
    MVP කාර්යප්‍රවාහය සම්පූර්ණ වන බවත් පෙන්වා දෙන ලදී.
  - කාර්ය සාධන දෘෂ්ටියෙන්, digital-born ඉංග්‍රීසි චක්‍රලේඛයක pdfplumber නිස්සාරණය ආසන්න වශයෙන් තත්පර 1.2ක් ගත විය.
    OCR අවශ්‍ය scanned නියැදි සඳහා ලේඛනයකට සාමාන්‍යයෙන් තත්පර 6.8ක් පමණ ගත විය. Ollama මත cold LLM ඇමතුමක් ලේඛන
    දිග අනුව තත්පර 8–15ක් පමණ ගත වූ අතර, එකම අන්තර්ගත hash එකක් සහිත නැවත සැකසුම් ඉල්ලීමක් MongoDB cache මගින්
    ආසන්න වශයෙන් 114ms තුළ සම්පූර්ණ විය. මෙම අගයන් human-in-the-loop සමාලෝචන පියවරක් ඇතුළත් පාසල් පරිපාලන කාර්යප්‍රවාහයකට
    ප්‍රායෝගිකව පිළිගත හැකි මට්ටමක පවතී.
  - මෙහෙයුම් තක්සේරුවේ සීමාවක් ලෙස මෙය සංවර්ධන/staging යෙදවීමක් බව සටහන් කළ යුතුය. නිෂ්පාදන uptime SLA එකක් ප්‍රකාශ
    නොකරන අතර ඉහළ සමගාමී පරිශීලක භාරයක් මෙම අධ්‍යයනයේ ප්‍රධාන මිනුම් ඉලක්කයක් නොවීය. එසේ වුවද, නැවත ලබා ගත හැකි
    exit-gate සත්‍යාපනය මගින් නිපැයුම ක්‍රියාකාරී deliverable එකක් ලෙස ක්‍රියාත්මක වන බවට ප්‍රමාණවත් මෙහෙයුම් සාක්ෂි
    ලැබේ. පහත රූප අදියර 1 සහ අදියර 4 සත්‍යාපන ප්‍රතිඵල සාරාංශගත කරයි.
