- title: 5.3 නියමු චක්‍රලේඛ තක්සේරුව
  id: sample_eval
  level: 2
  paragraphs:
  - ROUGE මගින් සාරාංශ අතිච්ඡාදනය ප්‍රමාණනය කළද, pipeline එකේ අනෙකුත් අවධීන් - විශේෂයෙන් OCR අවශ්‍යතාව, entity
    නිස්සාරණය සහ ක්‍රියාකාරී අයිතම හඳුනා ගැනීම - ගුණාත්මක නියැදි තක්සේරුවකින් අනුපූරක කළ යුතුය. ඒ සඳහා නියෝජිත
    අමාත්‍යාංශ චක්‍රලේඛ අටක් සකසා පිටු ගණන, OCR භාවිතය, DATE/ORG/LAW entity ගණන් සහ ක්‍රියාකාරී අයිතම ගණන් වාර්තා
    කරන ලදී.
  - Digital PDF ලේඛනවල DATE සහ ORG නිස්සාරණය සාපේක්ෂව ශක්තිමත් විය. නීතිමය වගන්ති යොමු ඇති ලේඛනවල LAW රටා ක්‍රියාත්මක
    විය. ක්‍රියාකාරී අයිතම ඝනත්වය නියෝගාත්මක භාෂාව (උදා. directed, instructed, should) සමඟ සහසම්බන්ධ විය. ඊට
    වෙනස්ව, scanned සිංහල පිටුවල OCR පෙළ අපැහැදිලි වූ අවස්ථාවලදී, සැකසීමට පෙර පරිශීලක සංස්කරණ පියවර අත්‍යවශ්‍ය
    විය. මෙය නිර්මාණයේ human-in-the-loop තීරණය සනාථ කරයි.
  - මෙම නියැදි තක්සේරුවේ අරමුණ නීතිමය වලංගුතාව සනාථ කිරීම නොවේ. එය pipeline එක විවිධ ලේඛන ලක්ෂණ යටතේ ක්‍රියාත්මක
    වන ආකාරය විස්තර කිරීමයි. Table 5.2 සහ පහත රූපය නියැදි අටේ entity සහ ක්‍රියාකාරී අයිතම ව්‍යාප්තිය සාරාංශගත කරයි.
