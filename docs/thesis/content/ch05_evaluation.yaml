- title: 5.5 UAT තත්ත්වය සහ ඉලක්ක සමඟ තක්සේරු සම්බන්ධය
  id: uat
  level: 2
  paragraphs:
  - පාසල් කාර්ය මණ්ඩලයේ සාමාජිකයන් 5ක් හෝ වැඩි ගණනක් සමඟ සිදු කළ යුතු විධිමත් UAT තවමත් සම්පූර්ණ කර නොමැත. සමීක්ෂණය
    (n=41) මගින් වක්‍ර පිළිගැනීමේ සාක්ෂි ලබා දේ (97.6% සාරාංශ අවශ්‍ය බව සහ 78% ඵලදායිතාව අපේක්ෂා කිරීම), එහෙත් එය
    practical UAT ප්‍රතිස්ථාපනය නොකරයි.
  - 'තක්සේරුව අරමුණු සමඟ සම්බන්ධ කිරීම: ඉලක්ක 1 සිට 4 දක්වා ක්‍රියාකාරී MVP එකක් සහ ස්වයංක්‍රීය පරීක්ෂණ මගින් තාක්ෂණිකව
    සාක්ෂාත් කර ඇත. ඉලක්කය 5 ROUGE සහ pytest මගින් මනිනු ලැබේ. පරිශීලක තෘප්තිය සහ විශ්වාසය UAT අසම්පූර්ණ බැවින්
    අර්ධ වශයෙන් පමණක් තක්සේරු කර ඇත.'
  - 'නිර්දේශය: නිබන්ධනය ඉදිරිපත් කිරීමෙන් පසු UAT සම්පූර්ණ කර, එහි ප්‍රතිඵල මගින් අදියර 6 හි ප්‍රමුඛතා නැවත සකස්
    කිරීම යෝග්‍ය වේ.'
