- title: 5.2 ROUGE තක්සේරු ප්‍රතිඵල
  id: rouge_results
  level: 2
  paragraphs:
  - සාරාංශ ගුණාත්මකභාව ප්‍රමාණනය කිරීම සඳහා ROUGE (Recall-Oriented Understudy for Gisting Evaluation) මිනුම් භාවිත
    කරන ලදී. අමාත්‍යාංශ චක්‍රලේඛ හයක් සඳහා මානව-රචිත යොමු සාරාංශ සකසා, පද්ධති-ජනිත සාරාංශය සමඟ සංසන්දනය කෙරිණි.
    නැවත ලබා ගත හැකි බව සහතික කිරීම පිණිස තක්සේරුව extractive/fallback මාදිලියේ සිදු කරන ලදී. එමගින් බාහිර LLM
    සේවාවක ලබා ගත හැකි බව මත යැපෙන අනිර්ණයාත්මක විචලනය අවම වේ.
  - Macro සාමාන්‍ය අගයන් ROUGE-1 F1 = 0.414, ROUGE-2 F1 = 0.215 සහ ROUGE-L F1 = 0.292 විය. ROUGE-1 අගය මානව යොමු
    සාරාංශ සමඟ මධ්‍යම මට්ටමේ unigram අතිච්ඡාදනයක් පෙන්වයි. ROUGE-2 අගය අඩු වන්නේ extractive වාක්‍ය තේරීම මානව
    paraphrase කළ යොමු සාරාංශයේ bigram රටාවලට සම්පූර්ණයෙන් නොගැලපෙන බැවිනි. ROUGE-L අගය අර්ධ ව්‍යුහාත්මක අනුකූලතාවක්
    නිරූපණය කරයි.
  - ලේඛන මට්ටමේ වෙනස්කම් ද වැදගත්ය. කෙටි, කේන්ද්‍රගත චක්‍රලේඛවල ඉහළ ROUGE අගයන් ලැබුණු අතර, දිගු පරිපාලන ලේඛනවල
    boilerplate ඝනත්වය නිසා bigram අතිච්ඡාදනය අඩු විය. මෙය පෙන්වන්නේ ROUGE ලකුණු ලේඛන වර්ගය සහ දිග මත රඳා පවතින
    බවයි. එබැවින් macro අගය තනි ලේඛනයක ගුණාත්මකභාවයේ නිරපේක්ෂ මිනුමක් ලෙස නොව, ව්‍යාපෘති-අභ්‍යන්තර baseline එකක්
    ලෙස අර්ථකථනය කළ යුතුය.
  - සීමාවන් පැහැදිලිව පිළිගත යුතුය. නියැදි ප්‍රමාණය හයකි; යොමු සාරාංශ තනි සටහන්කරුවකුගේ වන අතර අන්තර්-සටහන්කරු
    එකඟතාව මනින ලද්දේ නැත; ප්‍රධාන වාර්තාකරණය fallback මාදිලිය මත පදනම් වේ. එසේ වුවද, ROUGE ප්‍රතිඵල නැවත ලබා ගත
    හැකි ප්‍රමාණාත්මක සාධකයක් සපයන අතර අනාගත වැඩිදියුණු කිරීම් සංසන්දනය කිරීමට පදනමක් වේ. Table 5.1 සහ පහත රූපය
    ලේඛන-මට්ටමේ සහ macro ප්‍රතිඵල ඉදිරිපත් කරයි.
