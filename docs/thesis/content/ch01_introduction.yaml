title: 1. හැඳින්වීම (Introduction)
sections:
- title: 1.1 අරමුණු සහ ඉලක්ක (Aims and Objectives)
  id: aim
  level: 2
  paragraphs:
  - EasyCircular ව්‍යාපෘතියේ ප්‍රධාන අරමුණ (aim) වන්නේ ශ්‍රී ලංකා අධ්‍යාපන අමාත්‍යාංශ චක්‍රලේඛ PDF ලේඛන සඳහා AI-සහය
    සහිත, human-in-the-loop, web-based summarization and entity extraction පද්ධතියක් නිර්මාණය කිරීම සහ evaluate
    කිරීමයි. පද්ධතිය ගුරුවරුන්, විදුහල්පතිවරු සහ education administrators වල circular comprehension workload අඩු
    කිරීමට සහ compliance errors අවම කිරීමට designed විය.
  bullets: []
  numbered:
  - MOE circular PDF files upload කිරීම, text extraction (native PDF + OCR fallback) සහ user-editable text review
    interface සැපයීම.
  - Named Entity Recognition (NER) මගින් dates, organizations, legal references සහ action items automatically identify
    කිරීම.
  - Extractive-abstractive hybrid summarization pipeline implement කිරීම guardrails සමඟ hallucination risk minimize
    කිරීම.
  - Three-tier microservices architecture (Next.js frontend, Express backend, FastAPI AI service, MongoDB) Docker
    Compose environment එකක deploy කිරීම.
  - ROUGE metrics, automated test suite (91 pytest + 13 backend tests) සහ phase verification scripts මගින් system
    quality evaluate කිරීම.
  figures: []
- title: 1.2 පසුබිම සහ සන්දර්භය (Background and Context)
  id: bg
  level: 2
  paragraphs:
  - ශ්‍රී ලංකාවේ ප්‍රාථමික සහ ද්විතීයික අධ්‍යාපන ක්‍ෂේත්‍රය, දිනපතාම අධ්‍යාපන අමාත්‍යාංශය (Ministry of Education  MOE)
    විසින් නිකුත් කරනු ලබන විවිධ චක්‍රලේඛ (circulars) මගින් පාලනය වේ. මෙම චක්‍රලේඛ අතර පාසල් කළමනාකරණය, විභාග කටයුතු,
    ගුරු පුහුණුව, ශිෂ්‍ය සුබසාධන, පාසල් යටිතල පහසුකම්, පාසල් කාලසටහන් සහ COVID-19 පසු අධ්‍යාපන ප්‍රතිසංවර්ධනය පිළිබඳ
    නීතිමය සහ පරිපාලන උපදෙස් අඩංගු වේ. චක්‍රලේඛ බොහෝ විට PDF ආකෘතියෙන් moe.gov.lk වෙබ් අඩවිය හරහා ප්‍රකාශයට පත්
    කරන අතර, ප්‍රාදේශීය සහ පළාත් මට්ටමේ අධ්‍යාපන කාර්යālයකාරීන්, විදුහල්පතිවරු, ගුරුවරු සහ පරිපාලන නිලධාරීන් විසින්
    කියවා, අවබෝධ කර ගෙන, පාසල් මට්ටමේ ක්‍රියාත්මක කිරීමට සිදු කරයි.
  - MOE චක්‍රලේඛවල ප්‍රධාන ගැටලුව වන්නේ ඒවායේ දිග, භාෂා සංකීර්ණතාව සහ නීතිමය/පරිපාලන භාෂාවේ භාවිතයයි. සාමාන්‍ය circular
    එකක් පිටු 5-20 අතර දිගු වන අතර, එහි අන්තර්ගතය ගුරුවරුන්ට සෘජුවම අදාළ වන කොටස්, කාලසීමා, අනුගත විය යුතු නීති
    සහ ක්‍රියාත්මක කළ යුතු පියවර වෙන් කර හඳුනා ගැනීමට අමතර ශ්‍රමයක් අවශ්‍ය වේ. 2024-2026 කාලය තුළ නිකුත් වූ circulars
    අතර විශේෂ අධ්‍යාපන වැඩසටහන්, විභාග කටයුතු, ගුරුවරුන්ගේ වැටුප් සහ ප්‍රතිලාභ, පාසල් ආරක්ෂාව සහ ශිෂ්‍ය සංඛ්‍යා
    කළමනාකරණය පිළිබඳ දිගු ලේඛන බොහොමක් දක්නට ලැබේ.
  - ශ්‍රී ලංකාවේ අධ්‍යාපන පරිපාලන ව්‍යුහය ජිල්ල, පළාත් සහ ජාතික මට්ටම් වලින් සමන්විත වන අතර, circular එකක් නිකුත්
    වූ පසු එය පහළ මට්ටම් වෙත පැතිරීම WhatsApp groups, email forwards සහ physical copies මගින් සිදු වේ. මෙම පැතිරීමේ
    ක්‍රමවලදී මුල් ලේඛනයේ සම්පූර්ණ අර්ථය අහිමි වීම, වැරදි සාරාංශ (misinterpretations) සහ කාලසීමා මග හැරීම වැනි අවදානම්
    ඉහළ යයි. විදුහල්පතිවරුන්ට දිනකට කිහිපයක් circulars කියවීමට, ඒවා ගුරු staff එක් එක් කරමින් පැහැදිලි කිරීමට සහ
    compliance සනාථ කිරීමට කාලය වැය වේ.
  - PDF ආකෘතියේ circulars බොහෝ විට scanned images ලෙස upload කර ඇති අවස්ථා දක්නට ලැබේ  විශේෂයෙන් සිංහල හෝ දෙමළ භාෂාවෙන්
    ලියන ලද පැරණි circulars. මෙවැනි ලේඛන copy-paste කිරීමට හෝ සරල text search කිරීමට නොහැකි වන අතර, OCR (Optical
    Character Recognition) තාක්ෂණය නොමැතිව manual typing අවශ්‍ය වේ. එසේම digital-born PDFs වලදී tables, headers,
    footers සහ multi-column layouts නිසා plain text extraction අපහසු විය හැක.
  - EasyCircular ව්‍යාපෘතිය මෙම ප්‍රactical ගැටලුව විසඳීමට නිර්මාණය කරන ලද AI-සහය සහිත වෙබ් පද්ධතියකි. පද්ධතිය MOE
    circular PDF upload කිරීම, පෙළ නිස්සාරණ (text extraction), named entity recognition (NER), සාරාංශ generation
    සහ action items හඳුනා ගැනීම එකම workflow එකකින් සපයයි. මෙමගින් ගුරුවරුන්ට සහ පරිපාලන නිලධාරීන්ට දිගු circulars
    කෙටි සාරාංශ, highlighted dates, organizations, laws සහ ක්‍රියාත්මක කළ යුතු පියවර ලෙස ලබා ගැනීමට හැක.
  - මෙම research project එකේ primary motivation වන්නේ 2025-2026 කාලයේ සිදු කළ Google Forms primary research survey
    (n=41) හි ප්‍රතිඵලයි. සමීක්ෂණයෙන් 97.6% respondents circulars සඳහා සාරාංශයක් (summary) අවශ්‍ය බව ද, 78% entity
    highlighting (dates, names, rules) ප්‍රයෝජනවත් බව ද, 78% EasyCircular වැනි පද්ධතියක් work efficiency වැඩි කරන
    බව ද පෙන්වා දුන්නේය. එහෙත් 68.3% AI පද්ධතියක් භාවිත කිරීමට සෘජුව willing නොවන බවත්, privacy concerns (17 respondents)
    සහ documents too long (21 respondents) ප්‍රධාන barriers ලෙස හඳුනා ගත්තේය.
  - ශ්‍රී ලංකා අධ්‍යාපන ක්ෂේත්‍රයේ ඩිජිටල් පරිවර්තන ප්‍රයත්නයන් අතර e-Thaksalawa, Google Classroom භාවිතය සහ පාසල්
    කළමනාකරණ පද්ධති දක්නට ලැබුණ ද, MOE චක්‍රලේඛ අවබෝධ කර ගැනීම සඳහා විශේෂිත AI මෙවලමක් නොමැත. සාමාන්‍ය අරමුණු chatbot
    මෙවලම් (ChatGPT, Gemini) වෙත චක්‍රලේඛ upload කළ හැකි වුවද, hallucination අවදානම, දත්ත රහස්‍යතා ගැටලු, ව්‍යුහගත
    output නොමැති බව සහ සිංහල හා දෙමළ OCR සහාය සීමිත බව නිසා ආයතනික මට්ටමේ පිළිගැනීම අඩුය. EasyCircular මෙම පරතරය
    පිරවීම සඳහා guardrails, human-in-the-loop පෙළ සමාලෝචනය, ව්‍යුහගත JSON output සහ දේශීය LLM (Ollama) සහාය සමඟ
    purpose-built විසඳුමක් ලෙස නිර්මාණය කරන ලදී.
  - මෙම thesis report EasyCircular පද්ධතියේ design, implementation, evaluation සහ limitations comprehensively document
    කරයි. Contextual report (Chapters 1-4) හි ඉදිරිපත් කළ requirements, Agile methodology, three-tier architecture
    සහ risk analysis මෙම full thesis report හි extend කර results, automated testing, ROUGE evaluation සහ future
    work ඇතුළත් කර ඇත. Report එක academic rigor maintain කරමින් practical artefact (working software) demonstrate
    කිරීම අරමුණු කරයි.
