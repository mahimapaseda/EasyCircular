- title: 1.2 පර්යේෂණ ගැටලුව (Research Problem to be Addressed)
  id: problem
  level: 2
  paragraphs:
  - පර්යේෂණ ගැටලුව වන්නේ ශ්‍රී ලංකා අධ්‍යාපන අමාත්‍යාංශ චක්‍රලේඛ PDF ලේඛන දිගු, සංකීර්ණ සහ බහුභාෂික වීම නිසා පාසල්
    පරිපාලකයන්ට කෙටි කාලයකින් නිවැරදිව අවබෝධ කර ගැනීම අපහසු වීමයි. සාමාන්‍ය LLM chatbot මෙවලම් භාවිත කළ හැකි වුවද,
    hallucination අවදානම, දත්ත රහස්‍යතා ගැටලු සහ ව්‍යුහගත output නොමැති බව නිසා ආයතනික මට්ටමේ විශ්වාසයෙන් භාවිත
    කිරීම අපහසුය.
  - මෙම ගැටලුව ප්‍රාථමික සමීක්ෂණයෙන් (n=41) ප්‍රමාණාත්මකව තහවුරු විය. ප්‍රතිචාර දැක්වූවන් 21ක් චක්‍රලේඛ ඉතා දිගු
    බව ප්‍රධාන දුෂ්කරතාව ලෙස හඳුනා ගත් අතර 97.6%ක් සාරාංශයක් අවශ්‍ය බව ප්‍රකාශ කළහ. එහෙත් 68.3%ක් AI පද්ධතියක්
    භාවිත කිරීමට පැකිලූ අතර privacy ගැටලු (ප්‍රතිචාර 17ක්) ප්‍රධාන බාධකයක් ලෙස හඳුනා ගත්තේය. එබැවින් ගැටලුවට ලබා
    දෙන විසඳුම සාරාංශ ගුණාත්මකභාවය පමණක් නොව පරිශීලක විශ්වාසය සහ දත්ත රහස්‍යතාව ද එකවර ආමන්ත්‍රණය කළ යුතුය.
  bullets: []
  numbered: []
  figures: []
- title: 1.3 පර්යේෂණ ප්‍රශ්න (Research Questions)
  id: questions
  level: 2
  paragraphs:
  - පසුබිම සහ ගැටලු ප්‍රකාශය මත පදනම්ව මෙම පර්යේෂණය පහත පර්යේෂණ ප්‍රශ්න තුනට පිළිතුරු සොයයි. ප්‍රශ්න තුන පිළිවෙලින්
    නිර්මාණය, විශ්වසනීයත්වය සහ තක්සේරුව යන මානයන් ආවරණය කරයි.
  - මුල් ප්‍රශ්නය නිර්මාණය සහ ක්‍රියාත්මක කිරීම ආවරණය කරන පරිච්ඡේද 3 සහ 4 මගින්, දෙවන ප්‍රශ්නය guardrails ක්‍රියාත්මක
    කිරීම සහ මාදිලි විශ්ලේෂණය ආවරණය කරන පරිච්ඡේද 4 සහ 5 මගින්, තෙවන ප්‍රශ්නය සමීක්ෂණ විශ්ලේෂණය සහ ROUGE තක්සේරුව
    ආවරණය කරන පරිච්ඡේද 2 සහ 5 මගින් ආමන්ත්‍රණය කෙරේ.
  bullets: []
  numbered:
  - 'RQ1: අධ්‍යාපන අමාත්‍යාංශ චක්‍රලේඛ සඳහා PDF නිස්සාරණය, OCR, NER සහ සාරාංශකරණය ඒකාබද්ධ කරන purpose-built වෙබ්
    පද්ධතියක් කෙසේ නිර්මාණය කළ හැකිද?'
  - 'RQ2: Human-in-the-loop පෙළ සමාලෝචනය සහ date guardrails මගින් hallucination අවදානම කෙතරම් අවම කළ හැකිද?'
  - 'RQ3: පාසල් stakeholders (n=41) අවශ්‍යතා සහ ROUGE/ස්වයංක්‍රීය පරීක්ෂණ මගින් පද්ධතියේ ප්‍රයෝජනවත් බව සහ ගුණාත්මකභාවය
    කෙසේ තක්සේරු කළ හැකිද?'
  figures: []
- title: 1.4 අරමුණු සහ ඉලක්ක (Aims and Objectives)
  id: aim
  level: 2
  paragraphs:
  - මෙම ව්‍යාපෘතියේ අරමුණ (aim) වන්නේ ස්වභාවික භාෂා සැකසුම (Natural Language Processing  NLP) භාවිත කරමින් සංකීර්ණ
    අධ්‍යාපන චක්‍රලේඛවලින් තීරණාත්මක පරිපාලන උපදෙස් නිවැරදිව නිස්සාරණය කර සාරාංශගත කරන AI-පාදක වෙබ් යෙදුමක් සංවර්ධනය
    කිරීම මගින්, ශ්‍රී ලංකා පාසල් පද්ධතියේ පරිපාලන කාර්යක්ෂමතාව වැඩි දියුණු කිරීමයි.
  - මෙම ප්‍රධාන අරමුණ සාක්ෂාත් කර ගැනීම සඳහා සන්දර්භීය වාර්තාවේ (Contextual Report) නිර්වචනය කළ නිශ්චිත ඉලක්ක පහ
    පහත දැක්වේ.
  bullets: []
  numbered:
  - සංකීර්ණ පරිපාලන ලේඛන විශ්ලේෂණය සඳහා සුදුසු, පවතින ස්වභාවික භාෂා සැකසුම (NLP) ශිල්පක්‍රම සහ පෙළ සාරාංශකරණ ඇල්ගොරිතම
    විමර්ශනය කර තක්සේරු කිරීම.
  - 'විවිධ ගොනු ආකෘති (උදා: PDF) සැකසිය හැකි ආරක්ෂිත ලේඛන ඇතුළත් කිරීමේ මොඩියුලයක් (secure document ingestion module)
    ක්‍රියාත්මක කිරීම.'
  - චක්‍රලේඛ තුළ ඇති තීරණාත්මක දින, නිශ්චිත නීති සහ අදාළ පාර්ශ්ව නිවැරදිව හඳුනා ගැනීම සඳහා නාමිත සංචිත හඳුනා ගැනීමේ
    (Named Entity Recognition  NER) තාක්ෂණය භාවිත කරමින් AI නිස්සාරණ විශේෂාංගයක් ගොඩනැගීම.
  - සංකීර්ණ පරිපාලන පෙළ පහසුවෙන් කියවිය හැකි, ව්‍යුහගත කෙටි වාර්තා බවට ප්‍රතිසංවිධානය කරන ගතික සාරාංශකරණ එන්ජිමක්
    (dynamic summarization engine) ක්‍රියාත්මක කිරීම.
  - AI විසින් ජනනය කරන සාරාංශවල නිරවද්‍යතාව සහ වෙබ් යෙදුමේ සමස්ත ප්‍රයෝජ්‍යතාව (usability) පාසල් පරිපාලන කාර්ය මණ්ඩලය
    සම්බන්ධ කරගෙන පරීක්ෂා කර තක්සේරු කිරීම.
  closing_paragraphs:
  - ක්‍රියාත්මක කිරීමේ අවධියේදී ඉහත ඉලක්ක කිහිපයක් මුල් නිර්වචනයට වඩා පුළුල් ලෙස සම්පූර්ණ කරන ලදී. ඉලක්කය 2 සඳහා
    ස්කෑන් කළ චක්‍රලේඛ හැසිරවීමට Tesseract OCR fallback (සිංහල, ඉංග්‍රීසි, දෙමළ) සහ පරිශීලකයාට නිස්සාරණය කළ පෙළ
    නිවැරදි කළ හැකි human-in-the-loop අතුරුමුහුණත එක් කරන ලදී. ඉලක්කය 4 සඳහා hallucination අවදානම අවම කරන date
    guardrails සහ extractive fallback මාදිලිය එක් කරන ලදී. මේවාට අමතරව, ස්ථර ස්වාධීනව පරිමාණනය කිරීම සහ නැවත නිපදවිය
    හැකි යෙදවීම සක්‍රීය කිරීම සඳහා Docker Compose මත ත්‍රිස්ථර ගෘහනිර්මාණයක් සහ content-hash caching යාන්ත්‍රණයක්
    ක්‍රියාත්මක කරන ලදී. මෙම දිගුවීම් මුල් ඉලක්ක ලැයිස්තුවේ නොතිබූ අතිරේක තාක්ෂණික දායකත්ව ලෙස පරිච්ඡේද 3 සහ 4
    හි ලේඛනගත කර ඇත.
  - ඉලක්කය 5 හි ROUGE මිනුම් සහ ස්වයංක්‍රීය පරීක්ෂණ කොටස සම්පූර්ණ කර ඇති නමුත්, පාසල් පරිපාලන කාර්ය මණ්ඩලය සමඟ
    සිදු කළ යුතු විධිමත් පරිශීලක පිළිගැනීමේ පරීක්ෂණය (UAT) නිබන්ධනය ඉදිරිපත් කරන අවස්ථාව වන විට සම්පූර්ණ කර නොමැත.
    එබැවින් එය කොටස්-වශයෙන් සාක්ෂාත් වූ ඉලක්කයක් ලෙස පරිච්ඡේදය 5 කොටස 5.5 හි සහ පරිච්ඡේදය 6 හි Table 6.1 මගින්
    අවංකව වාර්තා කර ඇත.
