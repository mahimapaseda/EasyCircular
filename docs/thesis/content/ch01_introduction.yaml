- title: 1.4 ව්‍යාපෘතියට හැඳින්වීම (Introduction to Project)
  id: scope
  level: 2
  paragraphs:
  - EasyCircular ව්‍යාපෘතියේ විෂය පථය (scope) නිබන්ධන කාලරේඛාව (සති 10ක්, Phase 1 සිට Phase 5 දක්වා) සහ පවතින සම්පත්
    අනුව නිර්වචනය කර ඇත. විෂය පථය තුළ ඇතුළත් කරුණු (in-scope) ක්‍රියාකාරී මෘදුකාංග නිපැයුමක් (deliverable software
    artefact) සහ තක්සේරු සාක්ෂි ලෙස නිබන්ධන වාර්තාවේ ලේඛනගත කර ඇත. විෂය පථයෙන් බැහැර කරුණු (out-of-scope) Phase
    6 අනාගත වැඩිදියුණු කිරීම් ලෙස අවංකව හඳුනා ගෙන සටහන් කර ඇත.
  bullets:
  - 'විෂය පථය තුළ: අධ්‍යාපන අමාත්‍යාංශ චක්‍රලේඛ PDF ගොනු උඩුගත කිරීම, ද්විත්ව පුස්තකාල පෙළ නිස්සාරණය (pdfplumber
    සහ PyMuPDF භාවිතයෙන්), Tesseract OCR (සිංහල, ඉංග්‍රීසි සහ දෙමළ භාෂා ඇසුරුම් සමඟ), පරිශීලක විසින් පෙළ සංස්කරණය
    කළ හැකි human-in-the-loop අතුරුමුහුණත, SpaCy NER මගින් නාමිත සංචිත හඳුනා ගැනීම, LangChain/Ollama සාරාංශකරණ pipeline,
    JWT authentication, MongoDB දත්ත ගබඩාව, ප්‍රතිචාරශීලී (responsive) වෙබ් අතුරුමුහුණත, ROUGE තක්සේරුව, ස්වයංක්‍රීය
    පරීක්ෂණ සහ phase verification scripts.'
  - 'විෂය පථය තුළ: moe.gov.lk නිල වෙබ් අඩවියෙන් සජීවී චක්‍රලේඛ ලැයිස්තුව ආයාත කිරීමේ endpoint, content-hash පදනම්
    LLM ප්‍රතිචාර cache කිරීම (එකම circular එක නැවත process කරන විට LLM call එකක් නොකර cache එකෙන් ප්‍රතිඵල ලබා
    දීම), rate limiting, AI service token authentication සහ සියලු ස්ථර සඳහා health check endpoints.'
  - 'විෂය පථය තුළ: ප්‍රාථමික පර්යේෂණ සමීක්ෂණය (Google Forms, n=41) විශ්ලේෂණය සහ අවශ්‍යතා නිර්ණය කිරීමට ඒකාබද්ධ කිරීම;
    නියමු චක්‍රලේඛ 6ක් ඇතුළත් sample evaluation dataset.'
  - 'විෂය පථයෙන් බැහැර: සම්පූර්ණ සිංහල/දෙමළ NER ආකෘති (Phase 5 හි ඉංග්‍රීසි SpaCy en_core_web_sm ආකෘතිය පමණක් භාවිත
    වන අතර, සිංහල/දෙමළ ලේඛන සඳහා extractive fallback ක්‍රමය භාවිත වේ). සිංහල NLP under-resourced ස්වභාවය නිසා Unicode
    Sinhala script (U+0D80 සිට U+0DFF) tokenization සඳහා විශේෂිත මෙවලම් අවශ්‍ය වන අතර, ඒවා ඉංග්‍රීසි-කේන්ද්‍රීය
    NLP pipelines වල ඇතුළත් නොවේ.'
  - 'විෂය පථයෙන් බැහැර: නිෂ්පාදන මට්ටමේ cloud deployment, පාසල් කාර්ය මණ්ඩලය 5 දෙනෙකු හෝ ඊට වැඩි ප්‍රමාණයක් සමඟ
    විධිමත් පරිශීලක පිළිගැනීමේ පරීක්ෂණ (UAT) සැසි (නිබන්ධනය ඉදිරිපත් කරන අවස්ථාවේදී සැලසුම් කර ඇති නමුත් තවමත් සම්පූර්ණ
    නොවී ඇත).'
  - 'විෂය පථයෙන් බැහැර: ද්විභාෂික/ත්‍රිභාෂික UI (සිංහල/දෙමළ/ඉංග්‍රීසි interface labels), භූමිකා-පාදක පරිපාලක උපකරණ
    පුවරුව (role-based admin dashboard), පිටු 20ට වැඩි circulars සඳහා async job queue, MOE නිල API ඒකාබද්ධතාව (පොදු
    PDF URLs වලින් ඔබ්බට).'
  - 'විෂය පථයෙන් බැහැර: AI සාරාංශ වල නීතිමය වලංගුතා සහතිකකරණය. මෙම පද්ධතිය සහාය පමණක් සපයන අතර, නිල අර්ථකථනය (official
    interpretation) මිනිස් වගකීමක් ලෙස පවතී. සාරාංශ නිර්දේශ ලෙස සැලකිය යුතු අතර, නිල චක්‍රලේඛ පෙළ ප්‍රතිස්ථාපනය
    කිරීමට අදහස් නොකරයි.'
