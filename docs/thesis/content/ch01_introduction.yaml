- title: 1.6 වාර්තාවේ ව්‍යුහය (Structure of the Report)
  id: structure
  level: 2
  paragraphs:
  - මෙම නිබන්ධන වාර්තාව අධ්‍යයන ප්‍රශ්නයෙන් ආරම්භ වී නිගමනය දක්වා තාර්කික ගලායාමක් (logical flow) අනුගමනය කරන අතර,
    ප්‍රධාන පරිච්ඡේද හයක් (6) සහ පරිශිෂ්ට (appendices) වලින් සමන්විත වේ. සෑම පරිච්ඡේදයක්ම පෙර පරිච්ඡේදයේ
    සොයාගැනීම් මත ගොඩනඟමින් EasyCircular නිපැයුම සවිස්තරව ඉදිරිපත් කරයි.
  - පරිච්ඡේදය 1 (හැඳින්වීම) අරමුණු සහ ඉලක්ක, අධ්‍යාපන අමාත්‍යාංශ චක්‍රලේඛ ගැටලුවේ පසුබිම සහ සන්දර්භය, පර්යේෂණ
    ප්‍රශ්න, ව්‍යාපෘතියේ විෂය පථය, නිපැයුමේ ස්වභාවය සහ වාර්තාවේ ව්‍යුහය හඳුන්වා දෙයි.
  - පරිච්ඡේදය 2 (වෙළඳපොළ පර්යේෂණ සහ සාහිත්‍ය සමාලෝචනය) NLP, Transformer ආකෘති, සාරාංශකරණය, NER, ROUGE, පවතින
    මෙවලම් සංසන්දනාත්මක විශ්ලේෂණය සහ n=41 වෙළඳපොළ පර්යේෂණ සමීක්ෂණය ආවරණය කර පර්යේෂණ පරතරය සාධාරණීකරණය කරයි.
  - පරිච්ඡේදය 3 (නිපැයුම් නිර්මාණය) අවශ්‍යතා විශ්ලේෂණය, ත්‍රිස්ථර ගෘහනිර්මාණය, Class සහ ER ආකෘති, අතුරුමුහුණත්
    නිර්මාණය (UI wireframes) සහ තාක්ෂණ තොගය තෝරා ගැනීමේ තර්කනය ඉදිරිපත් කරයි.
  - පරිච්ඡේදය 4 (සංවර්ධනය සහ පරීක්ෂණය) PDF processing pipeline සහ ඇල්ගොරිතම flowchart, NER සහ සාරාංශකරණය
    ක්‍රියාත්මක කිරීම, ආරක්ෂාව, API අන්ත ලක්ෂ්‍ය, AI සහායක කේත ප්‍රකාශනය සහ ස්වයංක්‍රීය පරීක්ෂණ, අදියර සත්‍යාපනය
    සහ පරීක්ෂණ අවස්ථා (Expected/Actual) විස්තර කරයි.
  - පරිච්ඡේදය 5 (තක්සේරුව) මෙහෙයුම් ප්‍රමිතික, ROUGE තක්සේරු ප්‍රතිඵල, නියමු චක්‍රලේඛ තක්සේරුව, LLM සහ fallback
    මාදිලි සාකච්ඡාව, UAT තත්ත්වය සහ AI සහායක සංවර්ධනයේ ආචාර ධාර්මික තක්සේරුව ඉදිරිපත් කරයි.
  - පරිච්ඡේදය 6 (නිගමන සහ අනාගත කාර්යයන්) ඉලක්ක සාක්ෂාත්කරණය, සීමාවන්, නිර්දේශ සහ අනාගත කාර්යයන් සාරාංශ කරයි.
  - පරිශිෂ්ට වශයෙන් Appendix A හි ව්‍යාපෘති සැලසුම (Agile ක්‍රමවේදය, පස්-අදියර සැලැස්ම, Gantt, WBS, අවදානම් සහ
    phase exit gates), Appendix B හි සමීක්ෂණ ප්‍රශ්න, Appendix C හි පුළුල් API වගුව, Appendix D හි poster සටහන
    සහ Appendix E හි AI සහායක කේත කොටස් පිළිබඳ සම්පූර්ණ ප්‍රකාශනය ඇතුළත් වේ.
