- title: 1.6 පර්යේෂණ දායකත්වය (Research Contribution)
  id: contribution
  level: 2
  paragraphs:
  - මෙම ව්‍යාපෘතියේ ප්‍රධාන දායකත්වය වන්නේ ශ්‍රී ලංකා අධ්‍යාපන අමාත්‍යාංශ චක්‍රලේඛ වසම සඳහා purpose-built, self-hostable
    AI සාරාංශක වෙබ් පද්ධතියක් නිර්මාණය කිරීමයි. සාමාන්‍ය ChatGPT වැනි මෙවලම්වලට වඩා EasyCircular ව්‍යුහගත entity
    output, date guardrails, content-hash caching සහ human-in-the-loop පෙළ සමාලෝචනය සපයයි.
  - තාක්ෂණික දායකත්වය ලෙස ත්‍රිස්ථර monorepo ගෘහනිර්මාණය (Next.js, Express, FastAPI, MongoDB, Ollama), ත්‍රිභාෂික
    OCR (sin+eng+tam) සහ ROUGE පදනම් තක්සේරු සාක්ෂි ඉදිරිපත් කෙරේ. ප්‍රායෝගික දායකත්වය ලෙස පාසල් පරිපාලකයන්ට චක්‍රලේඛ
    අවබෝධය වේගවත් කිරීමේ ක්‍රියාකාරී මෘදුකාංග නිපැයුමක් ලබා දෙයි.
  - අධ්‍යයන දායකත්වය ලෙස primary research survey (n=41) findings, පර්යේෂණ පරතරය සහ අනාගත සිංහල NLP කාර්යයන් සඳහා
    පැහැදිලි පදනමක් ලේඛනගත කෙරේ.
  - පහත රූපයෙන් ක්‍රියාත්මක නිපැයුමේ ප්‍රධාන දසුන ඉදිරිපත් කෙරේ. සත්‍යාපිත පරිශීලකයෙකුගේ dashboard එකෙහි උඩුගත කළ
    චක්‍රලේඛ, ඒවායේ සැකසුම් තත්ත්වය සහ සාරාංශ වෙත ප්‍රවේශය පෙන්වන අතර, පද්ධතියේ සම්පූර්ණ ක්‍රියාකාරිත්වය පරිච්ඡේද
    3, 4 සහ 5 හි සවිස්තරව විස්තර කෙරේ.
