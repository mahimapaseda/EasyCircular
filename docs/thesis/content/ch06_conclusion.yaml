title: 6. නිගමන සහ අනාගත කාර්යයන් (Conclusions and Further Work)
sections:
- title: 6.1 සාරාංශය
  id: summary
  level: 2
  paragraphs:
  - EasyCircular ව්‍යාපෘතිය අධ්‍යාපන අමාත්‍යාංශ චක්‍රලේඛ අවබෝධ කර ගැනීම සඳහා AI සහායක පද්ධතියක් ලෙස සාර්ථකව නිර්මාණය
    කර, ක්‍රියාත්මක කර, තාක්ෂණිකව තක්සේරු කරන ලදී. ත්‍රිස්ථර ගෘහනිර්මාණය (Next.js 3002, Express 4000, FastAPI 5000,
    MongoDB 27017) Docker Compose පරිසරයක් තුළ ක්‍රියාත්මක වන deliverable නිපැයුමක් ලෙස ලබා දේ.
  - 'මූලික පර්යේෂණය (n=41) මගින් ප්‍රධාන අවශ්‍යතා තහවුරු විය: සාරාංශ අවශ්‍ය බව (97.6%), entity highlighting වටිනා
    බව (78%) සහ ඵලදායිතාව අපේක්ෂා කිරීම (78%). එහෙත් AI පිළිගැනීමේ බාධක (68.3% කැමති නොවීම සහ රහස්‍යතා පිළිබඳ අදහස්
    17ක්) දේශීය LLM සහ human-in-the-loop නිර්මාණ තීරණවලට මඟ පෙන්වූයේය.'
  - PDF pipeline එක library දෙකකින් නිස්සාරණය, Tesseract ත්‍රිභාෂික OCR සහ පරිශීලක පෙළ සමාලෝචනය මගින් නිස්සාරණ අවදානම
    විසඳයි. AI pipeline එක SpaCy NER, LangChain map-reduce සාරාංශකරණය සහ date guardrails මගින් hallucination අවදානම
    විසඳයි. Content-hash caching මගින් cached ප්‍රතිචාර ආසන්න වශයෙන් 114ms තුළ ලබා දේ.
  - 'තක්සේරුව: ROUGE macro F1 අගයන් (0.414 / 0.215 / 0.292), pytest 91ක් සහ backend පරීක්ෂණ 13ක් සමත් වීම, සහ phase1
    සහ phase4 සත්‍යාපක සමත් වීම. UI මගින් dashboard, upload, summary detail සහ mobile views ප්‍රදර්ශනය කරයි.'
  - සංවර්ධන ක්‍රියාවලියේ generative AI මෙවලම් සහායක ලෙස භාවිත කළ අතර එය පූර්ණ විනිවිදභාවයෙන් ප්‍රකාශ කර ඇත. AI-assisted
    code artefacts 10ක් ඒවායේ ක්‍රියාකාරිත්වය, භාවිත කිරීමට හේතුව සහ system design fit සමඟ කොටස 4.6 සහ Appendix
    E හි ලේඛනගත කර, References ලැයිස්තුවේ උපුටා දක්වා ඇත.
  bullets: []
  numbered: []
  figures: []
- title: 6.2 ඉලක්ක සාක්ෂාත්කරණය
  id: objectives
  level: 2
  paragraphs:
  - Table 6.1 මගින් පරිච්ඡේදය 1 හි නිර්ණය කළ ඉලක්ක සහ ඒවායේ සාක්ෂාත්කරණ තත්ත්වය සම්බන්ධ කර ඇත.
