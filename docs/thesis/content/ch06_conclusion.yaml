- title: 6.3 සීමාවන්
  id: limits
  level: 2
  paragraphs:
  - 'පූර්ණ සිංහල සහ දෙමළ NER සහ abstractive සාරාංශකරණය තවම ලබා දී නැත. වර්තමාන පද්ධතිය ඉංග්‍රීසි අන්තර්ගතය සඳහා
    ව්‍යුහගත entity නිස්සාරණය සපයන අතර සිංහල/දෙමළ කොටස් සඳහා OCR සහ extractive සහාය මත රඳා පවතී. එබැවින් ත්‍රිභාෂික
    අමාත්‍යාංශ චක්‍රලේඛ සඳහා සේවාව අර්ධ වශයෙන් පමණක් සම්පූර්ණය. මෙය අනාගත කාර්යයේ ඉහළම ප්‍රමුඛතාවකි.'
  - 'විධිමත් පාසල් කාර්ය මණ්ඩල UAT ඉදිරිපත් කිරීමේ අවස්ථාව වන විට සම්පූර්ණ නොවීය. සමීක්ෂණය අවශ්‍යතා සහ පිළිගැනීමේ
    බාධක පිළිබඳ වක්‍ර සාක්ෂි ලබා දුන්නද, එය සැබෑ කාර්යප්‍රවාහයේදී ප්‍රයෝජ්‍යතාව මනින UAT එක ප්‍රතිස්ථාපනය නොකරයි.
    එබැවින් නිෂ්පාදන සූදානම පිළිබඳ ප්‍රබල ප්‍රකාශයක් කළ නොහැක.'
  - 'ROUGE මගින් මනිනු ලබන්නේ යොමු සාරාංශය සමඟ n-gram අතිච්ඡාදනය පමණි. එය නීතිමය නිරවද්‍යතාව හෝ ප්‍රතිපත්ති අර්ථකථනයේ
    නිවැරදි බව සනාථ නොකරයි. සාරාංශය තීරණ සහායක මෙවලමක් වන අතර නිල අනුකූලතා අර්ථකථනය මානව වගකීමක් ලෙස පවතී. Date
    guardrails අවදානම අවම කරන නමුත් LLM මාදිලියේදී hallucination සම්පූර්ණයෙන් ඉවත් නොකරයි.'
  - 'තනි සංවර්ධක විෂය පථය නිසා නිෂ්පාදන cloud යෙදවීම, ඉතා දිගු ලේඛන සඳහා async queue සහ ද්විභාෂික UI තවම ක්‍රියාත්මක
    නොවීය. කාර්ය සාධනය ප්‍රධාන වශයෙන් සංවර්ධන පරිසරයේ මනින ලදී. තවද, AI සහායක සංවර්ධනය boilerplate කාර්යයන්ට ප්‍රයෝජනවත්
    වූ නමුත් වසම-විශේෂිත තර්කය සඳහා විශ්වාසදායක යෝජනා ලබා නොදුන් අතර සෑම යෝජනාවක්ම මානව සමාලෝචනයකට යටත් කිරීමට
    අමතර කාලයක් වැය විය.'
  - 'තවත් සීමාවක් වන්නේ තක්සේරු නියැදි ප්‍රමාණයයි. ROUGE තක්සේරුව චක්‍රලේඛ හයකට සීමා වූ අතර යොමු සාරාංශ තනි සටහන්කරුවකුගේ
    විය. මෙය ව්‍යාපෘති-අභ්‍යන්තර baseline එකක් සඳහා ප්‍රමාණවත් වුවද, පුළුල් සාමාන්‍යකරණයට ප්‍රමාණවත් නොවේ. එසේම
    OCR ගුණාත්මකභාවය scanned සිංහල ලේඛනවල වෙනස් වන බැවින්, නිස්සාරණ දෝෂ පහළ-ප්‍රවාහ NER සහ සාරාංශයට බලපෑ හැක.
    Human review පියවර මෙය අර්ධ වශයෙන් අවම කරයි.'
  - 'සීමාවන් වර්ගීකරණය කළහොත් තාක්ෂණික සීමා (භාෂා ආවරණය, OCR ගුණාත්මකභාවය), තක්සේරු සීමා (UAT සහ නියැදි ප්‍රමාණය)
    සහ සම්පත් සීමා (තනි සංවර්ධකයා, කාලරාමුව) ලෙස දැකිය හැක. මෙම වර්ගීකරණය අනාගත කාර්ය ප්‍රමුඛතාකරණයට මඟ පෙන්වයි.
    වඩාත් බරපතල සීමාව සිංහල NER පරතරය වන අතර, ඊළඟට UAT අසම්පූර්ණත්වය පැමිණේ.'
  bullets: []
  numbered: []
  figures: []
- title: 6.4 අනාගත කාර්යයන් (Phase 6)
  id: future
  level: 2
  paragraphs:
  - 'නිබන්ධනයෙන් පසු කාර්යය ප්‍රමුඛතා තුනකට සංවිධානය කළ හැක. පළමුව, භාෂා ආවරණය පුළුල් කිරීමයි: පූර්ණ සිංහල/දෙමළ
    NER, ද්විභාෂික පරිශීලක අතුරුමුහුණත සහ අමාත්‍යාංශ කෝපස් මත බහුභාෂික ආකෘති fine-tuning. මෙය වත්මන් ප්‍රධාන තාක්ෂණික
    සීමාවට සෘජු ප්‍රතිචාරයකි.'
  - 'දෙවනුව, තක්සේරුව සම්පූර්ණ කිරීමයි. පාසල් කාර්ය මණ්ඩලය සමඟ විධිමත් UAT සිදු කිරීම, ROUGE යොමු කට්ටලය පුළුල්
    කිරීම සහ නීතිමය/කරුණු නිරවද්‍යතාව සඳහා මානව තක්සේරු rubric එකක් සකස් කිරීම ඉලක්කය 5 සම්පූර්ණ කිරීමට අවශ්‍යය.
    මෙම පියවර නිෂ්පාදන නිර්දේශයට පෙර අත්‍යවශ්‍ය සාක්ෂි සපයයි.'
  - 'තෙවනුව, මෙහෙයුම් සහ ප්‍රයෝජ්‍යතා වැඩිදියුණු කිරීම්ය. මූලාශ්‍ර වාක්‍ය සම්බන්ධ කිරීම, දිගු ලේඛන සඳහා async
    job queue, භූමිකා-පාදක ප්‍රවේශ පාලනය, admin විශ්ලේෂණ dashboard සහ ලබා ගත හැකි නම් නිල අමාත්‍යාංශ ද්වාරය සමඟ
    ඒකාබද්ධ වීම ප්‍රායෝගික වටිනාකම තවදුරටත් වැඩි කරයි. ඒ සමඟම AI සහායක සංවර්ධනය සඳහා ලිඛිත ව්‍යාපෘති ප්‍රතිපත්තියක්
    පවත්වා ගැනීම - කුමන කාර්යයන්ට AI සහාය පිළිගත හැකිද සහ කුමන පරීක්ෂණ අනිවාර්යද යන්න - අනාගත නඩත්තුවට වැදගත්ය.'
  - 'කෙටි කාලීනව (මාස කිහිපයක්) UAT සම්පූර්ණ කිරීම සහ ROUGE කට්ටලය පුළුල් කිරීම වඩාත් ශක්‍යය. මධ්‍ය කාලීනව සිංහල
    NER සහ ද්විභාෂික UI සංවර්ධනයට වැඩි උත්සාහයක් අවශ්‍ය වේ. දිගු කාලීනව නිෂ්පාදන යෙදවීම සහ ආයතනික ඒකාබද්ධ කිරීම
    අමාත්‍යාංශ/පාසල් IT සහයෝගය මත රඳා පවතී. මෙම කාලානුරූප ප්‍රමුඛතාකරණය තනි සංවර්ධක සීමාව තුළ යථාර්ථවාදී මාර්ග සිතියමක්
    සපයයි.'
  - 'නිගමනය වශයෙන්, EasyCircular අමාත්‍යාංශ චක්‍රලේඛ අවබෝධ අභියෝගයට ප්‍රායෝගික, නැවත ලබා ගත හැකි සහ තාක්ෂණිකව තක්සේරු
    කළ ප්‍රතිචාරයක් ලබා දෙයි. ඉතිරි කාර්යය භාෂා ආවරණය, මානව තක්සේරුව සහ මෙහෙයුම් පරිණතභාවය වටා කේන්ද්‍රගත වේ. එම
    පියවර සම්පූර්ණ වූ විට පමණක් ආයතනික පරිමාණ යෙදවීමක් තර්කානුකූලව නිර්දේශ කළ හැක.'
