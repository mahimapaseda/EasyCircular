title: 6. නිගමන සහ අනාගත කාර්යයන් (Conclusions and Further Work)
sections:
- title: 6.1 සාරාංශය
  id: summary
  level: 2
  paragraphs:
  - 'මෙම ව්‍යාපෘතියේ අරමුණ වූයේ ශ්‍රී ලංකා අධ්‍යාපන අමාත්‍යාංශ චක්‍රලේඛ අවබෝධ කිරීමේ භාරය අඩු කරන AI සහායක වෙබ් පද්ධතියක්
    නිර්මාණය කිරීම, ක්‍රියාත්මක කිරීම සහ තාක්ෂණිකව තක්සේරු කිරීමයි. EasyCircular එම අරමුණට ප්‍රතිචාර දක්වමින් ඉදිරිපත්
    කිරීමේ ස්ථරය, යෙදුම් ස්ථරය සහ AI සේවාව ඒකාබද්ධ කරන ත්‍රිස්ථර ගෘහනිර්මාණයක් මත ක්‍රියාකාරී නිපැයුමක් ලෙස ලබා
    දෙයි.'
  - 'මූලික පර්යේෂණය (n=41) මගින් නිර්මාණයට මඟ පෙන්වූ ප්‍රධාන සාධක තහවුරු විය. සහභාගිවන්නන්ගෙන් 97.6% ක් සාරාංශයක්
    අවශ්‍ය බවත්, 78% ක් entity highlighting ප්‍රයෝජනවත් බවත්, 78% ක් ඵලදායිතාව අපේක්ෂා කරන බවත් පැවසූහ. එහෙත් 68.3%
    ක් AI භාවිතයට සෘජුව කැමති නොවූ අතර රහස්‍යතාව ප්‍රධාන කනස්සල්ලක් විය. එබැවින් දේශීය LLM විකල්පය සහ human-in-the-loop
    සමාලෝචන පියවර නිර්මාණයේ මධ්‍යස්ථානය විය.'
  - 'තාක්ෂණිකව, PDF pipeline එක බහු පුස්තකාල නිස්සාරණය, ත්‍රිභාෂික OCR සහ පරිශීලක පෙළ සංස්කරණය මගින් නිස්සාරණ අවදානම
    අවම කරයි. AI pipeline එක SpaCy NER, map-reduce සාරාංශකරණය සහ date guardrails මගින් hallucination අවදානම පාලනය
    කරයි. තක්සේරුවේදී ROUGE macro F1 අගයන් 0.414 / 0.215 / 0.292 ලැබුණු අතර ස්වයංක්‍රීය පරීක්ෂණ කට්ටලය සහ අදියර
    exit-gate සත්‍යාපනය මගින් නිපැයුම ක්‍රියාකාරී බව තහවුරු විය.'
  - 'සංවර්ධන ක්‍රියාවලියේ generative AI මෙවලම් සහායක ලෙස භාවිත කළ අතර එය පූර්ණ විනිවිදභාවයෙන් ප්‍රකාශ කර ඇත. AI-assisted
    artefacts දහයක් කොටස 4.6 සහ Appendix E හි ක්‍රියාකාරිත්වය, භාවිත හේතුව සහ system design fit සමඟ ලේඛනගත කර ඇත.
    සමස්තයක් ලෙස, ව්‍යාපෘතිය සාහිත්‍යයේ සහ සමීක්ෂණයේ හඳුනා ගත් පරතරයට ප්‍රායෝගික කෘතියකින් ප්‍රතිචාර දක්වන අතර
    ඉතිරි සීමාවන් අවංකව පිළිගනී.'
  - 'පර්යේෂණ දායකත්වය තුන් මට්ටමකින් සාරාංශ කළ හැක. පළමුව, වසම් මට්ටමේදී EasyCircular අමාත්‍යාංශ චක්‍රලේඛ අවබෝධය
    සඳහා අරමුණු-නිර්මිත, ස්වයං-ධාරිත සහ human-in-the-loop AI ප්‍රවේශයක් ඉදිරිපත් කරයි. දෙවනුව, ක්‍රමවේද මට්ටමේදී
    එය OCR, NER, guarded summarization සහ නැවත ලබා ගත හැකි තක්සේරුව එකම කෘතියක ඒකාබද්ධ කරයි. තෙවනුව, අධ්‍යයන මට්ටමේදී
    AI සහායක සංවර්ධනය ප්‍රකාශ කිරීම සහ පරීක්ෂණ මගින් සත්‍යාපනය කිරීමේ ප්‍රායෝගික ආකෘතියක් ලේඛනගත කරයි.'
  - 'ප්‍රායෝගික බලපෑම් දෘෂ්ටියෙන්, පද්ධතිය විදුහල්පතිවරුන්ට සහ ගුරුවරුන්ට දිගු චක්‍රලේඛයක ප්‍රධාන නියෝග, දින සහ වගකීම්
    ඉක්මනින් දැකීමට උපකාරී විය හැක. එහෙත් මෙම බලපෑම තවමත් විභවීයය. එය ආයතනික යෙදවීමකදී සනාථ වන්නේ UAT සහ දිගුකාලීන
    භාවිත සාක්ෂි ලැබුණු පසුව පමණි. එබැවින් මෙම නිගමනය ප්‍රායෝගික විභවය පිළිගන්නා අතර නිෂ්පාදන සාර්ථකත්වය ප්‍රකාශ
    නොකරයි.'
  bullets: []
  numbered: []
  figures: []
- title: 6.2 ඉලක්ක සාක්ෂාත්කරණය
  id: objectives
  level: 2
  paragraphs:
  - 'Table 6.1 මගින් පරිච්ඡේදය 1 කොටස 1.4 හි නිර්ණය කළ මුල් ඉලක්ක පහ සහ ඒවායේ සාක්ෂාත්කරණ තත්ත්වය සම්බන්ධ කර ඇත.
    මුල් ඉලක්ක ලැයිස්තුවේ නොතිබූ නමුත් ක්‍රියාත්මක කිරීමේදී සම්පූර්ණ කළ අතිරේක දායකත්ව ද වගුවේ අවසාන පේළි දෙකින්
    වෙන්ව ඉදිරිපත් කෙරේ.'
  - 'ඉලක්ක 1, 2 සහ 4 සම්පූර්ණයෙන් සාක්ෂාත් විය. ඉලක්කය 3 ඉංග්‍රීසි NER සඳහා සාක්ෂාත් වූ නමුත් සිංහල/දෙමළ NER තවම
    පූර්ණ නොවේ. ඉලක්කය 5 හි නිරවද්‍යතා කොටස ROUGE සහ ස්වයංක්‍රීය පරීක්ෂණ මගින් සාක්ෂාත් වූ අතර පාසල් කාර්ය මණ්ඩල
    UAT අසම්පූර්ණ බැවින් එය අර්ධ සාක්ෂාත්කරණයක් ලෙස වාර්තා කෙරේ. මෙම අවංක තක්සේරුව නිබන්ධනයේ ශාස්ත්‍රීය අවංකභාවයට
    අනුකූල වේ.'
  - 'සමීක්ෂණ සොයාගැනීම් සමඟ ඉලක්ක පෙළගැස්ම ද වැදගත්ය. සාරාංශ ඉල්ලුම ඉලක්කය 4 මගින් ආමන්ත්‍රණය විය. Entity highlighting
    ඉල්ලුම ඉලක්කය 3 මගින් ආමන්ත්‍රණය විය. AI පිළිගැනීමේ බාධක දේශීය LLM විකල්පය සහ human review පියවර මගින් ආමන්ත්‍රණය
    විය. එබැවින් ඉලක්ක සාක්ෂාත්කරණය තාක්ෂණික බෙදාහැරීමට පමණක් සීමා නොවී, මූලික පර්යේෂණ සාධක සමඟද සම්බන්ධ වේ.'
  - 'මුල් යෝජනාවට සාපේක්ෂව විෂය පථ සීරුමාරු දෙකක් විශේෂයෙන් සටහන් කළ යුතුය. සිංහල NER සම්පත් සීමා නිසා අනාගත කාර්යයට
    කල් දැමිණි. UAT කාලසටහන් සීමා නිසා ඉලක්කය 5 අර්ධ වශයෙන් පමණක් සම්පූර්ණ විය. මෙම අනුවර්තනය අසාර්ථකත්වයක් නොව,
    තනි සංවර්ධක සහ සති දහයක කාලරාමුවක් තුළ යථාර්ථවාදී ප්‍රමුඛතාකරණයකි.'
  bullets: []
