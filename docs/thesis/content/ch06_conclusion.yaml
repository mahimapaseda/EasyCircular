- title: 6.3 සීමාවන්
  id: limits
  level: 2
  paragraphs:
  - 'සීමාව 1 - සිංහල සහ දෙමළ NLP: පූර්ණ NER සහ abstractive සාරාංශකරණය ඉංග්‍රීසි භාෂාවට පමණක් සීමා වේ. සිංහල සහ දෙමළ
    කොටස් සඳහා OCR සහ extractive fallback පමණක් ලබා දේ. එබැවින් MOE ත්‍රිභාෂික චක්‍රලේඛ අර්ධ වශයෙන් පමණක් සේවය කරයි.
    අදියර 6 මගින් බහුභාෂික ආකෘති ආමන්ත්‍රණය කරයි.'
  - 'සීමාව 2 - UAT අසම්පූර්ණ: නිබන්ධන ඉදිරිපත් කිරීමේ අවස්ථාවේ පාසල් කාර්ය මණ්ඩලය සමඟ practical user acceptance
    testing සිදු කර නොමැත. සමීක්ෂණය වක්‍ර සාක්ෂි පමණක් ලබා දෙයි. එබැවින් production readiness ප්‍රකාශ නොකරයි.'
  - 'සීමාව 3 - ROUGE නීතිමය සාක්ෂියක් නොවේ: ස්වයංක්‍රීය මිනුම් මගින් මනිනු ලබන්නේ n-gram අතිච්ඡාදනය පමණක් වන අතර
    නීතිමය නිරවද්‍යතාව නොවේ. සාරාංශ අවබෝධයට සහාය වන අතර නිල අනුකූලතා අර්ථකථනය මිනිස් වගකීමක් ලෙස පවතී. Hallucination
    guardrails මගින් අවදානම අවම කරන නමුත් LLM මාදිලියේදී එය සම්පූර්ණයෙන් ඉවත් නොකරයි.'
  - 'සීමාව 4 - තනි සංවර්ධක විෂය පථය: production cloud deployment, ඉතා දිගු ලේඛන සඳහා async queue සහ bilingual UI
    ක්‍රියාත්මක කර නොමැත. කාර්ය සාධනය පරීක්ෂා කළේ සංවර්ධන hardware මත පමණි.'
  - 'සීමාව 5 - LLM ගුණාත්මක විචලනය: Ollama llama3.2:3b දේශීය ආකෘතියේ ගුණාත්මකභාවය වාණිජ API ආකෘතිවලට වඩා අඩුය; guardrail
    ප්‍රතික්ෂේපයක් සිදු වූ විට fallback මාදිලියට මාරු වීම සාරාංශයේ fluency අඩු කරයි.'
  - 'සීමාව 6 - AI සහායක සංවර්ධනයේ සීමා: generative AI මෙවලම් boilerplate කාර්යයන් සඳහා ප්‍රයෝජනවත් වූ නමුත් වසම-විශේෂිත
    තර්කය (සිංහල චක්‍රලේඛ ආකෘති, MOE පරිපාලන භාෂාව) සඳහා විශ්වාසදායක යෝජනා ලබා දුන්නේ නැත. එසේම යල් පැන ගිය library
    APIs සහ ආරක්ෂක validation නොමැති කේත යෝජනා කිරීම නිසා සෑම යෝජනාවක්ම අතින් සමාලෝචනය කිරීමට අමතර කාලයක් වැය විය.'
  bullets: []
  numbered: []
  figures: []
- title: 6.4 අනාගත කාර්යයන් (Phase 6)
  id: future
  level: 2
  paragraphs:
  - IMPLEMENTATION_PLAN.md හි කොටස 11 මගින් නිර්ණය කර ඇති නිබන්ධනයෙන් පසු වැඩිදියුණු කිරීම් පහත පරිදි වේ.
  - 'භාෂාව: පූර්ණ සිංහල සහ දෙමළ NER; ද්විභාෂික UI (සිංහල, දෙමළ සහ ඉංග්‍රීසි); MOE corpus මත බහුභාෂික LLM fine-tuning.'
  - 'අනන්‍යතාව: භූමිකා පදනම් අවසර (admin සහ teacher වශයෙන් වෙන් කිරීම); වර්තමාන jobRole field එකට අමතරව දිස්ත්‍රික්
    මට්ටමේ ප්‍රවේශ පාලන.'
  - 'බුද්ධිය: සාරාංශය තුළ මූලාශ්‍ර වාක්‍ය සම්බන්ධ කිරීම (highlight එකක් click කළ විට අදාළ ඡේදයට යාම); පිටු 20කට
    වැඩි චක්‍රලේඛ සඳහා progress UI සමඟ async job queue එකක්.'
  - 'මෙහෙයුම්: admin dashboard, batch upload, භාවිත විශ්ලේෂණ සහ API පිරිවැය වාර්තාකරණය.'
  - 'ඒකාබද්ධ කිරීම: ලබා ගත හැකි නම් විධිමත් MOE portal API එකක් සමඟ ඒකාබද්ධ වීම; නව චක්‍රලේඛ සඳහා දැනුම්දීම් පද්ධතියක්.'
  - 'තක්සේරුව: සහභාගිවන්නන් 5ක් හෝ වැඩි ගණනක් සමඟ UAT සම්පූර්ණ කිරීම; ROUGE reference කට්ටලය පුළුල් කිරීම; නීතිමය
    නිරවද්‍යතාව සඳහා මානව තක්සේරු rubric එකක් සකස් කිරීම.'
  - 'සංවර්ධන ක්‍රියාවලිය: AI සහායක සංවර්ධනය සඳහා ව්‍යාපෘති මට්ටමේ ලිඛිත ප්‍රතිපත්තියක් සකස් කිරීම - කුමන කාර්යයන්
    සඳහා AI සහාය පිළිගත හැකිද, කුමන පරීක්ෂණ අනිවාර්යද සහ ප්‍රකාශන ලේඛනය කෙසේ පවත්වා ගත යුතුද යන්න නිර්ණය කිරීම.'
